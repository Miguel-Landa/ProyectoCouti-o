<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Bienvenido al sistema MRX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Sección de la Imagen Lateral */
        .login-image {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1486006920555-c77dce18193b?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px 30px;
            position: relative;
            color: #ffffff;
        }

        .login-image::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.2));
        }

        .image-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* Estilo para ajustar el Logo */
        .logo-img {
            max-width: 150px;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
            border-radius: 8px;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.5));
        }

        .image-content h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .image-content p {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        /* Sección de la Tarjeta del Formulario */
        .card {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card h2 {
            font-size: 1.75rem;
            color: #0f172a;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background: #1d4ed8;
        }

        .mensaje {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 500;
        }

        /* Adaptación para pantallas pequeñas */
        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
            }
            .login-image {
                display: none;
            }
            .card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Panel de Imagen con el Logo -->
        <div class="login-image">
            <div class="image-content">
                <img src="logo.jpg" alt="Logo MRX" class="logo-img">
                <h2>Sistema MRX</h2>
                <p>Gestión y control de taller de mantenimiento.</p>
            </div>
        </div>

        <!-- Formulario -->
        <div class="card">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm" onsubmit="iniciarSesion(event)">
                <div class="input-group">
                    <input type="text" id="usuario" placeholder="Usuario" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <button type="submit">Ingresar</button>
            </form>
            <p id="mensaje" class="mensaje"></p>
        </div>
    </div>

    <script>
        function iniciarSesion(event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            })
            .then(res => res.json())
            .then(data => {
                const mensajeElem = document.getElementById('mensaje');
                if (data.success) {
                    mensajeElem.style.color = '#16a34a';
                    mensajeElem.innerText = 'Autenticación exitosa. Redirigiendo...';
                    setTimeout(() => {
                        window.location.href = data.redirectUrl;
                    }, 1000);
                } else {
                    mensajeElem.style.color = '#dc2626';
                    mensajeElem.innerText = data.message;
                }
            })
            .catch(() => {
                const mensajeElem = document.getElementById('mensaje');
                mensajeElem.style.color = '#dc2626';
                mensajeElem.innerText = 'Error al conectar con el servidor.';
            });
        }
    </script>
</body>
</html>
