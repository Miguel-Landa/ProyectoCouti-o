<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Bienvenido al sistema MRX</title>
    <!-- Fuente Inter limpia y profesional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0d0d0d;
            padding: 20px;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: #141414;
            border-radius: 6px;
            border: 1px solid #262626;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* Sección de la Imagen Lateral a Color */
        .login-image {
            flex: 1.1;
            background: url('https://images.unsplash.com/photo-1486006920555-c77dce18193b?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            position: relative;
            min-height: 480px;
        }

        .login-image-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
            color: #ffffff;
        }

        .login-image-overlay h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .login-image-overlay p {
            font-size: 0.85rem;
            color: #d4d4d4;
        }

        /* Formulario Limpio y Estructurado */
        .card {
            flex: 1;
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #141414;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-img {
            max-width: 130px;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
            border-radius: 4px;
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #a3a3a3;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input::placeholder {
            color: #666666;
        }

        .input-group input:focus {
            border-color: #ffffff;
            background: #262626;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            background: #e5e5e5;
        }

        /* Sección de Registro Cuadrada */
        .register-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #262626;
            text-align: center;
        }

        .register-section p {
            font-size: 0.82rem;
            color: #888888;
            margin-bottom: 12px;
        }

        .btn-register {
            display: block;
            width: 100%;
            padding: 11px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .btn-register:hover {
            border-color: #ffffff;
            background: #1f1f1f;
        }

        .mensaje {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
            }
            .login-image {
                display: none;
            }
            .card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Panel de Imagen Lateral a Color -->
        <div class="login-image">
            <div class="login-image-overlay">
                <h2>Sistema MRX</h2>
                <p>Gestión y control de taller de mantenimiento.</p>
            </div>
        </div>

        <!-- Formulario de Acceso -->
        <div class="card">
            <div class="header-logo">
                <img src="logo.jpg" alt="Logo MRX" class="logo-img">
            </div>
            
            <h2>Inicio de Sesión</h2>

            <form id="loginForm" onsubmit="iniciarSesion(event)">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit">Iniciar sesión</button>
            </form>

            <p id="mensaje" class="mensaje"></p>

            <div class="register-section">
                <p>¿Eres cliente y deseas agendar una cita?</p>
                <a href="registro-cliente.html" class="btn-register">
                    Registrarse como Cliente
                </a>
            </div>
        </div>
    </div>

    <script>
        function iniciarSesion(event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            })
            .then(res => res.json())
            .then(data => {
                const mensajeElem = document.getElementById('mensaje');
                if (data.success) {
                    mensajeElem.style.color = '#ffffff';
                    mensajeElem.innerText = 'Autenticación exitosa. Redirigiendo...';
                    setTimeout(() => {
                        window.location.href = data.redirectUrl;
                    }, 1000);
                } else {
                    mensajeElem.style.color = '#f87171';
                    mensajeElem.innerText = data.message;
                }
            })
            .catch(() => {
                const mensajeElem = document.getElementById('mensaje');
                mensajeElem.style.color = '#f87171';
                mensajeElem.innerText = 'Error al conectar con el servidor.';
            });
        }
    </script>
</body>
</html>
