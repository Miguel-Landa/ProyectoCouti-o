<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Bienvenido al sistema MRX</title>
    <!-- Fuentes Google: Orbitron e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000000;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.04) 0px, transparent 50%);
            font-family: 'Inter', system-ui, sans-serif;
            padding: 20px;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 860px;
            background: #0f0f0f;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        /* Sección de la Imagen Lateral Monocromática */
        .login-image {
            flex: 1;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(15, 15, 15, 0.88)), url('https://images.unsplash.com/photo-1486006920555-c77dce18193b?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            background-blend-mode: overlay;
            filter: grayscale(100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .logo-img {
            max-width: 150px;
            height: auto;
            margin: 0 auto 20px auto;
            display: block;
            border-radius: 12px;
            filter: grayscale(100%) drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.04);
        }

        .image-content h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .image-content p {
            font-size: 0.85rem;
            color: #a3a3a3;
            letter-spacing: 0.5px;
        }

        /* Formulario */
        .card {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #141414;
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 1.5px;
            position: relative;
            display: inline-block;
        }

        .card h2::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 40px;
            height: 3px;
            background: #ffffff;
            border-radius: 2px;
            box-shadow: 0 0 8px #ffffff;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: #222222;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 0.95rem;
            color: #ffffff;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
        }

        .input-group input::placeholder {
            color: #737373;
        }

        .input-group input:focus {
            background: #2a2a2a;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        button[type="submit"]:hover {
            background: #e5e5e5;
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* Bloque y Botón de Registro Monocromático */
        .register-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
        }

        .register-section p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .btn-register {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .btn-register:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .mensaje {
            margin-top: 20px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
            }
            .login-image {
                display: none;
            }
            .card {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Panel de Imagen con el Logo -->
        <div class="login-image">
            <div class="image-content">
                <img src="logo.jpg" alt="Logo MRX" class="logo-img">
                <h2>Sistema MRX</h2>
                <p>Gestión y control de taller de mantenimiento.</p>
            </div>
        </div>

        <!-- Formulario -->
        <div class="card">
            <h2>INICIAR SESIÓN</h2>
            <form id="loginForm" onsubmit="iniciarSesion(event)">
                <div class="input-group">
                    <input type="text" id="usuario" placeholder="Usuario" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <button type="submit">Ingresar</button>
            </form>

            <p id="mensaje" class="mensaje"></p>

            <!-- SECCIÓN DE REGISTRO PARA CLIENTES CON NAVEGACIÓN DIRECTA -->
            <div class="register-section">
                <p>¿Eres cliente y deseas agendar una cita?</p>
                <a href="registro-cliente.html" class="btn-register" onclick="window.location.href='registro-cliente.html'; return false;">
                    Registrarse como Cliente
                </a>
            </div>
        </div>
    </div>

    <script>
        function iniciarSesion(event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            })
            .then(res => res.json())
            .then(data => {
                const mensajeElem = document.getElementById('mensaje');
                if (data.success) {
                    mensajeElem.style.color = '#ffffff';
                    mensajeElem.innerText = 'Autenticación exitosa. Redirigiendo...';
                    setTimeout(() => {
                        window.location.href = data.redirectUrl;
                    }, 1000);
                } else {
                    mensajeElem.style.color = '#a3a3a3';
                    mensajeElem.innerText = data.message;
                }
            })
            .catch(() => {
                const mensajeElem = document.getElementById('mensaje');
                mensajeElem.style.color = '#a3a3a3';
                mensajeElem.innerText = 'Error al conectar con el servidor.';
            });
        }
    </script>
</body>
</html>
