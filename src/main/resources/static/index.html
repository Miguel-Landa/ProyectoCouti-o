<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Bienvenido al sistema MRX</title>
    <!-- Fuentes Google: Orbitron e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #080c14;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.12) 0px, transparent 50%);
            font-family: 'Inter', system-ui, sans-serif;
            padding: 20px;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 860px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(37, 99, 235, 0.15);
            overflow: hidden;
        }

        /* Sección de la Imagen Lateral */
        .login-image {
            flex: 1;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.85)), url('https://images.unsplash.com/photo-1486006920555-c77dce18193b?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            background-blend-mode: overlay;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .logo-img {
            max-width: 150px;
            height: auto;
            margin: 0 auto 20px auto;
            display: block;
            border-radius: 12px;
            filter: drop-shadow(0 0 15px rgba(37, 99, 235, 0.4));
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.04);
        }

        .image-content h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .image-content p {
            font-size: 0.85rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Sección del Formulario Futurista */
        .card {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(15, 23, 42, 0.6);
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #f8fafc;
            margin-bottom: 30px;
            letter-spacing: 1.5px;
            position: relative;
            display: inline-block;
        }

        .card h2::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 2px;
            box-shadow: 0 0 10px #2563eb;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            font-size: 0.95rem;
            color: #f1f5f9;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group input:focus {
            background: rgba(30, 41, 59, 0.95);
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.35), inset 0 0 8px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6);
            transform: translateY(-2px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* Bloque y Botón de Registro */
        .register-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .register-section p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .btn-register {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            box-sizing: border-box;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
            transform: translateY(-2px);
        }

        .mensaje {
            margin-top: 20px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
            }
            .login-image {
                display: none;
            }
            .card {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Panel de Imagen con el Logo -->
        <div class="login-image">
            <div class="image-content">
                <img src="logo.jpg" alt="Logo MRX" class="logo-img">
                <h2>Sistema MRX</h2>
                <p>Gestión y control de taller de mantenimiento.</p>
            </div>
        </div>

        <!-- Formulario -->
        <div class="card">
            <h2>INICIAR SESIÓN</h2>
            <form id="loginForm" onsubmit="iniciarSesion(event)">
                <div class="input-group">
                    <input type="text" id="usuario" placeholder="Usuario" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <button type="submit">Ingresar</button>
            </form>

            <p id="mensaje" class="mensaje"></p>

            <!-- SECCIÓN DE REGISTRO PARA CLIENTES -->
            <div class="register-section">
                <p>¿Eres cliente y deseas agendar una cita?</p>
                <a href="registro-cliente.html" class="btn-register">
                    Registrarse como Cliente
                </a>
            </div>
        </div>
    </div>

    <script>
        function iniciarSesion(event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            })
            .then(res => res.json())
            .then(data => {
                const mensajeElem = document.getElementById('mensaje');
                if (data.success) {
                    mensajeElem.style.color = '#34d399';
                    mensajeElem.innerText = 'Autenticación exitosa. Redirigiendo...';
                    setTimeout(() => {
                        window.location.href = data.redirectUrl;
                    }, 1000);
                } else {
                    mensajeElem.style.color = '#f87171';
                    mensajeElem.innerText = data.message;
                }
            })
            .catch(() => {
                const mensajeElem = document.getElementById('mensaje');
                mensajeElem.style.color = '#f87171';
                mensajeElem.innerText = 'Error al conectar con el servidor.';
            });
        }
    </script>
</body>
</html>
