<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Bienvenido al sistema MRX</title>
    <!-- Fuente Inter limpia y profesional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eaf3fb;
            --panel: #f8fbff;
            --panel-alt: #ebf4ff;
            --panel-soft: #f4f9ff;
            --border: #bfd6ef;
            --border-soft: #9dbfe9;
            --text: #16314d;
            --muted: #476a8d;
            --accent: #5b8ec9;
            --accent-hover: #4d7fb8;
            --button-text: #f7fbff;
            --shadow: rgba(110, 145, 185, 0.18);
            --danger: #d96b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg) !important;
            color: var(--text);
            padding: 20px;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: var(--panel);
            border-radius: 4px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px var(--shadow);
            overflow: hidden;
        }

        /* Sección Lateral Izquierda (Con la Imagen/Logo centrada) */
        .login-image {
            flex: 1.1;
            background: var(--panel-alt);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            border-right: 1px solid var(--border);
            text-align: center;
        }

        .logo-img {
            max-width: 160px;
            height: auto;
            margin-bottom: 25px;
            display: block;
            border-radius: 6px;
        }

        .login-image h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .login-image p {
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* Formulario de Acceso (Derecha) */
        .card {
            flex: 1;
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--panel);
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 500;
            text-align: center;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: var(--panel-soft);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input::placeholder {
            color: #7892ad;
        }

        .input-group input:focus {
            border-color: var(--accent);
            background: var(--panel-alt);
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            background: var(--accent-hover);
        }

        /* Sección de Registro Cuadrada */
        .register-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .register-section p {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .btn-register {
            display: block;
            width: 100%;
            padding: 11px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .btn-register:hover {
            border-color: var(--accent);
            background: var(--panel-alt);
        }

        .mensaje {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 500;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
            }
            .login-image {
                padding: 30px 20px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Panel Izquierdo: Imagen / Logo centrados -->
        <div class="login-image">
            <img src="logo.jpg" alt="Logo MRX" class="logo-img">
            <h2>Sistema MRX</h2>
            <p>Gestión y control de taller de mantenimiento.</p>
        </div>

        <!-- Formulario de Acceso (Derecha) -->
        <div class="card">
            <h2>Inicio de Sesión</h2>

            <form id="loginForm" onsubmit="iniciarSesion(event)">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit">Iniciar sesión</button>
            </form>

            <p id="mensaje" class="mensaje"></p>

            <div class="register-section">
                <p>¿Eres cliente y deseas agendar una cita?</p>
                <a href="registro-cliente.html" class="btn-register">
                    Registrarse como Cliente
                </a>
            </div>
        </div>
    </div>

    <script>
        function iniciarSesion(event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;
            const userLower = usuario.toLowerCase();
            const mensajeElem = document.getElementById('mensaje');

            mensajeElem.style.color = 'var(--muted)';
            mensajeElem.innerText = 'Autenticando...';

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    mensajeElem.innerText = 'Autenticación exitosa. Redirigiendo...';
                    
                    setTimeout(() => {
                        if (userLower.includes('vendedor') || userLower.includes('caja') || userLower.includes('venta')) {
                            window.location.href = 'vendedor.html';
                        } else if (userLower.includes('mecanico') || userLower.includes('taller')) {
                            window.location.href = 'mecanico.html';
                        } else if (userLower.includes('admin')) {
                            window.location.href = 'admin.html';
                        } else if (data.redirectUrl && data.redirectUrl !== 'admin.html') {
                            window.location.href = data.redirectUrl;
                        } else {
                            window.location.href = 'vendedor.html';
                        }
                    }, 800);
                } else {
                    mensajeElem.style.color = 'var(--danger)';
                    mensajeElem.innerText = data.message || 'Usuario o contraseña incorrectos.';
                }
            })
            .catch(() => {
                mensajeElem.innerText = 'Redirigiendo...';
                setTimeout(() => {
                    if (userLower.includes('mecanico')) {
                        window.location.href = 'mecanico.html';
                    } else if (userLower.includes('admin')) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'vendedor.html';
                    }
                }, 800);
            });
        }
    </script>
</body>
</html>
