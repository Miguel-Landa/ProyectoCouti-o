<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Registro de Cliente - Sistema MRX</title>
    <!-- Fuente Inter limpia y profesional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0d0d0d;
            padding: 20px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 650px;
            background: #141414;
            border-radius: 4px;
            border: 1px solid #262626;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            padding: 40px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .header-section p {
            font-size: 0.85rem;
            color: #a3a3a3;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            margin: 20px 0 15px 0;
            text-transform: uppercase;
            border-bottom: 1px solid #262626;
            padding-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #a3a3a3;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input::placeholder {
            color: #666666;
        }

        .input-group input:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background: #e5e5e5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888888;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .mensaje {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .form-wrapper {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="form-wrapper">
        <div class="header-section">
            <h2>Registro de Cliente</h2>
            <p>Ingresa tus datos para registrarte y agendar tu cita de servicio.</p>
        </div>

        <form id="registroForm" onsubmit="registrarCliente(event)">
            <div class="section-title">Información Personal</div>
            <div class="input-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ej. Carlos Mendoza" required>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label for="telefono">Teléfono / WhatsApp</label>
                    <input type="tel" id="telefono" placeholder="2281234567" required>
                </div>
                <div class="input-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="cliente@correo.com" required>
                </div>
            </div>

            <div class="section-title">Datos de la Motocicleta</div>
            <div class="grid-2">
                <div class="input-group">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" placeholder="Ej. Hero, Italika, Honda" required>
                </div>
                <div class="input-group">
                    <label for="modelo">Modelo y Año</label>
                    <input type="text" id="modelo" placeholder="Ej. Hunk 160R (2024)" required>
                </div>
            </div>

            <div class="input-group">
                <label for="placas">Placas (Opcional)</label>
                <input type="text" id="placas" placeholder="Ej. 12ABC3">
            </div>

            <button type="submit" class="btn-submit">Completar Registro</button>
        </form>

        <p id="mensaje" class="mensaje"></p>

        <a href="index.html" class="back-link">← Volver al Inicio de Sesión</a>
    </div>

    <script>
        function registrarCliente(event) {
            event.preventDefault();

            const clienteData = {
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value,
                marca: document.getElementById('marca').value,
                modelo: document.getElementById('modelo').value,
                placas: document.getElementById('placas').value
            };

            fetch('/api/clientes/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(clienteData)
            })
            .then(res => res.json())
            .then(data => {
                const mensajeElem = document.getElementById('mensaje');
                if (data.success) {
                    mensajeElem.style.color = '#ffffff';
                    mensajeElem.innerText = '¡Registro completado! Redirigiendo...';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    mensajeElem.style.color = '#f87171';
                    mensajeElem.innerText = data.message || 'Error al completar el registro.';
                }
            })
            .catch(() => {
                const mensajeElem = document.getElementById('mensaje');
                mensajeElem.style.color = '#f87171';
                mensajeElem.innerText = 'Error al conectar con el servidor.';
            });
        }
    </script>
</body>
</html>
