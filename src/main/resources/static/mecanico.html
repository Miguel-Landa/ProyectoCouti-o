<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Mecánico - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 600;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid #262626;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input[readonly] {
            background: #171717;
            color: #22c55e;
            font-weight: 600;
            border-color: #262626;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .btn-add-item {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: #ffffff;
            color: #000000;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding-top: 15px;
        }

        .qty-btn {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-remove-item {
            color: #ef4444;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #262626;
            border-radius: 4px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        table.data-table th {
            background: #1f1f1f;
            color: #a3a3a3;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #262626;
        }

        table.data-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #1f1f1f;
            color: #e5e5e5;
        }

        table.data-table tr:hover {
            background: #1a1a1a;
        }

        .badge-previa {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: inline-block;
        }

        .badge-directa {
            background: rgba(234, 179, 8, 0.15);
            color: #fde047;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(234, 179, 8, 0.3);
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-select-cita {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-select-cita:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-delete-cita {
            background: rgba(220, 38, 38, 0.2);
            color: #ef4444;
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-delete-cita:hover {
            background: #dc2626;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Taller y Servicio Técnico</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">Servicios de Taller</div>
                <button class="nav-btn active" onclick="cambiarVistaMecanico('mantenimiento', this)">
                    🛠️ Registro de Mantenimiento
                </button>
                <button class="nav-btn" onclick="cambiarVistaMecanico('citas', this)">
                    📋 Citas y Registro de Clientes
                </button>
                <button class="nav-btn" onclick="cambiarVistaMecanico('cobro', this)">
                    💳 Cobro de Mantenimiento / Servicio
                </button>
            </div>

            <div class="main-panel" id="panel-contenido-mecanico">
            </div>
        </div>
    </div>

    <script>
        const CLAVE_CATALOGO = 'mrx_catalogo_productos';

        let contadorConsecutivoFolio = 105;
        let piezasyInsumosServicio = [];
        let servicioSeleccionadoParaCobro = null;

        let listaCitas = [
            { folio: 'CITA-104', cliente: 'Carlos Mendoza', mecanico: 'Miguel Landa', moto: 'Hero Hunk 160R 4V', placas: '12ABC3', servicio: 'Afinación y cambio de balatas', modalidad: 'Cita Previa' },
            { folio: 'CITA-103', cliente: 'Roberto Silva', mecanico: 'Carlos Mendoza', moto: 'Italika FT150', placas: '98XYZ1', servicio: 'Revisión del sistema eléctrico', modalidad: 'Cita Previa' },
            { folio: 'CITA-102', cliente: 'Miguel Landa', mecanico: 'Miguel Landa', moto: 'Hero Hunk 160R 4V', placas: '45DEF6', servicio: 'Cambio de aceite expres', modalidad: 'Sin Cita (Directa)' },
            { folio: 'CITA-101', cliente: 'Ana Martínez', mecanico: 'Ramón Gómez', moto: 'Yamaha FZ25', placas: '77GHI8', servicio: 'Mantenimiento general (10k km)', modalidad: 'Cita Previa' }
        ];

        function obtenerCatalogo() {
            const data = localStorage.getItem(CLAVE_CATALOGO);
            if (data) return JSON.parse(data);
            return [
                { id: '1', sku: 'REF-101', nombre: 'Aceite Motul 10W40 1L', precio: 220.00, stock: 15 },
                { id: '2', sku: 'REF-102', nombre: 'Batería Hero Hunk 160R (12V 7Ah)', precio: 850.00, stock: 8 },
                { id: '3', sku: 'REF-103', nombre: 'Balatas Delanteras Hunk 160R', precio: 180.00, stock: 20 },
                { id: '4', sku: 'REF-104', nombre: 'Kit Arrastre Piñón y Cadena 428H', precio: 650.00, stock: 5 }
            ];
        }

        function guardarCatalogo(cat) {
            localStorage.setItem(CLAVE_CATALOGO, JSON.stringify(cat));
        }

        function cambiarVistaMecanico(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }

            const panel = document.getElementById('panel-contenido-mecanico');

            if (vista === 'mantenimiento') {
                renderizarFormularioMantenimientoOriginal();
            } else if (vista === 'citas') {
                renderizarTablaCitasOriginal();
            } else if (vista === 'cobro') {
                servicioSeleccionadoParaCobro = null;
                piezasyInsumosServicio = [];
                renderizarModuloCobroSeparado();
            }
        }

        /* 1. MÓDULO ORIGINAL: REGISTRO DE MANTENIMIENTO */
        function renderizarFormularioMantenimientoOriginal() {
            const panel = document.getElementById('panel-contenido-mecanico');
            const siguienteFolio = 'CITA-' + contadorConsecutivoFolio;

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Nuevo Servicio / Mantenimiento</h2>
                    <p>Registro de ingreso de motocicleta, diagnóstico inicial y asignación de refacciones.</p>
                </div>

                <form id="mantenimientoForm" onsubmit="guardarMantenimientoOriginal(event)">
                    <div class="form-section-title">1. Búsqueda y Validación de Cita</div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Folio de Cita Consecutivo Único</label>
                            <input type="text" id="folioCita" value="${siguienteFolio}" readonly>
                        </div>
                        <div class="input-group">
                            <label>Placas o Identificador de Motocicleta</label>
                            <input type="text" id="placasInput" placeholder="Ej. 12ABC3 o MX-9921" required>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nombre del Cliente</label>
                            <input type="text" id="clienteInput" placeholder="Ej. Juan Pérez" required>
                        </div>
                        <div class="input-group">
                            <label>Estado de Cita</label>
                            <select id="estadoCita">
                                <option value="Cita Previa">Cita Previa Agendada (Validada)</option>
                                <option value="Sin Cita (Directa)">Sin Cita (Registro Rápido de Cliente)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section-title">2. Diagnóstico Técnico e Inspección</div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Kilometraje Actual (km)</label>
                            <input type="number" id="kilometraje" placeholder="Ej. 12500" required>
                        </div>
                        <div class="input-group">
                            <label>Fallas Reportadas / Servicio Solicitado</label>
                            <input type="text" id="fallas" placeholder="Ej. Ruidos en freno delantero" required>
                        </div>
                    </div>

                    <div class="input-group" style="margin-bottom: 16px;">
                        <label>Diagnóstico Inicial del Mecánico</label>
                        <textarea id="diagnostico" placeholder="Describa la revisión técnica realizada..." required></textarea>
                    </div>

                    <div class="form-section-title">3. Refacciones Requeridas (Verificación de Stock)</div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Seleccionar Refacción / Insumo</label>
                            <select id="refaccion">
                                <option value="Balatas Delanteras Hunk 160R">Balatas Delanteras Hunk 160R (Stock Disponible)</option>
                                <option value="Aceite Motul 10W40 1L">Aceite Motul 10W40 1L (Stock Disponible)</option>
                                <option value="Bujía NGK Iridium">Bujía NGK Iridium (Stock Disponible)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Cantidad Requerida</label>
                            <input type="number" id="cantidadRefacion" value="1" min="1">
                        </div>
                    </div>

                    <button type="submit" class="btn-action">Guardar Orden de Servicio</button>
                </form>

                <div id="alertaExito" class="alert-box">
                    ✓ Orden registrada con Folio Consecutivo Único y guardada en el desglose.
                </div>
            `;
        }

        /* 2. MÓDULO ORIGINAL: CITAS Y REGISTRO DE CLIENTES */
        function renderizarTablaCitasOriginal() {
            const panel = document.getElementById('panel-contenido-mecanico');

            let filasHTML = listaCitas.map(cita => {
                const badgeClass = cita.modalidad.includes('Previa') ? 'badge-previa' : 'badge-directa';
                return `
                    <tr>
                        <td style="font-weight:600; color:#ffffff;">${cita.folio}</td>
                        <td>${cita.cliente}</td>
                        <td>${cita.moto}</td>
                        <td>${cita.placas}</td>
                        <td>${cita.servicio}</td>
                        <td><span class="${badgeClass}">${cita.modalidad}</span></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-delete-cita" onclick="eliminarCita('${cita.folio}')">Eliminar</button>
                                <button class="btn-select-cita" onclick="cargarCitaEnFormulario('${cita.folio}')">Atender</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Desglose de Citas y Registros de Clientes</h2>
                    <p>Visualización de citas agendadas desde la web y registros directos en caja.</p>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Folio / Cita</th>
                                <th>Cliente</th>
                                <th>Motocicleta</th>
                                <th>Placas</th>
                                <th>Servicio Solicitado</th>
                                <th>Modalidad</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filasHTML}
                        </tbody>
                    </table>
                </div>
            `;
        }

        /* 3. NUEVO MÓDULO INDEPENDIENTE: COBRO DE MANTENIMIENTO / SERVICIO */
        function renderizarModuloCobroSeparado() {
            const panel = document.getElementById('panel-contenido-mecanico');
            const catalogo = obtenerCatalogo();

            let filasServicios = listaCitas.map(cita => `
                <tr>
                    <td style="font-weight:600; color:#ffffff;">${cita.folio}</td>
                    <td><strong>${cita.cliente}</strong></td>
                    <td><span style="background:#262626; color:#60a5fa; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:600;">${cita.mecanico || 'Miguel Landa'}</span></td>
                    <td>${cita.moto} (${cita.placas})</td>
                    <td>${cita.servicio}</td>
                    <td>
                        <button class="btn-select-cita" style="background:#22c55e; color:#000;" onclick="seleccionarServicioParaCobrar('${cita.folio}')">💳 Generar Cobro / Ticket</button>
                    </td>
                </tr>
            `).join('');

            let opcionesRefacciones = catalogo.map(p => 
                `<option value="${p.id}">[${p.sku}] ${p.nombre} - $${p.precio.toFixed(2)} (Stock: ${p.stock})</option>`
            ).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Cobro de Mantenimiento / Servicio Técnico</h2>
                    <p>Selección de servicios concluidos, asignación de mecánico, refacciones utilizadas y emisión de ticket.</p>
                </div>

                <div class="summary-box" style="margin-top:0; margin-bottom:25px;">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px;">📋 Seleccionar Mantenimiento o Servicio a Cobrar</h3>
                    <div class="table-container" style="margin-top:0;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Folio</th>
                                    <th>Cliente</th>
                                    <th>Mecánico Encargado</th>
                                    <th>Motocicleta</th>
                                    <th>Servicio Realizado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${filasServicios.length > 0 ? filasServicios : '<tr><td colspan="6" style="text-align:center;">No hay servicios registrados para cobrar.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="formularioCobroDetalle" style="display: ${servicioSeleccionadoParaCobro ? 'block' : 'none'};">
                    <div class="form-section-title">Detalles de Facturación y Cobro (${servicioSeleccionadoParaCobro ? servicioSeleccionadoParaCobro.folio : ''})</div>
                    
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Cliente</label>
                            <input type="text" id="cobroClienteInput" value="${servicioSeleccionadoParaCobro ? servicioSeleccionadoParaCobro.cliente : ''}" readonly>
                        </div>
                        <div class="input-group">
                            <label>Mecánico que Realizó el Mantenimiento</label>
                            <select id="cobroMecanicoSelect">
                                <option value="Miguel Landa">Miguel Landa</option>
                                <option value="Carlos Mendoza">Carlos Mendoza</option>
                                <option value="Ramón Gómez">Ramón Gómez</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Servicio Técnico Realizado</label>
                            <input type="text" id="cobroServicioDescInput" value="${servicioSeleccionadoParaCobro ? servicioSeleccionadoParaCobro.servicio : ''}">
                        </div>
                        <div class="input-group">
                            <label>Costo de Mano de Obra ($ MXN)</label>
                            <input type="number" id="cobroManoObraInput" value="300.00" step="0.01" oninput="actualizarTotalesCobroModulo()">
                        </div>
                    </div>

                    <div class="form-section-title">Piezas y Refacciones Utilizadas en el Servicio</div>
                    <div style="display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
                        <div class="input-group" style="margin-bottom:0; flex:2;">
                            <label>Agregar Refacción al Ticket</label>
                            <select id="selectRefaccionCobro">${opcionesRefacciones}</select>
                        </div>
                        <div class="input-group" style="margin-bottom:0; flex:1;">
                            <label>Cantidad</label>
                            <input type="number" id="cantRefaccionCobro" value="1" min="1">
                        </div>
                        <button type="button" class="btn-add-item" style="padding:12px 18px;" onclick="agregarPiezaAlCobroModulo()">+ Agregar Pieza</button>
                    </div>

                    <div class="summary-box">
                        <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                            🧾 Desglose Final del Cobro de Servicio
                        </h3>
                        <div id="listaPiezasCobroModulo"></div>

                        <div style="margin-top:15px; border-top:1px solid #262626; padding-top:10px;">
                            <div class="summary-row"><span>Mano de Obra / Servicio Técnico:</span><span id="lblCobroManoObra">$300.00 MXN</span></div>
                            <div class="summary-row"><span>Subtotal General:</span><span id="lblCobroSubtotal">$300.00 MXN</span></div>
                            <div class="summary-row"><span>IVA (16%):</span><span id="lblCobroIva">$48.00 MXN</span></div>
                            <div class="summary-row total"><span>Total a Cobrar al Cliente:</span><span id="lblCobroTotal" style="color: #22c55e;">$348.00 MXN</span></div>
                        </div>
                    </div>

                    <button class="btn-action" onclick="finalizarCobroMantenimiento()">Finalizar Cobro y Descontar Refacciones</button>
                    <div id="alertaCobroExito" class="alert-box">✓ Cobro procesado correctamente y stock de refacciones actualizado.</div>
                </div>
            `;
            if (servicioSeleccionadoParaCobro) actualizarTotalesCobroModulo();
        }

        function seleccionarServicioParaCobrar(folio) {
            const servicio = listaCitas.find(c => c.folio === folio);
            if (servicio) {
                servicioSeleccionadoParaCobro = servicio;
                piezasyInsumosServicio = [];
                renderizarModuloCobroSeparado();
                if (servicio.mecanico) {
                    document.getElementById('cobroMecanicoSelect').value = servicio.mecanico;
                }
            }
        }

        function agregarPiezaAlCobroModulo() {
            const refId = document.getElementById('selectRefaccionCobro').value;
            const cant = parseInt(document.getElementById('cantRefaccionCobro').value) || 1;
            const catalogo = obtenerCatalogo();
            const ref = catalogo.find(p => p.id === refId);

            if (ref) {
                if (cant > ref.stock) {
                    alert(`⚠️ Stock insuficiente. Quedan ${ref.stock} pzas de ${ref.nombre}.`);
                    return;
                }
                const existe = piezasyInsumosServicio.find(i => i.id === refId);
                if (existe) {
                    if ((existe.cantidad + cant) > ref.stock) {
                        alert(`⚠️ Supera el stock disponible (${ref.stock} pzas).`);
                        return;
                    }
                    existe.cantidad += cant;
                } else {
                    piezasyInsumosServicio.push({ id: ref.id, sku: ref.sku, nombre: ref.nombre, precio: ref.precio, cantidad: cant });
                }
                actualizarTotalesCobroModulo();
            }
        }

        function modificarCantidadPiezaModulo(id, delta) {
            const item = piezasyInsumosServicio.find(i => i.id === id);
            const catalogo = obtenerCatalogo();
            const ref = catalogo.find(p => p.id === id);

            if (item && ref) {
                if (delta > 0 && (item.cantidad + delta) > ref.stock) {
                    alert(`⚠️ No puedes agregar más del stock disponible (${ref.stock} pzas).`);
                    return;
                }
                item.cantidad += delta;
                if (item.cantidad <= 0) piezasyInsumosServicio = piezasyInsumosServicio.filter(i => i.id !== id);
                actualizarTotalesCobroModulo();
            }
        }

        function removerPiezaCobroModulo(id) {
            piezasyInsumosServicio = piezasyInsumosServicio.filter(i => i.id !== id);
            actualizarTotalesCobroModulo();
        }

        function actualizarTotalesCobroModulo() {
            const contenedor = document.getElementById('listaPiezasCobroModulo');
            if (!contenedor) return;

            const manoObra = parseFloat(document.getElementById('cobroManoObraInput').value) || 0;
            let subtotalRef = 0;

            if (piezasyInsumosServicio.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado refacciones al ticket de cobro.</p>';
            } else {
                contenedor.innerHTML = piezasyInsumosServicio.map(item => {
                    const importe = item.precio * item.cantidad;
                    subtotalRef += importe;
                    return `
                        <div class="summary-row">
                            <div>
                                <span style="background:#262626; color:#e5e5e5; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${item.sku}</span>
                                <strong style="color:#ffffff;">${item.nombre}</strong> 
                                <span style="margin-left:8px;">
                                    <button class="qty-btn" onclick="modificarCantidadPiezaModulo('${item.id}', -1)">-</button>
                                    <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                    <button class="qty-btn" onclick="modificarCantidadPiezaModulo('${item.id}', 1)">+</button>
                                </span>
                                <button class="btn-remove-item" onclick="removerPiezaCobroModulo('${item.id}')">Quitar</button>
                            </div>
                            <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                        </div>
                    `;
                }).join('');
            }

            const subtotalGen = subtotalRef + manoObra;
            const iva = subtotalGen * 0.16;
            const total = subtotalGen + iva;

            document.getElementById('lblCobroManoObra').innerText = '$' + manoObra.toFixed(2) + ' MXN';
            document.getElementById('lblCobroSubtotal').innerText = '$' + subtotalGen.toFixed(2) + ' MXN';
            document.getElementById('lblCobroIva').innerText = '$' + iva.toFixed(2) + ' MXN';
            document.getElementById('lblCobroTotal').innerText = '$' + total.toFixed(2) + ' MXN';
        }

        function finalizarCobroMantenimiento() {
            if (!servicioSeleccionadoParaCobro) return;

            // Descontar refacciones utilizadas del catálogo general
            let catalogo = obtenerCatalogo();
            piezasyInsumosServicio.forEach(item => {
                const ref = catalogo.find(p => p.id === item.id);
                if (ref) ref.stock = Math.max(0, ref.stock - item.cantidad);
            });
            guardarCatalogo(catalogo);

            const alerta = document.getElementById("alertaCobroExito");
            alerta.style.display = "block";

            setTimeout(() => {
                alerta.style.display = "none";
                servicioSeleccionadoParaCobro = null;
                piezasyInsumosServicio = [];
                renderizarModuloCobroSeparado();
            }, 1800);
        }

        /* FUNCIONES AUXILIARES DE MANTENIMIENTO Y CITAS */
        function cargarCitaEnFormulario(folio) {
            const citaEncontrada = listaCitas.find(c => c.folio === folio);
            const botonesNav = document.querySelectorAll('.nav-btn');
            
            cambiarVistaMecanico('mantenimiento', botonesNav[0]);

            setTimeout(() => {
                if (citaEncontrada) {
                    document.getElementById('folioCita').value = citaEncontrada.folio;
                    document.getElementById('placasInput').value = citaEncontrada.placas;
                    document.getElementById('clienteInput').value = citaEncontrada.cliente;
                    document.getElementById('estadoCita').value = citaEncontrada.modalidad;
                    document.getElementById('fallas').value = citaEncontrada.servicio;
                    document.getElementById('diagnostico').value = 'Revisión técnica en proceso para la motocicleta ' + citaEncontrada.moto + '.';
                }
            }, 100);
        }

        function eliminarCita(folio) {
            if (confirm('¿Está seguro de eliminar la cita ' + folio + '?')) {
                listaCitas = listaCitas.filter(c => c.folio !== folio);
                const botonesNav = document.querySelectorAll('.nav-btn');
                cambiarVistaMecanico('citas', botonesNav[1]);
            }
        }

        function guardarMantenimientoOriginal(event) {
            event.preventDefault();

            const folioActual = document.getElementById('folioCita').value;
            const placasVal = document.getElementById('placasInput').value;
            const clienteVal = document.getElementById('clienteInput').value;
            const estadoCitaVal = document.getElementById('estadoCita').value;
            const fallasVal = document.getElementById('fallas').value;

            const indiceExistente = listaCitas.findIndex(c => c.folio === folioActual);

            if (indiceExistente !== -1) {
                listaCitas[indiceExistente].placas = placasVal;
                listaCitas[indiceExistente].cliente = clienteVal;
                listaCitas[indiceExistente].servicio = fallasVal;
                listaCitas[indiceExistente].modalidad = estadoCitaVal;
            } else {
                listaCitas.unshift({
                    folio: folioActual,
                    cliente: clienteVal || 'Cliente General',
                    mecanico: 'Miguel Landa',
                    moto: 'Motocicleta Ingresada',
                    placas: placasVal.toUpperCase(),
                    servicio: fallasVal || 'Mantenimiento General',
                    modalidad: estadoCitaVal
                });
                contadorConsecutivoFolio++;
            }

            const alerta = document.getElementById("alertaExito");
            alerta.style.display = "block";

            setTimeout(() => { 
                alerta.style.display = "none"; 
                cambiarVistaMecanico('mantenimiento', document.querySelectorAll('.nav-btn')[0]);
            }, 2000);
        }

        window.onload = function() {
            cambiarVistaMecanico('mantenimiento', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
