<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Taller Mecánico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dash-bg mecanico-theme">
    <div class="dashboard-container">
        <header class="topbar">
            <h1>🔧 Taller y Servicio Técnico</h1>
            <a href="/index.html" class="btn-logout">Cerrar Sesión</a>
        </header>
        <main class="grid-layout">
            <div class="dash-card">
                <h3>Órdenes de Trabajo</h3>
                <p>Consultar vehículos/módulos ingresados a revisión o afinación.</p>
                <button class="action-btn">Ver Pendientes</button>
            </div>
            <div class="dash-card">
                <h3>Diagnóstico Técnico</h3>
                <p>Registrar hallazgos, reemplazo de piezas y checklist de control.</p>
                <button class="action-btn">Crear Diagnóstico</button>
            </div>
            <div class="dash-card">
                <h3>Inventario de Herramientas</h3>
                <p>Control de refacciones solicitadas e insumos del taller.</p>
                <button class="action-btn">Consultar Insumos</button>
            </div>
        </main>
    </div>
</body>
</html>
