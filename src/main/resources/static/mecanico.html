<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Mecánico - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 600;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid #262626;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #262626;
            border-radius: 4px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        table.data-table th {
            background: #1f1f1f;
            color: #a3a3a3;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #262626;
        }

        table.data-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #1f1f1f;
            color: #e5e5e5;
        }

        table.data-table tr:hover {
            background: #1a1a1a;
        }

        .badge-previa {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: inline-block;
        }

        .badge-directa {
            background: rgba(234, 179, 8, 0.15);
            color: #fde047;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(234, 179, 8, 0.3);
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-select-cita {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-select-cita:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-delete-cita {
            background: rgba(220, 38, 38, 0.2);
            color: #ef4444;
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-delete-cita:hover {
            background: #dc2626;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Taller y Servicio Técnico</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">Servicios de Taller</div>
                <button class="nav-btn active" onclick="cambiarVistaMecanico('mantenimiento', this)">
                    🛠️ Registro de Mantenimiento
                </button>
                <button class="nav-btn" onclick="cambiarVistaMecanico('citas', this)">
                    📋 Citas y Registro de Clientes
                </button>
            </div>

            <div class="main-panel" id="panel-contenido-mecanico">
            </div>
        </div>
    </div>

    <script>
        let listaCitas = [
            { folio: 'CITA-104', cliente: 'Carlos Mendoza', moto: 'Hero Hunk 160R 4V', placas: '12ABC3', servicio: 'Afinación y cambio de balatas', modalidad: 'Cita Previa' },
            { folio: 'CITA-103', cliente: 'Roberto Silva', moto: 'Italika FT150', placas: '98XYZ1', servicio: 'Revisión del sistema eléctrico', modalidad: 'Cita Previa' },
            { folio: 'S-8821', cliente: 'Miguel Landa', moto: 'Hero Hunk 160R 4V', placas: '45DEF6', servicio: 'Cambio de aceite expres', modalidad: 'Sin Cita (Directa)' },
            { folio: 'CITA-101', cliente: 'Ana Martínez', moto: 'Yamaha FZ25', placas: '77GHI8', servicio: 'Mantenimiento general (10k km)', modalidad: 'Cita Previa' }
        ];

        function cambiarVistaMecanico(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }

            const panel = document.getElementById('panel-contenido-mecanico');

            if (vista === 'mantenimiento') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Nuevo Servicio / Mantenimiento</h2>
                        <p>Registro de ingreso de motocicleta, diagnóstico inicial y asignación de refacciones.</p>
                    </div>

                    <form id="mantenimientoForm" onsubmit="guardarMantenimiento(event)">
                        <div class="form-section-title">1. Búsqueda y Validación de Cita</div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Folio de Cita o Placas de la Motocicleta</label>
                                <input type="text" id="busqueda" placeholder="Ej. CITA-104 o 12ABC3" required>
                            </div>
                            <div class="input-group">
                                <label>Estado de Cita</label>
                                <select id="estadoCita">
                                    <option value="Cita Previa">Cita Previa Agendada (Validada)</option>
                                    <option value="Sin Cita (Directa)">Sin Cita (Registro Rápido de Cliente)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-section-title">2. Diagnóstico Técnico e Inspección</div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Kilometraje Actual (km)</label>
                                <input type="number" id="kilometraje" placeholder="Ej. 12500" required>
                            </div>
                            <div class="input-group">
                                <label>Fallas Reportadas por el Cliente</label>
                                <input type="text" id="fallas" placeholder="Ej. Ruidos en freno delantero" required>
                            </div>
                        </div>

                        <div class="input-group" style="margin-bottom: 16px;">
                            <label>Diagnóstico Inicial del Mecánico</label>
                            <textarea id="diagnostico" placeholder="Describa la revisión técnica realizada..." required></textarea>
                        </div>

                        <div class="form-section-title">3. Refacciones Requeridas (Verificación de Stock)</div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Seleccionar Refacción / Insumo</label>
                                <select id="refaccion">
                                    <option value="Balatas Delanteras Hunk 160R">Balatas Delanteras Hunk 160R (Stock Disponible)</option>
                                    <option value="Aceite Motul 10W40 1L">Aceite Motul 10W40 1L (Stock Disponible)</option>
                                    <option value="Bujía NGK Iridium">Bujía NGK Iridium (Stock Disponible)</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Cantidad Requerida</label>
                                <input type="number" id="cantidadRefacion" value="1" min="1">
                            </div>
                        </div>

                        <button type="submit" class="btn-action">Guardar Orden de Servicio</button>
                    </form>

                    <div id="alertaExito" class="alert-box">
                        ✓ Orden de mantenimiento registrada y guardada en el desglose de citas.
                    </div>
                `;
            } else if (vista === 'citas') {
                let filasHTML = listaCitas.map(cita => {
                    const badgeClass = cita.modalidad.includes('Previa') ? 'badge-previa' : 'badge-directa';
                    return `
                        <tr>
                            <td style="font-weight:600; color:#ffffff;">${cita.folio}</td>
                            <td>${cita.cliente}</td>
                            <td>${cita.moto}</td>
                            <td>${cita.placas}</td>
                            <td>${cita.servicio}</td>
                            <td><span class="${badgeClass}">${cita.modalidad}</span></td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-delete-cita" onclick="eliminarCita('${cita.folio}')">Eliminar</button>
                                    <button class="btn-select-cita" onclick="cargarCitaEnFormulario('${cita.folio}')">Atender</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Desglose de Citas y Registros de Clientes</h2>
                        <p>Visualización de citas agendadas desde la web y registros directos en caja.</p>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Folio / Cita</th>
                                    <th>Cliente</th>
                                    <th>Motocicleta</th>
                                    <th>Placas</th>
                                    <th>Servicio Solicitado</th>
                                    <th>Modalidad</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${filasHTML}
                            </tbody>
                        </table>
                    </div>
                `;
            }
        }

        function cargarCitaEnFormulario(folio) {
            const citaEncontrada = listaCitas.find(c => c.folio === folio);
            const botonesNav = document.querySelectorAll('.nav-btn');
            
            cambiarVistaMecanico('mantenimiento', botonesNav[0]);

            setTimeout(() => {
                if (citaEncontrada) {
                    document.getElementById('busqueda').value = citaEncontrada.folio + ' - ' + citaEncontrada.placas;
                    document.getElementById('estadoCita').value = citaEncontrada.modalidad;
                    document.getElementById('fallas').value = citaEncontrada.servicio;
                    document.getElementById('diagnostico').value = 'Revisión previa iniciada para cliente ' + citaEncontrada.cliente + ' (' + citaEncontrada.moto + ').';
                }
            }, 100);
        }

        function eliminarCita(folio) {
            if (confirm('¿Está seguro de eliminar la cita ' + folio + '?')) {
                listaCitas = listaCitas.filter(c => c.folio !== folio);
                const botonesNav = document.querySelectorAll('.nav-btn');
                cambiarVistaMecanico('citas', botonesNav[1]);
            }
        }

        function guardarMantenimiento(event) {
            event.preventDefault();

            const busquedaVal = document.getElementById('busqueda').value;
            const estadoCitaVal = document.getElementById('estadoCita').value;
            const fallasVal = document.getElementById('fallas').value;

            const nuevoFolio = busquedaVal ? busquedaVal.split(' - ')[0].toUpperCase() : 'ORD-' + Math.floor(1000 + Math.random() * 9000);

            listaCitas.unshift({
                folio: nuevoFolio,
                cliente: 'Cliente Atendido',
                moto: 'Motocicleta Ingresada',
                placas: busquedaVal.includes('CITA') ? 'REG-MOTO' : busquedaVal.toUpperCase(),
                servicio: fallasVal || 'Mantenimiento General',
                modalidad: estadoCitaVal
            });

            const alerta = document.getElementById("alertaExito");
            alerta.style.display = "block";

            setTimeout(() => { 
                alerta.style.display = "none"; 
                document.getElementById("mantenimientoForm").reset(); 
            }, 2500);
        }

        window.onload = function() {
            cambiarVistaMecanico('mantenimiento', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
