<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Mecánico - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 600;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid #262626;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        /* Estilos limpios para la Tabla HTML */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #262626;
            border-radius: 4px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        table.data-table th {
            background: #1f1f1f;
            color: #a3a3a3;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #262626;
        }

        table.data-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #1f1f1f;
            color: #e5e5e5;
        }

        table.data-table tr:hover {
            background: #1a1a1a;
        }

        .badge-previa {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: inline-block;
        }

        .badge-directa {
            background: rgba(234, 179, 8, 0.15);
            color: #fde047;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(234, 179, 8, 0.3);
            display: inline-block;
        }

        .btn-select-cita {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-select-cita:hover {
            background: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Barra Superior -->
        <div class="topbar">
            <h1>Taller y Servicio Técnico</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <!-- Workspace Dividido -->
        <div class="workspace">
            
            <!-- Izquierda: Módulos del Mecánico -->
            <div class="sidebar-buttons">
                <div class="sidebar-title">Servicios de Taller</div>
                <button class="nav-btn active" onclick="cambiarVistaMecanico('mantenimiento', this)">
                    🛠️ Registro de Mantenimiento
                </button>
                <button class="nav-btn" onclick="cambiarVistaMecanico('citas', this)">
                    📋 Citas y Registro de Clientes
                </button>
            </div>

            <!-- Centro / Derecho: Despliegue de Paneles -->
            <div class="main-panel" id="panel-contenido-mecanico">
                <!-- Carga dinámicamente "Registro de Mantenimiento" -->
            </div>

        </div>
    </div>

    <script>
        function cambiarVistaMecanico(vista, boton) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');

            const panel = document.getElementById('panel-contenido-mecanico');

            if (vista === 'mantenimiento') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Nuevo Servicio / Mantenimiento</h2>
                        <p>Registro de ingreso de motocicleta, diagnóstico inicial y asignación de refacciones.</p>
                    </div>

                    <form id="mantenimientoForm" onsubmit="guardarMantenimiento(event)">
                        <div class="form-section-title">1. Búsqueda y Validación de Cita</div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Folio de Cita o Placas de la Motocicleta</label>
                                <input type="text" id="busqueda" placeholder="Ej. CITA-104 o 12ABC3" required>
                            </div>
                            <div class="input-group">
                                <label>Estado de Cita</label>
                                <select id="estadoCita">
                                    <option value="encontrada">Cita Previa Agendada (Validada)</option>
                                    <option value="nueva">Sin Cita (Registro Rápido de Cliente)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-section-title">2. Diagnóstico Técnico e Inspección</div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Kilometraje Actual (km)</label>
                                <input type="number" id="kilometraje" placeholder="Ej. 12500" required>
                            </div>
                            <div class="input-group">
                                <label>Fallas Reportadas por el Cliente</label>
                                <input type="text" id="fallas" placeholder="Ej. Ruidos en freno delantero" required>
                            </div>
                        </div>

                        <div class="input-group" style="margin-bottom: 16px;">
                            <label>Diagnóstico Inicial del Mecánico</label>
                            <textarea id="diagnostico" placeholder="Describa la revisión técnica realizada..." required></textarea>
                        </div>

                        <div class="form-section-title">3. Refacciones Requeridas (Verificación de Stock)</div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Seleccionar Refacción / Insumo</label>
                                <select id="refaccion">
                                    <option value="balatas">Balatas Delanteras Hunk 160R (Stock Disponible)</option>
                                    <option value="aceite">Aceite Motul 10W40 1L (Stock Disponible)</option>
                                    <option value="bujia">Bujía NGK Iridium (Stock Disponible)</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Cantidad Requerida</label>
                                <input type="number" value="1" min="1">
                            </div>
                        </div>

                        <button type="submit" class="btn-action">Guardar Orden de Servicio</button>
                    </form>

                    <div id="alertaExito" class="alert-box">
                        ✓ Orden de mantenimiento registrada correctamente.
                    </div>
                `;
            } else if (vista === 'citas') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Desglose de Citas y Registros de Clientes</h2>
                        <p>Visualización de citas agendadas desde la web y registros directos en caja.</p>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Folio / Cita</th>
                                    <th>Cliente</th>
                                    <th>Motocicleta</th>
                                    <th>Placas</th>
                                    <th>Servicio Solicitado</th>
                                    <th>Modalidad</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="font-weight:600; color:#ffffff;">CITA-104</td>
                                    <td>Carlos Mendoza</td>
                                    <td>Hero Hunk 160R 4V</td>
                                    <td>12ABC3</td>
                                    <td>Afinación y cambio de balatas</td>
                                    <td><span class="badge-previa">Cita Previa</span></td>
                                    <td><button class="btn-select-cita" onclick="cargarCitaEnFormulario('CITA-104')">Atender</button></td>
                                </tr>
                                <tr>
                                    <td style="font-weight:600; color:#ffffff;">CITA-103</td>
                                    <td>Roberto Silva</td>
                                    <td>Italika FT150</td>
                                    <td>98XYZ1</td>
                                    <td>Revisión del sistema eléctrico</td>
                                    <td><span class="badge-previa">Cita Previa</span></td>
                                    <td><button class="btn-select-cita" onclick="cargarCitaEnFormulario('CITA-103')">Atender</button></td>
                                </tr>
                                <tr>
                                    <td style="font-weight:600; color:#ffffff;">S-8821</td>
                                    <td>Miguel Landa</td>
                                    <td>Hero Hunk 160R 4V</td>
                                    <td>45DEF6</td>
                                    <td>Cambio de aceite expres</td>
                                    <td><span class="badge-directa">Sin Cita (Directa)</span></td>
                                    <td><button class="btn-select-cita" onclick="cargarCitaEnFormulario('S-8821')">Atender</button></td>
                                </tr>
                                <tr>
                                    <td style="font-weight:600; color:#ffffff;">CITA-101</td>
                                    <td>Ana Martínez</td>
                                    <td>Yamaha FZ25</td>
                                    <td>77GHI8</td>
                                    <td>Mantenimiento general (10k km)</td>
                                    <td><span class="badge-previa">Cita Previa</span></td>
                                    <td><button class="btn-select-cita" onclick="cargarCitaEnFormulario('CITA-101')">Atender</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }
        }

        function cargarCitaEnFormulario(folio) {
            cambiarVistaMecanico('mantenimiento', document.querySelectorAll('.nav-btn')[0]);
            setTimeout(() => {
                document.getElementById('busqueda').value = folio;
            }, 100);
        }

        function guardarMantenimiento(event) {
            event.preventDefault();
            const alerta = document.getElementById("alertaExito");
            alerta.style.display = "block";
            setTimeout(() => { 
                alerta.style.display = "none"; 
                document.getElementById("mantenimientoForm").reset(); 
            }, 3000);
        }

        window.onload = function() {
            cambiarVistaMecanico('mantenimiento', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
