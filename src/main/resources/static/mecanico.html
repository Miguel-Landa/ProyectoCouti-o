<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Mecánico - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eaf3fb;
            --panel: #f8fbff;
            --panel-alt: #ebf4ff;
            --panel-soft: #f4f9ff;
            --border: #bfd6ef;
            --border-soft: #9dbfe9;
            --text: #111827;
            --muted: #476a8d;
            --accent: #5b8ec9;
            --accent-hover: #4d7fb8;
            --button-text: #f7fbff;
            --success: #4f9566;
            --danger: #c76363;
            --shadow: rgba(110, 145, 185, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 600;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid #262626;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input[readonly] {
            background: #171717;
            color: #22c55e;
            font-weight: 600;
            border-color: #262626;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-add-item {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: #ffffff;
            color: #000000;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding-top: 15px;
        }

        .qty-btn {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-remove-item {
            color: #ef4444;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #262626;
            border-radius: 4px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        table.data-table th {
            background: #1f1f1f;
            color: #a3a3a3;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #262626;
        }

        table.data-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #1f1f1f;
            color: #e5e5e5;
        }

        table.data-table tr:hover {
            background: #1a1a1a;
        }

        .badge-previa {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: inline-block;
        }

        .badge-directa {
            background: rgba(234, 179, 8, 0.15);
            color: #fde047;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(234, 179, 8, 0.3);
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-select-cita {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-select-cita:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-delete-cita {
            background: rgba(220, 38, 38, 0.2);
            color: #ef4444;
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-delete-cita:hover {
            background: #dc2626;
            color: #ffffff;
        }

        body {
            background: var(--bg) !important;
            color: var(--text) !important;
        }

        .topbar, .sidebar-buttons, .main-panel, .modal-card {
            background: var(--panel);
            border-color: var(--border);
            color: var(--text);
        }

        .topbar h1, .panel-header h2, .summary-row.total,
        .form-section-title {
            color: var(--text);
        }

        .panel-header, .panel-header p, .sidebar-title,
        .input-group label, .summary-row,
        table.data-table th {
            color: var(--muted);
        }

        .panel-header, .form-section-title, .summary-row,
        .table-container, table.data-table th, table.data-table td {
            border-color: var(--border);
        }

        .nav-btn, .btn-add-item, .btn-secondary, .qty-btn, .btn-select-cita,
        .input-group input, .input-group select, .input-group textarea,
        .summary-box, .table-container, table.data-table th,
        .table-container .data-table td {
            background: var(--panel-alt);
            color: var(--text);
            border-color: var(--border-soft);
        }

        .nav-btn:hover, .btn-add-item:hover, .btn-secondary:hover, .qty-btn:hover,
        .btn-select-cita:hover, .input-group input:focus,
        .input-group select:focus, .input-group textarea:focus,
        table.data-table tr:hover {
            background: #dfeeff;
            border-color: var(--accent);
            color: var(--text);
        }

        .nav-btn.active, .btn-action {
            background: var(--accent);
            color: var(--button-text);
            border-color: var(--accent);
        }

        .btn-action:hover {
            background: var(--accent-hover);
        }

        .btn-logout {
            color: var(--accent);
            border-color: var(--border-soft);
        }

        .btn-logout:hover {
            background: var(--accent);
            color: var(--button-text);
        }

        .input-group input[readonly] {
            background: var(--panel-alt);
            color: var(--success);
            border-color: var(--border);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
            color: var(--text);
            font-size: 0.9rem;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        table.data-table td {
            color: var(--text);
            border-bottom-color: var(--border);
        }

        .badge-previa {
            background: #edf7ef;
            color: var(--success);
            border-color: #b9d9c1;
        }

        .badge-directa {
            background: #fff8e7;
            color: #9b762e;
            border-color: #ead9a9;
        }

        .alert-box {
            background: #f0f8f1;
            border-color: var(--success);
            color: var(--success);
        }

        .btn-delete-cita {
            background: #fff4f3;
            color: var(--danger);
            border-color: #e9b8b5;
        }

        .btn-delete-cita:hover {
            background: var(--danger);
            color: #ffffff;
        }

        [style*="color:#ffffff"], [style*="color: #ffffff"],
        [style*="color:#fff"], [style*="color: #fff"],
        [style*="color:#e5e5e5"], [style*="color: #e5e5e5"] {
            color: var(--text) !important;
        }

        [style*="color:#a3a3a3"], [style*="color: #a3a3a3"] {
            color: var(--muted) !important;
        }

        .report-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin: 18px 0;
        }

        .report-total-card {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-alt);
        }

        .report-total-card strong {
            display: block;
            margin-top: 8px;
            font-size: 1.35rem;
        }

        .report-filter-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
        }

        @media print {
            @page {
                size: landscape;
                margin: 12mm;
            }

            body.reporte-impresion {
                background: #fff !important;
                color: #111 !important;
            }

            body.reporte-impresion .topbar,
            body.reporte-impresion .sidebar-buttons,
            body.reporte-impresion .no-print {
                display: none !important;
            }

            body.reporte-impresion .workspace,
            body.reporte-impresion .main-panel {
                display: block !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                border: 0 !important;
                box-shadow: none !important;
            }

            body.reporte-impresion .summary-box,
            body.reporte-impresion .report-total-card,
            body.reporte-impresion table.data-table th,
            body.reporte-impresion table.data-table td {
                background: #fff !important;
                color: #111 !important;
                border-color: #aaa !important;
            }
        }

        [style*="background:#262626"], [style*="background: #262626"] {
            background: var(--panel-alt) !important;
        }

        [style*="background:#22c55e"], [style*="background: #22c55e"] {
            background: #dcefe1 !important;
            color: var(--success) !important;
            border-color: #b9d9c1 !important;
        }

        [style*="color:#60a5fa"], [style*="color: #60a5fa"] {
            color: var(--accent) !important;
        }

        [style*="color:#22c55e"], [style*="color: #22c55e"],
        [style*="color:#4ade80"], [style*="color: #4ade80"] {
            color: var(--success) !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Taller y Servicio Técnico</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">Servicios de Taller</div>
                <button class="nav-btn active" onclick="cambiarVistaMecanico('mantenimiento', this)">
                    🛠️ Registro de Mantenimiento
                </button>
                <button class="nav-btn" onclick="cambiarVistaMecanico('citas', this)">
                    📋 Citas y Registro de Clientes
                </button>
                <button class="nav-btn" onclick="cambiarVistaMecanico('cobro', this)">
                    💳 Cobro de Mantenimiento / Servicio
                </button>
                <button class="nav-btn" onclick="cambiarVistaMecanico('historial', this)">
                    📊 Historial de Cobros
                </button>
            </div>

            <div class="main-panel" id="panel-contenido-mecanico">
            </div>
        </div>
    </div>

    <script>
        // ================= Utilidades =================
        function escaparHtml(valor) {
            return String(valor == null ? '' : valor).replace(/[&<>"']/g, caracter => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[caracter]);
        }

        async function api(url, opciones) {
            const resp = await fetch(url, opciones);
            let datos = null;
            try { datos = await resp.json(); } catch (e) { /* respuesta sin cuerpo */ }
            if (!resp.ok) {
                throw new Error((datos && datos.message) || ('Error del servidor (' + resp.status + ')'));
            }
            return datos;
        }

        function enviar(metodo, url, cuerpo) {
            return api(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: cuerpo ? JSON.stringify(cuerpo) : undefined
            });
        }

        function fechaLocalISO(fecha) {
            const anio = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const dia = String(fecha.getDate()).padStart(2, '0');
            return `${anio}-${mes}-${dia}`;
        }

        function formatearMoneda(importe) {
            return new Intl.NumberFormat('es-MX', {
                style: 'currency',
                currency: 'MXN'
            }).format(Number(importe) || 0);
        }

        // ================= Estado (datos que vienen de la base de datos) =================
        let catalogoCache = [];
        let listaCitas = [];
        let piezasyInsumosServicio = [];
        let refaccionesMantenimientoForm = [];
        let servicioSeleccionadoParaCobro = null;
        let historialCobros = [];

        function normalizarCita(r) {
            let d = {};
            try { d = r.detalle_orden ? JSON.parse(r.detalle_orden) : {}; } catch (e) { d = {}; }
            return {
                id: r.id,
                folio: r.folio,
                cliente: r.cliente,
                mecanico: r.mecanico || '',
                moto: r.moto,
                placas: r.placas,
                servicio: r.servicio,
                modalidad: r.modalidad || '',
                fechaHora: r.fecha_hora,
                pagoRegistradoId: r.pago_registrado_id,
                kilometraje: r.kilometraje,
                diagnostico: r.diagnostico,
                requiereRefacciones: d.requiereRefacciones === true,
                refacciones: d.refacciones || [],
                servicioExtra: d.servicioExtra || null
            };
        }

        async function cargarDatos() {
            const [citas, productos] = await Promise.all([api('/api/citas'), api('/api/productos')]);
            listaCitas = citas.map(normalizarCita);
            catalogoCache = productos.map(p => ({
                id: String(p.id),
                sku: p.sku,
                nombre: p.nombre,
                precio: Number(p.precio),
                stock: Number(p.stock)
            }));
        }

        function obtenerCatalogo() { return catalogoCache; }

        function panelMecanico() { return document.getElementById('panel-contenido-mecanico'); }

        function obtenerFechaHoraCita(cita) {
            const coincidencia = String(cita.fechaHora || '').match(
                /^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})(?:\s*(AM|PM))?/i
            );
            if (!coincidencia) return null;

            let hora = Number(coincidencia[4]);
            const meridiano = coincidencia[6]?.toUpperCase();
            if (meridiano === 'PM' && hora < 12) hora += 12;
            if (meridiano === 'AM' && hora === 12) hora = 0;

            const fecha = new Date(
                Number(coincidencia[1]),
                Number(coincidencia[2]) - 1,
                Number(coincidencia[3]),
                hora,
                Number(coincidencia[5])
            );
            if (Number.isNaN(fecha.getTime())) return null;

            return {
                fecha,
                fechaTexto: fecha.toLocaleDateString('es-MX'),
                horaTexto: fecha.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })
            };
        }

        // ================= Navegación =================
        async function cambiarVistaMecanico(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }

            panelMecanico().innerHTML = '<div class="summary-box">Cargando...</div>';

            try {
                if (vista === 'historial') {
                    await renderizarHistorialCobros();
                    return;
                }
                await cargarDatos();

                if (vista === 'mantenimiento') {
                    await renderizarFormularioMantenimientoOriginal();
                } else if (vista === 'citas') {
                    renderizarTablaCitasOriginal();
                } else if (vista === 'cobro') {
                    servicioSeleccionadoParaCobro = null;
                    piezasyInsumosServicio = [];
                    renderizarModuloCobroSeparado();
                }
            } catch (e) {
                panelMecanico().innerHTML = `
                    <div class="summary-box">
                        <p>No fue posible conectar con el servidor: ${escaparHtml(e.message)}</p>
                        <p style="margin-top:8px;">Si el servidor estaba dormido, espera un minuto e inténtalo de nuevo.</p>
                        <button class="btn-action" onclick="cambiarVistaMecanico('${vista}')">Reintentar</button>
                    </div>`;
            }
        }

        /* 1. REGISTRO DE MANTENIMIENTO */
        async function renderizarFormularioMantenimientoOriginal() {
            refaccionesMantenimientoForm = [];
            const { folio } = await api('/api/citas/siguiente-folio');

            panelMecanico().innerHTML = `
                <div class="panel-header">
                    <h2>Nuevo Servicio / Mantenimiento</h2>
                    <p>Registro de ingreso de motocicleta, diagnóstico inicial y asignación de refacciones.</p>
                </div>

                <form id="mantenimientoForm" onsubmit="guardarMantenimientoOriginal(event)">
                    <div class="form-section-title">1. Búsqueda y Validación de Cita</div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Folio de Cita Consecutivo Único</label>
                            <input type="text" id="folioCita" value="${escaparHtml(folio)}" readonly>
                        </div>

        function renderizarRefaccionesMantenimiento() {
            const contenedor = document.getElementById('listaRefaccionesMantenimiento');

            const opcionesRefacciones = obtenerCatalogo().map(refaccion =>
                `<option value="${refaccion.id}">[${escaparHtml(refaccion.sku)}] ${escaparHtml(refaccion.nombre)} (Stock: ${refaccion.stock})</option>`
            ).join('');

            contenedor.innerHTML = refaccionesMantenimientoForm.map((refaccion, indice) => `
                <div class="form-grid">
                    <div class="input-group">
                        <label for="refaccion-${indice}">Seleccionar Refacción / Insumo</label>
                        <select id="refaccion-${indice}" onchange="actualizarRefaccionMantenimiento(${indice}, this.value)" required>
                            <option value="">Selecciona una refacción</option>
                            ${opcionesRefacciones}
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="cantidadRefaccion-${indice}">Cantidad Requerida</label>
                        <div class="action-buttons">
                            <input type="number" id="cantidadRefaccion-${indice}" value="${refaccion.cantidad}" min="1" step="1"
                                onchange="actualizarCantidadRefaccionMantenimiento(${indice}, this.value)" required>
                            <button type="button" class="btn-remove-item" onclick="quitarRefaccionMantenimiento(${indice})">Quitar</button>
                        </div>
                    </div>
                </div>
            `).join('');

            refaccionesMantenimientoForm.forEach((refaccion, indice) => {
                const selector = document.getElementById(`refaccion-${indice}`);
                if (selector) selector.value = refaccion.id || '';
            });
        }

        function agregarRefaccionMantenimiento(refaccionInicial = null) {
            refaccionesMantenimientoForm.push(refaccionInicial || { id: '', cantidad: 1 });
            renderizarRefaccionesMantenimiento();
        }

        function actualizarRefaccionMantenimiento(indice, id) {
            if (refaccionesMantenimientoForm[indice]) {
                refaccionesMantenimientoForm[indice].id = id;
            }
        }

        function actualizarCantidadRefaccionMantenimiento(indice, cantidad) {
            if (refaccionesMantenimientoForm[indice]) {
                refaccionesMantenimientoForm[indice].cantidad = Number(cantidad);
            }
        }

        function quitarRefaccionMantenimiento(indice) {
            refaccionesMantenimientoForm.splice(indice, 1);
            renderizarRefaccionesMantenimiento();
        }

        function toggleRefaccionesMantenimiento() {
            const requiereRefacciones = document.getElementById('requiereRefacciones').checked;
            const camposRefacciones = document.getElementById('camposRefaccionesMantenimiento');

            camposRefacciones.style.display = requiereRefacciones ? 'block' : 'none';
            if (requiereRefacciones && refaccionesMantenimientoForm.length === 0) {
                agregarRefaccionMantenimiento();
            } else if (!requiereRefacciones) {
                refaccionesMantenimientoForm = [];
                renderizarRefaccionesMantenimiento();
            }
        }

        async function guardarMantenimientoOriginal(event) {
            event.preventDefault();

            const folioActual = document.getElementById('folioCita').value;
            const placasVal = document.getElementById('placasInput').value.trim();
            const clienteVal = document.getElementById('clienteInput').value.trim();
            const estadoCitaVal = document.getElementById('estadoCita').value;
            const fallasVal = document.getElementById('fallas').value.trim();
            const kilometrajeVal = document.getElementById('kilometraje').value;
            const diagnosticoVal = document.getElementById('diagnostico').value.trim();

            const servicioExtraDescripcion = document.getElementById('servicioExtraDescripcion').value.trim();
            const servicioExtraPrecioValor = document.getElementById('servicioExtraPrecio').value.trim();
            const servicioExtraPrecio = Number(servicioExtraPrecioValor);
            const tieneServicioExtra = Boolean(servicioExtraDescripcion || servicioExtraPrecioValor);
            if (tieneServicioExtra && (
                !servicioExtraDescripcion ||
                !servicioExtraPrecioValor ||
                !Number.isFinite(servicioExtraPrecio) ||
                servicioExtraPrecio <= 0
            )) {
                alert('Para cobrar un servicio extra, agrega su descripción y un precio mayor a $0.00.');
                return;
            }
            const servicioExtra = tieneServicioExtra
                ? { descripcion: servicioExtraDescripcion, precio: servicioExtraPrecio }
                : null;

            const requiereRefacciones = document.getElementById('requiereRefacciones').checked;
            if (requiereRefacciones && (
                refaccionesMantenimientoForm.length === 0 ||
                refaccionesMantenimientoForm.some(refaccion =>
                    !refaccion.id || !Number.isInteger(refaccion.cantidad) || refaccion.cantidad < 1
                )
            )) {
                alert('Agrega al menos una refacción y selecciona una cantidad válida para cada una.');
                return;
            }

            const catalogo = obtenerCatalogo();
            const refacciones = requiereRefacciones
                ? refaccionesMantenimientoForm.map(refaccionForm => {
                    const producto = catalogo.find(refaccion => refaccion.id === String(refaccionForm.id));
                    if (!producto) return null;
                    return {
                        id: producto.id,
                        sku: producto.sku,
                        nombre: producto.nombre,
                        precio: producto.precio,
                        cantidad: refaccionForm.cantidad
                    };
                })
                : [];
            if (refacciones.some(refaccion => refaccion === null)) {
                alert('Una de las refacciones seleccionadas ya no está disponible en el catálogo. Actualiza la selección e inténtalo de nuevo.');
                return;
            }

            const cantidadesPorRefaccion = new Map();
            refacciones.forEach(refaccion => {
                cantidadesPorRefaccion.set(
                    refaccion.id,
                    (cantidadesPorRefaccion.get(refaccion.id) || 0) + refaccion.cantidad
                );
            });
            for (const [id, cantidad] of cantidadesPorRefaccion) {
                const producto = catalogo.find(refaccion => refaccion.id === id);
                if (cantidad > producto.stock) {
                    alert(`Stock insuficiente para ${producto.nombre}. Disponibles: ${producto.stock} pzas.`);
                    return;
                }
            }

            const existente = listaCitas.find(c => c.folio === folioActual);
            const cuerpo = {
                folio: folioActual,
                cliente: clienteVal || 'Cliente General',
                placas: placasVal.toUpperCase(),
                servicio: fallasVal || 'Mantenimiento General',
                modalidad: estadoCitaVal,
                kilometraje: kilometrajeVal,
                diagnostico: diagnosticoVal,
                moto: existente ? existente.moto : 'Motocicleta ingresada',
                detalle_orden: JSON.stringify({ requiereRefacciones, refacciones, servicioExtra })
            };

            const boton = document.getElementById('btnGuardarOrden');
            if (boton) boton.disabled = true;
            try {
                await enviar('POST', '/api/citas/orden', cuerpo);
                document.getElementById('alertaExito').style.display = 'block';
                setTimeout(() => {
                    cambiarVistaMecanico('mantenimiento', document.querySelectorAll('.nav-btn')[0]);
                }, 1800);
            } catch (e) {
                if (boton) boton.disabled = false;
                alert('No se pudo guardar la orden: ' + e.message);
            }
        }

        /* 2. CITAS Y REGISTRO DE CLIENTES */

                const fechaA = obtenerFechaHoraCita(a)?.fecha.getTime();

                if (fechaB === undefined) return -1;

            const filasHTML = citasOrdenadas.map(cita => {

                return `

                        <td>${escaparHtml(cita.cliente)}</td>
                        <td>${escaparHtml(cita.moto)}</td>
                        <td>${escaparHtml(cita.placas)}</td>

                            </div>
                        </td>
                    </tr>

            panelMecanico().innerHTML = `

                    <h2>Desglose de Citas y Registros de Clientes</h2>
                    <p>Visualización de citas agendadas desde la web y registros directos en caja.</p>

        async function cargarCitaEnFormulario(folio) {
            await cambiarVistaMecanico('mantenimiento', document.querySelectorAll('.nav-btn')[0]);

            const citaEncontrada = listaCitas.find(c => c.folio === folio);
            if (!citaEncontrada || !document.getElementById('folioCita')) return;

            document.getElementById('folioCita').value = citaEncontrada.folio;
            document.getElementById('placasInput').value = citaEncontrada.placas || '';
            document.getElementById('clienteInput').value = citaEncontrada.cliente || '';

            const selectEstado = document.getElementById('estadoCita');
            if (Array.from(selectEstado.options).some(o => o.value === citaEncontrada.modalidad)) {
                selectEstado.value = citaEncontrada.modalidad;
            }

            document.getElementById('kilometraje').value =
                citaEncontrada.kilometraje != null ? citaEncontrada.kilometraje : '';
            document.getElementById('fallas').value = citaEncontrada.servicio || '';
            document.getElementById('diagnostico').value = citaEncontrada.diagnostico
                || ('Revisión técnica en proceso para la motocicleta ' + citaEncontrada.moto + '.');
            document.getElementById('servicioExtraDescripcion').value =
                citaEncontrada.servicioExtra ? citaEncontrada.servicioExtra.descripcion || '' : '';
            document.getElementById('servicioExtraPrecio').value =
                citaEncontrada.servicioExtra ? citaEncontrada.servicioExtra.precio : '';

            const catalogo = obtenerCatalogo();
            refaccionesMantenimientoForm = (citaEncontrada.refacciones || []).map(refaccionGuardada => {
                const producto = catalogo.find(refaccion =>
                    refaccion.id === String(refaccionGuardada.id) ||
                    refaccion.sku === refaccionGuardada.sku ||
                    refaccion.nombre === refaccionGuardada.nombre
                );
                return producto
                    ? { id: producto.id, cantidad: refaccionGuardada.cantidad }
                    : null;
            }).filter(Boolean);

            document.getElementById('requiereRefacciones').checked =
                citaEncontrada.requiereRefacciones === true || refaccionesMantenimientoForm.length > 0;
            toggleRefaccionesMantenimiento();
            renderizarRefaccionesMantenimiento();
        }

        async function eliminarCita(folio) {
            const cita = listaCitas.find(c => c.folio === folio);
            if (!cita) return;
            if (!confirm('¿Está seguro de eliminar la cita ' + folio + '?')) return;
            try {
                await enviar('DELETE', '/api/citas/' + cita.id);
                cambiarVistaMecanico('citas', document.querySelectorAll('.nav-btn')[1]);
            } catch (e) {
                alert('No se pudo eliminar la cita: ' + e.message);
            }
        }

        function seleccionarServicioParaCobrar(folio) {
            const servicio = listaCitas.find(c => c.folio === folio);

            piezasyInsumosServicio = [];
            renderizarModuloCobroSeparado();
            cargarRefaccionesOrdenAlCobro(servicio);

            const selectMecanico = document.getElementById('cobroMecanicoSelect');
            if (servicio.mecanico && selectMecanico &&
                Array.from(selectMecanico.options).some(o => o.value === servicio.mecanico)) {
                selectMecanico.value = servicio.mecanico;
            }

            const formulario = document.getElementById('formularioCobroDetalle');
            if (formulario) formulario.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function cargarRefaccionesOrdenAlCobro(servicio) {
            const catalogoServicio = obtenerCatalogo();
            piezasyInsumosServicio = (servicio.refacciones || []).map(refaccionGuardada => {
                const producto = catalogoServicio.find(refaccion =>
                    refaccion.id === String(refaccionGuardada.id) ||
                    refaccion.sku === refaccionGuardada.sku ||
                    refaccion.nombre === refaccionGuardada.nombre
                );
                if (!producto) return null;
                return {
                    id: producto.id,
                    sku: producto.sku,
                    nombre: producto.nombre,
                    precio: producto.precio,
                    cantidad: refaccionGuardada.cantidad
                };
            }).filter(Boolean);
            actualizarTotalesCobroModulo();
        }

        function agregarPiezaAlCobroModulo() {
            const selector = document.getElementById('selectRefaccionCobro');
            if (!selector || !selector.value) return;

            const refId = selector.value;
            const cant = parseInt(document.getElementById('cantRefaccionCobro').value) || 1;
            const ref = obtenerCatalogo().find(p => p.id === refId);

            if (ref) {
                if (cant > ref.stock) {
                    alert(`⚠️ Stock insuficiente. Quedan ${ref.stock} pzas de ${ref.nombre}.`);
                    return;
                }
                const existe = piezasyInsumosServicio.find(i => i.id === refId);
                if (existe) {
                    if ((existe.cantidad + cant) > ref.stock) {
                        alert(`⚠️ Supera el stock disponible (${ref.stock} pzas).`);
                        return;
                    }
                    existe.cantidad += cant;
                } else {
                    piezasyInsumosServicio.push({ id: ref.id, sku: ref.sku, nombre: ref.nombre, precio: ref.precio, cantidad: cant });
                }
                actualizarTotalesCobroModulo();
            }
        }

        function modificarCantidadPiezaModulo(id, delta) {
            const item = piezasyInsumosServicio.find(i => i.id === id);
            const ref = obtenerCatalogo().find(p => p.id === id);

            if (item && ref) {
                if (delta > 0 && (item.cantidad + delta) > ref.stock) {
                    alert(`⚠️ No puedes agregar más del stock disponible (${ref.stock} pzas).`);
                    return;
                }
                item.cantidad += delta;
                if (item.cantidad <= 0) piezasyInsumosServicio = piezasyInsumosServicio.filter(i => i.id !== id);
                actualizarTotalesCobroModulo();
            }
        }

        function removerPiezaCobroModulo(id) {
            piezasyInsumosServicio = piezasyInsumosServicio.filter(i => i.id !== id);
            actualizarTotalesCobroModulo();
        }

        function actualizarTotalesCobroModulo() {
            const contenedor = document.getElementById('listaPiezasCobroModulo');
            if (!contenedor) return;

            const manoObra = parseFloat(document.getElementById('cobroManoObraInput').value) || 0;
            const servicioExtra = servicioSeleccionadoParaCobro && servicioSeleccionadoParaCobro.servicioExtra;
            const precioServicioExtra = servicioExtra ? Number(servicioExtra.precio) || 0 : 0;
            let subtotalRef = 0;

            if (piezasyInsumosServicio.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado refacciones al ticket de cobro.</p>';
            } else {
                contenedor.innerHTML = piezasyInsumosServicio.map(item => {
                    const importe = item.precio * item.cantidad;
                    subtotalRef += importe;
                    return `
                        <div class="summary-row">
                            <div>
                                <span style="background:#262626; color:#e5e5e5; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${escaparHtml(item.sku)}</span>
                                <strong style="color:#ffffff;">${escaparHtml(item.nombre)}</strong>
                                <span style="margin-left:8px;">
                                    <button class="qty-btn" onclick="modificarCantidadPiezaModulo('${item.id}', -1)">-</button>
                                    <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                    <button class="qty-btn" onclick="modificarCantidadPiezaModulo('${item.id}', 1)">+</button>
                                </span>
                                <button class="btn-remove-item" onclick="removerPiezaCobroModulo('${item.id}')">Quitar</button>
                            </div>
                            <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                        </div>
                    `;
                }).join('');
            }

            const subtotalGen = subtotalRef + manoObra + precioServicioExtra;
            const iva = subtotalGen * 0.16;
            const total = subtotalGen + iva;

            document.getElementById('lblCobroManoObra').innerText = '$' + manoObra.toFixed(2) + ' MXN';
            document.getElementById('lblCobroServicioExtra').innerText = '$' + precioServicioExtra.toFixed(2) + ' MXN';
            document.getElementById('lblCobroSubtotal').innerText = '$' + subtotalGen.toFixed(2) + ' MXN';
            document.getElementById('lblCobroIva').innerText = '$' + iva.toFixed(2) + ' MXN';
            document.getElementById('lblCobroTotal').innerText = '$' + total.toFixed(2) + ' MXN';
        }

        async function finalizarCobroMantenimiento(boton) {
            if (!servicioSeleccionadoParaCobro) return;

            const descripcionServicioRealizado = document.getElementById('cobroServicioDescInput').value.trim();
            const costoManoObra = Number(document.getElementById('cobroManoObraInput').value);
            if (!descripcionServicioRealizado || !Number.isFinite(costoManoObra) || costoManoObra < 0) {
                alert('Indica el servicio realizado y un precio válido de mano de obra (mínimo $0.00).');
                return;
            }

            const catalogo = obtenerCatalogo();
            const cantidadesPorRefaccion = new Map();
            piezasyInsumosServicio.forEach(item => {
                cantidadesPorRefaccion.set(item.id, (cantidadesPorRefaccion.get(item.id) || 0) + item.cantidad);
            });
            for (const [id, cantidad] of cantidadesPorRefaccion) {
                const refaccion = catalogo.find(producto => producto.id === id);
                if (!refaccion || cantidad > refaccion.stock) {
                    alert(`Stock insuficiente para ${refaccion ? refaccion.nombre : 'una refacción del servicio'}. Ajusta las cantidades antes de finalizar el cobro.`);
                    return;
                }
            }

            const servicioActualizado = listaCitas.find(cita => cita.folio === servicioSeleccionadoParaCobro.folio);
            if (!servicioActualizado) {
                alert('No se encontró el servicio seleccionado. Actualiza la lista e inténtalo de nuevo.');
                return;
            }
            if (servicioActualizado.pagoRegistradoId) {
                alert('Este servicio ya tiene un cobro registrado. Consulta el historial para ver el detalle.');
                return;
            }

            if (boton) boton.disabled = true;
            try {
                await enviar('POST', '/api/cobros', {
                    folio: servicioActualizado.folio,
                    cliente: servicioActualizado.cliente || 'Cliente General',
                    motocicleta: servicioActualizado.moto || 'Motocicleta ingresada',
                    placas: servicioActualizado.placas || 'Sin placas',
                    servicioSolicitado: servicioActualizado.servicio || 'Servicio general',
                    servicioRealizado: descripcionServicioRealizado,
                    mecanico: document.getElementById('cobroMecanicoSelect').value,
                    manoObra: costoManoObra,
                    servicioExtraDescripcion: servicioActualizado.servicioExtra?.descripcion || '',
                    servicioExtraPrecio: servicioActualizado.servicioExtra?.precio || 0,
                    refacciones: piezasyInsumosServicio.map(item => ({
                        sku: item.sku,
                        nombre: item.nombre,
                        precioUnitario: item.precio,
                        cantidad: item.cantidad
                    }))
                });
            } catch (error) {
                if (boton) boton.disabled = false;
                alert(`No se registró el cobro. No se descontó el stock. ${error.message || 'Verifica la conexión e inténtalo de nuevo.'}`);
                return;
            }

            // El servidor ya descontó el stock y marcó la cita como cobrada
            document.getElementById('alertaCobroExito').style.display = 'block';
            setTimeout(() => {
                cambiarVistaMecanico('cobro', document.querySelectorAll('.nav-btn')[2]);
            }, 1800);
        }

        /* 4. HISTORIAL DE COBROS */
        async function renderizarHistorialCobros() {
            panelMecanico().innerHTML = `
                <div class="panel-header">
                    <h2>Historial de Cobros</h2>
                    <p>Consulta servicios cobrados y totales de caja por día o semana.</p>
                </div>
                <div class="summary-box">Cargando historial...</div>
            `;
            try {
                historialCobros = await api('/api/cobros');
                mostrarHistorialCobros();
            } catch (error) {
                panelMecanico().innerHTML = `
                    <div class="panel-header"><h2>Historial de Cobros</h2></div>
                    <div class="summary-box">
                        <p>No fue posible conectar con el servidor: ${escaparHtml(error.message || 'Error de conexión.')}</p>
                        <button class="btn-action" onclick="renderizarHistorialCobros()">Reintentar</button>
                    </div>
                `;
            }
        }

        function mostrarHistorialCobros(fechaInicio = fechaLocalISO(new Date()), fechaFin = fechaLocalISO(new Date())) {
            const cobrosFiltrados = historialCobros.filter(cobro => {
                const fechaPago = fechaLocalISO(new Date(cobro.fechaPago));
                return fechaPago >= fechaInicio && fechaPago <= fechaFin;
            });
            const totalPeriodo = cobrosFiltrados.reduce((total, cobro) => total + Number(cobro.total || 0), 0);
            const totalRefacciones = cobrosFiltrados.reduce((total, cobro) =>
                total + (cobro.refacciones || []).reduce((suma, refaccion) => suma + Number(refaccion.importe || 0), 0), 0);
            const totalServicios = cobrosFiltrados.reduce((total, cobro) =>
                total + Number(cobro.manoObra || 0) + Number(cobro.servicioExtraPrecio || 0), 0);
            const totalesPorDia = new Map();
            cobrosFiltrados.forEach(cobro => {
                const fecha = fechaLocalISO(new Date(cobro.fechaPago));
                const registro = totalesPorDia.get(fecha) || { cantidad: 0, total: 0 };
                registro.cantidad++;
                registro.total += Number(cobro.total || 0);
                totalesPorDia.set(fecha, registro);
            });

            const filasDiarias = [...totalesPorDia.entries()]
                .sort(([fechaA], [fechaB]) => fechaA.localeCompare(fechaB))
                .map(([fecha, registro]) => `
                    <tr>
                        <td>${new Date(`${fecha}T12:00:00`).toLocaleDateString('es-MX')}</td>
                        <td>${registro.cantidad}</td>
                        <td>${formatearMoneda(registro.total)}</td>
                    </tr>
                `).join('');

            const filasCobros = cobrosFiltrados.map(cobro => {
                const detalleRefacciones = (cobro.refacciones || []).map(refaccion =>
                    `${escaparHtml(refaccion.nombre)} (${refaccion.cantidad} × ${formatearMoneda(refaccion.precioUnitario)}) — ${formatearMoneda(refaccion.importe)}`
                );
                const detalle = [
                    `<strong>Solicitado:</strong> ${escaparHtml(cobro.servicioSolicitado)}`,
                    `<strong>Realizado:</strong> ${escaparHtml(cobro.servicioRealizado)}`,
                    `<strong>Mano de obra:</strong> ${formatearMoneda(cobro.manoObra)}`,
                    Number(cobro.servicioExtraPrecio) > 0
                        ? `<strong>Extra:</strong> ${escaparHtml(cobro.servicioExtraDescripcion)} — ${formatearMoneda(cobro.servicioExtraPrecio)}`
                        : '',
                    ...detalleRefacciones
                ].filter(Boolean).join('<br>');
                return `
                    <tr>
                        <td>${escaparHtml(new Date(cobro.fechaPago).toLocaleString('es-MX'))}</td>
                        <td>${escaparHtml(cobro.folio)}</td>
                        <td>${escaparHtml(cobro.cliente)}<br>${escaparHtml(cobro.motocicleta)} (${escaparHtml(cobro.placas)})</td>
                        <td>${detalle}</td>
                        <td>${escaparHtml(cobro.mecanico)}</td>
                        <td>${formatearMoneda(cobro.subtotal)}<br>IVA: ${formatearMoneda(cobro.iva)}</td>
                        <td><strong>${formatearMoneda(cobro.total)}</strong></td>
                    </tr>
                `;
            }).join('');

            panelMecanico().innerHTML = `
                <div class="panel-header">
                    <h2>Historial de Cobros</h2>
                    <p>Elige un periodo para consultar la caja. Usa Imprimir / Guardar PDF para descargar el reporte como PDF.</p>
                </div>
                <div class="summary-box no-print">
                    <div class="report-filter-actions">
                        <div class="input-group" style="margin:0;">
                            <label for="historialFechaInicio">Desde</label>
                            <input type="date" id="historialFechaInicio" value="${escaparHtml(fechaInicio)}">
                        </div>
                        <div class="input-group" style="margin:0;">
                            <label for="historialFechaFin">Hasta</label>
                            <input type="date" id="historialFechaFin" value="${escaparHtml(fechaFin)}">
                        </div>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoHistorial('hoy')">Hoy</button>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoHistorial('semana')">Esta semana</button>
                        <button type="button" class="btn-secondary" onclick="aplicarFiltroHistorial()">Aplicar fechas</button>
                        <button type="button" class="btn-action" style="margin-top:0; width:auto;" onclick="imprimirReporteCobros()">Imprimir / Guardar PDF</button>
                    </div>
                </div>
                <div class="report-summary-grid">
                    <div class="report-total-card">Cobros en el periodo<strong>${cobrosFiltrados.length}</strong></div>
                    <div class="report-total-card">Total en caja<strong>${formatearMoneda(totalPeriodo)}</strong></div>
                    <div class="report-total-card">Servicios y mano de obra<strong>${formatearMoneda(totalServicios)}</strong></div>
                    <div class="report-total-card">Refacciones<strong>${formatearMoneda(totalRefacciones)}</strong></div>
                </div>
                <div class="summary-box">
                    <h3>Resumen diario</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Día</th><th>Cobros</th><th>Total de caja</th></tr></thead>
                            <tbody>${filasDiarias || '<tr><td colspan="3" style="text-align:center;">No hay cobros para este periodo.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
                <div class="summary-box">
                    <h3>Detalle de servicios cobrados</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Fecha</th><th>Folio</th><th>Cliente / Motocicleta</th><th>Desglose</th><th>Mecánico</th><th>Subtotal / IVA</th><th>Total</th></tr></thead>
                            <tbody>${filasCobros || '<tr><td colspan="7" style="text-align:center;">No hay cobros para este periodo.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function seleccionarPeriodoHistorial(periodo) {
            const hoy = new Date();
            let inicio = new Date(hoy);
            let fin = new Date(hoy);
            if (periodo === 'semana') {
                const diasDesdeLunes = (hoy.getDay() + 6) % 7;
                inicio.setDate(hoy.getDate() - diasDesdeLunes);
                fin.setDate(inicio.getDate() + 6);
            }
            mostrarHistorialCobros(fechaLocalISO(inicio), fechaLocalISO(fin));
        }

        function aplicarFiltroHistorial() {
            const fechaInicio = document.getElementById('historialFechaInicio').value;
            const fechaFin = document.getElementById('historialFechaFin').value;
            if (!fechaInicio || !fechaFin || fechaInicio > fechaFin) {
                alert('Selecciona un rango válido: la fecha inicial debe ser igual o anterior a la fecha final.');
                return;
            }
            mostrarHistorialCobros(fechaInicio, fechaFin);
        }

        function imprimirReporteCobros() {
            document.body.classList.add('reporte-impresion');
            window.print();
            window.setTimeout(() => document.body.classList.remove('reporte-impresion'), 500);
        }

        window.onload = function() {
            cambiarVistaMecanico('mantenimiento', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
