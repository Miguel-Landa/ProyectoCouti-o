<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas y Cotizaciones - MRX</title>
    <script src="sesion.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eaf3fb;
            --panel: #f8fbff;
            --panel-alt: #ebf4ff;
            --panel-soft: #f4f9ff;
            --border: #bfd6ef;
            --border-soft: #9dbfe9;
            --text: #111827;
            --muted: #476a8d;
            --accent: #5b8ec9;
            --accent-hover: #4d7fb8;
            --button-text: #f7fbff;
            --success: #4f9566;
            --danger: #c76363;
            --shadow: rgba(110, 145, 185, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-add-item {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-secondary {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .qty-btn {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .ticket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px 20px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .ticket-item:hover {
            border-color: #404040;
            background: #262626;
        }

        .ticket-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ticket-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ticket-sub {
            font-size: 0.8rem;
            color: #a3a3a3;
        }

        .ticket-price {
            font-size: 1rem;
            font-weight: 700;
        }

        .badge-cotizacion {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .badge-venta {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .badge-stock-ok {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-stock-low {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-stock-empty {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 6px;
            width: 100%;
            max-width: 580px;
            padding: 25px;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger:hover { background: #b91c1c; }

        .btn-convert {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-convert:hover { background: #15803d; }

        .btn-close {
            background: transparent;
            color: #a3a3a3;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: #262626; color: #ffffff; }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .btn-remove-item {
            color: #ef4444;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #262626;
            border-radius: 4px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        table.data-table th {
            background: #1f1f1f;
            color: #a3a3a3;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #262626;
        }

        table.data-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #1f1f1f;
            color: #e5e5e5;
            vertical-align: top;
        }

        table.data-table tr:hover {
            background: #1a1a1a;
        }

        .report-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin: 18px 0;
        }

        .report-total-card {
            padding: 18px;
            border: 1px solid #262626;
            border-radius: 8px;
            background: #1f1f1f;
        }

        .report-total-card strong {
            display: block;
            margin-top: 8px;
            font-size: 1.35rem;
        }

        .report-filter-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
        }

        body {
            background: var(--bg) !important;
            color: var(--text) !important;
        }

        .topbar, .sidebar-buttons, .main-panel, .modal-card {
            background: var(--panel);
            border-color: var(--border);
            color: var(--text);
        }

        .topbar h1, .panel-header h2, .summary-row.total,
        .ticket-title {
            color: var(--text);
        }

        .panel-header, .panel-header p, .sidebar-title,
        .input-group label, .summary-row, .ticket-sub {
            color: var(--muted);
        }

        .panel-header, .summary-row, .ticket-item {
            border-color: var(--border);
        }

        .nav-btn, .btn-add-item, .btn-secondary, .qty-btn, .input-group input,
        .input-group select, .summary-box, .ticket-item {
            background: var(--panel-alt);
            color: var(--text);
            border-color: var(--border-soft);
        }

        .nav-btn:hover, .btn-add-item:hover, .btn-secondary:hover, .qty-btn:hover,
        .input-group input:focus, .input-group select:focus,
        .ticket-item:hover {
            background: #dfeeff;
            border-color: var(--accent);
            color: var(--text);
        }

        .nav-btn.active, .btn-action {
            background: var(--accent);
            color: var(--button-text);
            border-color: var(--accent);
        }

        .btn-action:hover {
            background: var(--accent-hover);
        }

        .btn-logout {
            color: var(--accent);
            border-color: var(--border-soft);
        }

        .btn-logout:hover {
            background: var(--accent);
            color: var(--button-text);
        }

        .badge-cotizacion {
            background: #edf4fc;
            color: var(--accent);
            border-color: #c5d9f0;
        }

        .badge-venta, .badge-stock-ok {
            background: #edf7ef;
            color: var(--success);
            border-color: #b9d9c1;
        }

        .badge-stock-low {
            background: #fff8e7;
            color: #9b762e;
            border-color: #ead9a9;
        }

        .badge-stock-empty, .btn-danger {
            background: #fff4f3;
            color: var(--danger);
            border-color: #e9b8b5;
        }

        .btn-convert {
            background: var(--accent);
            color: var(--button-text);
        }

        .btn-close {
            color: var(--muted);
            border-color: var(--border-soft);
        }

        .btn-close:hover {
            background: var(--panel-alt);
            color: var(--text);
        }

        .alert-box {
            background: #f0f8f1;
            border-color: var(--success);
            color: var(--success);
        }

        .table-container {
            background: var(--panel-alt);
            border-color: var(--border-soft);
        }

        table.data-table th {
            background: var(--panel-alt);
            color: var(--muted);
            border-bottom-color: var(--border);
        }

        table.data-table td {
            background: var(--panel-alt);
            color: var(--text);
            border-bottom-color: var(--border);
        }

        table.data-table tr:hover td {
            background: #dfeeff;
        }

        .report-total-card {
            background: var(--panel-alt);
            border-color: var(--border);
            color: var(--text);
        }

        .input-group input[readonly] {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .cambio-ok {
            color: var(--success);
        }

        .cambio-falta {
            color: var(--danger);
        }

        [style*="color:#ffffff"], [style*="color: #ffffff"],
        [style*="color:#fff"], [style*="color: #fff"],
        [style*="color:#e5e5e5"], [style*="color: #e5e5e5"] {
            color: var(--text) !important;
        }

        [style*="color:#a3a3a3"], [style*="color: #a3a3a3"] {
            color: var(--muted) !important;
        }

        [style*="background:#262626"], [style*="background: #262626"] {
            background: var(--panel-alt) !important;
        }

        [style*="background:#22c55e"], [style*="background: #22c55e"] {
            background: #dcefe1 !important;
            color: var(--success) !important;
            border-color: #b9d9c1 !important;
        }

        [style*="color:#60a5fa"], [style*="color: #60a5fa"],
        [style*="color:#2563eb"], [style*="color: #2563eb"] {
            color: var(--accent) !important;
        }

        [style*="color:#22c55e"], [style*="color: #22c55e"] {
            color: var(--success) !important;
        }

        [style*="background:#2563eb"], [style*="background: #2563eb"] {
            background: var(--accent) !important;
        }

        @media print {
            @page {
                size: landscape;
                margin: 12mm;
            }

            body.reporte-impresion {
                background: #fff !important;
                color: #111 !important;
            }

            body.reporte-impresion .topbar,
            body.reporte-impresion .sidebar-buttons,
            body.reporte-impresion .modal-overlay,
            body.reporte-impresion .no-print {
                display: none !important;
            }

            body.reporte-impresion .workspace,
            body.reporte-impresion .main-panel {
                display: block !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                border: 0 !important;
                box-shadow: none !important;
            }

            body.reporte-impresion .panel-header h2,
            body.reporte-impresion .panel-header p {
                color: #111 !important;
            }

            body.reporte-impresion .summary-box,
            body.reporte-impresion .report-total-card,
            body.reporte-impresion .table-container,
            body.reporte-impresion table.data-table th,
            body.reporte-impresion table.data-table td,
            body.reporte-impresion .summary-row {
                background: #fff !important;
                color: #111 !important;
                border-color: #aaa !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Sistema MRX - Módulo de Ventas y Cotizaciones</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">MÓDULOS DE VENTAS Y COTIZACIONES</div>
                <button class="nav-btn active" onclick="cambiarModulo('consulta_stock', this)">
                    Consultar Disponibilidad
                </button>
                <button class="nav-btn" onclick="cambiarModulo('cotizacion', this)">
                    Cotización de Productos
                </button>
                <button class="nav-btn" onclick="cambiarModulo('venta', this)">
                    Venta de Productos
                </button>
                <button class="nav-btn" onclick="cambiarModulo('historial_cotizaciones', this)">
                    Historial de Cotizaciones
                </button>
                <button class="nav-btn" onclick="cambiarModulo('historial_ventas', this)">
                    Historial de Ventas
                </button>
                <button class="nav-btn" onclick="cambiarModulo('corte_caja', this)">
                    Corte de Caja
                </button>
            </div>

            <div class="main-panel" id="panel-contenido">
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalTicketTitulo">Detalle del Registro</h2>
                <p id="modalTicketFecha">Fecha de emisión</p>
            </div>
            <div class="summary-box" id="modalDetalleContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;" id="modalAcciones">
            </div>
        </div>
    </div>

    <script>
        function esc(valor) {
            let texto = String(valor == null ? '' : valor);
            texto = texto.replace(/&/g, '&amp;');
            texto = texto.replace(/</g, '&lt;');
            texto = texto.replace(/>/g, '&gt;');
            texto = texto.replace(/"/g, '&quot;');
            texto = texto.replace(/'/g, '&#39;');
            return texto;
        }

        function mismoId(a, b) {
            return String(a) === String(b);
        }

        function redondear(n) {
            return Math.round((Number(n) + Number.EPSILON) * 100) / 100;
        }

        function dineroTexto(n) {
            return '$' + Number(n || 0).toFixed(2) + ' MXN';
        }

        function formatearMoneda(importe) {
            return new Intl.NumberFormat('es-MX', {
                style: 'currency',
                currency: 'MXN'
            }).format(Number(importe) || 0);
        }

        function fechaLocalISO(fecha) {
            const anio = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const dia = String(fecha.getDate()).padStart(2, '0');
            return anio + '-' + mes + '-' + dia;
        }

        function fechaVentaISO(texto) {
            const t = String(texto || '').trim();
            let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) {
                return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
            }
            m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) {
                return m[1] + '-' + m[2] + '-' + m[3];
            }
            return '';
        }

        function formatoFechaISO(iso) {
            const d = new Date(iso + 'T12:00:00');
            if (Number.isNaN(d.getTime())) {
                return esc(iso);
            }
            return d.toLocaleDateString('es-MX');
        }

        function formatoFechaHora(ms) {
            const d = new Date(Number(ms));
            if (Number.isNaN(d.getTime())) {
                return '—';
            }
            return d.toLocaleString('es-MX');
        }

        async function api(url, opciones) {
            const resp = await fetch(url, opciones);
            let datos = null;
            try {
                datos = await resp.json();
            } catch (e) {
                datos = null;
            }
            if (!resp.ok) {
                let mensaje = 'Error del servidor (' + resp.status + ')';
                if (datos && datos.message) {
                    mensaje = datos.message;
                }
                throw new Error(mensaje);
            }
            return datos;
        }

        function enviar(metodo, url, cuerpo) {
            const opciones = {
                method: metodo,
                headers: { 'Content-Type': 'application/json' }
            };
            if (cuerpo) {
                opciones.body = JSON.stringify(cuerpo);
            }
            return api(url, opciones);
        }

        let catalogoProductos = [];
        let historialRegistros = [];
        let cajaPendiente = null;
        let cortesHistorial = [];
        let fondoCaja = 0;
        let rangoCorte = null;

        let itemsVentaActual = [];
        let itemsCotizacionActual = [];
        let idCotizacionEnProceso = null;
        let folioCotizacionEnProceso = null;
        let registroSeleccionadoId = null;
        let rangoVentas = null;
        let totalVentaActual = 0;

        function buscarPorId(lista, id) {
            for (let i = 0; i < lista.length; i++) {
                if (mismoId(lista[i].id, id)) {
                    return lista[i];
                }
            }
            return null;
        }

        function quitarPorId(lista, id) {
            const restantes = [];
            for (let i = 0; i < lista.length; i++) {
                if (!mismoId(lista[i].id, id)) {
                    restantes.push(lista[i]);
                }
            }
            return restantes;
        }

        function filtrarProductosPorTexto(query) {
            const q = query.toLowerCase().trim();
            const resultado = [];
            for (let i = 0; i < catalogoProductos.length; i++) {
                const p = catalogoProductos[i];
                if (p.sku.toLowerCase().indexOf(q) !== -1 || p.nombre.toLowerCase().indexOf(q) !== -1) {
                    resultado.push(p);
                }
            }
            return resultado;
        }

        function buscarGrupo(grupos, clave) {
            for (let i = 0; i < grupos.length; i++) {
                if (grupos[i].clave === clave) {
                    return grupos[i];
                }
            }
            const nuevo = { clave: clave, cantidad: 0, total: 0 };
            grupos.push(nuevo);
            return nuevo;
        }

        function ordenarGruposPorClave(grupos) {
            for (let a = 0; a < grupos.length - 1; a++) {
                for (let b = a + 1; b < grupos.length; b++) {
                    if (grupos[b].clave < grupos[a].clave) {
                        const temporal = grupos[a];
                        grupos[a] = grupos[b];
                        grupos[b] = temporal;
                    }
                }
            }
        }

        function ordenarGruposPorTotal(grupos) {
            for (let a = 0; a < grupos.length - 1; a++) {
                for (let b = a + 1; b < grupos.length; b++) {
                    if (grupos[b].total > grupos[a].total) {
                        const temporal = grupos[a];
                        grupos[a] = grupos[b];
                        grupos[b] = temporal;
                    }
                }
            }
        }

        async function cargarCatalogo() {
            const filas = await api('/api/productos');
            catalogoProductos = [];
            for (let i = 0; i < filas.length; i++) {
                const p = filas[i];
                catalogoProductos.push({
                    id: String(p.id),
                    sku: p.sku,
                    nombre: p.nombre,
                    precio: Number(p.precio),
                    stock: Number(p.stock)
                });
            }
        }

        async function cargarHistorial() {
            const filas = await api('/api/ventas');
            historialRegistros = [];
            for (let i = 0; i < filas.length; i++) {
                const r = filas[i];
                const items = [];
                const detalle = r.detalle || [];
                for (let j = 0; j < detalle.length; j++) {
                    items.push({
                        id: detalle[j].producto_id,
                        producto: detalle[j].producto,
                        cantidad: Number(detalle[j].cantidad),
                        precio: Number(detalle[j].precio)
                    });
                }
                historialRegistros.push({
                    id: r.id,
                    folio: r.folio_numero,
                    cliente: r.cliente,
                    tipo: r.tipo,
                    items: items,
                    subtotal: Number(r.subtotal),
                    iva: Number(r.iva),
                    total: Number(r.total),
                    fecha: r.fecha,
                    pago: r.pago,
                    recibido: Number(r.monto_recibido || 0),
                    cambio: Number(r.cambio || 0),
                    corteId: r.corte_id
                });
            }
        }

        async function cargarCaja(desde, hasta) {
            let url = '/api/caja/pendiente';
            rangoCorte = null;
            if (desde && hasta) {
                url = url + '?desde=' + desde + '&hasta=' + hasta;
                rangoCorte = { desde: desde, hasta: hasta };
            }
            const pendiente = await api(url);
            const cortes = await api('/api/caja/cortes');
            const fondo = await api('/api/caja/fondo');
            fondoCaja = Number(fondo.fondo);

            const ventas = [];
            const lista = pendiente.ventas || [];
            for (let i = 0; i < lista.length; i++) {
                const v = lista[i];
                ventas.push({
                    id: v.id,
                    folio: v.folio_numero,
                    cliente: v.cliente,
                    pago: v.pago,
                    fecha: v.fecha,
                    total: Number(v.total),
                    recibido: Number(v.monto_recibido || 0),
                    cambio: Number(v.cambio || 0)
                });
            }
            cajaPendiente = {
                cantidad: Number(pendiente.cantidad),
                total: Number(pendiente.total),
                efectivo: Number(pendiente.efectivo),
                tarjeta: Number(pendiente.tarjeta),
                transferencia: Number(pendiente.transferencia),
                ventas: ventas
            };
            cortesHistorial = cortes;
        }

        async function aplicarFiltroCorte() {
            const desde = document.getElementById('corteFechaInicio').value;
            const hasta = document.getElementById('corteFechaFin').value;
            if (!desde || !hasta || desde > hasta) {
                alert('Selecciona un rango válido: la fecha inicial debe ser igual o anterior a la fecha final.');
                return;
            }
            try {
                await cargarCaja(desde, hasta);
                renderizarCorteCaja();
            } catch (e) {
                alert('No se pudo aplicar el filtro: ' + e.message);
            }
        }

        function etiquetaTipo(tipo) {
            if (tipo === 'COTIZACION') {
                return 'COTIZACIÓN';
            }
            return 'VENTA';
        }

        function buscarProductoDeItem(it) {
            const porId = buscarPorId(catalogoProductos, it.id);
            if (porId) {
                return porId;
            }
            const nombreItem = String(it.producto).toLowerCase();
            for (let i = 0; i < catalogoProductos.length; i++) {
                if (catalogoProductos[i].nombre.toLowerCase() === nombreItem) {
                    return catalogoProductos[i];
                }
            }
            return null;
        }

        async function cambiarModulo(vista, boton) {
            if (boton) {
                const botones = document.querySelectorAll('.nav-btn');
                for (let i = 0; i < botones.length; i++) {
                    botones[i].classList.remove('active');
                }
                boton.classList.add('active');
            }

            const panel = document.getElementById('panel-contenido');
            panel.innerHTML = '<div class="summary-box">Cargando...</div>';

            try {
                if (vista === 'corte_caja') {
                    await cargarCaja();
                } else if (vista === 'historial_ventas' || vista === 'historial_cotizaciones') {
                    await cargarHistorial();
                } else {
                    await cargarCatalogo();
                }

                if (vista === 'consulta_stock') {
                    renderizarConsultaStock();
                } else if (vista === 'venta') {
                    renderizarModuloVenta();
                } else if (vista === 'cotizacion') {
                    renderizarModuloCotizaciones();
                } else if (vista === 'historial_ventas') {
                    rangoVentas = null;
                    mostrarHistorialVentas();
                } else if (vista === 'historial_cotizaciones') {
                    renderizarHistorial('COTIZACION');
                } else if (vista === 'corte_caja') {
                    renderizarCorteCaja();
                }
            } catch (e) {
                panel.innerHTML = `
                    <div class="summary-box">
                        <p>No fue posible conectar con el servidor: ${esc(e.message)}</p>
                        <p style="margin-top:8px;">Si el servidor estaba dormido, espera un minuto e inténtalo de nuevo.</p>
                        <button class="btn-action" onclick="cambiarModulo('${vista}')">Reintentar</button>
                    </div>`;
            }
        }

            const panel = document.getElementById('panel-contenido');

            }

                            ${badgeStock}
                            ${botones}
                        </div>

        }

        function enviarAOperacion(prodId, destino) {
            const producto = buscarPorId(catalogoProductos, prodId);
            if (!producto) {
                return;
            }

            if (destino === 'cotizacion') {
                const existe = buscarPorId(itemsCotizacionActual, prodId);
                if (existe) {
                    existe.cantidad = existe.cantidad + 1;
                } else {
                    itemsCotizacionActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: 1 });
                }
                cambiarModulo('cotizacion', document.querySelectorAll('.nav-btn')[1]);
            } else if (destino === 'venta') {
                const existe = buscarPorId(itemsVentaActual, prodId);
                if (existe) {
                    if (existe.cantidad + 1 > producto.stock) {
                        alert('Supera el stock disponible (' + producto.stock + ' pzas).');
                        return;
                    }
                    existe.cantidad = existe.cantidad + 1;
                } else {
                    itemsVentaActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: 1 });
                }
                cambiarModulo('venta', document.querySelectorAll('.nav-btn')[2]);
            }
        }

        function alCambiarMetodoPago() {
            const campo = document.getElementById('ventaMontoRecibido');
            if (campo && document.getElementById('ventaMetodoPago').value === 'Efectivo') {
                campo.value = '';
            }
            actualizarCambioVenta();
        }

        function actualizarCambioVenta() {
            const lblCambio = document.getElementById('lblCambio');
            const lblTitulo = document.getElementById('lblCambioTitulo');
            const lblRecibido = document.getElementById('lblRecibido');
            const campo = document.getElementById('ventaMontoRecibido');
            const selectPago = document.getElementById('ventaMetodoPago');
            if (!lblCambio || !lblTitulo || !lblRecibido || !campo || !selectPago) {
                return;
            }

            const total = totalVentaActual;
            const esEfectivo = selectPago.value === 'Efectivo';

            campo.readOnly = !esEfectivo;
            if (!esEfectivo) {
                if (total > 0) {
                    campo.value = total.toFixed(2);
                } else {
                    campo.value = '';
                }
            }

            const capturado = campo.value !== '';
            const recibido = redondear(parseFloat(campo.value) || 0);
            lblRecibido.innerText = dineroTexto(recibido);

            if (capturado && recibido < total) {
                lblTitulo.innerText = 'Faltan por Cobrar:';
                lblCambio.innerText = dineroTexto(redondear(total - recibido));
                lblCambio.className = 'cambio-falta';
            } else {
                lblTitulo.innerText = 'Cambio a Entregar:';
                if (capturado) {
                    lblCambio.innerText = dineroTexto(redondear(recibido - total));
                } else {
                    lblCambio.innerText = dineroTexto(0);
                }
                lblCambio.className = 'cambio-ok';
            }
        }

        function filtrarSelectProductos(selectId, query) {
            const select = document.getElementById(selectId);
            if (!select) {
                return;
            }

            const filtrados = filtrarProductosPorTexto(query);

            if (filtrados.length === 0) {
                select.innerHTML = '<option value="">Sin coincidencias</option>';
                return;
            }

            let html = '';
            for (let i = 0; i < filtrados.length; i++) {
                const p = filtrados[i];
                html += '<option value="' + p.id + '">[' + esc(p.sku) + '] ' + esc(p.nombre)
                    + ' - $' + p.precio.toFixed(2) + ' (Stock: ' + p.stock + ' pzas)</option>';
            }
            select.innerHTML = html;

        function agregarProductoAVenta() {
            const select = document.getElementById('selectVentaProducto');
            if (!select || !select.value) {
                return;
            }

            const prodId = select.value;
            const cantidad = parseInt(document.getElementById('ventaCantidadInput').value) || 1;
            const producto = buscarPorId(catalogoProductos, prodId);

            if (producto) {
                if (cantidad > producto.stock) {
                    alert('Stock insuficiente. Disponibles: ' + producto.stock + ' pzas.');
                    return;
                }
                const existe = buscarPorId(itemsVentaActual, prodId);
                if (existe) {
                    if ((existe.cantidad + cantidad) > producto.stock) {
                        alert('Supera el stock disponible (' + producto.stock + ' pzas).');
                        return;
                    }
                    existe.cantidad = existe.cantidad + cantidad;
                } else {
                    itemsVentaActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: cantidad });
                }
                actualizarTablaVenta();
            }
        }

        function modificarCantidadVenta(id, delta) {
            const item = buscarPorId(itemsVentaActual, id);
            const prodReal = buscarPorId(catalogoProductos, id);
            if (item) {
                if (delta > 0 && prodReal && item.cantidad + delta > prodReal.stock) {
                    alert('Stock máximo alcanzado (' + prodReal.stock + ' pzas).');
                    return;
                }
                item.cantidad = item.cantidad + delta;
                if (item.cantidad <= 0) {
                    removerItemVenta(id);
                } else {
                    actualizarTablaVenta();
                }
            }
        }

        function removerItemVenta(id) {
            itemsVentaActual = quitarPorId(itemsVentaActual, id);
            actualizarTablaVenta();
        }

        function actualizarTablaVenta() {
            const contenedor = document.getElementById('listaItemsVenta');
            if (!contenedor) {
                return;
            }

            if (itemsVentaActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No hay productos agregados.</p>';
                document.getElementById('lblSubtotal').innerText = '$0.00 MXN';
                document.getElementById('lblIva').innerText = '$0.00 MXN';
                document.getElementById('lblTotal').innerText = '$0.00 MXN';
                totalVentaActual = 0;
                actualizarCambioVenta();
                return;
            }

            let suma = 0;
            let html = '';
            for (let i = 0; i < itemsVentaActual.length; i++) {
                const item = itemsVentaActual[i];
                const importe = item.precio * item.cantidad;
                suma = suma + importe;
                html += `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#4ade80; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${esc(item.sku)}</span>
                            <strong style="color:#ffffff;">${esc(item.nombre)}</strong>
                            <span style="margin-left:8px;">
                                <button class="qty-btn" type="button" onclick="modificarCantidadVenta('${item.id}', -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" type="button" onclick="modificarCantidadVenta('${item.id}', 1)">+</button>
                            </span>
                            <button type="button" class="btn-remove-item" onclick="removerItemVenta('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>`;
            }
            contenedor.innerHTML = html;

            const subtotal = redondear(suma);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);
            totalVentaActual = total;

            document.getElementById('lblSubtotal').innerText = dineroTexto(subtotal);
            document.getElementById('lblIva').innerText = dineroTexto(iva);
            document.getElementById('lblTotal').innerText = dineroTexto(total);
            actualizarCambioVenta();
        }

        function armarDetalle(items) {
            const detalle = [];
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                detalle.push({
                    producto_id: String(item.id),
                    producto: item.nombre,
                    cantidad: item.cantidad,
                    precio: item.precio,
                    importe: redondear(item.precio * item.cantidad)
                });
            }
            return detalle;
        }

        function sumarDetalle(detalle) {
            let suma = 0;
            for (let i = 0; i < detalle.length; i++) {
                suma = suma + detalle[i].importe;
            }
            return redondear(suma);
        }

        async function procesarVenta(event) {
            event.preventDefault();
            const cliente = document.getElementById('ventaCliente').value.trim();
            const pago = document.getElementById('ventaMetodoPago').value;

            if (itemsVentaActual.length === 0) {
                alert('Agrega al menos un producto a la venta.');
                return;
            }

            const detalle = armarDetalle(itemsVentaActual);
            const subtotal = sumarDetalle(detalle);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);

            const campoRecibido = document.getElementById('ventaMontoRecibido');
            const esEfectivo = pago === 'Efectivo';
            const recibido = redondear(parseFloat(campoRecibido.value));

            if (esEfectivo && (!Number.isFinite(recibido) || recibido < total)) {
                alert('El monto recibido es menor al total a cobrar. Captura el monto con el que paga el cliente.');
                campoRecibido.focus();
                return;
            }

            let cambio = 0;
            let montoRecibido = total;
            if (esEfectivo) {
                cambio = redondear(recibido - total);
                montoRecibido = recibido;
            }

            let nombreCliente = 'Cliente General';
            if (cliente) {
                nombreCliente = cliente;
            }

            const boton = document.getElementById('btnProcesarVenta');
            if (boton) {
                boton.disabled = true;
            }

            try {
                await enviar('POST', '/api/ventas', {
                    tipo: 'VENTA',
                    cliente: nombreCliente,
                    pago: pago,
                    fecha: new Date().toLocaleDateString('es-MX'),
                    subtotal: subtotal,
                    iva: iva,
                    total: total,
                    monto_recibido: montoRecibido,
                    cotizacion_id: idCotizacionEnProceso,
                    detalle: detalle
                });

                idCotizacionEnProceso = null;
                folioCotizacionEnProceso = null;

                const alerta = document.getElementById('alertaVenta');
                if (esEfectivo) {
                    alerta.innerText = 'Venta registrada. Recibido: ' + dineroTexto(recibido) + ' | Cambio a entregar: ' + dineroTexto(cambio);
                } else {
                    alerta.innerText = 'Venta registrada exitosamente y stock actualizado.';
                }
                alerta.style.display = 'block';
                setTimeout(function () {
                    itemsVentaActual = [];
                    cambiarModulo('venta');
                }, 3500);
            } catch (e) {
                if (boton) {
                    boton.disabled = false;
                }
                alert('No se pudo registrar la venta: ' + e.message);
                try {
                    await cargarCatalogo();
                    filtrarSelectProductos('selectVentaProducto', '');
                } catch (e2) {
                    e2 = null;
                }
            }
        }

        function agregarProductoACotizacion() {
            const select = document.getElementById('selectCotizacionProducto');
            if (!select || !select.value) {
                return;
            }

            const prodId = select.value;
            const cantidad = parseInt(document.getElementById('cotizacionCantidad').value) || 1;
            const producto = buscarPorId(catalogoProductos, prodId);

            if (producto) {
                const existe = buscarPorId(itemsCotizacionActual, prodId);
                if (existe) {
                    existe.cantidad = existe.cantidad + cantidad;
                } else {
                    itemsCotizacionActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: cantidad });
                }
                actualizarTablaCotizacion();
            }
        }

        function modificarCantidadCotizacion(id, delta) {
            const item = buscarPorId(itemsCotizacionActual, id);
            if (item) {
                item.cantidad = item.cantidad + delta;
                if (item.cantidad <= 0) {
                    removerItemCotizacion(id);
                } else {
                    actualizarTablaCotizacion();
                }
            }
        }

        function removerItemCotizacion(id) {
            itemsCotizacionActual = quitarPorId(itemsCotizacionActual, id);
            actualizarTablaCotizacion();
        }

        function actualizarTablaCotizacion() {
            const contenedor = document.getElementById('listaItemsCotizacion');
            if (!contenedor) {
                return;
            }

            if (itemsCotizacionActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No hay productos agregados.</p>';
                document.getElementById('lblSubtotalCotiz').innerText = '$0.00 MXN';
                document.getElementById('lblIvaCotiz').innerText = '$0.00 MXN';
                document.getElementById('lblTotalCotiz').innerText = '$0.00 MXN';
                return;
            }

            let subtotal = 0;
            let html = '';
            for (let i = 0; i < itemsCotizacionActual.length; i++) {
                const item = itemsCotizacionActual[i];
                const importe = item.precio * item.cantidad;
                subtotal = subtotal + importe;
                html += `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#60a5fa; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${esc(item.sku)}</span>
                            <strong style="color:#ffffff;">${esc(item.nombre)}</strong>
                            <span style="margin-left:8px;">
                                <button class="qty-btn" type="button" onclick="modificarCantidadCotizacion('${item.id}', -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" type="button" onclick="modificarCantidadCotizacion('${item.id}', 1)">+</button>
                            </span>
                            <button type="button" class="btn-remove-item" onclick="removerItemCotizacion('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>`;
            }
            contenedor.innerHTML = html;

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            document.getElementById('lblSubtotalCotiz').innerText = '$' + subtotal.toFixed(2) + ' MXN';
            document.getElementById('lblIvaCotiz').innerText = '$' + iva.toFixed(2) + ' MXN';
            document.getElementById('lblTotalCotiz').innerText = '$' + total.toFixed(2) + ' MXN';
        }

        async function guardarCotizacion() {
            let cliente = document.getElementById('cotizacionCliente').value.trim();
            if (cliente === '') {
                cliente = 'Cliente General';
            }
            if (itemsCotizacionActual.length === 0) {
                alert('Agrega al menos un producto a la cotización.');
                return;
            }

            const detalle = armarDetalle(itemsCotizacionActual);
            const subtotal = sumarDetalle(detalle);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);

            const boton = document.getElementById('btnGuardarCotizacion');
            if (boton) {
                boton.disabled = true;
            }

            try {
                await enviar('POST', '/api/ventas', {
                    tipo: 'COTIZACION',
                    cliente: cliente,
                    pago: 'Presupuesto',
                    fecha: new Date().toLocaleDateString('es-MX'),
                    subtotal: subtotal,
                    iva: iva,
                    total: total,
                    detalle: detalle
                });

                const alerta = document.getElementById('alertaCotizacion');
                alerta.style.display = 'block';
                setTimeout(function () {
                    itemsCotizacionActual = [];
                    cambiarModulo('cotizacion');
                }, 1500);
            } catch (e) {
                if (boton) {
                    boton.disabled = false;
                }
                alert('No se pudo guardar la cotización: ' + e.message);
            }
        }
