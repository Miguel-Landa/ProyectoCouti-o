<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .btn-add-item {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: #ffffff;
            color: #000000;
        }

        .ticket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ticket-item:hover {
            border-color: #ffffff;
            background: #262626;
        }

        .ticket-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ticket-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ticket-sub {
            font-size: 0.8rem;
            color: #a3a3a3;
        }

        .ticket-price {
            font-size: 1rem;
            font-weight: 700;
            color: #22c55e;
        }

        .badge-cotizacion {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .badge-venta {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 6px;
            width: 100%;
            max-width: 580px;
            padding: 25px;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger:hover { background: #b91c1c; }

        .btn-convert {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-convert:hover { background: #15803d; }

        .btn-close {
            background: transparent;
            color: #a3a3a3;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: #262626; color: #ffffff; }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .btn-remove-item {
            color: #ef4444;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Barra Superior -->
        <div class="topbar">
            <h1>Punto de Venta y Cotizaciones</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <!-- Workspace Dividido -->
        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">Módulos de Venta</div>
                <button class="nav-btn active" onclick="cambiarVistaVendedor('venta', this)">
                    🛒 Nueva Venta
                </button>
                <button class="nav-btn" onclick="cambiarVistaVendedor('cotizaciones', this)">
                    📄 Cotizaciones
                </button>
                <button class="nav-btn" onclick="cambiarVistaVendedor('historial', this)">
                    📜 Historial de Ventas
                </button>
            </div>

            <div class="main-panel" id="panel-contenido-vendedor">
            </div>
        </div>
    </div>

    <!-- Modal Emergente de Detalle de Venta/Cotización -->
    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalTicketTitulo">Detalle del Registro</h2>
                <p id="modalTicketFecha">Fecha de emisión</p>
            </div>
            <div class="summary-box" id="modalDetalleContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;" id="modalAcciones">
            </div>
        </div>
    </div>

    <script>
        const catalogoProductos = [
            { id: '1', sku: 'REF-101', nombre: 'Aceite Motul 10W40 1L', precio: 220.00, categoria: 'Motor y Aceites', stock: 15 },
            { id: '2', sku: 'REF-102', nombre: 'Batería Hero Hunk 160R (12V 7Ah)', precio: 850.00, categoria: 'Eléctrico y Baterías', stock: 8 },
            { id: '3', sku: 'REF-103', nombre: 'Balatas Delanteras Hunk 160R', precio: 180.00, categoria: 'Frenos y Suspensión', stock: 20 },
            { id: '4', sku: 'REF-104', nombre: 'Kit Arrastre Piñón y Cadena 428H', precio: 650.00, categoria: 'Motor y Aceites', stock: 5 }
        ];

        let historialVentas = [
            { id: 2035, cliente: 'Miguel Landa', tipo: 'COTIZACIÓN', items: [{ id: '2', producto: 'Batería Hero Hunk 160R (12V 7Ah)', cantidad: 1, precio: 850.00 }, { id: '1', producto: 'Aceite Motul 10W40 1L', cantidad: 1, precio: 220.00 }, { id: '4', producto: 'Kit Arrastre Piñón y Cadena 428H', cantidad: 1, precio: 650.00 }], subtotal: 1720.00, iva: 275.20, total: 1995.20, fecha: '24/09/2026', pago: 'Presupuesto' },
            { id: 1042, cliente: 'Carlos Mendoza', tipo: 'VENTA', items: [{ id: '1', producto: 'Aceite Motul 10W40 1L', cantidad: 1, precio: 220.00 }], subtotal: 220.00, iva: 35.20, total: 255.20, fecha: '24/09/2026', pago: 'Efectivo' }
        ];

        let itemsVentaActual = [];
        let itemsCotizacionActual = [];
        let idCotizacionEnProceso = null;
        let ticketSeleccionadoId = null;

        function cambiarVistaVendedor(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }

            const panel = document.getElementById('panel-contenido-vendedor');

            if (vista === 'venta') {
                renderizarModuloVenta();
            } 
            else if (vista === 'cotizaciones') {
                itemsCotizacionActual = [];
                renderizarModuloCotizaciones();
            } 
            else if (vista === 'historial') {
                renderizarHistorialVentas();
            }
        }

        function renderizarModuloVenta() {
            const panel = document.getElementById('panel-contenido-vendedor');
            let opcionesProd = catalogoProductos.map(p => `<option value="${p.id}">[${p.sku}] ${p.nombre} - $${p.precio.toFixed(2)} (Stock: ${p.stock} pzas)</option>`).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Nueva Venta ${idCotizacionEnProceso ? '<span style="color:#60a5fa; font-size:0.9rem;">(Procesando Cotización #' + idCotizacionEnProceso + ')</span>' : ''}</h2>
                    <p>Selección de productos, verificación de existencias y cobro en caja.</p>
                </div>

                <form id="ventaForm" onsubmit="procesarVenta(event)">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nombre del Cliente</label>
                            <input type="text" id="ventaCliente" placeholder="Ej. Carlos Mendoza" required>
                        </div>
                        <div class="input-group">
                            <label>Método de Pago</label>
                            <select id="ventaMetodoPago">
                                <option value="Efectivo">Efectivo</option>
                                <option value="Tarjeta">Tarjeta de Débito / Crédito</option>
                                <option value="Transferencia">Transferencia SPEI</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
                        <div class="input-group" style="margin-bottom:0; flex:2;">
                            <label>Agregar Producto al Carrito (Stock Disponible Visible)</label>
                            <select id="selectVentaProducto">
                                ${opcionesProd}
                            </select>
                        </div>
                        <div class="input-group" style="margin-bottom:0; flex:1;">
                            <label>Cantidad</label>
                            <input type="number" id="ventaCantidadInput" value="1" min="1">
                        </div>
                        <button type="button" class="btn-add-item" style="padding:12px 18px;" onclick="agregarProductoAVenta()">+ Agregar Item</button>
                    </div>

                    <div class="summary-box">
                        <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                            🛒 Desglose de Productos en Venta
                        </h3>
                        <div id="listaItemsVenta">
                            <p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado productos a la venta.</p>
                        </div>

                        <div style="margin-top:15px; border-top:1px solid #262626; padding-top:10px;">
                            <div class="summary-row"><span>Subtotal:</span><span id="lblSubtotal">$0.00 MXN</span></div>
                            <div class="summary-row"><span>IVA (16%):</span><span id="lblIva">$0.00 MXN</span></div>
                            <div class="summary-row total"><span>Total a Cobrar:</span><span id="lblTotal" style="color: #22c55e;">$0.00 MXN</span></div>
                        </div>
                    </div>

                    <button type="submit" class="btn-action">${idCotizacionEnProceso ? 'Convertir Cotización #' + idCotizacionEnProceso + ' a Venta' : 'Procesar Venta y Generar Ticket'}</button>
                </form>

                <div id="alertaVenta" class="alert-box">✓ Venta procesada con éxito y actualizada en el historial.</div>
            `;
            actualizarTablaVenta();
        }

        function agregarProductoAVenta() {
            const prodId = document.getElementById('selectVentaProducto').value;
            const cantidad = parseInt(document.getElementById('ventaCantidadInput').value) || 1;
            const producto = catalogoProductos.find(p => p.id === prodId);

            if (producto) {
                if (cantidad > producto.stock) {
                    alert(`⚠️ Stock insuficiente. Solo quedan ${producto.stock} unidades disponibles de ${producto.nombre}.`);
                    return;
                }

                const existe = itemsVentaActual.find(item => item.id === prodId);
                if (existe) {
                    if ((existe.cantidad + cantidad) > producto.stock) {
                        alert(`⚠️ Supera el stock máximo disponible (${producto.stock} pzas).`);
                        return;
                    }
                    existe.cantidad += cantidad;
                } else {
                    itemsVentaActual.push({
                        id: producto.id,
                        sku: producto.sku,
                        nombre: producto.nombre,
                        precio: producto.precio,
                        cantidad: cantidad
                    });
                }
                actualizarTablaVenta();
            }
        }

        function removerItemVenta(id) {
            itemsVentaActual = itemsVentaActual.filter(item => item.id !== id);
            actualizarTablaVenta();
        }

        function actualizarTablaVenta() {
            const contenedor = document.getElementById('listaItemsVenta');
            if (!contenedor) return;

            if (itemsVentaActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado productos a la venta.</p>';
                document.getElementById('lblSubtotal').innerText = '$0.00 MXN';
                document.getElementById('lblIva').innerText = '$0.00 MXN';
                document.getElementById('lblTotal').innerText = '$0.00 MXN';
                return;
            }

            let subtotalTotal = 0;
            let html = itemsVentaActual.map(item => {
                const importe = item.precio * item.cantidad;
                subtotalTotal += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#4ade80; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${item.sku}</span>
                            <strong style="color:#ffffff;">${item.nombre}</strong> (x${item.cantidad})
                            <button class="btn-remove-item" onclick="removerItemVenta('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>
                `;
            }).join('');

            const ivaTotal = subtotalTotal * 0.16;
            const total = subtotalTotal + ivaTotal;

            contenedor.innerHTML = html;
            document.getElementById('lblSubtotal').innerText = '$' + subtotalTotal.toFixed(2) + ' MXN';
            document.getElementById('lblIva').innerText = '$' + ivaTotal.toFixed(2) + ' MXN';
            document.getElementById('lblTotal').innerText = '$' + total.toFixed(2) + ' MXN';
        }

        function procesarVenta(event) {
            event.preventDefault();
            const cliente = document.getElementById('ventaCliente').value;
            const pago = document.getElementById('ventaMetodoPago').value;

            if (itemsVentaActual.length === 0) {
                alert('Selecciona al menos un producto para procesar la venta.');
                return;
            }

            let subtotal = 0;
            const itemsMapeados = itemsVentaActual.map(item => {
                subtotal += (item.precio * item.cantidad);
                const prodReal = catalogoProductos.find(p => p.id === item.id);
                if (prodReal) prodReal.stock -= item.cantidad;
                return { id: item.id, producto: item.nombre, cantidad: item.cantidad, precio: item.precio };
            });

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            if (idCotizacionEnProceso) {
                const indiceCotiz = historialVentas.findIndex(t => t.id === idCotizacionEnProceso);
                if (indiceCotiz !== -1) {
                    const registroActualizado = historialVentas.splice(indiceCotiz, 1)[0];
                    registroActualizado.cliente = cliente;
                    registroActualizado.tipo = 'VENTA';
                    registroActualizado.items = itemsMapeados;
                    registroActualizado.subtotal = subtotal;
                    registroActualizado.iva = iva;
                    registroActualizado.total = total;
                    registroActualizado.pago = pago;
                    registroActualizado.fecha = new Date().toLocaleDateString();

                    historialVentas.unshift(registroActualizado);
                }
                idCotizacionEnProceso = null;
            } else {
                const nuevoId = Math.floor(1043 + Math.random() * 100);
                historialVentas.unshift({
                    id: nuevoId,
                    cliente: cliente,
                    tipo: 'VENTA',
                    items: itemsMapeados,
                    subtotal: subtotal,
                    iva: iva,
                    total: total,
                    fecha: new Date().toLocaleDateString(),
                    pago: pago
                });
            }

            const alerta = document.getElementById('alertaVenta');
            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
                itemsVentaActual = [];
                renderizarModuloVenta();
            }, 2000);
        }

        function renderizarModuloCotizaciones() {
            const panel = document.getElementById('panel-contenido-vendedor');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Cotizaciones y Presupuestos</h2>
                    <p>Búsqueda de refacciones con existencias visibles en tiempo real.</p>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Nombre del Cliente</label>
                        <input type="text" id="cotizacionCliente" placeholder="Ej. Miguel Landa">
                    </div>
                    <div class="input-group">
                        <label>Buscar / Seleccionar Refacción (Stock Disponible Visible)</label>
                        <select id="selectCotizacionProducto">
                            ${catalogoProductos.map(p => `<option value="${p.id}">[${p.sku}] ${p.nombre} -$${p.precio.toFixed(2)} (Stock:${p.stock} pzas)</option>`).join('')}
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
                    <div class="input-group" style="margin-bottom:0; flex:1;">
                        <label>Cantidad</label>
                        <input type="number" id="cotizacionCantidad" value="1" min="1">
                    </div>
                    <button class="btn-add-item" style="padding:12px 20px;" onclick="agregarProductoACotizacion()">+ Agregar a la Cotización</button>
                </div>

                <div class="summary-box">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                        📋 Refacciones en la Cotización
                    </h3>
                    <div id="listaItemsCotizacion">
                        <p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado productos a esta cotización.</p>
                    </div>

                    <div style="margin-top:15px; border-top:1px solid #262626; padding-top:10px;">
                        <div class="summary-row"><span>Subtotal Refacciones:</span><span id="lblSubtotalCotiz">$0.00 MXN</span></div>
                        <div class="summary-row"><span>IVA (16%):</span><span id="lblIvaCotiz">$0.00 MXN</span></div>
                        <div class="summary-row total"><span>Total Cotizado:</span><span id="lblTotalCotiz" style="color:#60a5fa;">$0.00 MXN</span></div>
                    </div>
                </div>

                <button class="btn-action" onclick="guardarCotizaciónFinal()">💾 Guardar Cotización en Registro de Ventas</button>
                <div id="alertaCotizacion" class="alert-box">✓ Cotización registrada correctamente en el historial.</div>
            `;
            actualizarTablaCotizacion();
        }

        function agregarProductoACotizacion() {
            const prodId = document.getElementById('selectCotizacionProducto').value;
            const cantidad = parseInt(document.getElementById('cotizacionCantidad').value) || 1;
            const producto = catalogoProductos.find(p => p.id === prodId);

            if (producto) {
                const existe = itemsCotizacionActual.find(item => item.id === prodId);
                if (existe) {
                    existe.cantidad += cantidad;
                } else {
                    itemsCotizacionActual.push({
                        id: producto.id,
                        sku: producto.sku,
                        nombre: producto.nombre,
                        precio: producto.precio,
                        cantidad: cantidad
                    });
                }
                actualizarTablaCotizacion();
            }
        }

        function removerItemCotizacion(id) {
            itemsCotizacionActual = itemsCotizacionActual.filter(item => item.id !== id);
            actualizarTablaCotizacion();
        }

        function actualizarTablaCotizacion() {
            const contenedor = document.getElementById('listaItemsCotizacion');
            if (!contenedor) return;

            if (itemsCotizacionActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado productos a esta cotización.</p>';
                document.getElementById('lblSubtotalCotiz').innerText = '$0.00 MXN';
                document.getElementById('lblIvaCotiz').innerText = '$0.00 MXN';
                document.getElementById('lblTotalCotiz').innerText = '$0.00 MXN';
                return;
            }

            let subtotalTotal = 0;
            let html = itemsCotizacionActual.map(item => {
                const importe = item.precio * item.cantidad;
                subtotalTotal += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#60a5fa; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${item.sku}</span>
                            <strong style="color:#ffffff;">${item.nombre}</strong> (x${item.cantidad})
                            <button class="btn-remove-item" onclick="removerItemCotizacion('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>
                `;
            }).join('');

            const ivaTotal = subtotalTotal * 0.16;
            const totalCotizado = subtotalTotal + ivaTotal;

            contenedor.innerHTML = html;
            document.getElementById('lblSubtotalCotiz').innerText = '$' + subtotalTotal.toFixed(2) + ' MXN';
            document.getElementById('lblIvaCotiz').innerText = '$' + ivaTotal.toFixed(2) + ' MXN';
            document.getElementById('lblTotalCotiz').innerText = '$' + totalCotizado.toFixed(2) + ' MXN';
        }

        function guardarCotizaciónFinal() {
            const cliente = document.getElementById('cotizacionCliente').value || 'Cliente General';
            if (itemsCotizacionActual.length === 0) {
                alert('Agrega al menos una refacción para generar la cotización.');
                return;
            }

            let subtotal = 0;
            const itemsMapeados = itemsCotizacionActual.map(item => {
                subtotal += (item.precio * item.cantidad);
                return { id: item.id, producto: item.nombre, cantidad: item.cantidad, precio: item.precio };
            });

            const iva = subtotal * 0.16;
            const total = subtotal + iva;
            const nuevoId = Math.floor(2000 + Math.random() * 900);

            historialVentas.unshift({
                id: nuevoId,
                cliente: cliente,
                tipo: 'COTIZACIÓN',
                items: itemsMapeados,
                subtotal: subtotal,
                iva: iva,
                total: total,
                fecha: new Date().toLocaleDateString(),
                pago: 'Presupuesto'
            });

            const alerta = document.getElementById('alertaCotizacion');
            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
                itemsCotizacionActual = [];
                renderizarModuloCotizaciones();
            }, 2000);
        }

        function renderizarHistorialVentas() {
            const panel = document.getElementById('panel-contenido-vendedor');

            let itemsHTML = historialVentas.map(t => {
                const isCotiz = t.tipo === 'COTIZACIÓN';
                const badgeClass = isCotiz ? 'badge-cotizacion' : 'badge-venta';
                const colorMonto = isCotiz ? '#60a5fa' : '#22c55e';

                return `
                    <div class="ticket-item" onclick="abrirDetalleTicket(${t.id})">
                        <div class="ticket-info">
                            <div class="ticket-title">
                                #${t.id} - ${t.cliente}
                                <span class="${badgeClass}">${t.tipo}</span>
                            </div>
                            <div class="ticket-sub">Fecha: ${t.fecha} | Total Refacciones: ${t.items.length} item(s)</div>
                        </div>
                        <div class="ticket-price" style="color:${colorMonto};">$${t.total.toFixed(2)} MXN</div>
                    </div>
                `;
            }).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Historial de Ventas y Cotizaciones</h2>
                    <p>Registro centralizado de transacciones y presupuestos guardados.</p>
                </div>

                <div class="input-group">
                    <label>Buscar Ticket, Cotización o Cliente</label>
                    <input type="text" id="buscarTicketInput" placeholder="Ej. #2035 o Miguel Landa..." oninput="filtrarHistorial(this.value)">
                </div>

                <div id="listaTicketsContenedor">
                    ${itemsHTML.length > 0 ? itemsHTML : '<p style="color:#a3a3a3; text-align:center;">No hay registros disponibles.</p>'}
                </div>
            `;
        }

        function abrirDetalleTicket(id) {
            const ticket = historialVentas.find(t => t.id === id);
            if (!ticket) return;

            ticketSeleccionadoId = id;
            document.getElementById('modalTicketTitulo').innerText = `${ticket.tipo} #${ticket.id} - ${ticket.cliente}`;
            document.getElementById('modalTicketFecha').innerText = `Emisión: ${ticket.fecha} | Estado: ${ticket.pago}`;

            let itemsDesglose = ticket.items.map(it => `
                <div class="summary-row">
                    <span>${it.producto} (x${it.cantidad})</span>
                    <span>$${(it.precio * it.cantidad).toFixed(2)} MXN</span>
                </div>
            `).join('');

            document.getElementById('modalDetalleContenido').innerHTML = `
                <h4 style="font-size:0.85rem; color:#a3a3a3; margin-bottom:8px;">Desglose de Refacciones Solicitadas:</h4>
                ${itemsDesglose}
                <div class="summary-row" style="margin-top:10px; border-top:1px solid #262626; padding-top:8px;">
                    <span>Subtotal:</span><span>$${ticket.subtotal.toFixed(2)} MXN</span>
                </div>
                <div class="summary-row"><span>IVA (16%):</span><span>$${ticket.iva.toFixed(2)} MXN</span></div>
                <div class="summary-row total">
                    <span>Total ${ticket.tipo}:</span>
                    <span style="color:${ticket.tipo === 'COTIZACIÓN' ? '#60a5fa' : '#22c55e'};">$${ticket.total.toFixed(2)} MXN</span>
                </div>
            `;

            const contenedorAcciones = document.getElementById('modalAcciones');
            if (ticket.tipo === 'COTIZACIÓN') {
                contenedorAcciones.innerHTML = `
                    <button class="btn-convert" onclick="cargarCotizacionEnVenta(${ticket.id})">🛒 Cargar y Procesar Venta</button>
                    <button class="btn-danger" onclick="confirmarEliminarTicket()">🗑️ Eliminar</button>
                    <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
                `;
            } else {
                contenedorAcciones.innerHTML = `
                    <button class="btn-danger" onclick="confirmarEliminarTicket()">🗑️ Eliminar Registro</button>
                    <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
                `;
            }

            document.getElementById('modalDetalle').style.display = 'flex';
        }

        function cargarCotizacionEnVenta(idCotizacion) {
            const cotizacion = historialVentas.find(t => t.id === idCotizacion);
            if (!cotizacion) return;

            idCotizacionEnProceso = idCotizacion;

            itemsVentaActual = cotizacion.items.map(it => {
                const prodReal = catalogoProductos.find(p => p.nombre.toLowerCase().includes(it.producto.toLowerCase()) || p.id === it.id);
                return {
                    id: prodReal ? prodReal.id : '1',
                    sku: prodReal ? prodReal.sku : 'REF-100',
                    nombre: it.producto,
                    precio: it.precio,
                    cantidad: it.cantidad
                };
            });

            cerrarModal();

            const botonesNav = document.querySelectorAll('.nav-btn');
            cambiarVistaVendedor('venta', botonesNav[0]);

            setTimeout(() => {
                const clienteInput = document.getElementById('ventaCliente');
                if (clienteInput) clienteInput.value = cotizacion.cliente;
                actualizarTablaVenta();
            }, 100);
        }

        function cerrarModal() {
            document.getElementById('modalDetalle').style.display = 'none';
        }

        function confirmarEliminarTicket() {
            if (confirm(`¿Está seguro de eliminar el registro #${ticketSeleccionadoId}?`)) {
                historialVentas = historialVentas.filter(t => t.id !== ticketSeleccionadoId);
                cerrarModal();
                renderizarHistorialVentas();
            }
        }

        function filtrarHistorial(query) {
            const q = query.toLowerCase();
            const filtrados = historialVentas.filter(t => 
                t.id.toString().includes(q) || t.cliente.toLowerCase().includes(q) || t.tipo.toLowerCase().includes(q)
            );

            let itemsHTML = filtrados.map(t => {
                const isCotiz = t.tipo === 'COTIZACIÓN';
                const badgeClass = isCotiz ? 'badge-cotizacion' : 'badge-venta';
                const colorMonto = isCotiz ? '#60a5fa' : '#22c55e';

                return `
                    <div class="ticket-item" onclick="abrirDetalleTicket(${t.id})">
                        <div class="ticket-info">
                            <div class="ticket-title">
                                #${t.id} - ${t.cliente}
                                <span class="${badgeClass}">${t.tipo}</span>
                            </div>
                            <div class="ticket-sub">Fecha: ${t.fecha} | Total Refacciones: ${t.items.length} item(s)</div>
                        </div>
                        <div class="ticket-price" style="color:${colorMonto};">$${t.total.toFixed(2)} MXN</div>
                    </div>
                `;
            }).join('');

            document.getElementById('listaTicketsContenedor').innerHTML = itemsHTML.length > 0 
                ? itemsHTML 
                : '<p style="color:#a3a3a3; text-align:center;">No se encontraron coincidencias.</p>';
        }

        window.onload = function() {
            cambiarVistaVendedor('venta', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
