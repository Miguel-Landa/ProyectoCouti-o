<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .btn-add-item {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: #ffffff;
            color: #000000;
        }

        .qty-btn {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-remove-item {
            color: #ef4444;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .badge-stock {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Panel del Administrador</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">Módulos de Almacén</div>
                <button class="nav-btn active" onclick="cambiarVistaAdmin('compras', this)">
                    📦 Compras a Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('proveedores', this)">
                    🏭 Registro de Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('registrar-art', this)">
                    ➕ Registrar Artículos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('actualizar-art', this)">
                    ✏️ Actualizar Artículos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('eliminar-art', this)">
                    🗑️ Eliminar Artículos
                </button>
            </div>

            <div class="main-panel" id="panel-contenido-admin">
            </div>
        </div>
    </div>

    <script>
        // Catálogo Global Administrable
        let catalogoArticulosAdmin = [
            { id: '1', sku: 'REF-101', nombre: 'Aceite Motul 10W40 1L', costoCompra: 140.00, stock: 15 },
            { id: '2', sku: 'REF-102', nombre: 'Batería Hero Hunk 160R (12V 7Ah)', costoCompra: 520.00, stock: 8 },
            { id: '3', sku: 'REF-103', nombre: 'Balatas Delanteras Hunk 160R', costoCompra: 110.00, stock: 20 },
            { id: '4', sku: 'REF-104', nombre: 'Kit Arrastre Piñón y Cadena 428H', costoCompra: 410.00, stock: 5 }
        ];

        // Lista Global de Proveedores
        let proveedoresLista = [
            'Refacciones Hero México S.A. de C.V.',
            'Distribuidora Motul Veracruz',
            'Comercializadora de Autopartes Italika'
        ];

        let itemsCompraActual = [];

        function cambiarVistaAdmin(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }

            const panel = document.getElementById('panel-contenido-admin');

            if (vista === 'compras') {
                itemsCompraActual = [];
                renderizarModuloCompras();
            } 
            else if (vista === 'proveedores') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Registro de Proveedores</h2>
                        <p>Gestión del directorio de distribuidores. Los proveedores registrados aparecerán en Compras.</p>
                    </div>

                    <form onsubmit="guardarNuevoProveedor(event)">
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Nombre / Razón Social del Proveedor</label>
                                <input type="text" id="provNombreInput" placeholder="Ej. LUBRICANTES Y REFACCIONES DEL GOLFO" required>
                            </div>
                            <div class="input-group">
                                <label>RFC / Identificación Fiscal</label>
                                <input type="text" placeholder="Ej. LRG200315ABC">
                            </div>
                        </div>
                        <button type="submit" class="btn-action">Guardar Proveedor</button>
                    </form>

                    <div id="alertaProv" class="alert-box">✓ Proveedor registrado con éxito y disponible para Compras.</div>

                    <div class="summary-box" style="margin-top:25px;">
                        <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                            🏭 Directorio de Proveedores Registrados
                        </h3>
                        ${proveedoresLista.map(p => `<div class="summary-row"><strong style="color:#ffffff;">${p}</strong> <span class="badge-stock">Activo</span></div>`).join('')}
                    </div>
                `;
            } 
            else if (vista === 'registrar-art') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Registrar Nuevo Artículo</h2>
                        <p>Alta de productos en el catálogo de la empresa con stock inicial.</p>
                    </div>

                    <form onsubmit="guardarNuevoArticulo(event)">
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Código SKU Único</label>
                                <input type="text" id="newSkuInput" placeholder="Ej. REF-105" required>
                            </div>
                            <div class="input-group">
                                <label>Descripción del Producto</label>
                                <input type="text" id="newNombreInput" placeholder="Ej. Foco LED H4 Dual High/Low" required>
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="input-group">
                                <label>Costo de Compra ($ MXN)</label>
                                <input type="number" id="newCostoInput" placeholder="Ej. 180.00" step="0.01" required>
                            </div>
                            <div class="input-group">
                                <label>Stock Inicial en Almacén</label>
                                <input type="number" id="newStockInput" value="10" min="0" required>
                            </div>
                        </div>

                        <button type="submit" class="btn-action">Guardar Artículo en Catálogo</button>
                    </form>

                    <div id="alertaArt" class="alert-box">✓ Artículo dado de alta exitosamente en el catálogo.</div>
                `;
            } 
            else if (vista === 'actualizar-art') {
                let opcionesArt = catalogoArticulosAdmin.map(a => `<option value="${a.id}">[${a.sku}] ${a.nombre} (Stock Actual: ${a.stock})</option>`).join('');

                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Actualizar Artículos e Inventario</h2>
                        <p>Modificación de costos, descripciones y actualización directa del stock disponible.</p>
                    </div>

                    <div class="input-group">
                        <label>Seleccionar Artículo a Modificar</label>
                        <select id="selectEditArticulo" onchange="cargarDatosEnEdicion()">
                            ${opcionesArt}
                        </select>
                    </div>

                    <form onsubmit="guardarEdicionArticulo(event)" style="margin-top:20px;">
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Descripción / Nombre</label>
                                <input type="text" id="editNombreInput" required>
                            </div>
                            <div class="input-group">
                                <label>Costo de Compra ($ MXN)</label>
                                <input type="number" id="editCostoInput" step="0.01" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label>Stock Actual Disponible en Empresa</label>
                            <input type="number" id="editStockInput" min="0" required>
                        </div>

                        <button type="submit" class="btn-action">Guardar Cambios del Artículo</button>
                    </form>

                    <div id="alertaEdit" class="alert-box">✓ Datos y stock del artículo actualizados correctamente.</div>
                `;
                cargarDatosEnEdicion();
            } 
            else if (vista === 'eliminar-art') {
                renderizarModuloEliminar();
            }
        }

        /* --- LÓGICA DE COMPRAS Y SURTIDO --- */
        function renderizarModuloCompras() {
            const panel = document.getElementById('panel-contenido-admin');
            let opcionesProveedores = proveedoresLista.map(p => `<option value="${p}">${p}</option>`).join('');
            let opcionesArticulos = catalogoArticulosAdmin.map(a => `<option value="${a.id}">[${a.sku}] ${a.nombre} - Costo: $${a.costoCompra.toFixed(2)} (Stock Actual: ${a.stock} pzas)</option>`).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Registrar Compra de Mercancía</h2>
                    <p>Ingreso de facturas de compra y surtido dinámico de stock a almacén.</p>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Seleccionar Proveedor Registrado</label>
                        <select id="compraProveedorSelect">
                            ${opcionesProveedores}
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Número de Factura / Remisión</label>
                        <input type="text" id="compraFacturaInput" placeholder="Ej. FAC-2026-88" required>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
                    <div class="input-group" style="margin-bottom:0; flex:2;">
                        <label>Artículo Surtido (Stock Disponible Visible)</label>
                        <select id="selectCompraArticulo">
                            ${opcionesArticulos}
                        </select>
                    </div>
                    <div class="input-group" style="margin-bottom:0; flex:1;">
                        <label>Cantidad Comprada</label>
                        <input type="number" id="compraCantidadInput" value="10" min="1">
                    </div>
                    <button type="button" class="btn-add-item" style="padding:12px 18px;" onclick="agregarArticuloACompra()">+ Agregar a la Compra</button>
                </div>

                <div class="summary-box">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                        📦 Desglose de Artículos en la Factura de Compra
                    </h3>
                    <div id="listaArticulosCompra">
                        <p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado artículos a esta compra.</p>
                    </div>

                    <div style="margin-top:15px; border-top:1px solid #262626; padding-top:10px;">
                        <div class="summary-row"><span>Subtotal Compra:</span><span id="lblSubtotalCompra">$0.00 MXN</span></div>
                        <div class="summary-row"><span>IVA Soportado (16%):</span><span id="lblIvaCompra">$0.00 MXN</span></div>
                        <div class="summary-row total"><span>Total Factura:</span><span id="lblTotalCompra" style="color: #22c55e;">$0.00 MXN</span></div>
                    </div>
                </div>

                <button class="btn-action" onclick="guardarCompraMercancia()">Guardar Compra e Incrementar Stock</button>
                <div id="alertaCompra" class="alert-box">✓ Compra registrada correctamente. El stock en almacén ha sido incrementado.</div>
            `;
            actualizarTablaCompra();
        }

        function agregarArticuloACompra() {
            const artId = document.getElementById('selectCompraArticulo').value;
            const cantidad = parseInt(document.getElementById('compraCantidadInput').value) || 1;
            const articulo = catalogoArticulosAdmin.find(a => a.id === artId);

            if (articulo) {
                const existe = itemsCompraActual.find(item => item.id === artId);
                if (existe) {
                    existe.cantidad += cantidad;
                } else {
                    itemsCompraActual.push({
                        id: articulo.id,
                        sku: articulo.sku,
                        nombre: articulo.nombre,
                        costo: articulo.costoCompra,
                        cantidad: cantidad
                    });
                }
                actualizarTablaCompra();
            }
        }

        function modificarCantidadCompra(id, delta) {
            const item = itemsCompraActual.find(i => i.id === id);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) {
                    removerArticuloCompra(id);
                } else {
                    actualizarTablaCompra();
                }
            }
        }

        function removerArticuloCompra(id) {
            itemsCompraActual = itemsCompraActual.filter(i => i.id !== id);
            actualizarTablaCompra();
        }

        function actualizarTablaCompra() {
            const contenedor = document.getElementById('listaArticulosCompra');
            if (!contenedor) return;

            if (itemsCompraActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado artículos a esta compra.</p>';
                document.getElementById('lblSubtotalCompra').innerText = '$0.00 MXN';
                document.getElementById('lblIvaCompra').innerText = '$0.00 MXN';
                document.getElementById('lblTotalCompra').innerText = '$0.00 MXN';
                return;
            }

            let subtotal = 0;
            let html = itemsCompraActual.map(item => {
                const importe = item.costo * item.cantidad;
                subtotal += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#e5e5e5; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${item.sku}</span>
                            <strong style="color:#ffffff;">${item.nombre}</strong> 
                            <span style="margin-left:8px;">
                                <button class="qty-btn" onclick="modificarCantidadCompra('${item.id}', -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" onclick="modificarCantidadCompra('${item.id}', 1)">+</button>
                            </span>
                            <button class="btn-remove-item" onclick="removerArticuloCompra('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>
                `;
            }).join('');

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            contenedor.innerHTML = html;
            document.getElementById('lblSubtotalCompra').innerText = '$' + subtotal.toFixed(2) + ' MXN';
            document.getElementById('lblIvaCompra').innerText = '$' + iva.toFixed(2) + ' MXN';
            document.getElementById('lblTotalCompra').innerText = '$' + total.toFixed(2) + ' MXN';
        }

        function guardarCompraMercancia() {
            const factura = document.getElementById('compraFacturaInput').value;
            if (!factura) {
                alert('Ingresa el número de factura o remisión.');
                return;
            }

            if (itemsCompraActual.length === 0) {
                alert('Agrega al menos un artículo a la factura de compra.');
                return;
            }

            itemsCompraActual.forEach(item => {
                const artReal = catalogoArticulosAdmin.find(a => a.id === item.id);
                if (artReal) artReal.stock += item.cantidad;
            });

            const alerta = document.getElementById('alertaCompra');
            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
                itemsCompraActual = [];
                renderizarModuloCompras();
            }, 2000);
        }

        /* --- PROVEEDORES Y ARTÍCULOS --- */
        function guardarNuevoProveedor(event) {
            event.preventDefault();
            const provNombre = document.getElementById('provNombreInput').value.trim();
            if (provNombre && !proveedoresLista.includes(provNombre)) {
                proveedoresLista.push(provNombre);
                const alerta = document.getElementById('alertaProv');
                alerta.style.display = 'block';
                setTimeout(() => {
                    alerta.style.display = 'none';
                    cambiarVistaAdmin('proveedores');
                }, 1800);
            }
        }

        function guardarNuevoArticulo(event) {
            event.preventDefault();
            const sku = document.getElementById('newSkuInput').value.toUpperCase();
            const nombre = document.getElementById('newNombreInput').value;
            const costo = parseFloat(document.getElementById('newCostoInput').value) || 0;
            const stock = parseInt(document.getElementById('newStockInput').value) || 0;

            const nuevoId = (catalogoArticulosAdmin.length + 1).toString();
            catalogoArticulosAdmin.push({ id: nuevoId, sku: sku, nombre: nombre, costoCompra: costo, stock: stock });

            const alerta = document.getElementById('alertaArt');
            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
                cambiarVistaAdmin('registrar-art');
            }, 1800);
        }

        function cargarDatosEnEdicion() {
            const artId = document.getElementById('selectEditArticulo').value;
            const art = catalogoArticulosAdmin.find(a => a.id === artId);
            if (art) {
                document.getElementById('editNombreInput').value = art.nombre;
                document.getElementById('editCostoInput').value = art.costoCompra;
                document.getElementById('editStockInput').value = art.stock;
            }
        }

        function guardarEdicionArticulo(event) {
            event.preventDefault();
            const artId = document.getElementById('selectEditArticulo').value;
            const art = catalogoArticulosAdmin.find(a => a.id === artId);
            if (art) {
                art.nombre = document.getElementById('editNombreInput').value;
                art.costoCompra = parseFloat(document.getElementById('editCostoInput').value);
                art.stock = parseInt(document.getElementById('editStockInput').value);

                const alerta = document.getElementById('alertaEdit');
                alerta.style.display = 'block';
                setTimeout(() => {
                    alerta.style.display = 'none';
                    cambiarVistaAdmin('actualizar-art');
                }, 1800);
            }
        }

        function renderizarModuloEliminar() {
            const panel = document.getElementById('panel-contenido-admin');
            let filasHTML = catalogoArticulosAdmin.map(art => `
                <div class="summary-row">
                    <div>
                        <span style="background:#262626; color:#ef4444; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${art.sku}</span>
                        <strong style="color:#ffffff;">${art.nombre}</strong>
                        <span style="margin-left:10px; font-size:0.8rem; color:#a3a3a3;">Stock Actual: <strong style="color:#ffffff;">${art.stock} pzas</strong></span>
                    </div>
                    <button class="btn-remove-item" onclick="eliminarArticuloCatalog('${art.id}')">🗑️ Eliminar</button>
                </div>
            `).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Eliminar Artículos del Inventario</h2>
                    <p>Baja definitiva de productos del catálogo general.</p>
                </div>

                <div class="summary-box">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                        📦 Catálogo de Productos Registrados
                    </h3>
                    ${filasHTML.length > 0 ? filasHTML : '<p style="color:#a3a3a3; text-align:center;">No hay productos registrados.</p>'}
                </div>
            `;
        }

        function eliminarArticuloCatalog(id) {
            const art = catalogoArticulosAdmin.find(a => a.id === id);
            if (art && confirm(`¿Está seguro de eliminar ${art.nombre} (${art.sku}) del inventario?`)) {
                catalogoArticulosAdmin = catalogoArticulosAdmin.filter(a => a.id !== id);
                renderizarModuloEliminar();
            }
        }

        window.onload = function() {
            cambiarVistaAdmin('compras', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
