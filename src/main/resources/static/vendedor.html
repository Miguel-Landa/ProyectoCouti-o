<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        /* Estilos del Historial e Items Clickeables */
        .ticket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ticket-item:hover {
            border-color: #ffffff;
            background: #262626;
        }

        .ticket-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ticket-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ticket-sub {
            font-size: 0.8rem;
            color: #a3a3a3;
        }

        .ticket-price {
            font-size: 1rem;
            font-weight: 700;
            color: #22c55e;
        }

        /* Modal para Ver Detalle y Eliminar */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 6px;
            width: 100%;
            max-width: 500px;
            padding: 25px;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger:hover { background: #b91c1c; }

        .btn-close {
            background: transparent;
            color: #a3a3a3;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: #262626; color: #ffffff; }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Barra Superior -->
        <div class="topbar">
            <h1>Punto de Venta y Cotizaciones</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <!-- Workspace Dividido -->
        <div class="workspace">
            
            <!-- Izquierda: Menú de Vendedor -->
            <div class="sidebar-buttons">
                <div class="sidebar-title">Módulos de Venta</div>
                <button class="nav-btn active" onclick="cambiarVistaVendedor('venta', this)">
                    🛒 Nueva Venta
                </button>
                <button class="nav-btn" onclick="cambiarVistaVendedor('cotizaciones', this)">
                    📄 Cotizaciones
                </button>
                <button class="nav-btn" onclick="cambiarVistaVendedor('historial', this)">
                    📜 Historial de Ventas
                </button>
            </div>

            <!-- Panel Derecho Principal -->
            <div class="main-panel" id="panel-contenido-vendedor">
            </div>

        </div>
    </div>

    <!-- Modal Emergente de Detalle de Ticket -->
    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalTicketTitulo">Detalle de Ticket</h2>
                <p id="modalTicketFecha">Fecha de emisión</p>
            </div>
            <div class="summary-box" id="modalDetalleContenido" style="margin-top:0;">
                <!-- Rellenado por JS -->
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                <button class="btn-danger" onclick="confirmarEliminarTicket()">🗑️ Eliminar Ticket</button>
                <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        // Catálogo de Productos con código SKU, precio y stock
        const catalogoProductos = [
            { id: '1', sku: 'REF-101', nombre: 'Aceite Motul 10W40 1L', precio: 220.00, categoria: 'Motor y Aceites', stock: 15 },
            { id: '2', sku: 'REF-102', nombre: 'Batería Hero Hunk 160R (12V 7Ah)', precio: 850.00, categoria: 'Eléctrico y Baterías', stock: 8 },
            { id: '3', sku: 'REF-103', nombre: 'Balatas Delanteras Hunk 160R', precio: 180.00, categoria: 'Frenos y Suspensión', stock: 20 },
            { id: '4', sku: 'REF-104', nombre: 'Kit Arrastre Piñón y Cadena 428H', precio: 650.00, categoria: 'Motor y Aceites', stock: 5 }
        ];

        // Historial inicial de ventas
        let historialVentas = [
            { id: 1042, cliente: 'Carlos Mendoza', producto: 'Aceite Motul 10W40 1L', cantidad: 1, subtotal: 220.00, iva: 35.20, total: 255.20, fecha: '24/09/2026', pago: 'Efectivo' },
            { id: 1041, cliente: 'Roberto Silva', producto: 'Batería Hero Hunk 160R (12V 7Ah)', cantidad: 1, subtotal: 850.00, iva: 136.00, total: 986.00, fecha: '24/09/2026', pago: 'Tarjeta' }
        ];

        let ticketSeleccionadoId = null;

        function cambiarVistaVendedor(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }

            const panel = document.getElementById('panel-contenido-vendedor');

            if (vista === 'venta') {
                let opcionesProd = catalogoProductos.map(p => `<option value="${p.id}">${p.nombre} - $${p.precio.toFixed(2)} MXN</option>`).join('');

                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Nueva Venta</h2>
                        <p>Selección de productos, cálculo dinámico de totales y cobro en caja.</p>
                    </div>

                    <form id="ventaForm" onsubmit="procesarVenta(event)">
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Cliente / Nombre</label>
                                <input type="text" id="ventaCliente" placeholder="Ej. Carlos Mendoza" required>
                            </div>
                            <div class="input-group">
                                <label>Seleccionar Producto / Refacción</label>
                                <select id="ventaProductoSelect" onchange="recalcularTotalesVenta()">
                                    ${opcionesProd}
                                </select>
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="input-group">
                                <label>Cantidad</label>
                                <input type="number" id="ventaCantidad" value="1" min="1" oninput="recalcularTotalesVenta()" required>
                            </div>
                            <div class="input-group">
                                <label>Método de Pago</label>
                                <select id="ventaMetodoPago">
                                    <option value="Efectivo">Efectivo</option>
                                    <option value="Tarjeta">Tarjeta de Débito / Crédito</option>
                                    <option value="Transferencia">Transferencia Spei</option>
                                </select>
                            </div>
                        </div>

                        <div class="summary-box">
                            <div class="summary-row">
                                <span>Subtotal:</span>
                                <span id="lblSubtotal">$0.00 MXN</span>
                            </div>
                            <div class="summary-row">
                                <span>IVA (16%):</span>
                                <span id="lblIva">$0.00 MXN</span>
                            </div>
                            <div class="summary-row total">
                                <span>Total a Cobrar:</span>
                                <span id="lblTotal" style="color: #22c55e;">$0.00 MXN</span>
                            </div>
                        </div>

                        <button type="submit" class="btn-action">Procesar Venta y Generar Ticket</button>
                    </form>

                    <div id="alertaVenta" class="alert-box">✓ Venta procesada con éxito y registrada en el historial.</div>
                `;
                recalcularTotalesVenta();
            } 
            else if (vista === 'cotizaciones') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Cotizaciones y Disponibilidad</h2>
                        <p>Búsqueda en catálogo por código SKU, consulta de stock y detalles del producto.</p>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Buscar por Código SKU o Nombre</label>
                            <input type="text" id="inputBuscarCodigo" placeholder="Ej. REF-101 o Aceite..." oninput="filtrarCotizaciones()">
                        </div>
                        <div class="input-group">
                            <label>Categoría</label>
                            <select id="selectCategoria" onchange="filtrarCotizaciones()">
                                <option value="TODAS">Todas las categorías</option>
                                <option value="Motor y Aceites">Motor y Aceites</option>
                                <option value="Frenos y Suspensión">Frenos y Suspensión</option>
                                <option value="Eléctrico y Baterías">Eléctrico y Baterías</option>
                            </select>
                        </div>
                    </div>

                    <div class="summary-box" id="resultadoCatalogo">
                        <!-- Rellenado por JS -->
                    </div>

                    <button class="btn-action" onclick="alert('Generando PDF de la cotización...')">Imprimir Cotización en PDF</button>
                `;
                filtrarCotizaciones();
            } 
            else if (vista === 'historial') {
                renderizarHistorialVentas();
            }
        }

        /* --- LÓGICA DE NUEVA VENTA (CÁLCULO DINÁMICO) --- */
        function recalcularTotalesVenta() {
            const prodId = document.getElementById('ventaProductoSelect').value;
            const cantidad = parseInt(document.getElementById('ventaCantidad').value) || 1;
            const producto = catalogoProductos.find(p => p.id === prodId);

            if (producto) {
                const subtotal = producto.precio * cantidad;
                const iva = subtotal * 0.16;
                const total = subtotal + iva;

                document.getElementById('lblSubtotal').innerText = '$' + subtotal.toFixed(2) + ' MXN';
                document.getElementById('lblIva').innerText = '$' + iva.toFixed(2) + ' MXN';
                document.getElementById('lblTotal').innerText = '$' + total.toFixed(2) + ' MXN';
            }
        }

        function procesarVenta(event) {
            event.preventDefault();
            const cliente = document.getElementById('ventaCliente').value;
            const prodId = document.getElementById('ventaProductoSelect').value;
            const cantidad = parseInt(document.getElementById('ventaCantidad').value);
            const pago = document.getElementById('ventaMetodoPago').value;
            const producto = catalogoProductos.find(p => p.id === prodId);

            const subtotal = producto.precio * cantidad;
            const iva = subtotal * 0.16;
            const total = subtotal + iva;
            const nuevoId = Math.floor(1043 + Math.random() * 100);

            historialVentas.unshift({
                id: nuevoId,
                cliente: cliente,
                producto: producto.nombre,
                cantidad: cantidad,
                subtotal: subtotal,
                iva: iva,
                total: total,
                fecha: new Date().toLocaleDateString(),
                pago: pago
            });

            const alerta = document.getElementById('alertaVenta');
            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
                document.getElementById('ventaForm').reset();
                recalcularTotalesVenta();
            }, 2000);
        }

        /* --- LÓGICA DE HISTORIAL DE VENTAS --- */
        function renderizarHistorialVentas() {
            const panel = document.getElementById('panel-contenido-vendedor');

            let itemsHTML = historialVentas.map(t => `
                <div class="ticket-item" onclick="abrirDetalleTicket(${t.id})">
                    <div class="ticket-info">
                        <div class="ticket-title">Ticket #${t.id} - ${t.cliente}</div>
                        <div class="ticket-sub">Fecha: ${t.fecha} | Producto: ${t.producto} (x${t.cantidad})</div>
                    </div>
                    <div class="ticket-price">$${t.total.toFixed(2)} MXN</div>
                </div>
            `).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Historial de Ventas</h2>
                    <p>Registro de transacciones recientes. Haz clic en un ticket para ver el detalle o eliminarlo.</p>
                </div>

                <div class="input-group">
                    <label>Buscar Ticket o Cliente</label>
                    <input type="text" id="buscarTicketInput" placeholder="Ej. Ticket #1042 o cliente..." oninput="filtrarHistorial(this.value)">
                </div>

                <div id="listaTicketsContenedor">
                    ${itemsHTML.length > 0 ? itemsHTML : '<p style="color:#a3a3a3; text-align:center;">No hay ventas registradas.</p>'}
                </div>
            `;
        }

        function abrirDetalleTicket(id) {
            const ticket = historialVentas.find(t => t.id === id);
            if (!ticket) return;

            ticketSeleccionadoId = id;
            document.getElementById('modalTicketTitulo').innerText = `Ticket #${ticket.id} - ${ticket.cliente}`;
            document.getElementById('modalTicketFecha').innerText = `Emisión: ${ticket.fecha} | Pago: ${ticket.pago}`;

            document.getElementById('modalDetalleContenido').innerHTML = `
                <div class="summary-row"><span>Producto:</span><strong>${ticket.producto}</strong></div>
                <div class="summary-row"><span>Cantidad:</span><strong>${ticket.cantidad} pza(s)</strong></div>
                <div class="summary-row"><span>Subtotal:</span><span>$${ticket.subtotal.toFixed(2)} MXN</span></div>
                <div class="summary-row"><span>IVA (16%):</span><span>$${ticket.iva.toFixed(2)} MXN</span></div>
                <div class="summary-row total"><span>Total Pagado:</span><span style="color:#22c55e;">$${ticket.total.toFixed(2)} MXN</span></div>
            `;

            document.getElementById('modalDetalle').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalDetalle').style.display = 'none';
        }

        function confirmarEliminarTicket() {
            if (confirm(`¿Está seguro de eliminar el Ticket #${ticketSeleccionadoId} del historial?`)) {
                historialVentas = historialVentas.filter(t => t.id !== ticketSeleccionadoId);
                cerrarModal();
                renderizarHistorialVentas();
            }
        }

        function filtrarHistorial(query) {
            const q = query.toLowerCase();
            const filtrados = historialVentas.filter(t => 
                t.id.toString().includes(q) || t.cliente.toLowerCase().includes(q) || t.producto.toLowerCase().includes(q)
            );

            let itemsHTML = filtrados.map(t => `
                <div class="ticket-item" onclick="abrirDetalleTicket(${t.id})">
                    <div class="ticket-info">
                        <div class="ticket-title">Ticket #${t.id} - ${t.cliente}</div>
                        <div class="ticket-sub">Fecha: ${t.fecha} | Producto: ${t.producto} (x${t.cantidad})</div>
                    </div>
                    <div class="ticket-price">$${t.total.toFixed(2)} MXN</div>
                </div>
            `).join('');

            document.getElementById('listaTicketsContenedor').innerHTML = itemsHTML.length > 0 
                ? itemsHTML 
                : '<p style="color:#a3a3a3; text-align:center;">No se encontraron coincidencia.</p>';
        }

        /* --- LÓGICA DE COTIZACIONES Y BÚSQUEDA POR CÓDIGO --- */
        function filtrarCotizaciones() {
            const inputVal = document.getElementById('inputBuscarCodigo') ? document.getElementById('inputBuscarCodigo').value.trim().toLowerCase() : '';
            const catVal = document.getElementById('selectCategoria') ? document.getElementById('selectCategoria').value : 'TODAS';

            const filtrados = catalogoProductos.filter(p => {
                const coincideQuery = p.sku.toLowerCase().includes(inputVal) || p.nombre.toLowerCase().includes(inputVal);
                const coincideCat = catVal === 'TODAS' || p.categoria === catVal;
                return coincideQuery && coincideCat;
            });

            const contenedor = document.getElementById('resultadoCatalogo');
            if (!contenedor) return;

            if (filtrados.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center;">No hay productos que coincidan con la búsqueda.</p>';
                return;
            }

            let html = filtrados.map(p => `
                <div class="summary-row" style="align-items: center; padding: 12px 0;">
                    <div>
                        <span style="background:#262626; color:#4ade80; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:8px;">${p.sku}</span>
                        <strong style="color:#ffffff;">${p.nombre}</strong>
                        <div style="font-size:0.78rem; color:#737373; margin-top:2px;">Categoría: ${p.categoria} | Stock disponible: <span style="color:#ffffff;">${p.stock} unidades</span></div>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-size:1rem; font-weight:700; color:#ffffff;">$${p.precio.toFixed(2)} MXN</span>
                    </div>
                </div>
            `).join('');

            contenedor.innerHTML = html;
        }

        window.onload = function() {
            cambiarVistaVendedor('venta', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
