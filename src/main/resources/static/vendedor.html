<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Ventas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dash-bg vendedor-theme">
    <div class="dashboard-container">
        <header class="topbar">
            <h1>🛍️ Punto de Venta y Cotizaciones</h1>
            <a href="/index.html" class="btn-logout">Cerrar Sesión</a>
        </header>
        <main class="grid-layout">
            <div class="dash-card">
                <h3>Nueva Ventas</h3>
                <p>Generar factura, cobro en caja e impresión de tickets.</p>
                <button class="action-btn">Crear Factura</button>
            </div>
            <div class="dash-card">
                <h3>Catálogo y Cotizaciones</h3>
                <p>Consultar disponibilidad de refacciones, vehículos o artículos.</p>
                <button class="action-btn">Buscar Productos</button>
            </div>
            <div class="dash-card">
                <h3>Historial de Clientes</h3>
                <p>Registro de transacciones, garantías y seguimiento a ventas.</p>
                <button class="action-btn">Ver Clientes</button>
            </div>
        </main>
    </div>
</body>
</html>
