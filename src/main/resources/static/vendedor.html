<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas y Cotizaciones - MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .btn-add-item {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: #ffffff;
            color: #000000;
        }

        .qty-btn {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .ticket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px 20px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .ticket-item:hover {
            border-color: #404040;
            background: #262626;
        }

        .ticket-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ticket-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ticket-sub {
            font-size: 0.8rem;
            color: #a3a3a3;
        }

        .ticket-price {
            font-size: 1rem;
            font-weight: 700;
        }

        .badge-cotizacion {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .badge-venta {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .badge-stock-ok {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-stock-low {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-stock-empty {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 6px;
            width: 100%;
            max-width: 580px;
            padding: 25px;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger:hover { background: #b91c1c; }

        .btn-convert {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-convert:hover { background: #15803d; }

        .btn-close {
            background: transparent;
            color: #a3a3a3;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: #262626; color: #ffffff; }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .btn-remove-item {
            color: #ef4444;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Topbar -->
        <div class="topbar">
            <h1>Sistema MRX - Módulo de Ventas y Cotizaciones</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <!-- Workspace Lateral + Panel Principal -->
        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">MÓDULOS DE VENTAS Y COTIZACIONES</div>
                <button class="nav-btn active" onclick="cambiarModulo('consulta_stock', this)">
                    🔍 Consultar Disponibilidad
                </button>
                <button class="nav-btn" onclick="cambiarModulo('cotizacion', this)">
                    📋 Cotización de Productos
                </button>
                <button class="nav-btn" onclick="cambiarModulo('venta', this)">
                    🛒 Venta de Productos
                </button>
                <button class="nav-btn" onclick="cambiarModulo('historial_cotizaciones', this)">
                    📄 Historial de Cotizaciones
                </button>
                <button class="nav-btn" onclick="cambiarModulo('historial_ventas', this)">
                    📜 Historial de Ventas
                </button>
            </div>

            <div class="main-panel" id="panel-contenido">
                <!-- Se renderizan los módulos dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Modal Emergente de Detalles -->
    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalTicketTitulo">Detalle del Registro</h2>
                <p id="modalTicketFecha">Fecha de emisión</p>
            </div>
            <div class="summary-box" id="modalDetalleContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;" id="modalAcciones">
            </div>
        </div>
    </div>

    <script>
        const catalogoProductos = [
            { id: '1', sku: 'REF-101', nombre: 'Aceite Motul 10W40 1L', precio: 220.00, stock: 15 },
            { id: '2', sku: 'REF-102', nombre: 'Batería Hero Hunk 160R (12V 7Ah)', precio: 850.00, stock: 8 },
            { id: '3', sku: 'REF-103', nombre: 'Balatas Delanteras Hunk 160R', precio: 180.00, stock: 20 },
            { id: '4', sku: 'REF-104', nombre: 'Kit Arrastre Piñón y Cadena 428H', precio: 650.00, stock: 3 },
            { id: '5', sku: 'REF-105', nombre: 'Filtro de Aire Hunk 160R', precio: 120.00, stock: 0 }
        ];

        let historialRegistros = [
            { id: 2035, cliente: 'Miguel Landa', tipo: 'COTIZACIÓN', items: [{ id: '2', producto: 'Batería Hero Hunk 160R (12V 7Ah)', cantidad: 1, precio: 850.00 }, { id: '1', producto: 'Aceite Motul 10W40 1L', cantidad: 1, precio: 220.00 }], subtotal: 1070.00, iva: 171.20, total: 1241.20, fecha: '24/09/2026', pago: 'Presupuesto' },
            { id: 1042, cliente: 'Carlos Mendoza', tipo: 'VENTA', items: [{ id: '1', producto: 'Aceite Motul 10W40 1L', cantidad: 1, precio: 220.00 }], subtotal: 220.00, iva: 35.20, total: 255.20, fecha: '24/09/2026', pago: 'Efectivo' }
        ];

        let itemsVentaActual = [];
        let itemsCotizacionActual = [];
        let idCotizacionEnProceso = null;
        let registroSeleccionadoId = null;

        function cambiarModulo(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }

            if (vista === 'consulta_stock') {
                renderizarConsultaStock();
            } else if (vista === 'venta') {
                renderizarModuloVenta();
            } else if (vista === 'cotizacion') {
                renderizarModuloCotizaciones();
            } else if (vista === 'historial_ventas') {
                renderizarHistorial('VENTA');
            } else if (vista === 'historial_cotizaciones') {
                renderizarHistorial('COTIZACIÓN');
            }
        }

        /* --- MÓDULO 0: CONSULTA DE DISPONIBILIDAD / STOCK POR CÓDIGO --- */
        function renderizarConsultaStock() {
            const panel = document.getElementById('panel-contenido');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Consulta de Disponibilidad y Stock</h2>
                    <p>Busca productos por código (SKU) o nombre para verificar existencias antes de cotizar o vender.</p>
                </div>

                <div class="input-group" style="margin-bottom: 24px;">
                    <label>Buscar por Código (SKU) o Nombre del Producto</label>
                    <input type="text" id="inputBuscarStock" placeholder="Ej. REF-101 o Aceite Motul..." oninput="filtrarProductosStock(this.value)" autofocus>
                </div>

                <div id="contenedorListaProductosStock"></div>
            `;

            filtrarProductosStock('');
        }

        function filtrarProductosStock(query) {
            const contenedor = document.getElementById('contenedorListaProductosStock');
            if (!contenedor) return;

            const q = query.toLowerCase().trim();
            const productosFiltrados = catalogoProductos.filter(p => p.sku.toLowerCase().includes(q) || p.nombre.toLowerCase().includes(q));

            if (productosFiltrados.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:30px 0;">No se encontraron productos con ese código o nombre.</p>';
                return;
            }

            let html = productosFiltrados.map(p => {
                let badgeStock = `<span class="badge-stock-ok">✓ Disponible (${p.stock} pzas)</span>`;
                if (p.stock === 0) {
                    badgeStock = `<span class="badge-stock-empty">❌ Agotado (0 pzas)</span>`;
                } else if (p.stock <= 5) {
                    badgeStock = `<span class="badge-stock-low">⚠️ Poco Stock (${p.stock} pzas)</span>`;
                }

                return `
                    <div class="ticket-item">
                        <div class="ticket-info">
                            <div class="ticket-title">
                                <span style="background:#262626; color:#60a5fa; padding:2px 8px; border-radius:3px; font-size:0.8rem; font-weight:700; margin-right:8px;">${p.sku}</span>
                                ${p.nombre}
                            </div>
                            <div class="ticket-sub">Precio unitario: <strong>$${p.precio.toFixed(2)} MXN</strong></div>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            ${badgeStock}
                            ${p.stock > 0 ? `
                                <button class="btn-add-item" onclick="enviarAOperacion('${p.id}', 'cotizacion')">📋 Cotizar</button>
                                <button class="btn-add-item" style="background:#22c55e; border-color:#22c55e; color:#000;" onclick="enviarAOperacion('${p.id}', 'venta')">🛒 Vender</button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            contenedor.innerHTML = html;
        }

        function enviarAOperacion(prodId, destino) {
            const producto = catalogoProductos.find(p => p.id === prodId);
            if (!producto) return;

            if (destino === 'cotizacion') {
                const existe = itemsCotizacionActual.find(i => i.id === prodId);
                if (existe) existe.cantidad++;
                else itemsCotizacionActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: 1 });
                
                cambiarModulo('cotizacion', document.querySelectorAll('.nav-btn')[1]);
            } else if (destino === 'venta') {
                const existe = itemsVentaActual.find(i => i.id === prodId);
                if (existe) {
                    if (existe.cantidad + 1 > producto.stock) {
                        alert(`⚠️ Supera el stock disponible (${producto.stock} pzas).`);
                        return;
                    }
                    existe.cantidad++;
                } else {
                    itemsVentaActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: 1 });
                }

                cambiarModulo('venta', document.querySelectorAll('.nav-btn')[2]);
            }
        }

        /* --- MÓDULO 1: VENTA DE PRODUCTOS --- */
        function renderizarModuloVenta() {
            const panel = document.getElementById('panel-contenido');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Venta de Productos ${idCotizacionEnProceso ? '<span style="color:#60a5fa; font-size:0.9rem;">(Cargado desde Cotización #' + idCotizacionEnProceso + ')</span>' : ''}</h2>
                    <p>Selecciona los productos para procesar el cobro e imprimir ticket.</p>
                </div>

                <form id="ventaForm" onsubmit="procesarVenta(event)">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nombre del Cliente</label>
                            <input type="text" id="ventaCliente" placeholder="Ej. Carlos Mendoza" required>
                        </div>
                        <div class="input-group">
                            <label>Método de Pago</label>
                            <select id="ventaMetodoPago">
                                <option value="Efectivo">Efectivo</option>
                                <option value="Tarjeta">Tarjeta de Débito / Crédito</option>
                                <option value="Transferencia">Transferencia SPEI</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
                        <div class="input-group" style="margin-bottom:0; flex:1;">
                            <label>Filtrar / Buscar por Código SKU</label>
                            <input type="text" id="buscarSKUVenta" placeholder="Ej. REF-101..." oninput="filtrarSelectProductos('selectVentaProducto', this.value)">
                        </div>
                        <div class="input-group" style="margin-bottom:0; flex:2;">
                            <label>Seleccionar Producto</label>
                            <select id="selectVentaProducto"></select>
                        </div>
                        <div class="input-group" style="margin-bottom:0; flex:1;">
                            <label>Cantidad</label>
                            <input type="number" id="ventaCantidadInput" value="1" min="1">
                        </div>
                        <button type="button" class="btn-add-item" style="padding:12px 18px;" onclick="agregarProductoAVenta()">+ Agregar Item</button>
                    </div>

                    <div class="summary-box">
                        <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                            🛒 Desglose de Productos en la Venta
                        </h3>
                        <div id="listaItemsVenta"></div>
                        <div style="margin-top:15px; border-top:1px solid #262626; padding-top:10px;">
                            <div class="summary-row"><span>Subtotal:</span><span id="lblSubtotal">$0.00 MXN</span></div>
                            <div class="summary-row"><span>IVA (16%):</span><span id="lblIva">$0.00 MXN</span></div>
                            <div class="summary-row total"><span>Total a Cobrar:</span><span id="lblTotal" style="color: #22c55e;">$0.00 MXN</span></div>
                        </div>
                    </div>

                    <button type="submit" class="btn-action">${idCotizacionEnProceso ? 'Convertir Cotización #' + idCotizacionEnProceso + ' a Venta' : 'Procesar Venta'}</button>
                </form>

                <div id="alertaVenta" class="alert-box">✓ Venta registrada exitosamente y stock actualizado.</div>
            `;

            filtrarSelectProductos('selectVentaProducto', '');
            actualizarTablaVenta();
        }

        function filtrarSelectProductos(selectId, query) {
            const select = document.getElementById(selectId);
            if (!select) return;

            const q = query.toLowerCase().trim();
            const filtrados = catalogoProductos.filter(p => p.sku.toLowerCase().includes(q) || p.nombre.toLowerCase().includes(q));

            if (filtrados.length === 0) {
                select.innerHTML = `<option value="">Sin coincidencias</option>`;
                return;
            }

            select.innerHTML = filtrados.map(p => 
                `<option value="${p.id}">[${p.sku}] ${p.nombre} - $${p.precio.toFixed(2)} (Stock: ${p.stock} pzas)</option>`
            ).join('');
        }

        function agregarProductoAVenta() {
            const select = document.getElementById('selectVentaProducto');
            if (!select || !select.value) return;

            const prodId = select.value;
            const cantidad = parseInt(document.getElementById('ventaCantidadInput').value) || 1;
            const producto = catalogoProductos.find(p => p.id === prodId);

            if (producto) {
                if (cantidad > producto.stock) {
                    alert(`⚠️ Stock insuficiente. Disponibles: ${producto.stock} pzas.`);
                    return;
                }
                const existe = itemsVentaActual.find(item => item.id === prodId);
                if (existe) {
                    if ((existe.cantidad + cantidad) > producto.stock) {
                        alert(`⚠️ Supera el stock disponible (${producto.stock} pzas).`);
                        return;
                    }
                    existe.cantidad += cantidad;
                } else {
                    itemsVentaActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: cantidad });
                }
                actualizarTablaVenta();
            }
        }

        function modificarCantidadVenta(id, delta) {
            const item = itemsVentaActual.find(i => i.id === id);
            const prodReal = catalogoProductos.find(p => p.id === id);
            if (item && prodReal) {
                if (delta > 0 && item.cantidad + delta > prodReal.stock) {
                    alert(`⚠️ Stock máximo alcanzado (${prodReal.stock} pzas).`);
                    return;
                }
                item.cantidad += delta;
                if (item.cantidad <= 0) removerItemVenta(id);
                else actualizarTablaVenta();
            }
        }

        function removerItemVenta(id) {
            itemsVentaActual = itemsVentaActual.filter(item => item.id !== id);
            actualizarTablaVenta();
        }

        function actualizarTablaVenta() {
            const contenedor = document.getElementById('listaItemsVenta');
            if (!contenedor) return;

            if (itemsVentaActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No hay productos agregados.</p>';
                document.getElementById('lblSubtotal').innerText = '$0.00 MXN';
                document.getElementById('lblIva').innerText = '$0.00 MXN';
                document.getElementById('lblTotal').innerText = '$0.00 MXN';
                return;
            }

            let subtotal = 0;
            let html = itemsVentaActual.map(item => {
                const importe = item.precio * item.cantidad;
                subtotal += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#4ade80; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${item.sku}</span>
                            <strong style="color:#ffffff;">${item.nombre}</strong> 
                            <span style="margin-left:8px;">
                                <button class="qty-btn" type="button" onclick="modificarCantidadVenta('${item.id}', -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" type="button" onclick="modificarCantidadVenta('${item.id}', 1)">+</button>
                            </span>
                            <button type="button" class="btn-remove-item" onclick="removerItemVenta('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>
                `;
            }).join('');

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            contenedor.innerHTML = html;
            document.getElementById('lblSubtotal').innerText = '$' + subtotal.toFixed(2) + ' MXN';
            document.getElementById('lblIva').innerText = '$' + iva.toFixed(2) + ' MXN';
            document.getElementById('lblTotal').innerText = '$' + total.toFixed(2) + ' MXN';
        }

        function procesarVenta(event) {
            event.preventDefault();
            const cliente = document.getElementById('ventaCliente').value;
            const pago = document.getElementById('ventaMetodoPago').value;

            if (itemsVentaActual.length === 0) {
                alert('Agrega al menos un producto a la venta.');
                return;
            }

            let subtotal = 0;
            const itemsMapeados = itemsVentaActual.map(item => {
                subtotal += (item.precio * item.cantidad);
                const prodReal = catalogoProductos.find(p => p.id === item.id);
                if (prodReal) prodReal.stock -= item.cantidad;
                return { id: item.id, producto: item.nombre, cantidad: item.cantidad, precio: item.precio };
            });

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            if (idCotizacionEnProceso) {
                const idx = historialRegistros.findIndex(t => t.id === idCotizacionEnProceso);
                if (idx !== -1) {
                    const reg = historialRegistros.splice(idx, 1)[0];
                    reg.cliente = cliente; reg.tipo = 'VENTA'; reg.items = itemsMapeados;
                    reg.subtotal = subtotal; reg.iva = iva; reg.total = total; reg.pago = pago;
                    reg.fecha = new Date().toLocaleDateString();
                    historialRegistros.unshift(reg);
                }
                idCotizacionEnProceso = null;
            } else {
                historialRegistros.unshift({
                    id: Math.floor(1000 + Math.random() * 9000),
                    cliente: cliente, tipo: 'VENTA', items: itemsMapeados,
                    subtotal: subtotal, iva: iva, total: total,
                    fecha: new Date().toLocaleDateString(), pago: pago
                });
            }

            const alerta = document.getElementById('alertaVenta');
            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
                itemsVentaActual = [];
                renderizarModuloVenta();
            }, 1500);
        }

        /* --- MÓDULO 2: COTIZACIÓN DE PRODUCTOS --- */
        function renderizarModuloCotizaciones() {
            const panel = document.getElementById('panel-contenido');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Cotización de Productos</h2>
                    <p>Crea presupuestos formalizados para los clientes.</p>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Nombre del Cliente</label>
                        <input type="text" id="cotizacionCliente" placeholder="Ej. Miguel Landa">
                    </div>
                    <div class="input-group">
                        <label>Filtrar por Código SKU</label>
                        <input type="text" id="buscarSKUCotizacion" placeholder="Ej. REF-102..." oninput="filtrarSelectProductos('selectCotizacionProducto', this.value)">
                    </div>
                </div>

                <div style="display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
                    <div class="input-group" style="margin-bottom:0; flex:2;">
                        <label>Seleccionar Producto</label>
                        <select id="selectCotizacionProducto"></select>
                    </div>
                    <div class="input-group" style="margin-bottom:0; flex:1;">
                        <label>Cantidad</label>
                        <input type="number" id="cotizacionCantidad" value="1" min="1">
                    </div>
                    <button class="btn-add-item" style="padding:12px 20px;" onclick="agregarProductoACotizacion()">+ Agregar a Cotización</button>
                </div>

                <div class="summary-box">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                        📋 Productos en la Cotización
                    </h3>
                    <div id="listaItemsCotizacion"></div>
                    <div style="margin-top:15px; border-top:1px solid #262626; padding-top:10px;">
                        <div class="summary-row"><span>Subtotal:</span><span id="lblSubtotalCotiz">$0.00 MXN</span></div>
                        <div class="summary-row"><span>IVA (16%):</span><span id="lblIvaCotiz">$0.00 MXN</span></div>
                        <div class="summary-row total"><span>Total Cotizado:</span><span id="lblTotalCotiz" style="color:#60a5fa;">$0.00 MXN</span></div>
                    </div>
                </div>

                <button class="btn-action" onclick="guardarCotizacion()">💾 Guardar Cotización</button>
                <div id="alertaCotizacion" class="alert-box">✓ Cotización registrada en el historial.</div>
            `;

            filtrarSelectProductos('selectCotizacionProducto', '');
            actualizarTablaCotizacion();
        }

        function agregarProductoACotizacion() {
            const select = document.getElementById('selectCotizacionProducto');
            if (!select || !select.value) return;

            const prodId = select.value;
            const cantidad = parseInt(document.getElementById('cotizacionCantidad').value) || 1;
            const producto = catalogoProductos.find(p => p.id === prodId);

            if (producto) {
                const existe = itemsCotizacionActual.find(item => item.id === prodId);
                if (existe) existe.cantidad += cantidad;
                else itemsCotizacionActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: cantidad });
                actualizarTablaCotizacion();
            }
        }

        function modificarCantidadCotizacion(id, delta) {
            const item = itemsCotizacionActual.find(i => i.id === id);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) removerItemCotizacion(id);
                else actualizarTablaCotizacion();
            }
        }

        function removerItemCotizacion(id) {
            itemsCotizacionActual = itemsCotizacionActual.filter(item => item.id !== id);
            actualizarTablaCotizacion();
        }

        function actualizarTablaCotizacion() {
            const contenedor = document.getElementById('listaItemsCotizacion');
            if (!contenedor) return;

            if (itemsCotizacionActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No hay productos agregados.</p>';
                document.getElementById('lblSubtotalCotiz').innerText = '$0.00 MXN';
                document.getElementById('lblIvaCotiz').innerText = '$0.00 MXN';
                document.getElementById('lblTotalCotiz').innerText = '$0.00 MXN';
                return;
            }

            let subtotal = 0;
            let html = itemsCotizacionActual.map(item => {
                const importe = item.precio * item.cantidad;
                subtotal += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#60a5fa; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${item.sku}</span>
                            <strong style="color:#ffffff;">${item.nombre}</strong> 
                            <span style="margin-left:8px;">
                                <button class="qty-btn" type="button" onclick="modificarCantidadCotizacion('${item.id}', -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" type="button" onclick="modificarCantidadCotizacion('${item.id}', 1)">+</button>
                            </span>
                            <button type="button" class="btn-remove-item" onclick="removerItemCotizacion('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>
                `;
            }).join('');

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            contenedor.innerHTML = html;
            document.getElementById('lblSubtotalCotiz').innerText = '$' + subtotal.toFixed(2) + ' MXN';
            document.getElementById('lblIvaCotiz').innerText = '$' + iva.toFixed(2) + ' MXN';
            document.getElementById('lblTotalCotiz').innerText = '$' + total.toFixed(2) + ' MXN';
        }

        function guardarCotizacion() {
            const cliente = document.getElementById('cotizacionCliente').value || 'Cliente General';
            if (itemsCotizacionActual.length === 0) {
                alert('Agrega al menos un producto a la cotización.');
                return;
            }

            let subtotal = 0;
            const itemsMapeados = itemsCotizacionActual.map(item => {
                subtotal += (item.precio * item.cantidad);
                return { id: item.id, producto: item.nombre, cantidad: item.cantidad, precio: item.precio };
            });

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            historialRegistros.unshift({
                id: Math.floor(2000 + Math.random() * 8000),
                cliente: cliente, tipo: 'COTIZACIÓN', items: itemsMapeados,
                subtotal: subtotal, iva: iva, total: total,
                fecha: new Date().toLocaleDateString(), pago: 'Presupuesto'
            });

            const alerta = document.getElementById('alertaCotizacion');
            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
                itemsCotizacionActual = [];
                renderizarModuloCotizaciones();
            }, 1500);
        }

        /* --- MÓDULOS DE HISTORIAL: VENTAS Y COTIZACIONES --- */
        function renderizarHistorial(tipoFiltro) {
            const panel = document.getElementById('panel-contenido');
            const registrosFiltrados = historialRegistros.filter(r => r.tipo === tipoFiltro);

            let itemsHTML = registrosFiltrados.map(t => {
                const isCotiz = t.tipo === 'COTIZACIÓN';
                return `
                    <div class="ticket-item" onclick="abrirDetalleModal(${t.id})">
                        <div class="ticket-info">
                            <div class="ticket-title">
                                #${t.id} - ${t.cliente}
                                <span class="${isCotiz ? 'badge-cotizacion' : 'badge-venta'}">${t.tipo}</span>
                            </div>
                            <div class="ticket-sub">Fecha: ${t.fecha} | Cantidad de productos: ${t.items.length} item(s)</div>
                        </div>
                        <div class="ticket-price" style="color:${isCotiz ? '#60a5fa' : '#22c55e'};">$${t.total.toFixed(2)} MXN</div>
                    </div>
                `;
            }).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Historial de ${tipoFiltro === 'VENTA' ? 'Ventas' : 'Cotizaciones'}</h2>
                    <p>Consulta, busca o convierte los registros seleccionados.</p>
                </div>

                <div class="input-group">
                    <label>Buscar por Folio o Cliente</label>
                    <input type="text" placeholder="Ej. #2035 o Miguel Landa..." oninput="filtrarListaHistorial(this.value, '${tipoFiltro}')">
                </div>

                <div id="contenedorListaHistorial">
                    ${itemsHTML.length > 0 ? itemsHTML : '<p style="color:#a3a3a3; text-align:center; padding:20px;">No se encontraron registros.</p>'}
                </div>
            `;
        }

        function abrirDetalleModal(id) {
            const reg = historialRegistros.find(t => t.id === id);
            if (!reg) return;

            registroSeleccionadoId = id;
            document.getElementById('modalTicketTitulo').innerText = `${reg.tipo} #${reg.id} - ${reg.cliente}`;
            document.getElementById('modalTicketFecha').innerText = `Fecha: ${reg.fecha} | Estado: ${reg.pago}`;

            let itemsDesglose = reg.items.map(it => `
                <div class="summary-row">
                    <span>${it.producto} (x${it.cantidad})</span>
                    <span>$${(it.precio * it.cantidad).toFixed(2)} MXN</span>
                </div>
            `).join('');

            document.getElementById('modalDetalleContenido').innerHTML = `
                <h4 style="font-size:0.85rem; color:#a3a3a3; margin-bottom:8px;">Detalle de ítems:</h4>
                ${itemsDesglose}
                <div class="summary-row" style="margin-top:10px; border-top:1px solid #262626; padding-top:8px;">
                    <span>Subtotal:</span><span>$${reg.subtotal.toFixed(2)} MXN</span>
                </div>
                <div class="summary-row"><span>IVA (16%):</span><span>$${reg.iva.toFixed(2)} MXN</span></div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span style="color:${reg.tipo === 'COTIZACIÓN' ? '#60a5fa' : '#22c55e'};">$${reg.total.toFixed(2)} MXN</span>
                </div>
            `;

            const acciones = document.getElementById('modalAcciones');
            if (reg.tipo === 'COTIZACIÓN') {
                acciones.innerHTML = `
                    <button class="btn-convert" onclick="convertirCotizacionAVenta(${reg.id})">🛒 Convertir a Venta</button>
                    <button class="btn-danger" onclick="eliminarRegistroModal()">🗑️ Eliminar</button>
                    <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
                `;
            } else {
                acciones.innerHTML = `
                    <button class="btn-convert" style="background:#2563eb;" onclick="generarCotizacionDesdeVenta(${reg.id})">📋 Generar Cotización desde Venta</button>
                    <button class="btn-danger" onclick="eliminarRegistroModal()">🗑️ Eliminar</button>
                    <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
                `;
            }

            document.getElementById('modalDetalle').style.display = 'flex';
        }

        function convertirCotizacionAVenta(idCotiz) {
            const cotiz = historialRegistros.find(t => t.id === idCotiz);
            if (!cotiz) return;

            idCotizacionEnProceso = idCotiz;
            itemsVentaActual = cotiz.items.map(it => {
                const prodReal = catalogoProductos.find(p => p.nombre.toLowerCase().includes(it.producto.toLowerCase()) || p.id === it.id);
                return {
                    id: prodReal ? prodReal.id : '1',
                    sku: prodReal ? prodReal.sku : 'REF-100',
                    nombre: it.producto,
                    precio: it.precio,
                    cantidad: it.cantidad
                };
            });

            cerrarModal();
            cambiarModulo('venta', document.querySelectorAll('.nav-btn')[2]);

            setTimeout(() => {
                const c = document.getElementById('ventaCliente');
                if (c) c.value = cotiz.cliente;
                actualizarTablaVenta();
            }, 100);
        }

        function generarCotizacionDesdeVenta(idVenta) {
            const venta = historialRegistros.find(t => t.id === idVenta);
            if (!venta) return;

            itemsCotizacionActual = venta.items.map(it => {
                const prodReal = catalogoProductos.find(p => p.nombre.toLowerCase().includes(it.producto.toLowerCase()) || p.id === it.id);
                return {
                    id: prodReal ? prodReal.id : '1',
                    sku: prodReal ? prodReal.sku : 'REF-100',
                    nombre: it.producto,
                    precio: it.precio,
                    cantidad: it.cantidad
                };
            });

            cerrarModal();
            cambiarModulo('cotizacion', document.querySelectorAll('.nav-btn')[1]);

            setTimeout(() => {
                const c = document.getElementById('cotizacionCliente');
                if (c) c.value = venta.cliente;
                actualizarTablaCotizacion();
            }, 100);
        }

        function cerrarModal() { document.getElementById('modalDetalle').style.display = 'none'; }

        function eliminarRegistroModal() {
            if (confirm(`¿Eliminar el registro #${registroSeleccionadoId}?`)) {
                const reg = historialRegistros.find(t => t.id === registroSeleccionadoId);
                const tipoAnterior = reg ? reg.tipo : 'VENTA';
                historialRegistros = historialRegistros.filter(t => t.id !== registroSeleccionadoId);
                cerrarModal();
                renderizarHistorial(tipoAnterior);
            }
        }

        function filtrarListaHistorial(query, tipoFiltro) {
            const q = query.toLowerCase();
            const filtrados = historialRegistros.filter(t => t.tipo === tipoFiltro && (t.id.toString().includes(q) || t.cliente.toLowerCase().includes(q)));

            let html = filtrados.map(t => {
                const isCotiz = t.tipo === 'COTIZACIÓN';
                return `
                    <div class="ticket-item" onclick="abrirDetalleModal(${t.id})">
                        <div class="ticket-info">
                            <div class="ticket-title">
                                #${t.id} - ${t.cliente}
                                <span class="${isCotiz ? 'badge-cotizacion' : 'badge-venta'}">${t.tipo}</span>
                            </div>
                            <div class="ticket-sub">Fecha: ${t.fecha} | Cantidad de productos: ${t.items.length} item(s)</div>
                        </div>
                        <div class="ticket-price" style="color:${isCotiz ? '#60a5fa' : '#22c55e'};">$${t.total.toFixed(2)} MXN</div>
                    </div>
                `;
            }).join('');

            document.getElementById('contenedorListaHistorial').innerHTML = html.length > 0 ? html : '<p style="color:#a3a3a3; text-align:center; padding:20px;">No hay coincidencias.</p>';
        }

        window.onload = function() {
            cambiarModulo('consulta_stock', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
