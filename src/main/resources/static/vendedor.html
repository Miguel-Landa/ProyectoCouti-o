<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas y Cotizaciones - MRX</title>
    <script src="sesion.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eaf3fb;
            --panel: #f8fbff;
            --panel-alt: #ebf4ff;
            --panel-soft: #f4f9ff;
            --border: #bfd6ef;
            --border-soft: #9dbfe9;
            --text: #111827;
            --muted: #476a8d;
            --accent: #5b8ec9;
            --accent-hover: #4d7fb8;
            --button-text: #f7fbff;
            --success: #4f9566;
            --danger: #c76363;
            --shadow: rgba(110, 145, 185, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-add-item {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-secondary {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .qty-btn {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .ticket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px 20px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .ticket-item:hover {
            border-color: #404040;
            background: #262626;
        }

        .ticket-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ticket-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ticket-sub {
            font-size: 0.8rem;
            color: #a3a3a3;
        }

        .ticket-price {
            font-size: 1rem;
            font-weight: 700;
        }

        .badge-cotizacion {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .badge-venta {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .badge-stock-ok {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-stock-low {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-stock-empty {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 6px;
            width: 100%;
            max-width: 580px;
            padding: 25px;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger:hover { background: #b91c1c; }

        .btn-convert {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-convert:hover { background: #15803d; }

        .btn-close {
            background: transparent;
            color: #a3a3a3;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: #262626; color: #ffffff; }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .btn-remove-item {
            color: #ef4444;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #262626;
            border-radius: 4px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        table.data-table th {
            background: #1f1f1f;
            color: #a3a3a3;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #262626;
        }

        table.data-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #1f1f1f;
            color: #e5e5e5;
            vertical-align: top;
        }

        table.data-table tr:hover {
            background: #1a1a1a;
        }

        .report-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin: 18px 0;
        }

        .report-total-card {
            padding: 18px;
            border: 1px solid #262626;
            border-radius: 8px;
            background: #1f1f1f;
        }

        .report-total-card strong {
            display: block;
            margin-top: 8px;
            font-size: 1.35rem;
        }

        .report-filter-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
        }

        body {
            background: var(--bg) !important;
            color: var(--text) !important;
        }

        .topbar, .sidebar-buttons, .main-panel, .modal-card {
            background: var(--panel);
            border-color: var(--border);
            color: var(--text);
        }

        .topbar h1, .panel-header h2, .summary-row.total,
        .ticket-title {
            color: var(--text);
        }

        .panel-header, .panel-header p, .sidebar-title,
        .input-group label, .summary-row, .ticket-sub {
            color: var(--muted);
        }

        .panel-header, .summary-row, .ticket-item {
            border-color: var(--border);
        }

        .nav-btn, .btn-add-item, .btn-secondary, .qty-btn, .input-group input,
        .input-group select, .summary-box, .ticket-item {
            background: var(--panel-alt);
            color: var(--text);
            border-color: var(--border-soft);
        }

        .nav-btn:hover, .btn-add-item:hover, .btn-secondary:hover, .qty-btn:hover,
        .input-group input:focus, .input-group select:focus,
        .ticket-item:hover {
            background: #dfeeff;
            border-color: var(--accent);
            color: var(--text);
        }

        .nav-btn.active, .btn-action {
            background: var(--accent);
            color: var(--button-text);
            border-color: var(--accent);
        }

        .btn-action:hover {
            background: var(--accent-hover);
        }

        .btn-logout {
            color: var(--accent);
            border-color: var(--border-soft);
        }

        .btn-logout:hover {
            background: var(--accent);
            color: var(--button-text);
        }

        .badge-cotizacion {
            background: #edf4fc;
            color: var(--accent);
            border-color: #c5d9f0;
        }

        .badge-venta, .badge-stock-ok {
            background: #edf7ef;
            color: var(--success);
            border-color: #b9d9c1;
        }

        .badge-stock-low {
            background: #fff8e7;
            color: #9b762e;
            border-color: #ead9a9;
        }

        .badge-stock-empty, .btn-danger {
            background: #fff4f3;
            color: var(--danger);
            border-color: #e9b8b5;
        }

        .btn-convert {
            background: var(--accent);
            color: var(--button-text);
        }

        .btn-close {
            color: var(--muted);
            border-color: var(--border-soft);
        }

        .btn-close:hover {
            background: var(--panel-alt);
            color: var(--text);
        }

        .alert-box {
            background: #f0f8f1;
            border-color: var(--success);
            color: var(--success);
        }

        .table-container {
            background: var(--panel-alt);
            border-color: var(--border-soft);
        }

        table.data-table th {
            background: var(--panel-alt);
            color: var(--muted);
            border-bottom-color: var(--border);
        }

        table.data-table td {
            background: var(--panel-alt);
            color: var(--text);
            border-bottom-color: var(--border);
        }

        table.data-table tr:hover td {
            background: #dfeeff;
        }

        .report-total-card {
            background: var(--panel-alt);
            border-color: var(--border);
            color: var(--text);
        }

        .input-group input[readonly] {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .cambio-ok {
            color: var(--success);
        }

        .cambio-falta {
            color: var(--danger);
        }

        [style*="color:#ffffff"], [style*="color: #ffffff"],
        [style*="color:#fff"], [style*="color: #fff"],
        [style*="color:#e5e5e5"], [style*="color: #e5e5e5"] {
            color: var(--text) !important;
        }

        [style*="color:#a3a3a3"], [style*="color: #a3a3a3"] {
            color: var(--muted) !important;
        }

        [style*="background:#262626"], [style*="background: #262626"] {
            background: var(--panel-alt) !important;
        }

        [style*="background:#22c55e"], [style*="background: #22c55e"] {
            background: #dcefe1 !important;
            color: var(--success) !important;
            border-color: #b9d9c1 !important;
        }

        [style*="color:#60a5fa"], [style*="color: #60a5fa"],
        [style*="color:#2563eb"], [style*="color: #2563eb"] {
            color: var(--accent) !important;
        }

        [style*="color:#22c55e"], [style*="color: #22c55e"] {
            color: var(--success) !important;
        }

        [style*="background:#2563eb"], [style*="background: #2563eb"] {
            background: var(--accent) !important;
        }

        @media print {
            @page {
                size: landscape;
                margin: 12mm;
            }

            body.reporte-impresion {
                background: #fff !important;
                color: #111 !important;
            }

            body.reporte-impresion .topbar,
            body.reporte-impresion .sidebar-buttons,
            body.reporte-impresion .modal-overlay,
            body.reporte-impresion .no-print {
                display: none !important;
            }

            body.reporte-impresion .workspace,
            body.reporte-impresion .main-panel {
                display: block !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                border: 0 !important;
                box-shadow: none !important;
            }

            body.reporte-impresion .panel-header h2,
            body.reporte-impresion .panel-header p {
                color: #111 !important;
            }

            body.reporte-impresion .summary-box,
            body.reporte-impresion .report-total-card,
            body.reporte-impresion .table-container,
            body.reporte-impresion table.data-table th,
            body.reporte-impresion table.data-table td,
            body.reporte-impresion .summary-row {
                background: #fff !important;
                color: #111 !important;
                border-color: #aaa !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Sistema MRX - Módulo de Ventas y Cotizaciones</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">MÓDULOS DE VENTAS Y COTIZACIONES</div>
                <button class="nav-btn active" onclick="cambiarModulo('consulta_stock', this)">
                    🔍 Consultar Disponibilidad
                </button>
                <button class="nav-btn" onclick="cambiarModulo('cotizacion', this)">
                    📋 Cotización de Productos
                </button>
                <button class="nav-btn" onclick="cambiarModulo('venta', this)">
                    🛒 Venta de Productos
                </button>
                <button class="nav-btn" onclick="cambiarModulo('historial_cotizaciones', this)">
                    📄 Historial de Cotizaciones
                </button>
                <button class="nav-btn" onclick="cambiarModulo('historial_ventas', this)">
                    📜 Historial de Ventas
                </button>
                <button class="nav-btn" onclick="cambiarModulo('corte_caja', this)">
                    🧾 Corte de Caja
                </button>
            </div>

            <div class="main-panel" id="panel-contenido">
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalTicketTitulo">Detalle del Registro</h2>
                <p id="modalTicketFecha">Fecha de emisión</p>
            </div>
            <div class="summary-box" id="modalDetalleContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;" id="modalAcciones">
            </div>
        </div>
    </div>

    <script>
        function esc(valor) {
            return String(valor == null ? '' : valor).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function mismoId(a, b) { return String(a) === String(b); }

        function redondear(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }

        function dineroTexto(n) { return '$' + Number(n || 0).toFixed(2) + ' MXN'; }

        function formatearMoneda(importe) {
            return new Intl.NumberFormat('es-MX', {
                style: 'currency',
                currency: 'MXN'
            }).format(Number(importe) || 0);
        }

        function fechaLocalISO(fecha) {
            const anio = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const dia = String(fecha.getDate()).padStart(2, '0');
            return `${anio}-${mes}-${dia}`;
        }

        function fechaVentaISO(texto) {
            const t = String(texto || '').trim();
            let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) return `${m[1]}-${m[2]}-${m[3]}`;
            return '';
        }

        function formatoFechaISO(iso) {
            const d = new Date(`${iso}T12:00:00`);
            return Number.isNaN(d.getTime()) ? esc(iso) : d.toLocaleDateString('es-MX');
        }

        function formatoFechaHora(ms) {
            const d = new Date(Number(ms));
            return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString('es-MX');
        }

        async function api(url, opciones) {
            const resp = await fetch(url, opciones);
            let datos = null;
            try { datos = await resp.json(); } catch (e) { datos = null; }
            if (!resp.ok) {
                throw new Error((datos && datos.message) || ('Error del servidor (' + resp.status + ')'));
            }
            return datos;
        }

        function enviar(metodo, url, cuerpo) {
            return api(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: cuerpo ? JSON.stringify(cuerpo) : undefined
            });
        }

        let catalogoProductos = [];
        let historialRegistros = [];
        let cajaPendiente = null;
        let cortesHistorial = [];
        let fondoCaja = 0;
        let rangoCorte = null;

        let itemsVentaActual = [];
        let itemsCotizacionActual = [];

                rangoCorte = { desde: desde, hasta: hasta };

                api(url),
                api('/api/caja/cortes'),
                api('/api/caja/fondo')
            ]);

            cajaPendiente = {
                cantidad: Number(pendiente.cantidad),

                efectivo: Number(pendiente.efectivo),
                tarjeta: Number(pendiente.tarjeta),
                transferencia: Number(pendiente.transferencia),
                ventas: (pendiente.ventas || []).map(v => ({
                    id: v.id,
                    folio: v.folio_numero,
                    cliente: v.cliente,
                    pago: v.pago,

                    badgeStock = `<span class="badge-stock-low">⚠️ Poco Stock (${p.stock} pzas)</span>`;

                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function enviarAOperacion(prodId, destino) {
            const producto = catalogoProductos.find(p => mismoId(p.id, prodId));
            if (!producto) return;

            if (destino === 'cotizacion') {
                const existe = itemsCotizacionActual.find(i => mismoId(i.id, prodId));
                if (existe) existe.cantidad++;
                else itemsCotizacionActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: 1 });

                cambiarModulo('cotizacion', document.querySelectorAll('.nav-btn')[1]);
            } else if (destino === 'venta') {
                const existe = itemsVentaActual.find(i => mismoId(i.id, prodId));
                if (existe) {
                    if (existe.cantidad + 1 > producto.stock) {
                        alert(`⚠️ Supera el stock disponible (${producto.stock} pzas).`);
                        return;
                    }
                    existe.cantidad++;
                } else {
                    itemsVentaActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: 1 });
                }

                cambiarModulo('venta', document.querySelectorAll('.nav-btn')[2]);
            }
        }

            const campo = document.getElementById('ventaMontoRecibido');

        function actualizarCambioVenta() {
            const lblCambio = document.getElementById('lblCambio');
            const lblTitulo = document.getElementById('lblCambioTitulo');
            const lblRecibido = document.getElementById('lblRecibido');
            const campo = document.getElementById('ventaMontoRecibido');
            const selectPago = document.getElementById('ventaMetodoPago');
            if (!lblCambio || !lblTitulo || !lblRecibido || !campo || !selectPago) return;

            const total = totalVentaActual;
            const esEfectivo = selectPago.value === 'Efectivo';

            campo.readOnly = !esEfectivo;
            if (!esEfectivo) {
                campo.value = total > 0 ? total.toFixed(2) : '';
            }

            const capturado = campo.value !== '';
            const recibido = redondear(parseFloat(campo.value) || 0);
            lblRecibido.innerText = dineroTexto(recibido);

            if (capturado && recibido < total) {
                lblTitulo.innerText = 'Faltan por Cobrar:';
                lblCambio.innerText = dineroTexto(redondear(total - recibido));
                lblCambio.className = 'cambio-falta';
            } else {
                lblTitulo.innerText = 'Cambio a Entregar:';
                lblCambio.innerText = dineroTexto(capturado ? redondear(recibido - total) : 0);
                lblCambio.className = 'cambio-ok';
            }
        }

        function filtrarSelectProductos(selectId, query) {
            const select = document.getElementById(selectId);
            if (!select) return;

            const q = query.toLowerCase().trim();
            const filtrados = catalogoProductos.filter(p =>
                p.sku.toLowerCase().includes(q) || p.nombre.toLowerCase().includes(q));

            if (filtrados.length === 0) {
                select.innerHTML = `<option value="">Sin coincidencias</option>`;
                return;
            }

            select.innerHTML = filtrados.map(p =>
                `<option value="${p.id}">[${esc(p.sku)}] ${esc(p.nombre)} - $${p.precio.toFixed(2)} (Stock: ${p.stock} pzas)</option>`
            ).join('');
        }

        function agregarProductoAVenta() {
            const select = document.getElementById('selectVentaProducto');
            if (!select || !select.value) return;

            const prodId = select.value;
            const cantidad = parseInt(document.getElementById('ventaCantidadInput').value) || 1;
            const producto = catalogoProductos.find(p => mismoId(p.id, prodId));

            if (producto) {
                if (cantidad > producto.stock) {
                    alert(`⚠️ Stock insuficiente. Disponibles: ${producto.stock} pzas.`);
                    return;
                }
                const existe = itemsVentaActual.find(item => mismoId(item.id, prodId));
                if (existe) {
                    if ((existe.cantidad + cantidad) > producto.stock) {
                        alert(`⚠️ Supera el stock disponible (${producto.stock} pzas).`);
                        return;
                    }
                    existe.cantidad += cantidad;
                } else {
                    itemsVentaActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: cantidad });
                }
                actualizarTablaVenta();
            }
        }

        function modificarCantidadVenta(id, delta) {
            const item = itemsVentaActual.find(i => mismoId(i.id, id));
            const prodReal = catalogoProductos.find(p => mismoId(p.id, id));
            if (item) {
                if (delta > 0 && prodReal && item.cantidad + delta > prodReal.stock) {
                    alert(`⚠️ Stock máximo alcanzado (${prodReal.stock} pzas).`);
                    return;
                }
                item.cantidad += delta;
                if (item.cantidad <= 0) removerItemVenta(id);
                else actualizarTablaVenta();
            }
        }

        function removerItemVenta(id) {
            itemsVentaActual = itemsVentaActual.filter(item => !mismoId(item.id, id));
            actualizarTablaVenta();
        }

        function actualizarTablaVenta() {
            const contenedor = document.getElementById('listaItemsVenta');
            if (!contenedor) return;

            if (itemsVentaActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No hay productos agregados.</p>';
                document.getElementById('lblSubtotal').innerText = '$0.00 MXN';
                document.getElementById('lblIva').innerText = '$0.00 MXN';
                document.getElementById('lblTotal').innerText = '$0.00 MXN';
                totalVentaActual = 0;
                actualizarCambioVenta();
                return;
            }

            let suma = 0;
            contenedor.innerHTML = itemsVentaActual.map(item => {
                const importe = item.precio * item.cantidad;
                suma += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#4ade80; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${esc(item.sku)}</span>

                            <span style="margin-left:8px;">
                                <button class="qty-btn" type="button" onclick="modificarCantidadVenta('${item.id}', -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" type="button" onclick="modificarCantidadVenta('${item.id}', 1)">+</button>
                            </span>
                            <button type="button" class="btn-remove-item" onclick="removerItemVenta('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>
                `;
            }).join('');

            const subtotal = redondear(suma);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);
            totalVentaActual = total;

            document.getElementById('lblSubtotal').innerText = dineroTexto(subtotal);
            document.getElementById('lblIva').innerText = dineroTexto(iva);
            document.getElementById('lblTotal').innerText = dineroTexto(total);
            actualizarCambioVenta();
        }

        async function procesarVenta(event) {
            event.preventDefault();
            const cliente = document.getElementById('ventaCliente').value.trim();
            const pago = document.getElementById('ventaMetodoPago').value;

            if (itemsVentaActual.length === 0) {
                alert('Agrega al menos un producto a la venta.');
                return;
            }

            let subtotal = 0;
            const detalle = itemsVentaActual.map(item => {
                const importe = redondear(item.precio * item.cantidad);
                subtotal += importe;
                return {
                    producto_id: String(item.id),
                    producto: item.nombre,
                    cantidad: item.cantidad,
                    precio: item.precio,
                    importe: importe
                };
            });
            subtotal = redondear(subtotal);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);

            const campoRecibido = document.getElementById('ventaMontoRecibido');
            const esEfectivo = pago === 'Efectivo';
            const recibido = redondear(parseFloat(campoRecibido.value));

            if (esEfectivo && (!Number.isFinite(recibido) || recibido < total)) {
                alert('El monto recibido es menor al total a cobrar. Captura el monto con el que paga el cliente.');
                campoRecibido.focus();
                return;
            }

            const cambio = esEfectivo ? redondear(recibido - total) : 0;

            const boton = document.getElementById('btnProcesarVenta');
            if (boton) boton.disabled = true;

            try {
                await enviar('POST', '/api/ventas', {
                    tipo: 'VENTA',
                    cliente: cliente || 'Cliente General',
                    pago: pago,
                    fecha: new Date().toLocaleDateString('es-MX'),
                    subtotal, iva, total,
                    monto_recibido: esEfectivo ? recibido : total,
                    cotizacion_id: idCotizacionEnProceso,
                    detalle
                });

                idCotizacionEnProceso = null;
                folioCotizacionEnProceso = null;

                const alerta = document.getElementById('alertaVenta');
                alerta.innerText = esEfectivo
                    ? `✓ Venta registrada. Recibido: ${dineroTexto(recibido)} | Cambio a entregar: ${dineroTexto(cambio)}`
                    : '✓ Venta registrada exitosamente y stock actualizado.';
                alerta.style.display = 'block';
                setTimeout(() => {
                    itemsVentaActual = [];
                    cambiarModulo('venta');
                }, 3500);
            } catch (e) {
                if (boton) boton.disabled = false;
                alert('No se pudo registrar la venta: ' + e.message);
                try { await cargarCatalogo(); filtrarSelectProductos('selectVentaProducto', ''); } catch (_) {}
            }
        }

                <div id="alertaCotizacion" class="alert-box">✓ Cotización registrada en el historial.</div>
            `;

            filtrarSelectProductos('selectCotizacionProducto', '');
            actualizarTablaCotizacion();
        }

        function agregarProductoACotizacion() {
            const select = document.getElementById('selectCotizacionProducto');
            if (!select || !select.value) return;

            const prodId = select.value;
            const cantidad = parseInt(document.getElementById('cotizacionCantidad').value) || 1;
            const producto = catalogoProductos.find(p => mismoId(p.id, prodId));

            if (producto) {
                const existe = itemsCotizacionActual.find(item => mismoId(item.id, prodId));
                if (existe) existe.cantidad += cantidad;
                else itemsCotizacionActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: cantidad });
                actualizarTablaCotizacion();
            }
        }

        function modificarCantidadCotizacion(id, delta) {
            const item = itemsCotizacionActual.find(i => mismoId(i.id, id));
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) removerItemCotizacion(id);
                else actualizarTablaCotizacion();
            }
        }

        function removerItemCotizacion(id) {
            itemsCotizacionActual = itemsCotizacionActual.filter(item => !mismoId(item.id, id));
            actualizarTablaCotizacion();
        }

        function actualizarTablaCotizacion() {
            const contenedor = document.getElementById('listaItemsCotizacion');
            if (!contenedor) return;

            if (itemsCotizacionActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No hay productos agregados.</p>';
                document.getElementById('lblSubtotalCotiz').innerText = '$0.00 MXN';
                document.getElementById('lblIvaCotiz').innerText = '$0.00 MXN';
                document.getElementById('lblTotalCotiz').innerText = '$0.00 MXN';
                return;
            }

            let subtotal = 0;
            contenedor.innerHTML = itemsCotizacionActual.map(item => {
                const importe = item.precio * item.cantidad;
                subtotal += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#60a5fa; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${esc(item.sku)}</span>
                            <strong style="color:#ffffff;">${esc(item.nombre)}</strong>
                            <span style="margin-left:8px;">
                                <button class="qty-btn" type="button" onclick="modificarCantidadCotizacion('${item.id}', -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" type="button" onclick="modificarCantidadCotizacion('${item.id}', 1)">+</button>
                            </span>
                            <button type="button" class="btn-remove-item" onclick="removerItemCotizacion('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>
                `;
            }).join('');

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            document.getElementById('lblSubtotalCotiz').innerText = '$' + subtotal.toFixed(2) + ' MXN';
            document.getElementById('lblIvaCotiz').innerText = '$' + iva.toFixed(2) + ' MXN';
            document.getElementById('lblTotalCotiz').innerText = '$' + total.toFixed(2) + ' MXN';
        }

        async function guardarCotizacion() {
            const cliente = document.getElementById('cotizacionCliente').value.trim() || 'Cliente General';
            if (itemsCotizacionActual.length === 0) {
                alert('Agrega al menos un producto a la cotización.');
                return;
            }

            let subtotal = 0;
            const detalle = itemsCotizacionActual.map(item => {
                const importe = redondear(item.precio * item.cantidad);
                subtotal += importe;
                return {
                    producto_id: String(item.id),
                    producto: item.nombre,
                    cantidad: item.cantidad,
                    precio: item.precio,
                    importe: importe
                };
            });
            subtotal = redondear(subtotal);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);

            const boton = document.getElementById('btnGuardarCotizacion');
            if (boton) boton.disabled = true;

            try {
                await enviar('POST', '/api/ventas', {
                    tipo: 'COTIZACION',
                    cliente: cliente,
                    pago: 'Presupuesto',
                    fecha: new Date().toLocaleDateString('es-MX'),
                    subtotal, iva, total,
                    detalle
                });

                const alerta = document.getElementById('alertaCotizacion');
                alerta.style.display = 'block';
                setTimeout(() => {
                    itemsCotizacionActual = [];
                    cambiarModulo('cotizacion');
                }, 1500);
            } catch (e) {
                if (boton) boton.disabled = false;
                alert('No se pudo guardar la cotización: ' + e.message);
            }
        }

        function htmlListaHistorial(registros) {
            return registros.map(t => {

                return `
                    <div class="ticket-item" onclick="abrirDetalleModal(${t.id})">

                            <div class="ticket-title">
                                #${esc(t.folio)} - ${esc(t.cliente)}
                                <span class="${isCotiz ? 'badge-cotizacion' : 'badge-venta'}">${etiquetaTipo(t.tipo)}</span>
                            </div>
                            <div class="ticket-sub">Fecha: ${esc(t.fecha)} | Cantidad de productos: ${t.items.length} item(s)</div>
                        </div>
                        <div class="ticket-price" style="color:${isCotiz ? '#60a5fa' : '#22c55e'};">$${t.total.toFixed(2)} MXN</div>
                    </div>
                `;
            }).join('');
        }

        function renderizarHistorial(tipoFiltro) {
            const panel = document.getElementById('panel-contenido');
            const registrosFiltrados = historialRegistros.filter(r => r.tipo === tipoFiltro);
            const itemsHTML = htmlListaHistorial(registrosFiltrados);

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Historial de ${tipoFiltro === 'VENTA' ? 'Ventas' : 'Cotizaciones'}</h2>

                </div>

                <div class="input-group">
                    <label>Buscar por Folio o Cliente</label>

                    ${itemsHTML.length > 0 ? itemsHTML : '<p style="color:#a3a3a3; text-align:center; padding:20px;">No se encontraron registros.</p>'}

            `;
        }

        function filtrarListaHistorial(query, tipoFiltro) {
            const q = query.toLowerCase().replace('#', '').trim();
            const filtrados = historialRegistros.filter(t =>
                t.tipo === tipoFiltro &&
                (String(t.folio).includes(q) || t.cliente.toLowerCase().includes(q)));

            const html = htmlListaHistorial(filtrados);
            document.getElementById('contenedorListaHistorial').innerHTML =
                html.length > 0 ? html : '<p style="color:#a3a3a3; text-align:center; padding:20px;">No hay coincidencias.</p>';
        }

        function mostrarHistorialVentas(fechaInicio, fechaFin) {
            const hoy = fechaLocalISO(new Date());
            const inicio = fechaInicio || (rangoVentas ? rangoVentas.inicio : hoy);
            const fin = fechaFin || (rangoVentas ? rangoVentas.fin : hoy);
            rangoVentas = { inicio, fin };

            const ventas = historialRegistros
                .filter(r => {
                    if (r.tipo !== 'VENTA') return false;
                    const f = fechaVentaISO(r.fecha);
                    return f !== '' && f >= inicio && f <= fin;
                })
                .sort((a, b) => {
                    const fa = fechaVentaISO(a.fecha);
                    const fb = fechaVentaISO(b.fecha);
                    if (fa !== fb) return fb.localeCompare(fa);
                    return Number(b.id) - Number(a.id);
                });

            const totalPeriodo = ventas.reduce((suma, v) => suma + v.total, 0);
            const subtotalPeriodo = ventas.reduce((suma, v) => suma + v.subtotal, 0);
            const ivaPeriodo = ventas.reduce((suma, v) => suma + v.iva, 0);

            const totalesPorDia = new Map();
            const totalesPorPago = new Map();
            ventas.forEach(v => {
                const dia = fechaVentaISO(v.fecha);
                const registroDia = totalesPorDia.get(dia) || { cantidad: 0, total: 0 };
                registroDia.cantidad++;
                registroDia.total += v.total;
                totalesPorDia.set(dia, registroDia);

                const metodo = v.pago || 'Sin especificar';
                const registroPago = totalesPorPago.get(metodo) || { cantidad: 0, total: 0 };
                registroPago.cantidad++;
                registroPago.total += v.total;
                totalesPorPago.set(metodo, registroPago);
            });

            const filasDiarias = [...totalesPorDia.entries()]
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([dia, registro]) => `
                    <tr>
                        <td>${formatoFechaISO(dia)}</td>
                        <td>${registro.cantidad}</td>
                        <td>${formatearMoneda(registro.total)}</td>
                    </tr>
                `).join('');

            const filasPago = [...totalesPorPago.entries()]
                .sort(([, a], [, b]) => b.total - a.total)
                .map(([metodo, registro]) => `
                    <tr>
                        <td>${esc(metodo)}</td>
                        <td>${registro.cantidad}</td>
                        <td>${formatearMoneda(registro.total)}</td>
                    </tr>
                `).join('');

            const filasVentas = ventas.map(v => {
                const detalle = v.items.map(it =>
                    `${esc(it.producto)} (${it.cantidad} × ${formatearMoneda(it.precio)}) — ${formatearMoneda(it.precio * it.cantidad)}`
                ).join('<br>');
                return `
                    <tr>
                        <td>${esc(v.fecha)}</td>
                        <td>#${esc(v.folio)}</td>
                        <td>${esc(v.cliente)}</td>
                        <td>${detalle}</td>
                        <td>${esc(v.pago)}</td>
                        <td>${formatearMoneda(v.subtotal)}<br>IVA: ${formatearMoneda(v.iva)}</td>
                        <td><strong>${formatearMoneda(v.total)}</strong></td>
                        <td class="no-print"><button type="button" class="btn-add-item" onclick="abrirDetalleModal(${v.id})">🔍 Detalle</button></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('panel-contenido').innerHTML = `
                <div class="panel-header">
                    <h2>Historial de Ventas</h2>
                    <p class="no-print">Elige un periodo para consultar las ventas. Usa Imprimir / Guardar PDF para descargar el reporte como PDF.</p>
                    <p>Periodo del reporte: ${formatoFechaISO(inicio)} al ${formatoFechaISO(fin)}</p>
                </div>
                <div class="summary-box no-print" style="margin-top:0;">
                    <div class="report-filter-actions">
                        <div class="input-group" style="margin:0;">
                            <label for="ventasFechaInicio">Desde</label>
                            <input type="date" id="ventasFechaInicio" value="${esc(inicio)}">
                        </div>
                        <div class="input-group" style="margin:0;">
                            <label for="ventasFechaFin">Hasta</label>
                            <input type="date" id="ventasFechaFin" value="${esc(fin)}">
                        </div>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoVentas('hoy')">Hoy</button>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoVentas('semana')">Esta semana</button>
                        <button type="button" class="btn-secondary" onclick="aplicarFiltroVentas()">Aplicar fechas</button>
                        <button type="button" class="btn-action" style="margin-top:0; width:auto;" onclick="imprimirReporte()">Imprimir / Guardar PDF</button>
                    </div>
                </div>
                <div class="report-summary-grid">
                    <div class="report-total-card">Ventas en el periodo<strong>${ventas.length}</strong></div>
                    <div class="report-total-card">Total vendido<strong>${formatearMoneda(totalPeriodo)}</strong></div>
                    <div class="report-total-card">Subtotal sin IVA<strong>${formatearMoneda(subtotalPeriodo)}</strong></div>
                    <div class="report-total-card">IVA<strong>${formatearMoneda(ivaPeriodo)}</strong></div>
                </div>
                <div class="summary-box">
                    <h3>Resumen diario</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Día</th><th>Ventas</th><th>Total vendido</th></tr></thead>
                            <tbody>${filasDiarias || '<tr><td colspan="3" style="text-align:center;">No hay ventas para este periodo.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
                <div class="summary-box">
                    <h3>Resumen por método de pago</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Método de pago</th><th>Ventas</th><th>Total</th></tr></thead>
                            <tbody>${filasPago || '<tr><td colspan="3" style="text-align:center;">No hay ventas para este periodo.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
                <div class="summary-box">
                    <h3>Detalle de ventas realizadas</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Fecha</th><th>Folio</th><th>Cliente</th><th>Productos</th><th>Método de pago</th><th>Subtotal / IVA</th><th>Total</th><th class="no-print">Acciones</th></tr></thead>
                            <tbody>${filasVentas || '<tr><td colspan="8" style="text-align:center;">No hay ventas para este periodo.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function seleccionarPeriodoVentas(periodo) {
            const hoy = new Date();
            const inicio = new Date(hoy);
            const fin = new Date(hoy);
            if (periodo === 'semana') {
                const diasDesdeLunes = (hoy.getDay() + 6) % 7;
                inicio.setDate(hoy.getDate() - diasDesdeLunes);
                fin.setDate(inicio.getDate() + 6);
            }
            mostrarHistorialVentas(fechaLocalISO(inicio), fechaLocalISO(fin));
        }

        function aplicarFiltroVentas() {
            const fechaInicio = document.getElementById('ventasFechaInicio').value;
            const fechaFin = document.getElementById('ventasFechaFin').value;
            if (!fechaInicio || !fechaFin || fechaInicio > fechaFin) {
                alert('Selecciona un rango válido: la fecha inicial debe ser igual o anterior a la fecha final.');
                return;
            }
            mostrarHistorialVentas(fechaInicio, fechaFin);
        }

        function imprimirReporte() {
            document.body.classList.add('reporte-impresion');
            window.print();
            window.setTimeout(() => document.body.classList.remove('reporte-impresion'), 500);
        }

                            <label>Efectivo Contado en Caja ($ MXN)</label>
                            <input type="number" id="corteContado" min="0" step="0.01" placeholder="Ej. 1500.00" oninput="actualizarCalculoCorte()" required>
                        </div>
                    </div>
                    <div class="input-group">

                    <div class="summary-box">

                            🧮 Cuadre de Efectivo
                        </h3>
                        <div class="summary-row"><span>Fondo de caja:</span><span id="lblCorteFondo">${dineroTexto(fondoCaja)}</span></div>
                        <div class="summary-row"><span>Ventas en efectivo:</span><span id="lblCorteEfectivo">${dineroTexto(c.efectivo)}</span></div>

                    <button type="submit" class="btn-action" id="btnRealizarCorte">Realizar Corte de Caja</button>

                            <tbody>${filasPendientes}</tbody>

            document.getElementById('panel-contenido').innerHTML = `

                            <tbody>${filasCortes || '<tr><td colspan="9" style="text-align:center;">Aún no se ha realizado ningún corte.</td></tr>'}</tbody>
                        </table>

        function actualizarCalculoCorte() {
            const campoRetiros = document.getElementById('corteRetiros');
            const campoContado = document.getElementById('corteContado');
            if (!campoRetiros || !campoContado || !cajaPendiente) return;

            const fondo = redondear(fondoCaja);
            const retiros = redondear(parseFloat(campoRetiros.value) || 0);
            const contado = redondear(parseFloat(campoContado.value) || 0);
            const capturado = campoContado.value !== '';
            const esperado = redondear(fondo + cajaPendiente.efectivo - retiros);
            const diferencia = redondear(contado - esperado);

            document.getElementById('lblCorteFondo').innerText = dineroTexto(fondo);
            document.getElementById('lblCorteRetiros').innerText = dineroTexto(retiros);
            document.getElementById('lblCorteEsperado').innerText = dineroTexto(esperado);
            document.getElementById('lblCorteContado').innerText = dineroTexto(contado);

            const titulo = document.getElementById('lblCorteDifTitulo');
            const valor = document.getElementById('lblCorteDif');
            if (!capturado) {
                titulo.innerText = 'Diferencia:';
                valor.innerText = dineroTexto(0);
                valor.className = 'cambio-ok';
            } else if (diferencia === 0) {
                titulo.innerText = 'Caja cuadrada:';
                valor.innerText = dineroTexto(0);
                valor.className = 'cambio-ok';
            } else if (diferencia > 0) {
                titulo.innerText = 'Sobrante:';
                valor.innerText = dineroTexto(diferencia);
                valor.className = 'cambio-ok';
            } else {
                titulo.innerText = 'Faltante:';
                valor.innerText = dineroTexto(Math.abs(diferencia));
                valor.className = 'cambio-falta';
            }
        }

        async function realizarCorte(event) {
            event.preventDefault();

            const responsable = document.getElementById('corteResponsable').value.trim();
            const fondo = redondear(fondoCaja);
            const retiros = redondear(parseFloat(document.getElementById('corteRetiros').value) || 0);
            const contadoTexto = document.getElementById('corteContado').value;
            const contado = redondear(parseFloat(contadoTexto));

            if (!responsable) {
                alert('Escribe el nombre del responsable del corte.');
                return;
            }
            if (contadoTexto === '' || !Number.isFinite(contado) || contado < 0) {
                alert('Captura el efectivo contado en caja.');
                return;
            }
            if (retiros < 0) {
                alert('Los montos no pueden ser negativos.');
                return;
            }

            const esperado = redondear(fondo + cajaPendiente.efectivo - retiros);
            const diferencia = redondear(contado - esperado);
            const textoDiferencia = diferencia === 0
                ? 'La caja está cuadrada.'
                : (diferencia > 0 ? `Hay un sobrante de ${dineroTexto(diferencia)}.` : `Hay un faltante de ${dineroTexto(Math.abs(diferencia))}.`);
            const textoPeriodo = rangoCorte
                ? `del ${formatoFechaISO(rangoCorte.desde)} al ${formatoFechaISO(rangoCorte.hasta)}`
                : 'de todo lo pendiente';

            if (!confirm(`¿Realizar el corte ${textoPeriodo} con ${cajaPendiente.cantidad} venta(s) por ${dineroTexto(cajaPendiente.total)}?\n\n${textoDiferencia}\n\nEl corte no se puede modificar después.`)) {
                return;
            }

            const boton = document.getElementById('btnRealizarCorte');
            if (boton) boton.disabled = true;

            const cuerpo = {
                responsable,
                retiros,
                efectivo_contado: contado,
                observaciones: document.getElementById('corteObs').value.trim()
            };
            if (rangoCorte) {
                cuerpo.desde = rangoCorte.desde;
                cuerpo.hasta = rangoCorte.hasta;
            }

            try {
                const corte = await enviar('POST', '/api/caja/cortes', cuerpo);
                mostrarCorte(corte, true);
            } catch (e) {
                if (boton) boton.disabled = false;
                alert('No se pudo realizar el corte: ' + e.message);
                cambiarModulo('corte_caja');
            }
        }

        async function verCorte(id) {
            try {
                const corte = await api('/api/caja/cortes/' + id);
                mostrarCorte(corte, false);
            } catch (e) {
                alert('No se pudo cargar el corte: ' + e.message);
            }
        }

        function mostrarCorte(k, recien) {
            const ventas = k.ventas || [];
            const dif = Number(k.diferencia);
            const etiquetaDif = dif === 0 ? 'Caja cuadrada' : (dif > 0 ? 'Sobrante' : 'Faltante');

            const filas = ventas.map(v => {
                const esEfectivo = v.pago === 'Efectivo' && Number(v.monto_recibido || 0) > 0;
                return `
                    <tr>
                        <td>#${esc(v.folio_numero)}</td>
                        <td>${esc(v.fecha)}</td>
                        <td>${esc(v.cliente)}</td>
                        <td>${esc(v.pago)}</td>
                        <td><strong>${formatearMoneda(v.total)}</strong></td>
                        <td>${esEfectivo ? formatearMoneda(v.monto_recibido) : '—'}</td>
                        <td>${esEfectivo ? formatearMoneda(v.cambio) : '—'}</td>
                    </tr>
                `;
            }).join('');

            document.getElementById('panel-contenido').innerHTML = `
                <div class="panel-header">
                    <h2>Corte de Caja #${esc(k.id)}</h2>
                    <p>Fecha y hora del corte: ${esc(formatoFechaHora(k.fecha_corte))} | Responsable: ${esc(k.responsable)}</p>
                </div>
                ${recien ? '<div class="alert-box no-print" style="display:block; margin-top:0;">✓ Corte de caja registrado correctamente. Las ventas incluidas ya no aparecerán como pendientes.</div>' : ''}
                <div class="summary-box no-print" style="margin-top:15px;">
                    <div class="report-filter-actions">
                        <button type="button" class="btn-action" style="margin-top:0; width:auto;" onclick="imprimirReporte()">Imprimir / Guardar PDF</button>
                        <button type="button" class="btn-secondary" onclick="cambiarModulo('corte_caja')">← Volver a Corte de Caja</button>
                    </div>
                </div>
                <div class="report-summary-grid">
                    <div class="report-total-card">Ventas incluidas<strong>${esc(k.num_ventas)}</strong></div>
                    <div class="report-total-card">Total vendido<strong>${formatearMoneda(k.total_ventas)}</strong></div>
                    <div class="report-total-card">Efectivo<strong>${formatearMoneda(k.ventas_efectivo)}</strong></div>
                    <div class="report-total-card">Tarjeta<strong>${formatearMoneda(k.ventas_tarjeta)}</strong></div>
                    <div class="report-total-card">Transferencia<strong>${formatearMoneda(k.ventas_transferencia)}</strong></div>
                </div>
                <div class="summary-box">
                    <h3>Cuadre de efectivo</h3>
                    <div class="summary-row"><span>Fondo de caja:</span><span>${formatearMoneda(k.fondo_inicial)}</span></div>
                    <div class="summary-row"><span>Ventas en efectivo:</span><span>${formatearMoneda(k.ventas_efectivo)}</span></div>
                    <div class="summary-row"><span>Retiros:</span><span>${formatearMoneda(k.retiros)}</span></div>
                    <div class="summary-row total"><span>Efectivo esperado en caja:</span><span>${formatearMoneda(k.efectivo_esperado)}</span></div>
                    <div class="summary-row"><span>Efectivo contado:</span><span>${formatearMoneda(k.efectivo_contado)}</span></div>
                    <div class="summary-row total"><span>${etiquetaDif}:</span><span class="${dif < 0 ? 'cambio-falta' : 'cambio-ok'}">${formatearMoneda(Math.abs(dif))}</span></div>
                    <div class="summary-row"><span>Observaciones:</span><span>${esc(k.observaciones || '—')}</span></div>
                </div>
                <div class="summary-box">
                    <h3>Ventas incluidas en el corte</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Método de pago</th><th>Total</th><th>Recibido</th><th>Cambio</th></tr></thead>
                            <tbody>${filas || '<tr><td colspan="7" style="text-align:center;">Sin ventas.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function abrirDetalleModal(id) {
            const reg = historialRegistros.find(t => mismoId(t.id, id));
            if (!reg) return;

            registroSeleccionadoId = reg.id;
            document.getElementById('modalTicketTitulo').innerText = `${etiquetaTipo(reg.tipo)} #${reg.folio} - ${reg.cliente}`;
            document.getElementById('modalTicketFecha').innerText = `Fecha: ${reg.fecha} | Estado: ${reg.pago}`;

            const itemsDesglose = reg.items.map(it => `
                <div class="summary-row">
                    <span>${esc(it.producto)} (x${it.cantidad})</span>
                    <span>$${(it.precio * it.cantidad).toFixed(2)} MXN</span>
                </div>
            `).join('');

            const colorTotal = reg.tipo === 'COTIZACION' ? '#60a5fa' : '#22c55e';
            const esEfectivo = reg.tipo === 'VENTA' && reg.pago === 'Efectivo' && reg.recibido > 0;
            document.getElementById('modalDetalleContenido').innerHTML = `
                <h4 style="font-size:0.85rem; color:#a3a3a3; margin-bottom:8px;">Detalle de ítems:</h4>
                ${itemsDesglose}
                <div class="summary-row" style="margin-top:10px; border-top:1px solid #262626; padding-top:8px;">
                    <span>Subtotal:</span><span>$${reg.subtotal.toFixed(2)} MXN</span>
                </div>
                <div class="summary-row"><span>IVA (16%):</span><span>$${reg.iva.toFixed(2)} MXN</span></div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span style="color:${colorTotal};">$${reg.total.toFixed(2)} MXN</span>
                </div>
                ${esEfectivo ? `
                    <div class="summary-row"><span>Monto recibido:</span><span>${dineroTexto(reg.recibido)}</span></div>
                    <div class="summary-row"><span>Cambio entregado:</span><span>${dineroTexto(reg.cambio)}</span></div>
                ` : ''}
                ${reg.tipo === 'VENTA' && reg.corteId ? `<div class="summary-row"><span>Incluida en el corte:</span><span>#${esc(reg.corteId)}</span></div>` : ''}
            `;

            const acciones = document.getElementById('modalAcciones');
            const botonEliminar = (reg.tipo === 'VENTA' && reg.corteId)
                ? ''
                : '<button class="btn-danger" onclick="eliminarRegistroModal()">🗑️ Eliminar</button>';

            if (reg.tipo === 'COTIZACION') {
                acciones.innerHTML = `
                    <button class="btn-convert" onclick="convertirCotizacionAVenta(${reg.id})">🛒 Convertir a Venta</button>
                    ${botonEliminar}
                    <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
                `;
            } else {
                acciones.innerHTML = `
                    <button class="btn-convert" style="background:#2563eb;" onclick="generarCotizacionDesdeVenta(${reg.id})">📋 Generar Cotización desde Venta</button>
                    ${botonEliminar}
                    <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
                `;
            }

            document.getElementById('modalDetalle').style.display = 'flex';
        }

        async function convertirCotizacionAVenta(idCotiz) {
            const cotiz = historialRegistros.find(t => mismoId(t.id, idCotiz));
            if (!cotiz) return;

            try { await cargarCatalogo(); } catch (e) { alert('No se pudo cargar el catálogo: ' + e.message); return; }

            idCotizacionEnProceso = cotiz.id;
            folioCotizacionEnProceso = cotiz.folio;
            itemsVentaActual = cotiz.items.map(it => {
                const prodReal = buscarProductoDeItem(it);
                return {
                    id: prodReal ? prodReal.id : String(it.id),
                    sku: prodReal ? prodReal.sku : '—',
                    nombre: it.producto,
                    precio: it.precio,
                    cantidad: it.cantidad
                };
            });

            cerrarModal();
            await cambiarModulo('venta', document.querySelectorAll('.nav-btn')[2]);

            const c = document.getElementById('ventaCliente');
            if (c) c.value = cotiz.cliente;
        }

        async function generarCotizacionDesdeVenta(idVenta) {
            const venta = historialRegistros.find(t => mismoId(t.id, idVenta));
            if (!venta) return;

            try { await cargarCatalogo(); } catch (e) { alert('No se pudo cargar el catálogo: ' + e.message); return; }

            itemsCotizacionActual = venta.items.map(it => {
                const prodReal = buscarProductoDeItem(it);
                return {
                    id: prodReal ? prodReal.id : String(it.id),
                    sku: prodReal ? prodReal.sku : '—',
                    nombre: it.producto,
                    precio: it.precio,
                    cantidad: it.cantidad
                };
            });

            cerrarModal();
            await cambiarModulo('cotizacion', document.querySelectorAll('.nav-btn')[1]);

            const c = document.getElementById('cotizacionCliente');
            if (c) c.value = venta.cliente;
        }

        function cerrarModal() { document.getElementById('modalDetalle').style.display = 'none'; }

        async function eliminarRegistroModal() {
            const reg = historialRegistros.find(t => mismoId(t.id, registroSeleccionadoId));
            if (!reg) return;
            if (!confirm(`¿Eliminar el registro #${reg.folio}?`)) return;

            try {
                await enviar('DELETE', '/api/ventas/' + reg.id);
                cerrarModal();
                if (reg.tipo === 'VENTA') {
                    await cargarHistorial();
                    mostrarHistorialVentas();
                } else {
                    await cambiarModulo('historial_cotizaciones');
                }
            } catch (e) {
                alert('No se pudo eliminar: ' + e.message);
            }
        }

        window.onload = function() {
            cambiarModulo('consulta_stock', document.querySelector('.nav-btn'));
        };
    </script>
</body>
