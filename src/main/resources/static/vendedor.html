<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas y Cotizaciones - MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eaf3fb;
            --panel: #f8fbff;
            --panel-alt: #ebf4ff;
            --panel-soft: #f4f9ff;
            --border: #bfd6ef;
            --border-soft: #9dbfe9;
            --text: #111827;
            --muted: #476a8d;
            --accent: #5b8ec9;
            --accent-hover: #4d7fb8;
            --button-text: #f7fbff;
            --success: #4f9566;
            --danger: #c76363;
            --shadow: rgba(110, 145, 185, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d !important;
            color: #ffffff !important;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-add-item {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: #ffffff;
            color: #000000;
        }

        .qty-btn {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .ticket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 16px 20px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .ticket-item:hover {
            border-color: #404040;
            background: #262626;
        }

        .ticket-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ticket-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        .ticket-sub {
            font-size: 0.8rem;
            color: #a3a3a3;
        }

        .ticket-price {
            font-size: 1rem;
            font-weight: 700;
        }

        .badge-cotizacion {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .badge-venta {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .badge-stock-ok {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-stock-low {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-stock-empty {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 6px;
            width: 100%;
            max-width: 580px;
            padding: 25px;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger:hover { background: #b91c1c; }

        .btn-convert {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-convert:hover { background: #15803d; }

        .btn-close {
            background: transparent;
            color: #a3a3a3;
            border: 1px solid #404040;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: #262626; color: #ffffff; }

        .alert-box {
            display: none;
            padding: 14px;
            background: #1f1f1f;
            border: 1px solid #22c55e;
            color: #22c55e;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .btn-remove-item {
            color: #ef4444;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        body {
            background: var(--bg) !important;
            color: var(--text) !important;
        }

        .topbar, .sidebar-buttons, .main-panel, .modal-card {
            background: var(--panel);
            border-color: var(--border);
            color: var(--text);
        }

        .topbar h1, .panel-header h2, .summary-row.total,
        .ticket-title {
            color: var(--text);
        }

        .panel-header, .panel-header p, .sidebar-title,
        .input-group label, .summary-row, .ticket-sub {
            color: var(--muted);
        }

        .panel-header, .summary-row, .ticket-item {
            border-color: var(--border);
        }

        .nav-btn, .btn-add-item, .qty-btn, .input-group input,
        .input-group select, .summary-box, .ticket-item {
            background: var(--panel-alt);
            color: var(--text);
            border-color: var(--border-soft);
        }

        .nav-btn:hover, .btn-add-item:hover, .qty-btn:hover,
        .input-group input:focus, .input-group select:focus,
        .ticket-item:hover {
            background: #dfeeff;
            border-color: var(--accent);
            color: var(--text);
        }

        .nav-btn.active, .btn-action {
            background: var(--accent);
            color: var(--button-text);
            border-color: var(--accent);
        }

        .btn-action:hover {
            background: var(--accent-hover);
        }

        .btn-logout {
            color: var(--accent);
            border-color: var(--border-soft);
        }

        .btn-logout:hover {
            background: var(--accent);
            color: var(--button-text);
        }

        .badge-cotizacion {
            background: #edf4fc;
            color: var(--accent);
            border-color: #c5d9f0;
        }

        .badge-venta, .badge-stock-ok {
            background: #edf7ef;
            color: var(--success);
            border-color: #b9d9c1;
        }

        .badge-stock-low {
            background: #fff8e7;
            color: #9b762e;
            border-color: #ead9a9;
        }

        .badge-stock-empty, .btn-danger {
            background: #fff4f3;
            color: var(--danger);
            border-color: #e9b8b5;
        }

        .btn-convert {
            background: var(--accent);
            color: var(--button-text);
        }

        .btn-close {
            color: var(--muted);
            border-color: var(--border-soft);
        }

        .btn-close:hover {
            background: var(--panel-alt);
            color: var(--text);
        }

        .alert-box {
            background: #f0f8f1;
            border-color: var(--success);
            color: var(--success);
        }

        [style*="color:#ffffff"], [style*="color: #ffffff"],
        [style*="color:#fff"], [style*="color: #fff"],
        [style*="color:#e5e5e5"], [style*="color: #e5e5e5"] {
            color: var(--text) !important;
        }

        [style*="color:#a3a3a3"], [style*="color: #a3a3a3"] {
            color: var(--muted) !important;
        }

        [style*="background:#262626"], [style*="background: #262626"] {
            background: var(--panel-alt) !important;
        }

        [style*="background:#22c55e"], [style*="background: #22c55e"] {
            background: #dcefe1 !important;
            color: var(--success) !important;
            border-color: #b9d9c1 !important;
        }

        [style*="color:#60a5fa"], [style*="color: #60a5fa"],
        [style*="color:#2563eb"], [style*="color: #2563eb"] {
            color: var(--accent) !important;
        }

        [style*="color:#22c55e"], [style*="color: #22c55e"] {
            color: var(--success) !important;
        }

        [style*="background:#2563eb"], [style*="background: #2563eb"] {
            background: var(--accent) !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Topbar -->
        <div class="topbar">
            <h1>Sistema MRX - Módulo de Ventas y Cotizaciones</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <!-- Workspace Lateral + Panel Principal -->
        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">MÓDULOS DE VENTAS Y COTIZACIONES</div>
                <button class="nav-btn active" onclick="cambiarModulo('consulta_stock', this)">
                    🔍 Consultar Disponibilidad
                </button>
                <button class="nav-btn" onclick="cambiarModulo('cotizacion', this)">
                    📋 Cotización de Productos
                </button>
                <button class="nav-btn" onclick="cambiarModulo('venta', this)">
                    🛒 Venta de Productos
                </button>
                <button class="nav-btn" onclick="cambiarModulo('historial_cotizaciones', this)">
                    📄 Historial de Cotizaciones
                </button>
                <button class="nav-btn" onclick="cambiarModulo('historial_ventas', this)">
                    📜 Historial de Ventas
                </button>
            </div>

            <div class="main-panel" id="panel-contenido">
                <!-- Se renderizan los módulos dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Modal Emergente de Detalles -->
    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalTicketTitulo">Detalle del Registro</h2>
                <p id="modalTicketFecha">Fecha de emisión</p>
            </div>
            <div class="summary-box" id="modalDetalleContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;" id="modalAcciones">
            </div>
        </div>
    </div>

    <script>
        // ================= Utilidades =================
        function esc(valor) {
            return String(valor == null ? '' : valor).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }
        function mismoId(a, b) { return String(a) === String(b); }
        function redondear(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }

        async function api(url, opciones) {
            const resp = await fetch(url, opciones);
            let datos = null;
            try { datos = await resp.json(); } catch (e) { /* respuesta sin cuerpo */ }
            if (!resp.ok) {
                throw new Error((datos && datos.message) || ('Error del servidor (' + resp.status + ')'));
            }
            return datos;
        }

        function enviar(metodo, url, cuerpo) {
            return api(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: cuerpo ? JSON.stringify(cuerpo) : undefined
            });
        }

        // ================= Estado (datos que vienen de la base de datos) =================
        let catalogoProductos = [];
        let historialRegistros = [];

        let itemsVentaActual = [];
        let itemsCotizacionActual = [];
        let idCotizacionEnProceso = null;      // id interno de la cotización que se convierte
        let folioCotizacionEnProceso = null;   // folio visible de esa cotización
        let registroSeleccionadoId = null;

        async function cargarCatalogo() {
            const filas = await api('/api/productos');
            catalogoProductos = filas.map(p => ({
                id: String(p.id),
                sku: p.sku,
                nombre: p.nombre,
                precio: Number(p.precio),
                stock: Number(p.stock)
            }));
        }

        async function cargarHistorial() {
            const filas = await api('/api/ventas');
            historialRegistros = filas.map(r => ({
                id: r.id,
                folio: r.folio_numero,
                cliente: r.cliente,
                tipo: r.tipo,   // 'VENTA' o 'COTIZACION'
                items: (r.detalle || []).map(d => ({
                    id: d.producto_id,
                    producto: d.producto,
                    cantidad: Number(d.cantidad),
                    precio: Number(d.precio)
                })),
                subtotal: Number(r.subtotal),
                iva: Number(r.iva),
                total: Number(r.total),
                fecha: r.fecha,
                pago: r.pago
            }));
        }

        function etiquetaTipo(tipo) { return tipo === 'COTIZACION' ? 'COTIZACIÓN' : 'VENTA'; }

        function buscarProductoDeItem(it) {
            return catalogoProductos.find(p => mismoId(p.id, it.id))
                || catalogoProductos.find(p => p.nombre.toLowerCase() === String(it.producto).toLowerCase());
        }

        // ================= Navegación =================
        async function cambiarModulo(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }

            const panel = document.getElementById('panel-contenido');
            panel.innerHTML = '<div class="summary-box">Cargando...</div>';

            try {
                if (vista === 'historial_ventas' || vista === 'historial_cotizaciones') {
                    await cargarHistorial();
                } else {
                    await cargarCatalogo();
                }

                if (vista === 'consulta_stock') {
                    renderizarConsultaStock();
                } else if (vista === 'venta') {
                    renderizarModuloVenta();
                } else if (vista === 'cotizacion') {
                    renderizarModuloCotizaciones();
                } else if (vista === 'historial_ventas') {
                    renderizarHistorial('VENTA');
                } else if (vista === 'historial_cotizaciones') {
                    renderizarHistorial('COTIZACION');
                }
            } catch (e) {
                panel.innerHTML = `
                    <div class="summary-box">
                        <p>No fue posible conectar con el servidor: ${esc(e.message)}</p>
                        <p style="margin-top:8px;">Si el servidor estaba dormido, espera un minuto e inténtalo de nuevo.</p>
                        <button class="btn-action" onclick="cambiarModulo('${vista}')">Reintentar</button>
                    </div>`;
            }
        }

        /* --- MÓDULO 0: CONSULTA DE DISPONIBILIDAD / STOCK POR CÓDIGO --- */
        function renderizarConsultaStock() {
            const panel = document.getElementById('panel-contenido');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Consulta de Disponibilidad y Stock</h2>
                    <p>Busca productos por código (SKU) o nombre para verificar existencias antes de cotizar o vender.</p>
                </div>

                <div class="input-group" style="margin-bottom: 24px;">
                    <label>Buscar por Código (SKU) o Nombre del Producto</label>
                    <input type="text" id="inputBuscarStock" placeholder="Ej. REF-101 o Aceite Motul..." oninput="filtrarProductosStock(this.value)" autofocus>
                </div>

                <div id="contenedorListaProductosStock"></div>
            `;

            filtrarProductosStock('');
        }

        function filtrarProductosStock(query) {
            const contenedor = document.getElementById('contenedorListaProductosStock');
            if (!contenedor) return;

            const q = query.toLowerCase().trim();
            const productosFiltrados = catalogoProductos.filter(p =>
                p.sku.toLowerCase().includes(q) || p.nombre.toLowerCase().includes(q));

            if (productosFiltrados.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:30px 0;">No se encontraron productos con ese código o nombre.</p>';
                return;
            }

            contenedor.innerHTML = productosFiltrados.map(p => {
                let badgeStock = `<span class="badge-stock-ok">✓ Disponible (${p.stock} pzas)</span>`;
                if (p.stock <= 0) {
                    badgeStock = `<span class="badge-stock-empty">❌ Agotado (0 pzas)</span>`;
                } else if (p.stock <= 5) {
                    badgeStock = `<span class="badge-stock-low">⚠️ Poco Stock (${p.stock} pzas)</span>`;
                }

                return `
                    <div class="ticket-item">
                        <div class="ticket-info">
                            <div class="ticket-title">
                                <span style="background:#262626; color:#60a5fa; padding:2px 8px; border-radius:3px; font-size:0.8rem; font-weight:700; margin-right:8px;">${esc(p.sku)}</span>
                                ${esc(p.nombre)}
                            </div>
                            <div class="ticket-sub">Precio unitario: <strong>$${p.precio.toFixed(2)} MXN</strong></div>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            ${badgeStock}

                                <button class="btn-add-item" style="background:#22c55e; border-color:#22c55e; color:#000;" onclick="enviarAOperacion('${p.id}', 'venta')">🛒 Vender</button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

        function enviarAOperacion(prodId, destino) {
            const producto = catalogoProductos.find(p => mismoId(p.id, prodId));
            if (!producto) return;

            if (destino === 'cotizacion') {
                const existe = itemsCotizacionActual.find(i => mismoId(i.id, prodId));
                if (existe) existe.cantidad++;
                else itemsCotizacionActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: 1 });

                cambiarModulo('cotizacion', document.querySelectorAll('.nav-btn')[1]);
            } else if (destino === 'venta') {
                const existe = itemsVentaActual.find(i => mismoId(i.id, prodId));
                if (existe) {
                    if (existe.cantidad + 1 > producto.stock) {
                        alert(`⚠️ Supera el stock disponible (${producto.stock} pzas).`);
                        return;
                    }
                    existe.cantidad++;
                } else {
                    itemsVentaActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: 1 });
                }

                cambiarModulo('venta', document.querySelectorAll('.nav-btn')[2]);
            }
        }

        function filtrarSelectProductos(selectId, query) {
            const select = document.getElementById(selectId);
            if (!select) return;

            const q = query.toLowerCase().trim();
            const filtrados = catalogoProductos.filter(p =>
                p.sku.toLowerCase().includes(q) || p.nombre.toLowerCase().includes(q));

            if (filtrados.length === 0) {
                select.innerHTML = `<option value="">Sin coincidencias</option>`;
                return;
            }

            select.innerHTML = filtrados.map(p =>
                `<option value="${p.id}">[${esc(p.sku)}] ${esc(p.nombre)} - $${p.precio.toFixed(2)} (Stock: ${p.stock} pzas)</option>`
            ).join('');

        function agregarProductoAVenta() {
            const select = document.getElementById('selectVentaProducto');
            if (!select || !select.value) return;

            const prodId = select.value;
            const cantidad = parseInt(document.getElementById('ventaCantidadInput').value) || 1;
            const producto = catalogoProductos.find(p => mismoId(p.id, prodId));

            if (producto) {
                if (cantidad > producto.stock) {
                    alert(`⚠️ Stock insuficiente. Disponibles: ${producto.stock} pzas.`);
                    return;
                }
                const existe = itemsVentaActual.find(item => mismoId(item.id, prodId));
                if (existe) {
                    if ((existe.cantidad + cantidad) > producto.stock) {
                        alert(`⚠️ Supera el stock disponible (${producto.stock} pzas).`);
                        return;
                    }
                    existe.cantidad += cantidad;
                } else {
                    itemsVentaActual.push({ id: producto.id, sku: producto.sku, nombre: producto.nombre, precio: producto.precio, cantidad: cantidad });
                }
                actualizarTablaVenta();
            }
        }

        function modificarCantidadVenta(id, delta) {
            const item = itemsVentaActual.find(i => mismoId(i.id, id));
            const prodReal = catalogoProductos.find(p => mismoId(p.id, id));
            if (item) {
                if (delta > 0 && prodReal && item.cantidad + delta > prodReal.stock) {
                    alert(`⚠️ Stock máximo alcanzado (${prodReal.stock} pzas).`);
                    return;
                }
                item.cantidad += delta;
                if (item.cantidad <= 0) removerItemVenta(id);
                else actualizarTablaVenta();
            }
        }

        function removerItemVenta(id) {
            itemsVentaActual = itemsVentaActual.filter(item => !mismoId(item.id, id));
            actualizarTablaVenta();

        async function procesarVenta(event) {
            event.preventDefault();
            const cliente = document.getElementById('ventaCliente').value.trim();
            const pago = document.getElementById('ventaMetodoPago').value;

            if (itemsVentaActual.length === 0) {
                alert('Agrega al menos un producto a la venta.');
                return;
            }

            let subtotal = 0;
            const detalle = itemsVentaActual.map(item => {
                const importe = redondear(item.precio * item.cantidad);
                subtotal += importe;
                return {
                    producto_id: String(item.id),
                    producto: item.nombre,
                    cantidad: item.cantidad,
                    precio: item.precio,
                    importe: importe
                };
            });
            subtotal = redondear(subtotal);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);

            const boton = document.getElementById('btnProcesarVenta');
            if (boton) boton.disabled = true;

            try {
                await enviar('POST', '/api/ventas', {
                    tipo: 'VENTA',
                    cliente: cliente || 'Cliente General',
                    pago: pago,
                    fecha: new Date().toLocaleDateString('es-MX'),
                    subtotal, iva, total,
                    cotizacion_id: idCotizacionEnProceso,
                    detalle
                });

                idCotizacionEnProceso = null;
                folioCotizacionEnProceso = null;

                const alerta = document.getElementById('alertaVenta');
                alerta.style.display = 'block';
                setTimeout(() => {
                    itemsVentaActual = [];
                    cambiarModulo('venta');
                }, 1500);
            } catch (e) {
                if (boton) boton.disabled = false;
                alert('No se pudo registrar la venta: ' + e.message);
                try { await cargarCatalogo(); filtrarSelectProductos('selectVentaProducto', ''); } catch (_) { /* se ignora */ }
            }
        }

            const cotiz = historialRegistros.find(t => mismoId(t.id, idCotiz));
            if (!cotiz) return;

            try { await cargarCatalogo(); } catch (e) { alert('No se pudo cargar el catálogo: ' + e.message); return; }

            idCotizacionEnProceso = cotiz.id;
            folioCotizacionEnProceso = cotiz.folio;
            itemsVentaActual = cotiz.items.map(it => {
                const prodReal = buscarProductoDeItem(it);
                return {
                    id: prodReal ? prodReal.id : String(it.id),
                    sku: prodReal ? prodReal.sku : '—',
                    nombre: it.producto,
                    precio: it.precio,
                    cantidad: it.cantidad
                };
            });

            cerrarModal();
            await cambiarModulo('venta', document.querySelectorAll('.nav-btn')[2]);

            const c = document.getElementById('ventaCliente');
            if (c) c.value = cotiz.cliente;
        }

        async function generarCotizacionDesdeVenta(idVenta) {
            const venta = historialRegistros.find(t => mismoId(t.id, idVenta));
            if (!venta) return;

            try { await cargarCatalogo(); } catch (e) { alert('No se pudo cargar el catálogo: ' + e.message); return; }

            itemsCotizacionActual = venta.items.map(it => {
                const prodReal = buscarProductoDeItem(it);
                return {
                    id: prodReal ? prodReal.id : String(it.id),
                    sku: prodReal ? prodReal.sku : '—',
                    nombre: it.producto,
                    precio: it.precio,
                    cantidad: it.cantidad
                };
            });

            cerrarModal();
            await cambiarModulo('cotizacion', document.querySelectorAll('.nav-btn')[1]);

            const c = document.getElementById('cotizacionCliente');
            if (c) c.value = venta.cliente;
        }

        function cerrarModal() { document.getElementById('modalDetalle').style.display = 'none'; }

        async function eliminarRegistroModal() {
            const reg = historialRegistros.find(t => mismoId(t.id, registroSeleccionadoId));
            if (!reg) return;
            if (!confirm(`¿Eliminar el registro #${reg.folio}?`)) return;

            try {
                await enviar('DELETE', '/api/ventas/' + reg.id);
                cerrarModal();
                await cambiarModulo(reg.tipo === 'VENTA' ? 'historial_ventas' : 'historial_cotizaciones');
            } catch (e) {
                alert('No se pudo eliminar: ' + e.message);
            }
        }

        window.onload = function() {
            cambiarModulo('consulta_stock', document.querySelector('.nav-btn'));
        };
    </script>
