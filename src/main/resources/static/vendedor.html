        function filtrarListaHistorial(query, tipoFiltro) {
            const q = query.toLowerCase().replace('#', '').trim();
            const filtrados = [];
            for (let i = 0; i < historialRegistros.length; i++) {
                const t = historialRegistros[i];
                if (t.tipo === tipoFiltro) {
                    if (String(t.folio).indexOf(q) !== -1 || t.cliente.toLowerCase().indexOf(q) !== -1) {
                        filtrados.push(t);
                    }
                }
            }

            let html = htmlListaHistorial(filtrados);
            if (html === '') {
                html = '<p style="color:#a3a3a3; text-align:center; padding:20px;">No hay coincidencias.</p>';
            }
            document.getElementById('contenedorListaHistorial').innerHTML = html;
        }

        function mostrarHistorialVentas(fechaInicio, fechaFin) {
            const hoy = fechaLocalISO(new Date());
            let inicio = hoy;
            let fin = hoy;
            if (fechaInicio) {
                inicio = fechaInicio;
            } else if (rangoVentas) {
                inicio = rangoVentas.inicio;
            }
            if (fechaFin) {
                fin = fechaFin;
            } else if (rangoVentas) {
                fin = rangoVentas.fin;
            }
            rangoVentas = { inicio: inicio, fin: fin };

            const ventas = [];
            for (let i = 0; i < historialRegistros.length; i++) {
                const r = historialRegistros[i];
                if (r.tipo === 'VENTA') {
                    const f = fechaVentaISO(r.fecha);
                    if (f !== '' && f >= inicio && f <= fin) {
                        ventas.push(r);
                    }
                }
            }

            for (let a = 0; a < ventas.length - 1; a++) {
                for (let b = a + 1; b < ventas.length; b++) {
                    const fa = fechaVentaISO(ventas[a].fecha);
                    const fb = fechaVentaISO(ventas[b].fecha);
                    let cambiar = false;
                    if (fb > fa) {
                        cambiar = true;
                    } else if (fb === fa && Number(ventas[b].id) > Number(ventas[a].id)) {
                        cambiar = true;
                    }
                    if (cambiar) {
                        const temporal = ventas[a];
                        ventas[a] = ventas[b];
                        ventas[b] = temporal;
                    }
                }
            }

            let totalPeriodo = 0;
            let subtotalPeriodo = 0;
            let ivaPeriodo = 0;
            const totalesPorDia = [];
            const totalesPorPago = [];
            for (let i = 0; i < ventas.length; i++) {
                const v = ventas[i];
                totalPeriodo = totalPeriodo + v.total;
                subtotalPeriodo = subtotalPeriodo + v.subtotal;
                ivaPeriodo = ivaPeriodo + v.iva;

                const registroDia = buscarGrupo(totalesPorDia, fechaVentaISO(v.fecha));
                registroDia.cantidad = registroDia.cantidad + 1;
                registroDia.total = registroDia.total + v.total;

                let metodo = 'Sin especificar';
                if (v.pago) {
                    metodo = v.pago;
                }
                const registroPago = buscarGrupo(totalesPorPago, metodo);
                registroPago.cantidad = registroPago.cantidad + 1;
                registroPago.total = registroPago.total + v.total;
            }

            ordenarGruposPorClave(totalesPorDia);
            ordenarGruposPorTotal(totalesPorPago);

            let filasDiarias = '';
            for (let i = 0; i < totalesPorDia.length; i++) {
                const g = totalesPorDia[i];
                filasDiarias += `
                    <tr>
                        <td>${formatoFechaISO(g.clave)}</td>
                        <td>${g.cantidad}</td>
                        <td>${formatearMoneda(g.total)}</td>
                    </tr>`;
            }

            let filasPago = '';
            for (let i = 0; i < totalesPorPago.length; i++) {
                const g = totalesPorPago[i];
                filasPago += `
                    <tr>
                        <td>${esc(g.clave)}</td>
                        <td>${g.cantidad}</td>
                        <td>${formatearMoneda(g.total)}</td>
                    </tr>`;
            }

            let filasVentas = '';
            for (let i = 0; i < ventas.length; i++) {
                const v = ventas[i];
                let detalle = '';
                for (let j = 0; j < v.items.length; j++) {
                    const it = v.items[j];
                    if (j > 0) {
                        detalle += '<br>';
                    }
                    detalle += esc(it.producto) + ' (' + it.cantidad + ' × ' + formatearMoneda(it.precio) + ') — ' + formatearMoneda(it.precio * it.cantidad);
                }
                filasVentas += `
                    <tr>
                        <td>${esc(v.fecha)}</td>
                        <td>#${esc(v.folio)}</td>
                        <td>${esc(v.cliente)}</td>
                        <td>${detalle}</td>
                        <td>${esc(v.pago)}</td>
                        <td>${formatearMoneda(v.subtotal)}<br>IVA: ${formatearMoneda(v.iva)}</td>
                        <td><strong>${formatearMoneda(v.total)}</strong></td>
                        <td class="no-print"><button type="button" class="btn-add-item" onclick="abrirDetalleModal(${v.id})">Detalle</button></td>
                    </tr>`;
            }

            if (filasDiarias === '') {
                filasDiarias = '<tr><td colspan="3" style="text-align:center;">No hay ventas para este periodo.</td></tr>';
            }
            if (filasPago === '') {
                filasPago = '<tr><td colspan="3" style="text-align:center;">No hay ventas para este periodo.</td></tr>';
            }
            if (filasVentas === '') {
                filasVentas = '<tr><td colspan="8" style="text-align:center;">No hay ventas para este periodo.</td></tr>';
            }

            document.getElementById('panel-contenido').innerHTML = `
                <div class="panel-header">
                    <h2>Historial de Ventas</h2>
                    <p class="no-print">Elige un periodo para consultar las ventas. Usa Imprimir / Guardar PDF para descargar el reporte como PDF.</p>
                    <p>Periodo del reporte: ${formatoFechaISO(inicio)} al ${formatoFechaISO(fin)}</p>
                </div>
                <div class="summary-box no-print" style="margin-top:0;">
                    <div class="report-filter-actions">
                        <div class="input-group" style="margin:0;">
                            <label for="ventasFechaInicio">Desde</label>
                            <input type="date" id="ventasFechaInicio" value="${esc(inicio)}">
                        </div>
                        <div class="input-group" style="margin:0;">
                            <label for="ventasFechaFin">Hasta</label>
                            <input type="date" id="ventasFechaFin" value="${esc(fin)}">
                        </div>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoVentas('hoy')">Hoy</button>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoVentas('semana')">Esta semana</button>
                        <button type="button" class="btn-secondary" onclick="aplicarFiltroVentas()">Aplicar fechas</button>
                        <button type="button" class="btn-action" style="margin-top:0; width:auto;" onclick="imprimirReporte()">Imprimir / Guardar PDF</button>
                    </div>
                </div>
                <div class="report-summary-grid">
                    <div class="report-total-card">Ventas en el periodo<strong>${ventas.length}</strong></div>
                    <div class="report-total-card">Total vendido<strong>${formatearMoneda(totalPeriodo)}</strong></div>
                    <div class="report-total-card">Subtotal sin IVA<strong>${formatearMoneda(subtotalPeriodo)}</strong></div>
                    <div class="report-total-card">IVA<strong>${formatearMoneda(ivaPeriodo)}</strong></div>
                </div>
                <div class="summary-box">
                    <h3>Resumen diario</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Día</th><th>Ventas</th><th>Total vendido</th></tr></thead>
                            <tbody>${filasDiarias}</tbody>
                        </table>
                    </div>
                </div>
                <div class="summary-box">
                    <h3>Resumen por método de pago</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Método de pago</th><th>Ventas</th><th>Total</th></tr></thead>
                            <tbody>${filasPago}</tbody>
                        </table>
                    </div>
                </div>
                <div class="summary-box">
                    <h3>Detalle de ventas realizadas</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Fecha</th><th>Folio</th><th>Cliente</th><th>Productos</th><th>Método de pago</th><th>Subtotal / IVA</th><th>Total</th><th class="no-print">Acciones</th></tr></thead>
                            <tbody>${filasVentas}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function seleccionarPeriodoVentas(periodo) {
            const hoy = new Date();
            const inicio = new Date(hoy);
            const fin = new Date(hoy);
            if (periodo === 'semana') {
                const diasDesdeLunes = (hoy.getDay() + 6) % 7;
                inicio.setDate(hoy.getDate() - diasDesdeLunes);
                fin.setDate(inicio.getDate() + 6);
            }
            mostrarHistorialVentas(fechaLocalISO(inicio), fechaLocalISO(fin));
        }

        function aplicarFiltroVentas() {
            const fechaInicio = document.getElementById('ventasFechaInicio').value;
            const fechaFin = document.getElementById('ventasFechaFin').value;
            if (!fechaInicio || !fechaFin || fechaInicio > fechaFin) {
                alert('Selecciona un rango válido: la fecha inicial debe ser igual o anterior a la fecha final.');
                return;
            }
            mostrarHistorialVentas(fechaInicio, fechaFin);
        }

        function imprimirReporte() {
            document.body.classList.add('reporte-impresion');
            window.print();
            window.setTimeout(function () {
                document.body.classList.remove('reporte-impresion');
            }, 500);
        }

        function renderizarCorteCaja() {
            const c = cajaPendiente;
            const hoy = fechaLocalISO(new Date());
            let minimo = hoy;
            for (let i = 0; i < c.ventas.length; i++) {
                const f = fechaVentaISO(c.ventas[i].fecha);
                if (f !== '' && f < minimo) {
                    minimo = f;
                }
            }
            let inicio = minimo;
            let fin = hoy;
            if (rangoCorte) {
                inicio = rangoCorte.desde;
                fin = rangoCorte.hasta;
            }

            let filasPendientes = '';
            for (let i = 0; i < c.ventas.length; i++) {
                const v = c.ventas[i];
                let recibido = '—';
                let cambio = '—';
                if (v.pago === 'Efectivo' && v.recibido > 0) {
                    recibido = formatearMoneda(v.recibido);
                    cambio = formatearMoneda(v.cambio);
                }
                filasPendientes += `
                    <tr>
                        <td>#${esc(v.folio)}</td>
                        <td>${esc(v.fecha)}</td>
                        <td>${esc(v.cliente)}</td>
                        <td>${esc(v.pago)}</td>
                        <td><strong>${formatearMoneda(v.total)}</strong></td>
                        <td>${recibido}</td>
                        <td>${cambio}</td>
                    </tr>`;
            }

            let filasCortes = '';
            for (let i = 0; i < cortesHistorial.length; i++) {
                const k = cortesHistorial[i];
                const dif = Number(k.diferencia);
                let claseDif = 'cambio-ok';
                if (dif < 0) {
                    claseDif = 'cambio-falta';
                }
                filasCortes += `
                    <tr>
                        <td>#${esc(k.id)}</td>
                        <td>${esc(formatoFechaHora(k.fecha_corte))}</td>
                        <td>${esc(k.responsable)}</td>
                        <td>${esc(k.num_ventas)}</td>
                        <td>${formatearMoneda(k.total_ventas)}</td>
                        <td>${formatearMoneda(k.efectivo_esperado)}</td>
                        <td>${formatearMoneda(k.efectivo_contado)}</td>
                        <td class="${claseDif}"><strong>${formatearMoneda(dif)}</strong></td>
                        <td><button type="button" class="btn-add-item" onclick="verCorte(${k.id})">Ver / Imprimir</button></td>
                    </tr>`;
            }
            if (filasCortes === '') {
                filasCortes = '<tr><td colspan="9" style="text-align:center;">Aún no se ha realizado ningún corte.</td></tr>';
            }

            let bloquePendiente = '';
            if (c.cantidad === 0) {
                bloquePendiente = '<div class="summary-box" style="margin-top:0;"><p style="text-align:center;">No hay ventas pendientes de corte en este periodo.</p></div>';
            } else {
                bloquePendiente = `
                <form id="corteForm" onsubmit="realizarCorte(event)">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Responsable del Corte</label>
                            <input type="text" id="corteResponsable" placeholder="Ej. Nombre del vendedor" required>
                        </div>
                        <div class="input-group">
                            <label>Fondo de Caja (definido por el administrador)</label>
                            <input type="number" id="corteFondo" value="${fondoCaja}" readonly>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Retiros de Efectivo ($ MXN)</label>
                            <input type="number" id="corteRetiros" min="0" step="0.01" value="0" oninput="actualizarCalculoCorte()">
                        </div>
                        <div class="input-group">
                            <label>Efectivo Contado en Caja ($ MXN)</label>
                            <input type="number" id="corteContado" min="0" step="0.01" placeholder="Ej. 1500.00" oninput="actualizarCalculoCorte()" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Observaciones (opcional)</label>
                        <input type="text" id="corteObs" maxlength="500" placeholder="Ej. Se retiró efectivo para depósito">
                    </div>

                    <div class="summary-box">
                        <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                            Cuadre de Efectivo
                        </h3>
                        <div class="summary-row"><span>Fondo de caja:</span><span id="lblCorteFondo">${dineroTexto(fondoCaja)}</span></div>
                        <div class="summary-row"><span>Ventas en efectivo:</span><span id="lblCorteEfectivo">${dineroTexto(c.efectivo)}</span></div>
                        <div class="summary-row"><span>Retiros:</span><span id="lblCorteRetiros">$0.00 MXN</span></div>
                        <div class="summary-row total"><span>Efectivo esperado en caja:</span><span id="lblCorteEsperado">${dineroTexto(fondoCaja + c.efectivo)}</span></div>
                        <div class="summary-row"><span>Efectivo contado:</span><span id="lblCorteContado">$0.00 MXN</span></div>
                        <div class="summary-row total"><span id="lblCorteDifTitulo">Diferencia:</span><span id="lblCorteDif" class="cambio-ok">$0.00 MXN</span></div>
                    </div>

                    <button type="submit" class="btn-action" id="btnRealizarCorte">Realizar Corte de Caja</button>
                </form>

                <div class="summary-box">
                    <h3>Ventas incluidas en este corte</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Método de pago</th><th>Total</th><th>Recibido</th><th>Cambio</th></tr></thead>
                            <tbody>${filasPendientes}</tbody>
                        </table>
                    </div>
                </div>
            `;
            }

            document.getElementById('panel-contenido').innerHTML = `
                <div class="panel-header">
                    <h2>Corte de Caja</h2>
                    <p>Elige el periodo de ventas que quieres cortar y compara el efectivo esperado contra el efectivo contado.</p>
                    <p>Periodo del corte: ${formatoFechaISO(inicio)} al ${formatoFechaISO(fin)}</p>
                </div>
                <div class="summary-box" style="margin-top:0;">
                    <div class="report-filter-actions">
                        <div class="input-group" style="margin:0;">
                            <label for="corteFechaInicio">Desde</label>
                            <input type="date" id="corteFechaInicio" value="${esc(inicio)}">
                        </div>
                        <div class="input-group" style="margin:0;">
                            <label for="corteFechaFin">Hasta</label>
                            <input type="date" id="corteFechaFin" value="${esc(fin)}">
                        </div>
                        <button type="button" class="btn-secondary" onclick="aplicarFiltroCorte()">Aplicar fechas</button>
                        <button type="button" class="btn-secondary" onclick="cambiarModulo('corte_caja')">Ver todo lo pendiente</button>
                    </div>
                </div>
                <div class="report-summary-grid">
                    <div class="report-total-card">Fondo de caja<strong>${formatearMoneda(fondoCaja)}</strong></div>
                    <div class="report-total-card">Ventas pendientes de corte<strong>${c.cantidad}</strong></div>
                    <div class="report-total-card">Total vendido<strong>${formatearMoneda(c.total)}</strong></div>
                    <div class="report-total-card">Efectivo<strong>${formatearMoneda(c.efectivo)}</strong></div>
                    <div class="report-total-card">Tarjeta<strong>${formatearMoneda(c.tarjeta)}</strong></div>
                    <div class="report-total-card">Transferencia<strong>${formatearMoneda(c.transferencia)}</strong></div>
                </div>
                ${bloquePendiente}
                <div class="summary-box">
                    <h3>Historial de cortes realizados</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Corte</th><th>Fecha y hora</th><th>Responsable</th><th>Ventas</th><th>Total vendido</th><th>Efectivo esperado</th><th>Efectivo contado</th><th>Diferencia</th><th>Acciones</th></tr></thead>
                            <tbody>${filasCortes}</tbody>
                        </table>
                    </div>
                </div>
            `;

            if (c.cantidad > 0) {
                actualizarCalculoCorte();
            }
        }

        function actualizarCalculoCorte() {
            const campoRetiros = document.getElementById('corteRetiros');
            const campoContado = document.getElementById('corteContado');
            if (!campoRetiros || !campoContado || !cajaPendiente) {
                return;
            }

            const fondo = redondear(fondoCaja);
            const retiros = redondear(parseFloat(campoRetiros.value) || 0);
            const contado = redondear(parseFloat(campoContado.value) || 0);
            const capturado = campoContado.value !== '';
            const esperado = redondear(fondo + cajaPendiente.efectivo - retiros);
            const diferencia = redondear(contado - esperado);

            document.getElementById('lblCorteFondo').innerText = dineroTexto(fondo);
            document.getElementById('lblCorteRetiros').innerText = dineroTexto(retiros);
            document.getElementById('lblCorteEsperado').innerText = dineroTexto(esperado);
            document.getElementById('lblCorteContado').innerText = dineroTexto(contado);

            const titulo = document.getElementById('lblCorteDifTitulo');
            const valor = document.getElementById('lblCorteDif');
            if (!capturado) {
                titulo.innerText = 'Diferencia:';
                valor.innerText = dineroTexto(0);
                valor.className = 'cambio-ok';
            } else if (diferencia === 0) {
                titulo.innerText = 'Caja cuadrada:';
                valor.innerText = dineroTexto(0);
                valor.className = 'cambio-ok';
            } else if (diferencia > 0) {
                titulo.innerText = 'Sobrante:';
                valor.innerText = dineroTexto(diferencia);
                valor.className = 'cambio-ok';
            } else {
                titulo.innerText = 'Faltante:';
                valor.innerText = dineroTexto(Math.abs(diferencia));
                valor.className = 'cambio-falta';
            }
        }

        async function realizarCorte(event) {
            event.preventDefault();

            const responsable = document.getElementById('corteResponsable').value.trim();
            const fondo = redondear(fondoCaja);
            const retiros = redondear(parseFloat(document.getElementById('corteRetiros').value) || 0);
            const contadoTexto = document.getElementById('corteContado').value;
            const contado = redondear(parseFloat(contadoTexto));

            if (!responsable) {
                alert('Escribe el nombre del responsable del corte.');
                return;
            }
            if (contadoTexto === '' || !Number.isFinite(contado) || contado < 0) {
                alert('Captura el efectivo contado en caja.');
                return;
            }
            if (retiros < 0) {
                alert('Los montos no pueden ser negativos.');
                return;
            }

            const esperado = redondear(fondo + cajaPendiente.efectivo - retiros);
            const diferencia = redondear(contado - esperado);

            let textoDiferencia = 'La caja está cuadrada.';
            if (diferencia > 0) {
                textoDiferencia = 'Hay un sobrante de ' + dineroTexto(diferencia) + '.';
            } else if (diferencia < 0) {
                textoDiferencia = 'Hay un faltante de ' + dineroTexto(Math.abs(diferencia)) + '.';
            }

            let textoPeriodo = 'de todo lo pendiente';
            if (rangoCorte) {
                textoPeriodo = 'del ' + formatoFechaISO(rangoCorte.desde) + ' al ' + formatoFechaISO(rangoCorte.hasta);
            }

            const mensaje = '¿Realizar el corte ' + textoPeriodo + ' con ' + cajaPendiente.cantidad + ' venta(s) por '
                + dineroTexto(cajaPendiente.total) + '?\n\n' + textoDiferencia + '\n\nEl corte no se puede modificar después.';
            if (!confirm(mensaje)) {
                return;
            }

            const boton = document.getElementById('btnRealizarCorte');
            if (boton) {
                boton.disabled = true;
            }

            const cuerpo = {
                responsable: responsable,
                retiros: retiros,
                efectivo_contado: contado,
                observaciones: document.getElementById('corteObs').value.trim()
            };
            if (rangoCorte) {
                cuerpo.desde = rangoCorte.desde;
                cuerpo.hasta = rangoCorte.hasta;
            }

            try {
                const corte = await enviar('POST', '/api/caja/cortes', cuerpo);
                mostrarCorte(corte, true);
            } catch (e) {
                if (boton) {
                    boton.disabled = false;
                }
                alert('No se pudo realizar el corte: ' + e.message);
                cambiarModulo('corte_caja');
            }
        }

        async function verCorte(id) {
            try {
                const corte = await api('/api/caja/cortes/' + id);
                mostrarCorte(corte, false);
            } catch (e) {
                alert('No se pudo cargar el corte: ' + e.message);
            }
        }

        function mostrarCorte(k, recien) {
            const ventas = k.ventas || [];
            const dif = Number(k.diferencia);

            let etiquetaDif = 'Caja cuadrada';
            if (dif > 0) {
                etiquetaDif = 'Sobrante';
            } else if (dif < 0) {
                etiquetaDif = 'Faltante';
            }
            let claseDif = 'cambio-ok';
            if (dif < 0) {
                claseDif = 'cambio-falta';
            }

            let filas = '';
            for (let i = 0; i < ventas.length; i++) {
                const v = ventas[i];
                const esEfectivo = v.pago === 'Efectivo' && Number(v.monto_recibido || 0) > 0;
                let recibido = '—';
                let cambio = '—';
                if (esEfectivo) {
                    recibido = formatearMoneda(v.monto_recibido);
                    cambio = formatearMoneda(v.cambio);
                }
                filas += `
                    <tr>
                        <td>#${esc(v.folio_numero)}</td>
                        <td>${esc(v.fecha)}</td>
                        <td>${esc(v.cliente)}</td>
                        <td>${esc(v.pago)}</td>
                        <td><strong>${formatearMoneda(v.total)}</strong></td>
                        <td>${recibido}</td>
                        <td>${cambio}</td>
                    </tr>`;
            }
            if (filas === '') {
                filas = '<tr><td colspan="7" style="text-align:center;">Sin ventas.</td></tr>';
            }

            let avisoReciente = '';
            if (recien) {
                avisoReciente = '<div class="alert-box no-print" style="display:block; margin-top:0;">Corte de caja registrado correctamente. Las ventas incluidas ya no aparecerán como pendientes.</div>';
            }

            document.getElementById('panel-contenido').innerHTML = `
                <div class="panel-header">
                    <h2>Corte de Caja #${esc(k.id)}</h2>
                    <p>Fecha y hora del corte: ${esc(formatoFechaHora(k.fecha_corte))} | Responsable: ${esc(k.responsable)}</p>
                </div>
                ${avisoReciente}
                <div class="summary-box no-print" style="margin-top:15px;">
                    <div class="report-filter-actions">
                        <button type="button" class="btn-action" style="margin-top:0; width:auto;" onclick="imprimirReporte()">Imprimir / Guardar PDF</button>
                        <button type="button" class="btn-secondary" onclick="cambiarModulo('corte_caja')">Volver a Corte de Caja</button>
                    </div>
                </div>
                <div class="report-summary-grid">
                    <div class="report-total-card">Ventas incluidas<strong>${esc(k.num_ventas)}</strong></div>
                    <div class="report-total-card">Total vendido<strong>${formatearMoneda(k.total_ventas)}</strong></div>
                    <div class="report-total-card">Efectivo<strong>${formatearMoneda(k.ventas_efectivo)}</strong></div>
                    <div class="report-total-card">Tarjeta<strong>${formatearMoneda(k.ventas_tarjeta)}</strong></div>
                    <div class="report-total-card">Transferencia<strong>${formatearMoneda(k.ventas_transferencia)}</strong></div>
                </div>
                <div class="summary-box">
                    <h3>Cuadre de efectivo</h3>
                    <div class="summary-row"><span>Fondo de caja:</span><span>${formatearMoneda(k.fondo_inicial)}</span></div>
                    <div class="summary-row"><span>Ventas en efectivo:</span><span>${formatearMoneda(k.ventas_efectivo)}</span></div>
                    <div class="summary-row"><span>Retiros:</span><span>${formatearMoneda(k.retiros)}</span></div>
                    <div class="summary-row total"><span>Efectivo esperado en caja:</span><span>${formatearMoneda(k.efectivo_esperado)}</span></div>
                    <div class="summary-row"><span>Efectivo contado:</span><span>${formatearMoneda(k.efectivo_contado)}</span></div>
                    <div class="summary-row total"><span>${etiquetaDif}:</span><span class="${claseDif}">${formatearMoneda(Math.abs(dif))}</span></div>
                    <div class="summary-row"><span>Observaciones:</span><span>${esc(k.observaciones || '—')}</span></div>
                </div>
                <div class="summary-box">
                    <h3>Ventas incluidas en el corte</h3>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Método de pago</th><th>Total</th><th>Recibido</th><th>Cambio</th></tr></thead>
                            <tbody>${filas}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function abrirDetalleModal(id) {
            const reg = buscarPorId(historialRegistros, id);
            if (!reg) {
                return;
            }

            registroSeleccionadoId = reg.id;
            document.getElementById('modalTicketTitulo').innerText = etiquetaTipo(reg.tipo) + ' #' + reg.folio + ' - ' + reg.cliente;
            document.getElementById('modalTicketFecha').innerText = 'Fecha: ' + reg.fecha + ' | Estado: ' + reg.pago;

            let itemsDesglose = '';
            for (let i = 0; i < reg.items.length; i++) {
                const it = reg.items[i];
                itemsDesglose += `
                    <div class="summary-row">
                        <span>${esc(it.producto)} (x${it.cantidad})</span>
                        <span>$${(it.precio * it.cantidad).toFixed(2)} MXN</span>
                    </div>`;
            }

            let colorTotal = '#22c55e';
            if (reg.tipo === 'COTIZACION') {
                colorTotal = '#60a5fa';
            }
            const esEfectivo = reg.tipo === 'VENTA' && reg.pago === 'Efectivo' && reg.recibido > 0;

            let bloqueEfectivo = '';
            if (esEfectivo) {
                bloqueEfectivo = `
                    <div class="summary-row"><span>Monto recibido:</span><span>${dineroTexto(reg.recibido)}</span></div>
                    <div class="summary-row"><span>Cambio entregado:</span><span>${dineroTexto(reg.cambio)}</span></div>`;
            }
            let bloqueCorte = '';
            if (reg.tipo === 'VENTA' && reg.corteId) {
                bloqueCorte = '<div class="summary-row"><span>Incluida en el corte:</span><span>#' + esc(reg.corteId) + '</span></div>';
            }

            document.getElementById('modalDetalleContenido').innerHTML = `
                <h4 style="font-size:0.85rem; color:#a3a3a3; margin-bottom:8px;">Detalle de ítems:</h4>
                ${itemsDesglose}
                <div class="summary-row" style="margin-top:10px; border-top:1px solid #262626; padding-top:8px;">
                    <span>Subtotal:</span><span>$${reg.subtotal.toFixed(2)} MXN</span>
                </div>
                <div class="summary-row"><span>IVA (16%):</span><span>$${reg.iva.toFixed(2)} MXN</span></div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span style="color:${colorTotal};">$${reg.total.toFixed(2)} MXN</span>
                </div>
                ${bloqueEfectivo}
                ${bloqueCorte}
            `;

            const acciones = document.getElementById('modalAcciones');
            let botonEliminar = '<button class="btn-danger" onclick="eliminarRegistroModal()">Eliminar</button>';
            if (reg.tipo === 'VENTA' && reg.corteId) {
                botonEliminar = '';
            }

            if (reg.tipo === 'COTIZACION') {
                acciones.innerHTML = `
                    <button class="btn-convert" onclick="convertirCotizacionAVenta(${reg.id})">Convertir a Venta</button>
                    ${botonEliminar}
                    <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
                `;
            } else {
                acciones.innerHTML = `
                    <button class="btn-convert" style="background:#2563eb;" onclick="generarCotizacionDesdeVenta(${reg.id})">Generar Cotización desde Venta</button>
                    ${botonEliminar}
                    <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
                `;
            }

            document.getElementById('modalDetalle').style.display = 'flex';
        }

        function itemsDesdeRegistro(registro) {
            const items = [];
            for (let i = 0; i < registro.items.length; i++) {
                const it = registro.items[i];
                const prodReal = buscarProductoDeItem(it);
                let id = String(it.id);
                let sku = '—';
                if (prodReal) {
                    id = prodReal.id;
                    sku = prodReal.sku;
                }
                items.push({
                    id: id,
                    sku: sku,
                    nombre: it.producto,
                    precio: it.precio,
                    cantidad: it.cantidad
                });
            }
            return items;
        }

        async function convertirCotizacionAVenta(idCotiz) {
            const cotiz = buscarPorId(historialRegistros, idCotiz);
            if (!cotiz) {
                return;
            }

            try {
                await cargarCatalogo();
            } catch (e) {
                alert('No se pudo cargar el catálogo: ' + e.message);
                return;
            }

            idCotizacionEnProceso = cotiz.id;
            folioCotizacionEnProceso = cotiz.folio;
            itemsVentaActual = itemsDesdeRegistro(cotiz);

            cerrarModal();
            await cambiarModulo('venta', document.querySelectorAll('.nav-btn')[2]);

            const c = document.getElementById('ventaCliente');
            if (c) {
                c.value = cotiz.cliente;
            }
        }

        async function generarCotizacionDesdeVenta(idVenta) {
            const venta = buscarPorId(historialRegistros, idVenta);
            if (!venta) {
                return;
            }

            try {
                await cargarCatalogo();
            } catch (e) {
                alert('No se pudo cargar el catálogo: ' + e.message);
                return;
            }

            itemsCotizacionActual = itemsDesdeRegistro(venta);

            cerrarModal();
            await cambiarModulo('cotizacion', document.querySelectorAll('.nav-btn')[1]);

            const c = document.getElementById('cotizacionCliente');
            if (c) {
                c.value = venta.cliente;
            }
        }

        function cerrarModal() {
            document.getElementById('modalDetalle').style.display = 'none';
        }

        async function eliminarRegistroModal() {
            const reg = buscarPorId(historialRegistros, registroSeleccionadoId);
            if (!reg) {
                return;
            }
            if (!confirm('¿Eliminar el registro #' + reg.folio + '?')) {
                return;
            }

            try {
                await enviar('DELETE', '/api/ventas/' + reg.id);
                cerrarModal();
                if (reg.tipo === 'VENTA') {
                    await cargarHistorial();
                    mostrarHistorialVentas();
                } else {
                    await cambiarModulo('historial_cotizaciones');
                }
            } catch (e) {
                alert('No se pudo eliminar: ' + e.message);
            }
        }

        window.onload = function () {
            cambiarModulo('consulta_stock', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
