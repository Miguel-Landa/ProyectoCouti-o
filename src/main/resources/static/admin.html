<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal */
        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Barra Superior */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Layout Principal: 2 Columnas (Sidebar Izquierdo + Panel Derecho) */
        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        /* Sidebar Izquierda: Botones de Navegación */
        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #737373;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #a3a3a3;
            border: 1px solid #262626;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #262626;
            color: #ffffff;
            border-color: #404040;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        /* Panel Derecho */
        .main-panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 4px;
        }

        /* Formularios */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #a3a3a3;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: #ffffff;
            background: #262626;
        }

        .summary-box {
            background: #1f1f1f;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #a3a3a3;
            border-bottom: 1px solid #262626;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: #e5e5e5;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Barra Superior -->
        <div class="topbar">
            <h1>Panel del Administrador</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <!-- Workspace Dividido -->
        <div class="workspace">
            
            <!-- Izquierda: Módulos específicos del Administrador -->
            <div class="sidebar-buttons">
                <div class="sidebar-title">Módulos de Almacén</div>
                <button class="nav-btn active" onclick="cambiarVistaAdmin('compras', this)">
                    📦 Compras a Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('proveedores', this)">
                    🏭 Registro de Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('alta-articulo', this)">
                    ➕ Registrar Artículos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('actualizar-articulo', this)">
                    ✏️ Actualizar Artículos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('eliminar-articulo', this)">
                    🗑️ Eliminar Artículos
                </button>
            </div>

            <!-- Centro / Derecho: Despliegue de Formularios -->
            <div class="main-panel" id="panel-contenido-admin">
                <!-- Carga por defecto "Compras a Proveedores" -->
            </div>

        </div>
    </div>

    <script>
        function cambiarVistaAdmin(vista, boton) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');

            const panel = document.getElementById('panel-contenido-admin');

            if (vista === 'compras') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Registrar Compra de Mercancía</h2>
                        <p>Ingreso de facturas de compra y surtido de stock a almacén.</p>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Seleccionar Proveedor</label>
                            <select>
                                <option>Refacciones Hero México S.A. de C.V.</option>
                                <option>Italika MotoPartes Xalapa</option>
                                <option>Lubricantes Motul Directo</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Número de Factura / Remisión</label>
                            <input type="text" placeholder="Ej. FAC-2026-88">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Artículo Surtido</label>
                            <select>
                                <option>Aceite Motul 10W40 1L</option>
                                <option>Batería Hero 12V 7Ah</option>
                                <option>Balatas Delanteras Hunk 160R</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Cantidad Comprada</label>
                            <input type="number" placeholder="Ej. 50">
                        </div>
                    </div>

                    <button class="btn-action">Guardar Compra e Incrementar Stock</button>
                `;
            } else if (vista === 'proveedores') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Registrar Nuevo Proveedor</h2>
                        <p>Dar de alta empresas proveedoras de refacciones y accesorios.</p>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nombre de la Empresa / Proveedor</label>
                            <input type="text" placeholder="Ej. MotoPartes del Golfo">
                        </div>
                        <div class="input-group">
                            <label>RFC</label>
                            <input type="text" placeholder="Ej. MPG900101XYZ">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Teléfono / WhatsApp de Contacto</label>
                            <input type="tel" placeholder="Ej. 2288123456">
                        </div>
                        <div class="input-group">
                            <label>Correo Electrónico</label>
                            <input type="email" placeholder="contacto@proveedor.com">
                        </div>
                    </div>

                    <button class="btn-action">Registrar Proveedor</button>
                `;
            } else if (vista === 'alta-articulo') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Registrar Nuevo Artículo en Inventario</h2>
                        <p>Dar de alta una nueva refacción o insumo en el catálogo.</p>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Código SKU / Referencia</label>
                            <input type="text" placeholder="Ej. REF-3005">
                        </div>
                        <div class="input-group">
                            <label>Nombre o Descripción del Artículo</label>
                            <input type="text" placeholder="Ej. Filtro de Aceite Hero Hunk">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Precio de Venta ($ MXN)</label>
                            <input type="number" placeholder="Ej. 180.00">
                        </div>
                        <div class="input-group">
                            <label>Stock Inicial</label>
                            <input type="number" placeholder="Ej. 20">
                        </div>
                    </div>

                    <button class="btn-action">Guardar Artículo en Inventario</button>
                `;
            } else if (vista === 'actualizar-articulo') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Actualizar Artículo en Inventario</h2>
                        <p>Modificar precio de venta, descripción o existencias de un artículo.</p>
                    </div>

                    <div class="input-group" style="margin-bottom: 20px;">
                        <label>Buscar Artículo por Código o Nombre</label>
                        <input type="text" placeholder="Ej. REF-1002 o Batería Hero">
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nuevo Precio ($ MXN)</label>
                            <input type="number" value="850.00">
                        </div>
                        <div class="input-group">
                            <label>Ajuste de Stock</label>
                            <input type="number" value="15">
                        </div>
                    </div>

                    <button class="btn-action">Actualizar Datos de Artículo</button>
                `;
            } else if (vista === 'eliminar-articulo') {
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Eliminar Artículo de Inventario</h2>
                        <p>Dar de baja refacciones descontinuadas o fuera de catálogo.</p>
                    </div>

                    <div class="input-group" style="margin-bottom: 20px;">
                        <label>Seleccionar Artículo a Eliminar</label>
                        <select>
                            <option>REF-9901 - Kit Arrastre Descontinuado</option>
                            <option>REF-9902 - Espejo Retrovisor Universal Antiguo</option>
                        </select>
                    </div>

                    <div class="summary-box">
                        <div class="summary-row">
                            <span style="color:#ef4444; font-weight:600;">⚠️ ADVERTENCIA:</span>
                            <span>Esta acción eliminará el artículo permanentemente del sistema.</span>
                        </div>
                    </div>

                    <button class="btn-action btn-danger">Confirmar y Eliminar Artículo</button>
                `;
            }
        }

        // Cargar vista inicial
        window.onload = function() {
            cambiarVistaAdmin('compras', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
