                }
                html += '<option value="' + a.id + '" ' + marca + '>[' + esc(a.sku) + '] ' + esc(a.nombre)
                    + ' - Costo $' + dinero(a.costo_compra) + ' / Precio $' + dinero(a.precio) + '</option>';
            }
            return html;
        }

        function formatoValorDecision(valor, unidad) {
            if (unidad === '$') {
                return formatearMoneda(valor);
            }
            return Number(valor).toFixed(2) + ' atenc.';
        }

        function armarEscenarios(lista) {
            const salida = [];
            for (let k = 0; k < lista.length; k++) {
                salida.push({ nombre: lista[k][0], valor: lista[k][1], prob: PROBABILIDADES_BASE[k] });
            }
            return salida;
        }

        async function renderizarDecisiones() {
            let opcionesTipo = '';
            for (const clave in TIPOS_DECISION) {
                let marca = '';
                if (clave === decTipo) {
                    marca = 'selected';
                }
                opcionesTipo += '<option value="' + clave + '" ' + marca + '>' + esc(TIPOS_DECISION[clave].nombre) + '</option>';
            }

            panelAdmin().innerHTML = `
                <div class="panel-header">
                    <h2>Toma de Decisiones</h2>
                    <p class="no-print" id="decDescripcion"></p>
                </div>
                <div class="summary-box no-print" style="margin-top:0;">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Tipo de problema</label>
                            <select id="decTipoSelect" onchange="cambiarTipoDecision(this.value)">${opcionesTipo}</select>
                        </div>
                        <div class="input-group">
                            <label>Periodo de los datos de apoyo (días)</label>
                            <div style="display:flex; gap:10px;">
                                <input type="number" id="decDias" value="90" min="7" max="365" step="1">
                                <button type="button" class="btn-secondary" onclick="actualizarApoyoDecision()">Actualizar datos</button>
                            </div>
                        </div>
                    </div>
                    <p style="font-size:0.8rem;">Al actualizar los datos del periodo se restablecen los valores sugeridos de la tabla.</p>
                </div>
                <div id="decApoyo"></div>
                <div class="summary-box no-print" id="decFormulario"></div>
                <div id="resultadoDecision"></div>
            `;
            await cargarApoyoDecision();
            await aplicarDefaultsDecision();
            mostrarDescripcionDecision();
            renderizarApoyoDecision();
            renderizarFormularioDecision();
        }

        function diasDecision() {
            const campo = document.getElementById('decDias');
            if (campo) {
                return Number(campo.value) || 90;
            }
            return 90;
        }

        async function cargarApoyoDecision() {
            try {
                decApoyo = await api('/api/decisiones/apoyo?dias=' + diasDecision());
            } catch (e) {
                decApoyo = null;
            }
        }

        async function cargarPrecioApoyo() {
            decPrecioApoyo = null;
            if (!decGlobal.productoId) {
                return;
            }
            try {
                decPrecioApoyo = await api('/api/decisiones/precio-apoyo?producto_id=' + encodeURIComponent(decGlobal.productoId) + '&dias=' + diasDecision());
            } catch (e) {
                decPrecioApoyo = null;
            }
        }

        async function actualizarApoyoDecision() {
            await cargarApoyoDecision();
            await aplicarDefaultsDecision();
            renderizarApoyoDecision();
            renderizarFormularioDecision();
            document.getElementById('resultadoDecision').innerHTML = '';
        }

        async function cambiarTipoDecision(valor) {
            decTipo = valor;
            await aplicarDefaultsDecision();
            mostrarDescripcionDecision();
            renderizarApoyoDecision();
            renderizarFormularioDecision();
            document.getElementById('resultadoDecision').innerHTML = '';
        }

        function mostrarDescripcionDecision() {
            const el = document.getElementById('decDescripcion');
            if (el) {
                el.innerText = TIPOS_DECISION[decTipo].descripcion;
            }
        }

        async function cargarAlternativasProveedor() {
            let costos = [];
            try {
                costos = await api('/api/decisiones/costos-proveedor?producto_id=' + encodeURIComponent(decGlobal.productoId));
            } catch (e) {
                costos = [];
            }
            const prod = productoPorId(decGlobal.productoId);
            let costoBase = 0;
            if (prod) {
                costoBase = Number(prod.costo_compra);
            }

            const alts = [];
            const usados = [];
            for (let i = 0; i < costos.length && i < 7; i++) {
                alts.push({ nombre: costos[i].proveedor, valor: 10, costo: costos[i].costo, producto: '' });
                usados.push(costos[i].proveedor);
            }

            if (alts.length > 0) {
                decNotaProv = 'Los costos salen de la última compra de este producto a cada proveedor. Puedes cambiarlos.';
            } else {
                decNotaProv = 'Este producto aún no tiene compras registradas. Captura el costo que ofrece cada proveedor o registra una compra primero.';
            }

            if (alts.length < 2) {
                let registrados = [];
                if (decApoyo) {
                    registrados = decApoyo.proveedores;
                }
                for (let i = 0; i < registrados.length; i++) {
                    if (alts.length < 3 && !contiene(usados, registrados[i].nombre)) {
                        alts.push({ nombre: registrados[i].nombre, valor: 10, costo: redondear(costoBase), producto: '' });
                        usados.push(registrados[i].nombre);
                    }
                }
            }

            while (alts.length < 2) {
                alts.push({ nombre: 'Proveedor ' + String.fromCharCode(65 + alts.length), valor: 10, costo: redondear(costoBase), producto: '' });
            }
            decAlternativas = alts;
        }

        async function prepararPrecioDecision() {
            await cargarPrecioApoyo();
            const prod = productoPorId(decGlobal.productoId);
            let precioBase = 100;
            decGlobal.costo = 0;
            if (prod) {
                precioBase = Number(prod.precio);
                decGlobal.costo = Number(prod.costo_compra);
            }
            let real = 0;
            if (decPrecioApoyo) {
                real = Number(decPrecioApoyo.demandaMensual);
            }
            if (real > 0) {
                decGlobal.demandaBase = redondear(real);
                decNotaPrecio = 'La demanda base sale de las piezas que vendiste de este producto en el periodo, convertidas a piezas por mes.';
            } else {
                decGlobal.demandaBase = 10;
                decNotaPrecio = 'Este producto no tiene ventas en el periodo, así que la demanda base de 10 piezas por mes es un supuesto. Cámbiala si conoces la real.';
            }
            const factores = [0.9, 1, 1.1, 1.2];
            decAlternativas = [];
            for (let i = 0; i < factores.length; i++) {
                decAlternativas.push({ nombre: '', valor: redondear(precioBase * factores[i]), costo: '', producto: '' });
            }
        }

        async function aplicarDefaultsDecision() {
            const ap = decApoyo;
            let primero = null;
            if (catalogoCache.length > 0) {
                primero = catalogoCache[0];
            }
            decGlobal = {
                productoId: '',
                rescate: 0,
                alfa: 0.5,
                ingreso: 500,
                descuento: 15,
                costoPromo: 0,
                costo: 0,
                demandaBase: 10,
                elasticidad: -1
            };
            if (primero) {
                decGlobal.productoId = String(primero.id);
                decGlobal.costo = Number(primero.costo_compra);
            }
            decNotaProv = '';
            decNotaPrecio = '';

            if (decTipo === 'piezas') {
                const cantidades = [5, 10, 20];
                decAlternativas = [];
                for (let i = 0; i < cantidades.length; i++) {
                    decAlternativas.push({ nombre: '', valor: cantidades[i], costo: '', producto: '' });
                }
                decEscenarios = armarEscenarios([['Demanda baja', 5], ['Demanda media', 10], ['Demanda alta', 20]]);
            } else if (decTipo === 'proveedor') {
                decAlternativas = [];
                decEscenarios = armarEscenarios([['Demanda baja', 5], ['Demanda media', 10], ['Demanda alta', 20]]);
                await cargarAlternativasProveedor();
            } else if (decTipo === 'mecanico') {
                let base = 20;
                if (ap && ap.servicios.porMes > 0) {
                    base = Math.round(ap.servicios.porMes);
                }
                if (ap && ap.servicios.ingresoPromedio > 0) {
                    decGlobal.ingreso = Math.round(ap.servicios.ingresoPromedio);
                }
                decAlternativas = [
                    { nombre: 'No contratar', valor: base, costo: 0, producto: '' },
                    { nombre: 'Medio tiempo', valor: Math.round(base * 1.5), costo: 6000, producto: '' },
                    { nombre: 'Tiempo completo', valor: base * 2, costo: 12000, producto: '' }
                ];
                decEscenarios = armarEscenarios([
                    ['Pocas citas', Math.round(base * 0.7)],
                    ['Citas normales', base],
                    ['Muchas citas', Math.round(base * 1.3)]
                ]);
            } else if (decTipo === 'descanso') {
                decAlternativas = [];
                for (let i = 0; i < DIAS_SEMANA.length; i++) {
                    decAlternativas.push({ nombre: DIAS_SEMANA[i], valor: promedioDia(DIAS_SEMANA[i]), costo: '', producto: '' });
                }
                decEscenarios = armarEscenarios([['Afluencia baja', 0.8], ['Afluencia normal', 1], ['Afluencia alta', 1.2]]);
            } else if (decTipo === 'promocion') {
                const candidatos = [];
                if (ap) {
                    for (let i = 0; i < ap.rotacion.length && candidatos.length < 3; i++) {
                        if (ap.rotacion[i].stock > 0) {
                            candidatos.push(String(ap.rotacion[i].id));
                        }
                    }
                }
                for (let i = 0; i < catalogoCache.length; i++) {
                    if (candidatos.length < 3 && !contiene(candidatos, String(catalogoCache[i].id))) {
                        candidatos.push(String(catalogoCache[i].id));
                    }
                }
                decAlternativas = [];
                for (let i = 0; i < candidatos.length; i++) {
                    decAlternativas.push({ nombre: '', valor: '', costo: '', producto: candidatos[i] });
                }
                decEscenarios = armarEscenarios([['Respuesta baja', 20], ['Respuesta media', 40], ['Respuesta alta', 70]]);
            } else if (decTipo === 'precio') {
                decEscenarios = armarEscenarios([['Demanda baja', 0.7], ['Demanda media', 1], ['Demanda alta', 1.3]]);
                await prepararPrecioDecision();
            }
        }

        function renderizarApoyoDecision() {
            const cont = document.getElementById('decApoyo');
            if (!cont) {
                return;
            }
            if (decTipo === 'piezas') {
                cont.innerHTML = '<div class="summary-box no-print"><p style="font-size:0.85rem;">Datos de apoyo: el costo y el precio de la refacción salen del catálogo.</p></div>';
                return;
            }
            if (decTipo === 'precio') {
                const prod = productoPorId(decGlobal.productoId);
                if (!prod) {
                    cont.innerHTML = '<div class="summary-box no-print"><p style="font-size:0.85rem;">No hay productos en el catálogo.</p></div>';
                    return;
                }
                const costo = Number(decGlobal.costo);
                const precio = Number(prod.precio);
                let vendidas = 0;
                let mensual = 0;
                let periodoTxt = '';
                if (decPrecioApoyo) {
                    vendidas = Number(decPrecioApoyo.vendidas);
                    mensual = Number(decPrecioApoyo.demandaMensual);
                    periodoTxt = ' (últimos ' + decPrecioApoyo.dias + ' días)';
                }
                cont.innerHTML = `
                    <div class="summary-box">
                        <h3 style="font-size:0.9rem;">Datos del producto${periodoTxt}</h3>
                        <div class="report-summary-grid">
                            <div class="report-total-card">Costo vigente<strong>${formatearMoneda(costo)}</strong></div>
                            <div class="report-total-card">Precio actual<strong>${formatearMoneda(precio)}</strong></div>
                            <div class="report-total-card">Margen actual por pieza<strong>${formatearMoneda(precio - costo)}</strong></div>
                            <div class="report-total-card">Piezas vendidas en el periodo<strong>${vendidas.toFixed(0)}</strong></div>
                            <div class="report-total-card">Demanda mensual real<strong>${mensual.toFixed(1)}</strong></div>
                        </div>
                        <p style="font-size:0.8rem;">${esc(decNotaPrecio)}</p>
                    </div>`;
                return;
            }
            if (!decApoyo) {
                cont.innerHTML = '<div class="summary-box no-print"><p style="font-size:0.85rem;">No se pudieron cargar los datos de apoyo. Puedes capturar los valores manualmente.</p></div>';
                return;
            }
            const periodo = formatoFecha(decApoyo.inicio) + ' al ' + formatoFecha(decApoyo.fin) + ' (' + decApoyo.dias + ' días)';
            if (decTipo === 'descanso') {
                let menor = null;
                for (let i = 0; i < decApoyo.atenciones.length; i++) {
                    const d = decApoyo.atenciones[i];
                    if (d.ocurrencias > 0) {
                        if (menor === null || d.promedio < menor.promedio) {
                            menor = d;
                        }
                    }
                }
                let filas = '';
                for (let i = 0; i < decApoyo.atenciones.length; i++) {
                    const d = decApoyo.atenciones[i];
                    let marca = '';
                    if (menor && menor.dia === d.dia) {
                        marca = '(menor) ';
                    }
                    filas += `
                        <tr>
                            <td>${marca}<strong>${esc(d.dia)}</strong></td>
                            <td>${d.total}</td>
                            <td>${d.ocurrencias}</td>
                            <td>${Number(d.promedio).toFixed(2)}</td>
                        </tr>`;
                }
                cont.innerHTML = `
                    <div class="summary-box">
                        <h3 style="font-size:0.9rem;">Atenciones por día de la semana (${periodo})</h3>
                        <div class="table-scroll"><table class="data-table">
                            <thead><tr><th>Día</th><th>Atenciones registradas</th><th>Veces que ocurrió el día</th><th>Promedio por día</th></tr></thead>
                            <tbody>${filas}</tbody>
                        </table></div>
                        <p style="font-size:0.8rem; margin-top:8px;">(menor) marca el día con menor movimiento. Se cuentan citas previas y clientes sin cita por su fecha de captura.</p>
                    </div>`;
            } else if (decTipo === 'promocion') {
                let filas = '';
                for (let i = 0; i < decApoyo.rotacion.length && i < 10; i++) {
                    const p = decApoyo.rotacion[i];
                    filas += `
                        <tr>
                            <td>${esc(p.sku)}</td>
                            <td>${esc(p.nombre)}</td>
                            <td>${p.stock}</td>
                            <td>${Number(p.vendidas).toFixed(0)}</td>
                            <td>${Number(p.rotacion).toFixed(2)}</td>
                        </tr>`;
                }
                if (filas === '') {
                    filas = '<tr><td colspan="5" style="text-align:center;">No hay productos registrados.</td></tr>';
                }
                cont.innerHTML = `
                    <div class="summary-box">
                        <h3 style="font-size:0.9rem;">Productos con menor rotación (${periodo})</h3>
                        <div class="table-scroll"><table class="data-table">
                            <thead><tr><th>SKU</th><th>Producto</th><th>Stock</th><th>Piezas vendidas</th><th>Rotación (vendidas / stock)</th></tr></thead>
                            <tbody>${filas}</tbody>
                        </table></div>
                        <p style="font-size:0.8rem; margin-top:8px;">Cuenta ventas de mostrador y refacciones usadas en servicios cobrados.</p>
                    </div>`;
            } else if (decTipo === 'proveedor') {
                let filas = '';
                for (let i = 0; i < decApoyo.proveedores.length; i++) {
                    const p = decApoyo.proveedores[i];
                    filas += `
                        <tr>
                            <td>${esc(p.nombre)}</td>
                            <td>${p.productos}</td>
                            <td>${formatearMoneda(p.costoPromedio)}</td>
                        </tr>`;
                }
                if (filas === '') {
                    filas = '<tr><td colspan="3" style="text-align:center;">No hay proveedores registrados.</td></tr>';
                }
                cont.innerHTML = `
                    <div class="summary-box">
                        <h3 style="font-size:0.9rem;">Proveedores registrados</h3>
                        <div class="table-scroll"><table class="data-table">
                            <thead><tr><th>Proveedor</th><th>Productos que surte</th><th>Costo promedio por pieza</th></tr></thead>
                            <tbody>${filas}</tbody>
                        </table></div>
                        <p style="font-size:0.8rem; margin-top:8px;">${esc(decNotaProv)}</p>
                    </div>`;
            } else if (decTipo === 'mecanico') {
                const s = decApoyo.servicios;
                cont.innerHTML = `
                    <div class="summary-box">
                        <h3 style="font-size:0.9rem;">Servicios del taller (${periodo})</h3>
                        <div class="report-summary-grid">
                            <div class="report-total-card">Servicios cobrados<strong>${s.total}</strong></div>
                            <div class="report-total-card">Servicios por mes<strong>${Number(s.porMes).toFixed(1)}</strong></div>
                            <div class="report-total-card">Ingreso promedio por servicio<strong>${formatearMoneda(s.ingresoPromedio)}</strong></div>
                            <div class="report-total-card">Mecánicos activos<strong>${s.mecanicosActivos}</strong></div>
                        </div>
                    </div>`;
            }
        }

        function leerCampoDecision(id, clave) {
            const el = document.getElementById(id);
            if (el) {
                decGlobal[clave] = el.value;
            }
        }

        function leerFormularioDecision() {
            for (let k = 0; k < decAlternativas.length; k++) {
                const a = decAlternativas[k];
                const nombre = document.getElementById('decAltNombre' + k);
                if (nombre) {
                    a.nombre = nombre.value;
                }
                const valor = document.getElementById('decAltValor' + k);
                if (valor) {
                    a.valor = valor.value;
                }
                const costo = document.getElementById('decAltCosto' + k);
                if (costo) {
                    a.costo = costo.value;
                }
                const producto = document.getElementById('decAltProducto' + k);
                if (producto) {
                    a.producto = producto.value;
                }
            }
            for (let k = 0; k < decEscenarios.length; k++) {
                const e = decEscenarios[k];
                const nombre = document.getElementById('decEscNombre' + k);
                if (nombre) {
                    e.nombre = nombre.value;
                }
                const valor = document.getElementById('decEscValor' + k);
                if (valor) {
                    e.valor = valor.value;
                }
                const prob = document.getElementById('decEscProb' + k);
                if (prob) {
                    e.prob = prob.value;
                }
            }
            leerCampoDecision('decProducto', 'productoId');
            leerCampoDecision('decRescate', 'rescate');
            leerCampoDecision('decAlfa', 'alfa');
            leerCampoDecision('decIngreso', 'ingreso');
            leerCampoDecision('decDescuento', 'descuento');
            leerCampoDecision('decCostoPromo', 'costoPromo');
            leerCampoDecision('decCosto', 'costo');
            leerCampoDecision('decDemandaBase', 'demandaBase');
            leerCampoDecision('decElasticidad', 'elasticidad');
        }

        async function cambiarProductoDecision() {
            leerFormularioDecision();
            if (decTipo === 'proveedor') {
                await cargarAlternativasProveedor();
                renderizarApoyoDecision();
                renderizarFormularioDecision();
            } else if (decTipo === 'precio') {
                await prepararPrecioDecision();
                renderizarApoyoDecision();
                renderizarFormularioDecision();
            }
        }

        function entradaDecision(id, valor, tipo, extra) {
            let atributos = '';
            if (extra) {
                atributos = extra;
            }
            return '<input type="' + tipo + '" class="celda-decision" id="' + id + '" value="' + esc(valor) + '" ' + atributos + '>';
        }

        function filaAlternativaDecision(a, k) {
            let quitar = '';
            if (decAlternativas.length > 2) {
                quitar = '<button type="button" class="btn-remove-item" onclick="quitarAlternativaDecision(' + k + ')">Quitar</button>';
            }
            if (decTipo === 'piezas') {
                return '<tr><td>Alternativa ' + (k + 1) + '</td><td>' + entradaDecision('decAltValor' + k, a.valor, 'number', 'min="0" step="1"') + '</td><td>' + quitar + '</td></tr>';
            }
            if (decTipo === 'proveedor') {
                return `<tr>
                    <td><input type="text" class="celda-decision" id="decAltNombre${k}" value="${esc(a.nombre)}" list="listaProveedoresDecision" maxlength="60"></td>
                    <td>${entradaDecision('decAltCosto' + k, a.costo, 'number', 'min="0" step="0.01"')}</td>
                    <td>${entradaDecision('decAltValor' + k, a.valor, 'number', 'min="0" step="1"')}</td>
                    <td>${quitar}</td></tr>`;
            }
            if (decTipo === 'mecanico') {
                return `<tr>
                    <td><input type="text" class="celda-decision" id="decAltNombre${k}" value="${esc(a.nombre)}" maxlength="60"></td>
                    <td>${entradaDecision('decAltValor' + k, a.valor, 'number', 'min="0" step="1"')}</td>
                    <td>${entradaDecision('decAltCosto' + k, a.costo, 'number', 'min="0" step="0.01"')}</td>
                    <td>${quitar}</td></tr>`;
            }
            if (decTipo === 'descanso') {
                let dias = '';
                for (let i = 0; i < DIAS_SEMANA.length; i++) {
                    let marca = '';
                    if (DIAS_SEMANA[i] === a.nombre) {
                        marca = 'selected';
                    }
                    dias += '<option value="' + DIAS_SEMANA[i] + '" ' + marca + '>' + DIAS_SEMANA[i] + '</option>';
                }
                return `<tr>
                    <td><select class="celda-decision" id="decAltNombre${k}" onchange="cambiarDiaDecision(${k})">${dias}</select></td>
                    <td>${entradaDecision('decAltValor' + k, a.valor, 'number', 'min="0" step="0.01"')}</td>
                    <td>${quitar}</td></tr>`;
            }
            if (decTipo === 'precio') {
                return '<tr><td>Precio ' + (k + 1) + '</td><td>' + entradaDecision('decAltValor' + k, a.valor, 'number', 'min="0" step="0.01"') + '</td><td>' + quitar + '</td></tr>';
            }
            return `<tr>
                <td><select class="celda-decision" id="decAltProducto${k}" style="width:100%;">${opcionesProductosDecision(a.producto)}</select></td>
                <td>${quitar}</td></tr>`;
        }

        function filaEscenarioDecision(e, k) {
            let quitar = '';
            if (decEscenarios.length > 2) {
                quitar = '<button type="button" class="btn-remove-item" onclick="quitarEscenarioDecision(' + k + ')">Quitar</button>';
            }
            let paso = 'min="0" step="1"';
            if (decTipo === 'descanso') {
                paso = 'min="0.1" step="0.05"';
            }
            if (decTipo === 'precio') {
                paso = 'min="0.1" step="0.05"';
            }
            if (decTipo === 'promocion') {
                paso = 'min="0" max="100" step="1"';
            }
            return `<tr>
                <td><input type="text" class="celda-decision" id="decEscNombre${k}" value="${esc(e.nombre)}" maxlength="60"></td>
                <td>${entradaDecision('decEscValor' + k, e.valor, 'number', paso)}</td>
                <td>${entradaDecision('decEscProb' + k, e.prob, 'number', 'min="0" max="1" step="0.01"')}</td>
                <td>${quitar}</td></tr>`;
        }

        function renderizarFormularioDecision() {
            const cont = document.getElementById('decFormulario');
            if (!cont) {
                return;
            }
            const g = decGlobal;

            let selectorProducto = opcionesProductosDecision(g.productoId);
            if (selectorProducto === '') {
                selectorProducto = '<option value="">No hay productos</option>';
            }

            let camposGlobales = '';
            if (decTipo === 'piezas' || decTipo === 'proveedor') {
                camposGlobales = `
                    <div class="input-group">
                        <label>Refacción a analizar</label>
                        <select id="decProducto" onchange="cambiarProductoDecision()">${selectorProducto}</select>
                    </div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Valor de rescate por pieza sobrante ($ MXN, 0 si no se recupera nada)</label>
                            <input type="number" id="decRescate" value="${esc(g.rescate)}" min="0" step="0.01">
                        </div>
                        <div class="input-group">
                            <label>Coeficiente de optimismo α de Hurwicz (0 a 1)</label>
                            <input type="number" id="decAlfa" value="${esc(g.alfa)}" min="0" max="1" step="0.1">
                        </div>
                    </div>`;
            } else if (decTipo === 'precio') {
                camposGlobales = `
                    <div class="input-group">
                        <label>Refacción a analizar</label>
                        <select id="decProducto" onchange="cambiarProductoDecision()">${selectorProducto}</select>
                    </div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Costo por pieza ($ MXN, por defecto el último costo de compra)</label>
                            <input type="number" id="decCosto" value="${esc(g.costo)}" min="0" step="0.01">
                        </div>
                        <div class="input-group">
                            <label>Demanda base (piezas por mes, de tus ventas reales)</label>
                            <input type="number" id="decDemandaBase" value="${esc(g.demandaBase)}" min="0" step="0.1">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Elasticidad precio de la demanda (supuesto, negativa: −1 = si el precio sube 10 %, la demanda baja 10 %)</label>
                            <input type="number" id="decElasticidad" value="${esc(g.elasticidad)}" max="0" step="0.1">
                        </div>
                        <div class="input-group">
                            <label>Coeficiente de optimismo α de Hurwicz (0 a 1)</label>
                            <input type="number" id="decAlfa" value="${esc(g.alfa)}" min="0" max="1" step="0.1">
                        </div>
                    </div>`;
            } else if (decTipo === 'mecanico') {
                camposGlobales = `
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Ingreso promedio por servicio ($ MXN)</label>
                            <input type="number" id="decIngreso" value="${esc(g.ingreso)}" min="0" step="0.01">
                        </div>
                        <div class="input-group">
                            <label>Coeficiente de optimismo α de Hurwicz (0 a 1)</label>
                            <input type="number" id="decAlfa" value="${esc(g.alfa)}" min="0" max="1" step="0.1">
                        </div>
                    </div>`;
            } else if (decTipo === 'promocion') {
                camposGlobales = `
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Descuento de la promoción (%)</label>
                            <input type="number" id="decDescuento" value="${esc(g.descuento)}" min="0" max="100" step="1">
                        </div>
                        <div class="input-group">
                            <label>Costo de la promoción ($ MXN, por producto)</label>
                            <input type="number" id="decCostoPromo" value="${esc(g.costoPromo)}" min="0" step="0.01">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Coeficiente de optimismo α de Hurwicz (0 a 1)</label>
                        <input type="number" id="decAlfa" value="${esc(g.alfa)}" min="0" max="1" step="0.1">
                    </div>`;
            } else {
                camposGlobales = `
                    <div class="input-group">
                        <label>Coeficiente de optimismo α de Hurwicz (0 a 1)</label>
                        <input type="number" id="decAlfa" value="${esc(g.alfa)}" min="0" max="1" step="0.1">
                    </div>`;
            }

            let encabezadoAlt = '<th>Alternativa</th><th>Piezas a surtir</th><th></th>';
            let encabezadoEsc = '<th>Escenario</th><th>Demanda (piezas)</th><th>Probabilidad</th><th></th>';
            if (decTipo === 'proveedor') {
                encabezadoAlt = '<th>Proveedor</th><th>Costo por pieza</th><th>Pedido (piezas)</th><th></th>';
            } else if (decTipo === 'mecanico') {
                encabezadoAlt = '<th>Opción</th><th>Capacidad (servicios/mes)</th><th>Costo mensual</th><th></th>';
                encabezadoEsc = '<th>Escenario</th><th>Servicios por mes</th><th>Probabilidad</th><th></th>';
            } else if (decTipo === 'descanso') {
                encabezadoAlt = '<th>Día de descanso</th><th>Atenciones promedio</th><th></th>';
                encabezadoEsc = '<th>Escenario</th><th>Factor de afluencia (1 = normal)</th><th>Probabilidad</th><th></th>';
            } else if (decTipo === 'promocion') {
                encabezadoAlt = '<th>Producto</th><th></th>';
                encabezadoEsc = '<th>Escenario</th><th>% del stock que se vende</th><th>Probabilidad</th><th></th>';
            } else if (decTipo === 'precio') {
                encabezadoAlt = '<th>Alternativa</th><th>Precio de venta ($ MXN)</th><th></th>';
                encabezadoEsc = '<th>Escenario</th><th>Factor de demanda (1 = demanda base)</th><th>Probabilidad</th><th></th>';
            }

            let filasAlt = '';
            for (let k = 0; k < decAlternativas.length; k++) {
                filasAlt += filaAlternativaDecision(decAlternativas[k], k);
            }
            let filasEsc = '';
            for (let k = 0; k < decEscenarios.length; k++) {
                filasEsc += filaEscenarioDecision(decEscenarios[k], k);
            }

            let botonAlt = '';
            if (decAlternativas.length < 7) {
                botonAlt = '<button type="button" class="btn-add-item" style="margin-top:10px;" onclick="agregarAlternativaDecision()">+ Agregar alternativa</button>';
            }
            let botonEsc = '';
            if (decEscenarios.length < 7) {
                botonEsc = '<button type="button" class="btn-add-item" style="margin-top:10px;" onclick="agregarEscenarioDecision()">+ Agregar escenario</button>';
            }

            let listaProv = '<datalist id="listaProveedoresDecision"></datalist>';
            if (decApoyo) {
                let opcionesProv = '';
                for (let i = 0; i < decApoyo.proveedores.length; i++) {
                    opcionesProv += '<option value="' + esc(decApoyo.proveedores[i].nombre) + '">';
                }
                listaProv = '<datalist id="listaProveedoresDecision">' + opcionesProv + '</datalist>';
            }

            let notaProveedor = '';
            if (decTipo === 'proveedor' && decNotaProv) {
                notaProveedor = '<p style="font-size:0.8rem; margin-bottom:10px;">' + esc(decNotaProv) + '</p>';
            }
            let notaPrecio = '';
            if (decTipo === 'precio') {
                notaPrecio = '<p style="font-size:0.8rem; margin-bottom:10px;">Piezas esperadas = demanda base × factor del escenario × (precio / precio actual) ^ elasticidad. La elasticidad es un supuesto: tus ventas no muestran cómo reacciona la demanda a precios distintos.</p>';
            }

            cont.innerHTML = `
                ${camposGlobales}
                ${listaProv}
                ${notaProveedor}
                ${notaPrecio}
                <div class="form-grid">
                    <div>
                        <h3 style="font-size:0.9rem;">Alternativas (2 a 7)</h3>
                        <div class="table-scroll"><table class="data-table">
                            <thead><tr>${encabezadoAlt}</tr></thead>
                            <tbody>${filasAlt}</tbody>
                        </table></div>
                        ${botonAlt}
                    </div>
                    <div>
                        <h3 style="font-size:0.9rem;">Escenarios (2 a 7)</h3>
                        <div class="table-scroll"><table class="data-table">
                            <thead><tr>${encabezadoEsc}</tr></thead>
                            <tbody>${filasEsc}</tbody>
                        </table></div>
                        ${botonEsc}
                    </div>
                </div>
                <p style="font-size:0.8rem;">Las probabilidades deben sumar 1. Se usan solo para el VME; los demás criterios no las necesitan.</p>
                <button type="button" class="btn-action" id="btnCalcularDecision" onclick="calcularDecision()">Calcular decisión</button>
            `;
        }

        function cambiarDiaDecision(k) {
            const sel = document.getElementById('decAltNombre' + k);
            const campo = document.getElementById('decAltValor' + k);
            if (sel && campo) {
                campo.value = promedioDia(sel.value);
            }
        }

        function agregarAlternativaDecision() {
            leerFormularioDecision();
            if (decAlternativas.length >= 7) {
                return;
            }
            let nueva = { nombre: '', valor: '', costo: '', producto: '' };
            if (decTipo === 'descanso') {
                const usados = listaDe(decAlternativas, 'nombre');
                let libre = null;
                for (let i = 0; i < DIAS_SEMANA.length; i++) {
                    if (libre === null && !contiene(usados, DIAS_SEMANA[i])) {
                        libre = DIAS_SEMANA[i];
                    }
                }
                if (libre === null) {
                    alert('Ya están los siete días de la semana.');
                    return;
                }
                nueva = { nombre: libre, valor: promedioDia(libre), costo: '', producto: '' };
            } else if (decTipo === 'promocion') {
                const usados = [];
                for (let i = 0; i < decAlternativas.length; i++) {
                    usados.push(String(decAlternativas[i].producto));
                }
                let libre = null;
                for (let i = 0; i < catalogoCache.length; i++) {
                    if (libre === null && !contiene(usados, String(catalogoCache[i].id))) {
                        libre = catalogoCache[i];
                    }
                }
                if (libre === null) {
                    alert('No hay más productos en el catálogo.');
                    return;
                }
                nueva = { nombre: '', valor: '', costo: '', producto: String(libre.id) };
            } else if (decTipo === 'proveedor') {
                const primero = productoPorId(decGlobal.productoId);
                let costoBase = 0;
                if (primero) {
                    costoBase = Number(primero.costo_compra);
                }
                nueva = { nombre: 'Proveedor ' + (decAlternativas.length + 1), valor: 10, costo: costoBase, producto: '' };
            } else if (decTipo === 'mecanico') {
                nueva = { nombre: 'Opción ' + (decAlternativas.length + 1), valor: 0, costo: 0, producto: '' };
            } else if (decTipo === 'precio') {
                let ultimo = 0;
                if (decAlternativas.length > 0) {
                    ultimo = Number(decAlternativas[decAlternativas.length - 1].valor);
                }
                nueva = { nombre: '', valor: redondear(ultimo * 1.1), costo: '', producto: '' };
            } else {
                nueva = { nombre: '', valor: 0, costo: '', producto: '' };
            }
            decAlternativas.push(nueva);
            renderizarFormularioDecision();
        }

        function quitarAlternativaDecision(k) {
            leerFormularioDecision();
            if (decAlternativas.length <= 2) {
                return;
            }
            decAlternativas.splice(k, 1);
            renderizarFormularioDecision();
        }

        function agregarEscenarioDecision() {
            leerFormularioDecision();
            if (decEscenarios.length >= 7) {
                return;
            }
            let valorBase = 0;
            if (decTipo === 'descanso' || decTipo === 'precio') {
                valorBase = 1;
            }
            decEscenarios.push({ nombre: 'Escenario ' + (decEscenarios.length + 1), valor: valorBase, prob: 0 });
            renderizarFormularioDecision();
        }

        function quitarEscenarioDecision(k) {
            leerFormularioDecision();
            if (decEscenarios.length <= 2) {
                return;
            }
            decEscenarios.splice(k, 1);
            renderizarFormularioDecision();
        }

        async function calcularDecision() {
            leerFormularioDecision();
            const cuerpo = {
                tipo: decTipo,
                alfa: decGlobal.alfa,
                nombres_alternativas: listaDe(decAlternativas, 'nombre'),
                nombres_escenarios: listaDe(decEscenarios, 'nombre'),
                escenarios: listaDe(decEscenarios, 'valor'),
                probabilidades: listaDe(decEscenarios, 'prob')
            };
            if (decTipo === 'piezas') {
                cuerpo.producto_id = decGlobal.productoId;
                cuerpo.rescate = decGlobal.rescate;
                cuerpo.alternativas = listaDe(decAlternativas, 'valor');
            } else if (decTipo === 'proveedor') {
                cuerpo.producto_id = decGlobal.productoId;
                cuerpo.rescate = decGlobal.rescate;
                cuerpo.alternativas = listaDe(decAlternativas, 'valor');
                cuerpo.costos = listaDe(decAlternativas, 'costo');
            } else if (decTipo === 'mecanico') {
                cuerpo.ingreso = decGlobal.ingreso;
                cuerpo.alternativas = listaDe(decAlternativas, 'valor');
                cuerpo.costos = listaDe(decAlternativas, 'costo');
            } else if (decTipo === 'descanso') {
                cuerpo.alternativas = listaDe(decAlternativas, 'valor');
                if (decApoyo) {
                    cuerpo.total_semana = decApoyo.totalSemana;
                } else {
                    cuerpo.total_semana = '';
                }
            } else if (decTipo === 'promocion') {
                cuerpo.productos = listaDe(decAlternativas, 'producto');
                cuerpo.descuento = decGlobal.descuento;
                cuerpo.costo_promocion = decGlobal.costoPromo;
            } else if (decTipo === 'precio') {
                cuerpo.producto_id = decGlobal.productoId;
                cuerpo.costo = decGlobal.costo;
                cuerpo.demanda_base = decGlobal.demandaBase;
                cuerpo.elasticidad = decGlobal.elasticidad;
                cuerpo.alternativas = listaDe(decAlternativas, 'valor');
            }
            const boton = document.getElementById('btnCalcularDecision');
            if (boton) {
                boton.disabled = true;
            }
            try {
                const r = await enviar('POST', '/api/decisiones/calcular', cuerpo);
                mostrarResultadoDecision(r);
            } catch (e) {
                alert('No se pudo calcular: ' + e.message);
            }
            if (boton) {
                boton.disabled = false;
            }
        }

        function tablaMatrizDecision(r, matriz, resaltar) {
            let encabezado = '';
            for (let j = 0; j < r.etiquetasEscenarios.length; j++) {
                encabezado += '<th>' + esc(r.etiquetasEscenarios[j]) + '</th>';
            }
            let filas = '';
            for (let i = 0; i < matriz.length; i++) {
                filas += '<tr><td><strong>' + esc(r.etiquetasAlternativas[i]) + '</strong></td>';
                for (let j = 0; j < matriz[i].length; j++) {
                    const v = matriz[i][j];
                    let clase = '';
                    if (resaltar && v < 0) {
                        clase = 'dif-falta';
                    }
                    filas += '<td class="' + clase + '">' + formatoValorDecision(v, r.unidad) + '</td>';
                }
                filas += '</tr>';
            }
            return '<div class="table-scroll"><table class="data-table">'
                + '<thead><tr><th>Alternativa</th>' + encabezado + '</tr></thead>'
                + '<tbody>' + filas + '</tbody></table></div>';
        }

        function mostrarResultadoDecision(r) {
            let encabezadoCriterios = '';
            for (let c = 0; c < r.criterios.length; c++) {
                const crit = r.criterios[c];
                encabezadoCriterios += '<th>' + esc(crit.nombre) + '<br><span class="badge-tipo">' + esc(crit.tipoDecision) + '</span></th>';
            }

            let filasCriterios = '';
            for (let i = 0; i < r.etiquetasAlternativas.length; i++) {
                filasCriterios += '<tr><td><strong>' + esc(r.etiquetasAlternativas[i]) + '</strong></td>';
                for (let c = 0; c < r.criterios.length; c++) {
                    const crit = r.criterios[c];
                    const texto = formatoValorDecision(crit.valores[i], r.unidad);
                    if (crit.mejor === i) {
                        filasCriterios += '<td>(mejor) <strong>' + texto + '</strong></td>';
                    } else {
                        filasCriterios += '<td>' + texto + '</td>';
                    }
                }
                filasCriterios += '</tr>';
            }

            let recomendaciones = '';
            for (let c = 0; c < r.criterios.length; c++) {
                const crit = r.criterios[c];
                recomendaciones += `
                    <div class="summary-row">
                        <span>${esc(crit.nombre)} <span class="badge-tipo">${esc(crit.tipoDecision)}</span></span>
                        <strong>${esc(r.etiquetasAlternativas[crit.mejor])}</strong>
                    </div>`;
            }

            const votos = {};
            for (let c = 0; c < r.criterios.length; c++) {
                const indice = r.criterios[c].mejor;
                if (votos[indice] === undefined) {
                    votos[indice] = 0;
                }
                votos[indice] = votos[indice] + 1;
            }
            let ganadora = r.criterios[0].mejor;
            for (const clave in votos) {
                if (votos[clave] > votos[ganadora]) {
                    ganadora = Number(clave);
                }
            }

            let tituloPagos = 'atenciones conservadas';
            if (r.unidad === '$') {
                tituloPagos = 'utilidad';
            }

            document.getElementById('resultadoDecision').innerHTML = `
                <div class="summary-box">
                    <h3 style="font-size:0.95rem;">Tipo de problema: ${esc(r.tipoProblema)}</h3>
                    <p style="font-size:0.85rem;">${esc(r.descripcion)}</p>
                </div>
                <div class="summary-box">
                    <h3 style="font-size:0.9rem;">Tabla de pagos (${tituloPagos} de cada alternativa en cada escenario)</h3>
                    ${tablaMatrizDecision(r, r.pagos, true)}
                </div>
                <div class="summary-box">
                    <h3 style="font-size:0.9rem;">Tabla de arrepentimiento (Savage)</h3>
                    ${tablaMatrizDecision(r, r.arrepentimientos, false)}
                </div>
                <div class="summary-box">
                    <h3 style="font-size:0.9rem;">Resultado de cada criterio ((mejor) marca la mejor alternativa)</h3>
                    <div class="table-scroll"><table class="data-table">
                        <thead><tr><th>Alternativa</th>${encabezadoCriterios}</tr></thead>
                        <tbody>${filasCriterios}</tbody>
                    </table></div>
                </div>
                <div class="summary-box">
                    <h3 style="font-size:0.9rem;">Recomendación por criterio</h3>
                    ${recomendaciones}
                    <div class="summary-row total">
                        <span>Alternativa recomendada por más criterios (${votos[ganadora]} de ${r.criterios.length}):</span>
                        <span>${esc(r.etiquetasAlternativas[ganadora])}</span>
                    </div>
                </div>
                <button type="button" class="btn-action no-print" onclick="imprimirReporte()">Imprimir / Guardar PDF</button>
            `;
        }

        window.onload = function () {
            cambiarVistaAdmin('compras', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
