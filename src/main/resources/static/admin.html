<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Sistema MRX</title>
    <script src="sesion.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eaf3fb;
            --bg-soft: #f4f9ff;
            --panel: #f8fbff;
            --panel-alt: #ebf4ff;
            --panel-strong: #dfeeff;
            --border: #bfd6ef;
            --border-soft: #9dbfe9;
            --text: #111827;
            --muted: #476a8d;
            --muted-strong: #254868;
            --accent: #5b8ec9;
            --accent-strong: #3f72b5;
            --button-text: #f7fbff;
            --success: #55a66d;
            --danger: #d96b6b;
            --shadow: rgba(110, 145, 185, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .btn-logout {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .btn-movimientos {
            background: var(--accent);
            color: var(--button-text);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-movimientos:hover {
            background: var(--accent-strong);
            border-color: var(--accent-strong);
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--panel-alt);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--panel-strong);
            color: var(--text);
            border-color: var(--border-soft);
        }

        .nav-btn.active {
            background: var(--text);
            color: var(--button-text);
            border-color: var(--text);
            font-weight: 600;
        }

        .main-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
        }

        .panel-header p {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: var(--panel-alt);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
            background: var(--panel-strong);
        }

        .input-group input[readonly] {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .summary-box {
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: var(--text);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: var(--muted-strong);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-add-item {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .btn-secondary {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .qty-btn {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .btn-remove-item {
            color: var(--danger);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        .btn-edit-item {
            color: var(--accent);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-edit-item:hover { text-decoration: underline; }

        .badge-activo {
            background: #edf7ef;
            color: var(--success);
            border: 1px solid #b9d9c1;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-inactivo {
            background: #fff4f3;
            color: var(--danger);
            border: 1px solid #e9b8b5;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .dif-ok {
            color: var(--success);
        }

        .dif-falta {
            color: var(--danger);
        }

        .alert-box {
            display: none;
            padding: 14px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .data-table th, .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .data-table th {
            color: var(--muted);
            font-weight: 600;
            background: var(--panel-alt);
        }

        .report-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin: 18px 0;
        }

        .report-total-card {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-alt);
            color: var(--text);
        }

        .report-total-card strong {
            display: block;
            margin-top: 8px;
            font-size: 1.35rem;
        }

        .fondo-input {
            width: 100%;
            padding: 8px 10px;
            background: var(--panel);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }

        .fondo-botones {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .fondo-botones .btn-secondary {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.8rem;
        }

        .celda-decision {
            width: 100%;
            min-width: 90px;
            padding: 8px;
            background: var(--panel);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.85rem;
        }

        .badge-tipo {
            background: #edf4fc;
            color: var(--accent-strong);
            border: 1px solid #c5d9f0;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 4px;
        }

        .formula-box {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .formula-box:last-child {
            border-bottom: none;
        }

        .report-filter-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 10, 18, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 20px 40px var(--shadow);
        }

        .btn-close {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border-soft);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: var(--panel-alt); color: var(--text); }

        [style*="color:#ffffff"], [style*="color: #ffffff"],
        [style*="color:#fff"], [style*="color: #fff"] {
            color: var(--text) !important;
        }

        @media print {
            @page {
                size: landscape;
                margin: 12mm;
            }

            body.reporte-impresion {
                background: #fff !important;
                color: #111 !important;
                padding: 0 !important;
            }

            body.reporte-impresion .topbar,
            body.reporte-impresion .sidebar-buttons,
            body.reporte-impresion .modal-overlay,
            body.reporte-impresion .no-print {
                display: none !important;
            }

            body.reporte-impresion .workspace,
            body.reporte-impresion .main-panel {
                display: block !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                border: 0 !important;
                box-shadow: none !important;
                background: #fff !important;
            }

            body.reporte-impresion .panel-header h2,
            body.reporte-impresion .panel-header p,
            body.reporte-impresion .summary-box h3 {
                color: #111 !important;
            }

            body.reporte-impresion .table-scroll {
                overflow: visible !important;
            }

            body.reporte-impresion .summary-box,
            body.reporte-impresion .report-total-card,
            body.reporte-impresion .summary-row,
            body.reporte-impresion .formula-box,
            body.reporte-impresion .data-table th,
            body.reporte-impresion .data-table td {
                background: #fff !important;
                color: #111 !important;
                border-color: #aaa !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Panel del Administrador</h1>
            <div style="display:flex; gap:10px; align-items:center;">
                <button type="button" class="btn-movimientos" onclick="abrirMovimientos()">Historial de Movimientos</button>
                <a href="index.html" class="btn-logout">Cerrar Sesión</a>
            </div>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">Apartados</div>
                <button class="nav-btn active" onclick="cambiarVistaAdmin('compras', this)">
                    Compras a Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('proveedores', this)">
                    Gestión de Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('articulos', this)">
                    Gestión del Catálogo de Artículos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('mecanicos', this)">
                    Registro de Mecánicos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('historial_ventas', this)">
                    Historial de Ventas
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('cortes_caja', this)">
                    Cortes de Caja
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('historial_cobros', this)">
                    Historial de Mantenimientos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('decisiones', this)">
                    Toma de Decisiones
                </button>
            </div>

            <div class="main-panel" id="panel-contenido-admin">
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalDetalleCompra">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalCompraTitulo">Detalle de Factura</h2>
                <p id="modalCompraInfo">Proveedor / Fecha</p>
            </div>
            <div class="summary-box" id="modalCompraContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-close" onclick="cerrarModalCompra()">Cerrar Ventana</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalDetalleMecanico">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalMecanicoTitulo">Detalle del Mecánico</h2>
                <p id="modalMecanicoInfo">Especialidad</p>
            </div>
            <div class="summary-box" id="modalMecanicoContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-close" onclick="cerrarModalMecanico()">Cerrar Ventana</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalDetalleMovimiento">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalMovimientoTitulo">Detalle del Movimiento</h2>
                <p id="modalMovimientoInfo">Fecha y hora</p>
            </div>
            <div class="summary-box" id="modalMovimientoContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-close" onclick="cerrarModalMovimiento()">Cerrar Ventana</button>
            </div>
        </div>
    </div>

    <script>
        function esc(valor) {
            let texto = String(valor == null ? '' : valor);
            texto = texto.replace(/&/g, '&amp;');
            texto = texto.replace(/</g, '&lt;');
            texto = texto.replace(/>/g, '&gt;');
            texto = texto.replace(/"/g, '&quot;');
            texto = texto.replace(/'/g, '&#39;');
            return texto;
        }

        function dinero(n) {
            return Number(n || 0).toFixed(2);
        }

        function mismoId(a, b) {
            return String(a) === String(b);
        }

        function redondear(n) {
            return Math.round((Number(n) + Number.EPSILON) * 100) / 100;
        }

        function formatearMoneda(importe) {
            return new Intl.NumberFormat('es-MX', {
                style: 'currency',
                currency: 'MXN'
            }).format(Number(importe) || 0);
        }

        function buscarPorId(lista, id) {
            for (let i = 0; i < lista.length; i++) {
                if (mismoId(lista[i].id, id)) {
                    return lista[i];
                }
            }
            return null;
        }

        function contiene(lista, valor) {
            for (let i = 0; i < lista.length; i++) {
                if (lista[i] === valor) {
                    return true;
                }
            }
            return false;
        }

        function listaDe(lista, campo) {
            const salida = [];
            for (let i = 0; i < lista.length; i++) {
                salida.push(lista[i][campo]);
            }
            return salida;
        }

        function fechaLocalISO(fecha) {
            const anio = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const dia = String(fecha.getDate()).padStart(2, '0');
            return anio + '-' + mes + '-' + dia;
        }

        function hoyISO() {
            return fechaLocalISO(new Date());
        }

        function fechaVentaISO(texto) {
            const t = String(texto || '').trim();
            let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) {
                return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
            }
            m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) {
                return m[1] + '-' + m[2] + '-' + m[3];
            }
            return '';
        }

        function formatoFecha(f) {
            if (!f) {
                return '—';
            }
            const d = new Date(f + 'T12:00:00');
            if (isNaN(d.getTime())) {
                return esc(f);
            }
            return d.toLocaleDateString('es-MX');
        }

        function formatoFechaHora(ms) {
            const d = new Date(Number(ms));
            if (Number.isNaN(d.getTime())) {
                return '—';
            }
            return d.toLocaleString('es-MX');
        }

        async function api(url, opciones) {
            const resp = await fetch(url, opciones);
            let datos = null;
            try {
                datos = await resp.json();
            } catch (e) {
                datos = null;
            }
            if (!resp.ok) {
                let mensaje = 'Error del servidor (' + resp.status + ')';
                if (datos && datos.message) {
                    mensaje = datos.message;
                }
                throw new Error(mensaje);
            }
            return datos;
        }

        function enviar(metodo, url, cuerpo) {
            const opciones = {
                method: metodo,
                headers: { 'Content-Type': 'application/json' }
            };
            if (cuerpo) {
                opciones.body = JSON.stringify(cuerpo);
            }
            return api(url, opciones);
        }

        let catalogoCache = [];
        let proveedoresCache = [];
        let comprasCache = [];
        let mecanicosCache = [];
        let cobrosCache = [];
        let ventasCache = [];
        let cortesCache = [];
        let fondoCaja = 0;
        let itemsCompraActual = [];
        let idProveedorEditando = null;
        let idProductoEditando = null;
        let idMecanicoEditando = null;
        let filtroMecanicos = '';
        let rangoVentas = null;
        let rangoCobros = null;
        let rangoCortes = null;

        function panelAdmin() {
            return document.getElementById('panel-contenido-admin');
        }

        function mostrarCargando() {
            panelAdmin().innerHTML = '<div class="summary-box">Cargando datos desde la base de datos...</div>';
        }

        function mostrarErrorCarga(error, vista) {
            panelAdmin().innerHTML = `
                <div class="summary-box">
                    <p>No fue posible conectar con el servidor: ${esc(error.message)}</p>
                    <p style="margin-top:8px;">Si el servidor estaba dormido, espera un minuto e inténtalo de nuevo.</p>
                    <button class="btn-action" onclick="cambiarVistaAdmin('${vista}')">Reintentar</button>
                </div>`;
        }

        async function cambiarVistaAdmin(vista, boton) {
            if (boton) {
                const botones = document.querySelectorAll('.nav-btn');
                for (let i = 0; i < botones.length; i++) {
                    botones[i].classList.remove('active');
                }
                boton.classList.add('active');
            }
            mostrarCargando();
            try {
                if (vista === 'compras') {
                    itemsCompraActual = [];
                    proveedoresCache = await api('/api/proveedores');
                    catalogoCache = await api('/api/productos');
                    comprasCache = await api('/api/compras');
                    renderizarModuloCompras();
                } else if (vista === 'proveedores') {
                    idProveedorEditando = null;
                    proveedoresCache = await api('/api/proveedores');
                    renderizarModuloProveedores();
                } else if (vista === 'articulos') {
                    idProductoEditando = null;
                    catalogoCache = await api('/api/productos');
                    renderizarModuloArticulos();
                } else if (vista === 'mecanicos') {
                    idMecanicoEditando = null;
                    mecanicosCache = await api('/api/mecanicos');
                    try {
                        cobrosCache = await api('/api/cobros');
                    } catch (e) {
                        cobrosCache = [];
                    }
                    renderizarModuloMecanicos();
                } else if (vista === 'historial_ventas') {
                    await cargarVentas();
                    rangoVentas = null;
                    mostrarHistorialVentas();
                } else if (vista === 'cortes_caja') {
                    cortesCache = await api('/api/caja/cortes');
                    const fondo = await api('/api/caja/fondo');
                    fondoCaja = Number(fondo.fondo);
                    rangoCortes = null;
                    mostrarCortes();
                } else if (vista === 'historial_cobros') {
                    cobrosCache = await api('/api/cobros');
                    rangoCobros = null;
                    mostrarHistorialCobros();
                } else if (vista === 'decisiones') {
                    catalogoCache = await api('/api/productos');
                    await renderizarDecisiones();
                }
            } catch (e) {
                mostrarErrorCarga(e, vista);
            }
        }

        function costoSugeridoCompra(articulo, proveedor) {
            for (let i = 0; i < comprasCache.length; i++) {
                const c = comprasCache[i];
                if (c.proveedor === proveedor) {
                    const detalle = c.detalle || [];
                    for (let j = 0; j < detalle.length; j++) {
                        if (detalle[j].sku === articulo.sku) {
                            return Number(detalle[j].costo);
                        }
                    }
                }
            }
            return Number(articulo.costo_compra);
        }

        function precargarCostoCompra() {
            const sel = document.getElementById('selectCompraArticulo');
            const prov = document.getElementById('compraProveedorSelect');
            const campo = document.getElementById('compraCostoInput');
            if (!sel || !campo) {
                return;
            }
            const articulo = buscarPorId(catalogoCache, sel.value);
            if (!articulo) {
                campo.value = '';
                return;
            }
            let nombreProveedor = '';
            if (prov) {
                nombreProveedor = prov.value;
            }
            campo.value = costoSugeridoCompra(articulo, nombreProveedor);
        }

        function agregarArticuloACompra() {
            const sel = document.getElementById('selectCompraArticulo');
            if (!sel || !sel.value) {
                return;
            }
            const cantidad = parseInt(document.getElementById('compraCantidadInput').value) || 1;
            const costo = parseFloat(document.getElementById('compraCostoInput').value);
            if (Number.isNaN(costo) || costo <= 0) {
                alert('Captura el costo por pieza que cobra este proveedor.');
                return;
            }
            const articulo = buscarPorId(catalogoCache, sel.value);
            if (!articulo) {
                return;
            }

            const existe = buscarPorId(itemsCompraActual, articulo.id);
            if (existe) {
                existe.cantidad = existe.cantidad + cantidad;
                existe.costo = costo;
            } else {
                itemsCompraActual.push({
                    id: articulo.id,
                    sku: articulo.sku,
                    nombre: articulo.nombre,
                    costo: costo,
                    cantidad: cantidad
                });
            }
            actualizarTablaCompra();
        }

        function cambiarCostoCompra(id, valor) {
            const item = buscarPorId(itemsCompraActual, id);
            const costo = parseFloat(valor);
            if (item && !Number.isNaN(costo) && costo >= 0) {
                item.costo = costo;
            }
            actualizarTablaCompra();
        }

        function modificarCantidadCompra(id, delta) {
            const item = buscarPorId(itemsCompraActual, id);
            if (item) {
                item.cantidad = item.cantidad + delta;
                if (item.cantidad <= 0) {
                    removerArticuloCompra(id);
                } else {
                    actualizarTablaCompra();
                }
            }
        }

        function removerArticuloCompra(id) {
            const restantes = [];
            for (let i = 0; i < itemsCompraActual.length; i++) {
                if (!mismoId(itemsCompraActual[i].id, id)) {
                    restantes.push(itemsCompraActual[i]);
                }
            }
            itemsCompraActual = restantes;
            actualizarTablaCompra();
        }

        function actualizarTablaCompra() {
            const contenedor = document.getElementById('listaArticulosCompra');
            if (!contenedor) {
                return;
            }

            if (itemsCompraActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado artículos.</p>';
                document.getElementById('lblSubtotalCompra').innerText = '$0.00 MXN';
                document.getElementById('lblIvaCompra').innerText = '$0.00 MXN';
                document.getElementById('lblTotalCompra').innerText = '$0.00 MXN';
                return;
            }

            let subtotal = 0;
            let html = '';
            for (let i = 0; i < itemsCompraActual.length; i++) {
                const item = itemsCompraActual[i];
                const importe = item.costo * item.cantidad;
                subtotal = subtotal + importe;
                html += `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#e5e5e5; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${esc(item.sku)}</span>
                            <strong style="color:#ffffff;">${esc(item.nombre)}</strong>
                            <span style="margin-left:8px;">
                                <button class="qty-btn" onclick="modificarCantidadCompra(${item.id}, -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" onclick="modificarCantidadCompra(${item.id}, 1)">+</button>
                            </span>
                            <span style="margin-left:8px;">Costo: $
                                <input type="number" class="celda-decision" style="width:100px; min-width:100px;" min="0" step="0.01" value="${item.costo}" onchange="cambiarCostoCompra(${item.id}, this.value)">
                            </span>
                            <button class="btn-remove-item" onclick="removerArticuloCompra(${item.id})">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${dinero(importe)} MXN</span>
                    </div>`;
            }
            contenedor.innerHTML = html;

            const iva = subtotal * 0.16;
            const total = subtotal + iva;
            document.getElementById('lblSubtotalCompra').innerText = '$' + dinero(subtotal) + ' MXN';
            document.getElementById('lblIvaCompra').innerText = '$' + dinero(iva) + ' MXN';
            document.getElementById('lblTotalCompra').innerText = '$' + dinero(total) + ' MXN';
        }

        async function guardarCompraMercancia() {
            const factura = document.getElementById('compraFacturaInput').value.trim();
            const proveedor = document.getElementById('compraProveedorSelect').value;

            if (!factura) {
                alert('Ingresa el número de factura o remisión.');
                return;
            }
            if (!proveedor) {
                alert('Registra y selecciona un proveedor.');
                return;
            }
            if (itemsCompraActual.length === 0) {
                alert('Agrega al menos un artículo.');
                return;
            }
            for (let i = 0; i < itemsCompraActual.length; i++) {
                if (!(itemsCompraActual[i].costo > 0)) {
                    alert('Todos los artículos deben tener un costo mayor a cero.');
                    return;
                }
            }

            let subtotal = 0;
            const detalle = [];
            for (let i = 0; i < itemsCompraActual.length; i++) {
                const item = itemsCompraActual[i];
                const importe = redondear(item.costo * item.cantidad);
                subtotal = subtotal + importe;
                detalle.push({
                    producto_id: String(item.id),
                    sku: item.sku,
                    nombre: item.nombre,
                    costo: item.costo,
                    cantidad: item.cantidad,
                    importe: importe
                });
            }
            subtotal = redondear(subtotal);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);

            const boton = document.getElementById('btnGuardarCompra');
            if (boton) {
                boton.disabled = true;
            }
            try {
                await enviar('POST', '/api/compras', {
                    factura: factura,
                    proveedor: proveedor,
                    fecha: new Date().toLocaleDateString('es-MX'),
                    subtotal: subtotal,
                    iva: iva,
                    total: total,
                    detalle: detalle
                });
                document.getElementById('alertaCompra').style.display = 'block';
                setTimeout(function () {
                    cambiarVistaAdmin('compras');
                }, 1500);
            } catch (e) {
                if (boton) {
                    boton.disabled = false;
                }
                alert('No se pudo guardar la compra: ' + e.message);
            }
        }

            }

        function numeroDeCodigo(codigo) {
            const texto = String(codigo || '');
            const partes = texto.split('-');
            const ultima = partes[partes.length - 1];
            const numero = parseInt(ultima);
            if (Number.isNaN(numero)) {
                return 0;
            }
            return numero;
        }

        function leerUltimoCodigo() {
            let guardado = 0;
            try {
                guardado = parseInt(localStorage.getItem('ultimoCodigoArticulo')) || 0;
            } catch (e) {
                guardado = 0;
            }
            return guardado;
        }

        function guardarNumeroCodigo(numero) {
            try {
                if (numero > leerUltimoCodigo()) {
                    localStorage.setItem('ultimoCodigoArticulo', String(numero));
                }
            } catch (e) {
                return;
            }
        }

        function siguienteCodigoArticulo() {
            let mayor = 0;
            for (let i = 0; i < catalogoCache.length; i++) {
                const n = numeroDeCodigo(catalogoCache[i].sku);
                if (n > mayor) {
                    mayor = n;
                }
            }
            guardarNumeroCodigo(mayor);
            const guardado = leerUltimoCodigo();
            if (guardado > mayor) {
                mayor = guardado;
            }
            return 'REF-' + (mayor + 1);
        }

                if (a.stock < 5) {

                filasHTML += `

        function periodoSeleccionado(periodo) {

            const inicio = new Date(hoy);
            const fin = new Date(hoy);
            if (periodo === 'semana') {
                const diasDesdeLunes = (hoy.getDay() + 6) % 7;
                inicio.setDate(hoy.getDate() - diasDesdeLunes);
                fin.setDate(inicio.getDate() + 6);
            }
            return { inicio: fechaLocalISO(inicio), fin: fechaLocalISO(fin) };

        function rangoDe(rangoGuardado, fechaInicio, fechaFin) {
            const hoy = hoyISO();
            let inicio = hoy;
            let fin = hoy;
            if (fechaInicio) {
                inicio = fechaInicio;
            } else if (rangoGuardado) {
                inicio = rangoGuardado.inicio;
            }
            if (fechaFin) {
                fin = fechaFin;
            } else if (rangoGuardado) {
                fin = rangoGuardado.fin;
            }
            return { inicio: inicio, fin: fin };
        }

        function buscarGrupo(grupos, clave) {
            for (let i = 0; i < grupos.length; i++) {
                if (grupos[i].clave === clave) {
                    return grupos[i];
                }
            }
            const nuevo = { clave: clave, cantidad: 0, total: 0 };
            grupos.push(nuevo);
            return nuevo;
        }

        function ordenarGruposPorClave(grupos) {
            for (let a = 0; a < grupos.length - 1; a++) {
                for (let b = a + 1; b < grupos.length; b++) {
                    if (grupos[b].clave < grupos[a].clave) {
                        const temporal = grupos[a];
                        grupos[a] = grupos[b];
                        grupos[b] = temporal;
                    }
                }
            }
        }

        function ordenarGruposPorTotal(grupos) {
            for (let a = 0; a < grupos.length - 1; a++) {
                for (let b = a + 1; b < grupos.length; b++) {
                    if (grupos[b].total > grupos[a].total) {
                        const temporal = grupos[a];
                        grupos[a] = grupos[b];
                        grupos[b] = temporal;
                    }
                }
            }
        }

        async function cargarVentas() {
            const filas = await api('/api/ventas');
            ventasCache = [];
            for (let i = 0; i < filas.length; i++) {
                const r = filas[i];
                const items = [];
                const detalle = r.detalle || [];
                for (let j = 0; j < detalle.length; j++) {
                    items.push({
                        producto: detalle[j].producto,
                        cantidad: Number(detalle[j].cantidad),
                        precio: Number(detalle[j].precio)
                    });
                }
                ventasCache.push({
                    id: r.id,
                    folio: r.folio_numero,
                    cliente: r.cliente,
                    tipo: r.tipo,
                    items: items,
                    subtotal: Number(r.subtotal),
                    iva: Number(r.iva),
                    total: Number(r.total),
                    fecha: r.fecha,
                    pago: r.pago,
                    corteId: r.corte_id
                });
            }
        }

        function mostrarHistorialVentas(fechaInicio, fechaFin) {
            const rango = rangoDe(rangoVentas, fechaInicio, fechaFin);
            const inicio = rango.inicio;
            const fin = rango.fin;
            rangoVentas = { inicio: inicio, fin: fin };

            const ventas = [];
            for (let i = 0; i < ventasCache.length; i++) {
                const v = ventasCache[i];
                if (v.tipo === 'VENTA') {
                    const f = fechaVentaISO(v.fecha);
                    if (f !== '' && f >= inicio && f <= fin) {
                        ventas.push(v);
                    }
                }
            }

            for (let a = 0; a < ventas.length - 1; a++) {
                for (let b = a + 1; b < ventas.length; b++) {
                    const fa = fechaVentaISO(ventas[a].fecha);
                    const fb = fechaVentaISO(ventas[b].fecha);
                    let cambiar = false;
                    if (fb > fa) {
                        cambiar = true;
                    } else if (fb === fa && Number(ventas[b].id) > Number(ventas[a].id)) {
                        cambiar = true;
                    }
                    if (cambiar) {
                        const temporal = ventas[a];
                        ventas[a] = ventas[b];
                        ventas[b] = temporal;
                    }
                }
            }

            let totalPeriodo = 0;
            let subtotalPeriodo = 0;
            let ivaPeriodo = 0;
            const totalesPorDia = [];
            const totalesPorPago = [];
            for (let i = 0; i < ventas.length; i++) {
                const v = ventas[i];
                totalPeriodo = totalPeriodo + v.total;
                subtotalPeriodo = subtotalPeriodo + v.subtotal;
                ivaPeriodo = ivaPeriodo + v.iva;

                const registroDia = buscarGrupo(totalesPorDia, fechaVentaISO(v.fecha));
                registroDia.cantidad = registroDia.cantidad + 1;
                registroDia.total = registroDia.total + v.total;

                let metodo = 'Sin especificar';
                if (v.pago) {
                    metodo = v.pago;
                }
                const registroPago = buscarGrupo(totalesPorPago, metodo);
                registroPago.cantidad = registroPago.cantidad + 1;
                registroPago.total = registroPago.total + v.total;
            }

            ordenarGruposPorClave(totalesPorDia);
            ordenarGruposPorTotal(totalesPorPago);

            let filasDiarias = '';
            for (let i = 0; i < totalesPorDia.length; i++) {
                const g = totalesPorDia[i];
                filasDiarias += `
                    <tr>
                        <td>${formatoFecha(g.clave)}</td>
                        <td>${g.cantidad}</td>
                        <td>${formatearMoneda(g.total)}</td>
                    </tr>`;
            }

        async function guardarFondo(modo) {

            if (valor === '' || !Number.isFinite(Number(valor))) {
                alert('Escribe un monto válido.');
                return;
            }
            if (modo === 'fondo' && Number(valor) < 0) {
                alert('El fondo no puede ser negativo.');
                return;
            }
            let cuerpo = { fondo: valor };
            if (modo === 'agregar') {
                cuerpo = { agregar: valor };
            }
            try {
                const r = await enviar('PUT', '/api/caja/fondo', cuerpo);
                fondoCaja = Number(r.fondo);
                mostrarCortes();
            } catch (e) {
                alert('No se pudo guardar el fondo: ' + e.message);

            let suma = 0;
            for (let i = 0; i < lista.length; i++) {
                suma = suma + Number(lista[i][campo] || 0);
            }
            return suma;

        function mostrarHistorialCobros(fechaInicio, fechaFin) {
            const rango = rangoDe(rangoCobros, fechaInicio, fechaFin);
            const inicio = rango.inicio;
            const fin = rango.fin;
            rangoCobros = { inicio: inicio, fin: fin };

            const cobros = [];
            for (let i = 0; i < cobrosCache.length; i++) {
                const c = cobrosCache[i];
                const f = fechaLocalISO(new Date(c.fechaPago));
                if (f >= inicio && f <= fin) {
                    cobros.push(c);
                }
            }

            for (let a = 0; a < cobros.length - 1; a++) {
                for (let b = a + 1; b < cobros.length; b++) {
                    if (Number(cobros[b].fechaPago) > Number(cobros[a].fechaPago)) {
                        const temporal = cobros[a];
                        cobros[a] = cobros[b];
                        cobros[b] = temporal;
                    }
                }
            }

            let totalPeriodo = 0;
            let totalRefacciones = 0;
            let totalServicios = 0;
            const totalesPorDia = [];
            const totalesPorMecanico = [];
            for (let i = 0; i < cobros.length; i++) {
                const c = cobros[i];
                totalPeriodo = totalPeriodo + Number(c.total || 0);
                totalServicios = totalServicios + Number(c.manoObra || 0) + Number(c.servicioExtraPrecio || 0);
                const refacciones = c.refacciones || [];
                for (let j = 0; j < refacciones.length; j++) {
                    totalRefacciones = totalRefacciones + Number(refacciones[j].importe || 0);
                }

                const registroDia = buscarGrupo(totalesPorDia, fechaLocalISO(new Date(c.fechaPago)));
                registroDia.cantidad = registroDia.cantidad + 1;
                registroDia.total = registroDia.total + Number(c.total || 0);

                let nombre = 'Sin asignar';
                if (c.mecanico) {
                    nombre = c.mecanico;

                const registroMec = buscarGrupo(totalesPorMecanico, nombre);

                registroMec.total = registroMec.total + Number(c.total || 0);

            const fechaInicio = document.getElementById('cobrosFechaInicio').value;
            const fechaFin = document.getElementById('cobrosFechaFin').value;
            if (!fechaInicio || !fechaFin || fechaInicio > fechaFin) {
                alert('Selecciona un rango válido: la fecha inicial debe ser igual o anterior a la fecha final.');
                return;
            }
            mostrarHistorialCobros(fechaInicio, fechaFin);
        }

        let movimientosTodos = [];
        let movimientosVista = [];
        let rangoMovimientos = null;
        let filtroTipoMovimientos = 'todos';

        const TIPOS_MOVIMIENTO = ['Venta', 'Cotización', 'Cobro de servicio', 'Compra a proveedor', 'Corte de caja'];

        function fechaHace30Dias() {
            const d = new Date();
            d.setDate(d.getDate() - 30);
            return fechaLocalISO(d);
        }

        function horaDeMs(ms) {
            const d = new Date(Number(ms));
            if (Number.isNaN(d.getTime())) {
                return '—';
            }
            return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
        }

        function filaDetalle(etiqueta, valor) {
            return '<div class="summary-row"><span>' + etiqueta + '</span><span>' + valor + '</span></div>';
        }

        async function abrirMovimientos() {
            const botones = document.querySelectorAll('.nav-btn');
            for (let i = 0; i < botones.length; i++) {
                botones[i].classList.remove('active');
            }
            mostrarCargando();
            try {
                const ventas = await api('/api/ventas');
                const compras = await api('/api/compras');
                let cobros = [];
                try {
                    cobros = await api('/api/cobros');
                } catch (e) {
                    cobros = [];
                }
                const cortes = await api('/api/caja/cortes');

                movimientosTodos = [];

                for (let i = 0; i < ventas.length; i++) {
                    const v = ventas[i];
                    const fecha = fechaVentaISO(v.fecha);
                    if (fecha !== '') {
                        let tipo = 'Venta';
                        let entrada = Number(v.total || 0);
                        if (v.tipo === 'COTIZACION') {
                            tipo = 'Cotización';
                            entrada = 0;
                        }
                        movimientosTodos.push({
                            fecha: fecha,
                            ms: 0,
                            hora: '—',
                            tipo: tipo,
                            folio: '#' + v.folio_numero,
                            responsable: v.cliente,
                            entrada: entrada,
                            salida: 0,
                            orden: Number(v.id),
                            datos: v
                        });
                    }
                }

                for (let i = 0; i < compras.length; i++) {
                    const c = compras[i];
                    const fecha = fechaVentaISO(c.fecha);
                    if (fecha !== '') {
                        movimientosTodos.push({
                            fecha: fecha,
                            ms: 0,
                            hora: '—',
                            tipo: 'Compra a proveedor',
                            folio: c.factura,
                            responsable: c.proveedor,
                            entrada: 0,
                            salida: Number(c.total || 0),
                            orden: Number(c.id),
                            datos: c
                        });
                    }
                }

                for (let i = 0; i < cobros.length; i++) {
                    const c = cobros[i];
                    movimientosTodos.push({
                        fecha: fechaLocalISO(new Date(Number(c.fechaPago))),
                        ms: Number(c.fechaPago),
                        hora: horaDeMs(c.fechaPago),
                        tipo: 'Cobro de servicio',
                        folio: c.folio,
                        responsable: c.mecanico,
                        entrada: Number(c.total || 0),
                        salida: 0,
                        orden: Number(c.id || 0),
                        datos: c
                    });
                }

                for (let i = 0; i < cortes.length; i++) {
                    const k = cortes[i];
                    movimientosTodos.push({
                        fecha: fechaLocalISO(new Date(Number(k.fecha_corte))),
                        ms: Number(k.fecha_corte),
                        hora: horaDeMs(k.fecha_corte),
                        tipo: 'Corte de caja',
                        folio: '#' + k.id,
                        responsable: k.responsable,
                        entrada: 0,
                        salida: 0,
                        orden: Number(k.id),
                        datos: k
                    });
                }

                for (let a = 0; a < movimientosTodos.length - 1; a++) {
                    for (let b = a + 1; b < movimientosTodos.length; b++) {
                        const ma = movimientosTodos[a];
                        const mb = movimientosTodos[b];
                        let cambiar = false;
                        if (mb.fecha > ma.fecha) {
                            cambiar = true;
                        } else if (mb.fecha === ma.fecha && mb.ms > ma.ms) {
                            cambiar = true;
                        } else if (mb.fecha === ma.fecha && mb.ms === ma.ms && mb.orden > ma.orden) {
                            cambiar = true;
                        }
                        if (cambiar) {
                            movimientosTodos[a] = mb;
                            movimientosTodos[b] = ma;
                        }
                    }
                }

                rangoMovimientos = { inicio: fechaHace30Dias(), fin: hoyISO() };
                filtroTipoMovimientos = 'todos';
                mostrarMovimientos();
            } catch (e) {
                mostrarErrorCarga(e, 'compras');
            }
        }

        function mostrarMovimientos() {
            const inicio = rangoMovimientos.inicio;
            const fin = rangoMovimientos.fin;

            movimientosVista = [];
            let totalEntradas = 0;
            let totalSalidas = 0;
            for (let i = 0; i < movimientosTodos.length; i++) {
                const m = movimientosTodos[i];
                let cumpleTipo = false;
                if (filtroTipoMovimientos === 'todos' || filtroTipoMovimientos === m.tipo) {
                    cumpleTipo = true;
                }
                if (cumpleTipo && m.fecha >= inicio && m.fecha <= fin) {
                    movimientosVista.push(m);
                    totalEntradas = totalEntradas + m.entrada;
                    totalSalidas = totalSalidas + m.salida;
                }
            }
            const balance = redondear(totalEntradas - totalSalidas);
            let claseBalance = 'dif-ok';
            if (balance < 0) {
                claseBalance = 'dif-falta';
            }

            let opcionesTipo = '<option value="todos">Todos los movimientos</option>';
            for (let i = 0; i < TIPOS_MOVIMIENTO.length; i++) {
                let marca = '';
                if (TIPOS_MOVIMIENTO[i] === filtroTipoMovimientos) {
                    marca = 'selected';
                }
                opcionesTipo += '<option value="' + TIPOS_MOVIMIENTO[i] + '" ' + marca + '>' + TIPOS_MOVIMIENTO[i] + '</option>';
            }

            let filas = '';
            for (let i = 0; i < movimientosVista.length; i++) {
                const m = movimientosVista[i];
                let textoEntrada = '—';
                let textoSalida = '—';
                if (m.entrada > 0) {
                    textoEntrada = formatearMoneda(m.entrada);
                }
                if (m.salida > 0) {
                    textoSalida = formatearMoneda(m.salida);
                }
                filas += `
                    <tr>
                        <td>${formatoFecha(m.fecha)}</td>
                        <td>${esc(m.hora)}</td>
                        <td><span class="badge-tipo">${esc(m.tipo)}</span></td>
                        <td>${esc(m.folio)}</td>
                        <td>${esc(m.responsable)}</td>
                        <td class="dif-ok">${textoEntrada}</td>
                        <td class="dif-falta">${textoSalida}</td>
                        <td class="no-print"><button type="button" class="btn-edit-item" onclick="verDetalleMovimiento(${i})">Ver detalle</button></td>
                    </tr>`;
            }
            if (filas === '') {
                filas = '<tr><td colspan="8" style="text-align:center;">No hay movimientos para este periodo.</td></tr>';
            }

            panelAdmin().innerHTML = `
                <div class="panel-header">
                    <h2>Historial de Movimientos</h2>
                    <p class="no-print">Registro de ventas, cotizaciones, cobros de servicio, compras a proveedores y cortes de caja. Usa Ver detalle para consultar cada movimiento.</p>
                    <p>Periodo del reporte: ${formatoFecha(inicio)} al ${formatoFecha(fin)}</p>
                </div>
                <div class="summary-box no-print" style="margin-top:0;">
                    <div class="report-filter-actions">
                        <div class="input-group" style="margin:0;">
                            <label for="movFechaInicio">Desde</label>
                            <input type="date" id="movFechaInicio" value="${esc(inicio)}">
                        </div>
                        <div class="input-group" style="margin:0;">
                            <label for="movFechaFin">Hasta</label>
                            <input type="date" id="movFechaFin" value="${esc(fin)}">
                        </div>
                        <div class="input-group" style="margin:0;">
                            <label for="movTipo">Tipo de movimiento</label>
                            <select id="movTipo">${opcionesTipo}</select>
                        </div>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoMovimientos('hoy')">Hoy</button>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoMovimientos('semana')">Esta semana</button>
                        <button type="button" class="btn-secondary" onclick="aplicarFiltroMovimientos()">Aplicar filtros</button>
                        <button type="button" class="btn-action" style="margin-top:0; width:auto;" onclick="imprimirReporte()">Imprimir / Guardar PDF</button>
                    </div>
                </div>
                <div class="report-summary-grid">
                    <div class="report-total-card">Movimientos en el periodo<strong>${movimientosVista.length}</strong></div>
                    <div class="report-total-card">Total de entradas<strong class="dif-ok">${formatearMoneda(totalEntradas)}</strong></div>
                    <div class="report-total-card">Total de salidas<strong class="dif-falta">${formatearMoneda(totalSalidas)}</strong></div>
                    <div class="report-total-card">Balance<strong class="${claseBalance}">${formatearMoneda(balance)}</strong></div>
                </div>
                <div class="summary-box">
                    <h3 style="font-size:0.9rem;">Listado de movimientos</h3>
                    <div class="table-scroll">
                        <table class="data-table">
                            <thead><tr><th>Fecha</th><th>Hora</th><th>Tipo de movimiento</th><th>Folio</th><th>Responsable / Cliente</th><th>Entrada</th><th>Salida</th><th class="no-print">Acciones</th></tr></thead>
                            <tbody>${filas}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function seleccionarPeriodoMovimientos(periodo) {
            const p = periodoSeleccionado(periodo);
            rangoMovimientos = { inicio: p.inicio, fin: p.fin };
            filtroTipoMovimientos = document.getElementById('movTipo').value;
            mostrarMovimientos();
        }

        function aplicarFiltroMovimientos() {
            const fechaInicio = document.getElementById('movFechaInicio').value;
            const fechaFin = document.getElementById('movFechaFin').value;
            if (!fechaInicio || !fechaFin || fechaInicio > fechaFin) {
                alert('Selecciona un rango válido: la fecha inicial debe ser igual o anterior a la fecha final.');
                return;
            }
            rangoMovimientos = { inicio: fechaInicio, fin: fechaFin };
            filtroTipoMovimientos = document.getElementById('movTipo').value;
            mostrarMovimientos();

        function detalleVentaMovimiento(v) {
            let html = filaDetalle('Cliente', esc(v.cliente));
            html += filaDetalle('Método de pago', esc(v.pago));
            html += filaDetalle('Fecha', esc(v.fecha));

            let productos = '';
            const detalle = v.detalle || [];
            for (let i = 0; i < detalle.length; i++) {
                const d = detalle[i];
                productos += filaDetalle(esc(d.producto) + ' (x' + d.cantidad + ' a ' + formatearMoneda(d.precio) + ')',
                    formatearMoneda(Number(d.precio) * Number(d.cantidad)));
            }
            html += '<h4 style="font-size:0.85rem; margin:10px 0 4px 0;">Productos:</h4>' + productos;

            html += filaDetalle('Subtotal', formatearMoneda(v.subtotal));
            html += filaDetalle('IVA (16%)', formatearMoneda(v.iva));
            html += '<div class="summary-row total"><span>Total</span><span>' + formatearMoneda(v.total) + '</span></div>';

            if (v.tipo === 'VENTA' && v.pago === 'Efectivo' && Number(v.monto_recibido || 0) > 0) {
                html += filaDetalle('Monto recibido', formatearMoneda(v.monto_recibido));
                html += filaDetalle('Cambio entregado', formatearMoneda(v.cambio));
            }
            if (v.tipo === 'VENTA') {
                let textoCorte = 'Pendiente de corte';
                if (v.corte_id) {
                    textoCorte = '#' + esc(v.corte_id);
                }
                html += filaDetalle('Corte de caja', textoCorte);
            }
            return html;
        }

        function detalleCobroMovimiento(c) {
            let html = filaDetalle('Folio', esc(c.folio));
            html += filaDetalle('Cliente', esc(c.cliente));
            html += filaDetalle('Motocicleta', esc(c.motocicleta) + ' (' + esc(c.placas) + ')');
            html += filaDetalle('Servicio solicitado', esc(c.servicioSolicitado));
            html += filaDetalle('Servicio realizado', esc(c.servicioRealizado));
            html += filaDetalle('Mecánico', esc(c.mecanico));
            html += filaDetalle('Mano de obra', formatearMoneda(c.manoObra));
            if (Number(c.servicioExtraPrecio) > 0) {
                html += filaDetalle('Extra: ' + esc(c.servicioExtraDescripcion), formatearMoneda(c.servicioExtraPrecio));
            }

            const refacciones = c.refacciones || [];
            if (refacciones.length > 0) {
                html += '<h4 style="font-size:0.85rem; margin:10px 0 4px 0;">Refacciones:</h4>';
            }
            for (let i = 0; i < refacciones.length; i++) {
                const r = refacciones[i];
                html += filaDetalle(esc(r.nombre) + ' (x' + r.cantidad + ' a ' + formatearMoneda(r.precioUnitario) + ')',
                    formatearMoneda(r.importe));
            }

            html += filaDetalle('Subtotal', formatearMoneda(c.subtotal));
            html += filaDetalle('IVA (16%)', formatearMoneda(c.iva));
            html += '<div class="summary-row total"><span>Total</span><span>' + formatearMoneda(c.total) + '</span></div>';
            return html;
        }

        function detalleCompraMovimiento(c) {
            let html = filaDetalle('Factura / Remisión', esc(c.factura));
            html += filaDetalle('Proveedor', esc(c.proveedor));
            html += filaDetalle('Fecha', esc(c.fecha));

            let articulos = '';
            const detalle = c.detalle || [];
            for (let i = 0; i < detalle.length; i++) {
                const d = detalle[i];
                articulos += filaDetalle(esc(d.nombre) + ' (' + esc(d.sku) + ') x' + d.cantidad + ' a ' + formatearMoneda(d.costo),
                    formatearMoneda(d.importe));
            }
            html += '<h4 style="font-size:0.85rem; margin:10px 0 4px 0;">Artículos adquiridos:</h4>' + articulos;

            html += filaDetalle('Subtotal', formatearMoneda(c.subtotal));
            html += filaDetalle('IVA (16%)', formatearMoneda(c.iva));
            html += '<div class="summary-row total"><span>Total de la factura</span><span>' + formatearMoneda(c.total) + '</span></div>';
            return html;
        }

        function detalleCorteMovimiento(k) {
            const dif = Number(k.diferencia);
            let etiquetaDif = 'Caja cuadrada';
            let claseDif = 'dif-ok';
            if (dif > 0) {
                etiquetaDif = 'Sobrante';
            } else if (dif < 0) {
                etiquetaDif = 'Faltante';
                claseDif = 'dif-falta';
            }

            let html = filaDetalle('Responsable', esc(k.responsable));
            html += filaDetalle('Ventas incluidas', esc(k.num_ventas));
            html += filaDetalle('Total vendido', formatearMoneda(k.total_ventas));
            html += filaDetalle('Ventas en efectivo', formatearMoneda(k.ventas_efectivo));
            html += filaDetalle('Ventas con tarjeta', formatearMoneda(k.ventas_tarjeta));
            html += filaDetalle('Ventas por transferencia', formatearMoneda(k.ventas_transferencia));
            html += filaDetalle('Fondo de caja', formatearMoneda(k.fondo_inicial));
            html += filaDetalle('Retiros', formatearMoneda(k.retiros));
            html += '<div class="summary-row total"><span>Efectivo esperado</span><span>' + formatearMoneda(k.efectivo_esperado) + '</span></div>';
            html += filaDetalle('Efectivo contado', formatearMoneda(k.efectivo_contado));
            html += '<div class="summary-row total"><span>' + etiquetaDif + '</span><span class="' + claseDif + '">'
                + formatearMoneda(Math.abs(dif)) + '</span></div>';
            html += filaDetalle('Observaciones', esc(k.observaciones || '—'));
            return html;
        }

        async function verDetalleMovimiento(indice) {
            const m = movimientosVista[indice];
            if (!m) {
                return;
            }

            let fechaTexto = formatoFecha(m.fecha);
            if (m.hora !== '—') {
                fechaTexto = fechaTexto + ' ' + m.hora;
            }
            document.getElementById('modalMovimientoTitulo').innerText = m.tipo + ' ' + m.folio;
            document.getElementById('modalMovimientoInfo').innerText = 'Fecha y hora: ' + fechaTexto;

            let html = '';
            if (m.tipo === 'Venta' || m.tipo === 'Cotización') {
                html = detalleVentaMovimiento(m.datos);
            } else if (m.tipo === 'Cobro de servicio') {
                html = detalleCobroMovimiento(m.datos);
            } else if (m.tipo === 'Compra a proveedor') {
                html = detalleCompraMovimiento(m.datos);
            } else if (m.tipo === 'Corte de caja') {
                let corte = m.datos;
                try {
                    corte = await api('/api/caja/cortes/' + m.datos.id);
                } catch (e) {
                    corte = m.datos;
                }
                html = detalleCorteMovimiento(corte);
            }

            document.getElementById('modalMovimientoContenido').innerHTML = html;
            document.getElementById('modalDetalleMovimiento').style.display = 'flex';
        }
