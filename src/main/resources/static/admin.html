<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Sistema MRX</title>
    <script src="sesion.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eaf3fb;
            --bg-soft: #f4f9ff;
            --panel: #f8fbff;
            --panel-alt: #ebf4ff;
            --panel-strong: #dfeeff;
            --border: #bfd6ef;
            --border-soft: #9dbfe9;
            --text: #111827;
            --muted: #476a8d;
            --muted-strong: #254868;
            --accent: #5b8ec9;
            --accent-strong: #3f72b5;
            --button-text: #f7fbff;
            --success: #55a66d;
            --danger: #d96b6b;
            --shadow: rgba(110, 145, 185, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .btn-logout {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--panel-alt);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--panel-strong);
            color: var(--text);
            border-color: var(--border-soft);
        }

        .nav-btn.active {
            background: var(--text);
            color: var(--button-text);
            border-color: var(--text);
            font-weight: 600;
        }

        .main-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
        }

        .panel-header p {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: var(--panel-alt);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
            background: var(--panel-strong);
        }

        .summary-box {
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: var(--text);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: var(--muted-strong);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-add-item {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .btn-secondary {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .qty-btn {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .btn-remove-item {
            color: var(--danger);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        .btn-edit-item {
            color: var(--accent);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-edit-item:hover { text-decoration: underline; }

        .badge-activo {
            background: #edf7ef;
            color: var(--success);
            border: 1px solid #b9d9c1;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-inactivo {
            background: #fff4f3;
            color: var(--danger);
            border: 1px solid #e9b8b5;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .dif-ok {
            color: var(--success);
        }

        .dif-falta {
            color: var(--danger);
        }

        .alert-box {
            display: none;
            padding: 14px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .data-table th, .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .data-table th {
            color: var(--muted);
            font-weight: 600;
            background: var(--panel-alt);
        }

        .report-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin: 18px 0;
        }

        .report-total-card {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-alt);
            color: var(--text);
        }

        .report-total-card strong {
            display: block;
            margin-top: 8px;
            font-size: 1.35rem;
        }

        .fondo-input {
            width: 100%;
            padding: 8px 10px;
            background: var(--panel);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }

        .fondo-botones {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .fondo-botones .btn-secondary {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.8rem;
        }

        .celda-decision {
            width: 100%;
            min-width: 90px;
            padding: 8px;
            background: var(--panel);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.85rem;
        }

        .badge-tipo {
            background: #edf4fc;
            color: var(--accent-strong);
            border: 1px solid #c5d9f0;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 4px;
        }

        .formula-box {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .formula-box:last-child {
            border-bottom: none;
        }

        .report-filter-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 10, 18, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            box-shadow: 0 20px 40px var(--shadow);
        }

        .btn-close {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border-soft);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: var(--panel-alt); color: var(--text); }

        [style*="color:#ffffff"], [style*="color: #ffffff"],
        [style*="color:#fff"], [style*="color: #fff"] {
            color: var(--text) !important;
        }

        @media print {
            @page {
                size: landscape;
                margin: 12mm;
            }

            body.reporte-impresion {
                background: #fff !important;
                color: #111 !important;
                padding: 0 !important;
            }

            body.reporte-impresion .topbar,
            body.reporte-impresion .sidebar-buttons,
            body.reporte-impresion .modal-overlay,
            body.reporte-impresion .no-print {
                display: none !important;
            }

            body.reporte-impresion .workspace,
            body.reporte-impresion .main-panel {
                display: block !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                border: 0 !important;
                box-shadow: none !important;
                background: #fff !important;
            }

            body.reporte-impresion .panel-header h2,
            body.reporte-impresion .panel-header p,
            body.reporte-impresion .summary-box h3 {
                color: #111 !important;
            }

            body.reporte-impresion .table-scroll {
                overflow: visible !important;
            }

            body.reporte-impresion .summary-box,
            body.reporte-impresion .report-total-card,
            body.reporte-impresion .summary-row,
            body.reporte-impresion .formula-box,
            body.reporte-impresion .data-table th,
            body.reporte-impresion .data-table td {
                background: #fff !important;
                color: #111 !important;
                border-color: #aaa !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Panel del Administrador</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">Módulos Unificados</div>
                <button class="nav-btn active" onclick="cambiarVistaAdmin('compras', this)">
                    📦 Compras a Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('proveedores', this)">
                    🏭 Gestión de Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('articulos', this)">
                    🔧 Gestión del Catálogo de Artículos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('mecanicos', this)">
                    👷 Registro de Mecánicos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('historial_ventas', this)">
                    📜 Historial de Ventas
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('cortes_caja', this)">
                    🧾 Cortes de Caja
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('historial_cobros', this)">
                    📊 Historial de Mantenimientos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('decisiones', this)">
                    🧠 Toma de Decisiones
                </button>
            </div>

            <div class="main-panel" id="panel-contenido-admin">
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalDetalleCompra">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalCompraTitulo">Detalle de Factura</h2>
                <p id="modalCompraInfo">Proveedor / Fecha</p>
            </div>
            <div class="summary-box" id="modalCompraContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-close" onclick="cerrarModalCompra()">Cerrar Ventana</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalDetalleMecanico">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalMecanicoTitulo">Detalle del Mecánico</h2>
                <p id="modalMecanicoInfo">Especialidad</p>
            </div>
            <div class="summary-box" id="modalMecanicoContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-close" onclick="cerrarModalMecanico()">Cerrar Ventana</button>
            </div>
        </div>
    </div>

    <script>
        function esc(valor) {
            return String(valor == null ? '' : valor).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function dinero(n) { return Number(n || 0).toFixed(2); }

        function mismoId(a, b) { return String(a) === String(b); }

        function redondear(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }

        function formatearMoneda(importe) {
            return new Intl.NumberFormat('es-MX', {
                style: 'currency',
                currency: 'MXN'
            }).format(Number(importe) || 0);
        }

        function fechaLocalISO(fecha) {
            const anio = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const dia = String(fecha.getDate()).padStart(2, '0');
            return `${anio}-${mes}-${dia}`;
        }

        function hoyISO() { return fechaLocalISO(new Date()); }

        function fechaVentaISO(texto) {
            const t = String(texto || '').trim();
            let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) return `${m[1]}-${m[2]}-${m[3]}`;
            return '';
        }

        function formatoFecha(f) {
            if (!f) return '—';
            const d = new Date(`${f}T12:00:00`);
            return isNaN(d.getTime()) ? esc(f) : d.toLocaleDateString('es-MX');
        }

        function formatoFechaHora(ms) {
            const d = new Date(Number(ms));
            return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString('es-MX');
        }

        async function api(url, opciones) {
            const resp = await fetch(url, opciones);
            let datos = null;
            try { datos = await resp.json(); } catch (e) { datos = null; }
            if (!resp.ok) {
                throw new Error((datos && datos.message) || ('Error del servidor (' + resp.status + ')'));
            }
            return datos;
        }

        function enviar(metodo, url, cuerpo) {
            return api(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: cuerpo ? JSON.stringify(cuerpo) : undefined
            });
        }

        let catalogoCache = [];
        let proveedoresCache = [];
        let comprasCache = [];
        let mecanicosCache = [];
        let cobrosCache = [];
        let ventasCache = [];
        let cortesCache = [];
        let fondoCaja = 0;
        let itemsCompraActual = [];
        let idProveedorEditando = null;
        let idProductoEditando = null;
        let idMecanicoEditando = null;
        let filtroMecanicos = '';
        let rangoVentas = null;
        let rangoCobros = null;
        let rangoCortes = null;

        function panelAdmin() { return document.getElementById('panel-contenido-admin'); }

        function mostrarCargando() {
            panelAdmin().innerHTML = '<div class="summary-box">Cargando datos desde la base de datos...</div>';
        }

        function mostrarErrorCarga(error, vista) {
            panelAdmin().innerHTML = `
                <div class="summary-box">
                    <p>No fue posible conectar con el servidor: ${esc(error.message)}</p>
                    <p style="margin-top:8px;">Si el servidor estaba dormido, espera un minuto e inténtalo de nuevo.</p>
                    <button class="btn-action" onclick="cambiarVistaAdmin('${vista}')">Reintentar</button>
                </div>`;
        }

        async function cambiarVistaAdmin(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }
            mostrarCargando();
            try {
                if (vista === 'compras') {
                    itemsCompraActual = [];
                    [proveedoresCache, catalogoCache, comprasCache] = await Promise.all([
                        api('/api/proveedores'), api('/api/productos'), api('/api/compras')
                    ]);
                    renderizarModuloCompras();
                } else if (vista === 'proveedores') {
                    idProveedorEditando = null;
                    proveedoresCache = await api('/api/proveedores');
                    renderizarModuloProveedores();
                } else if (vista === 'articulos') {
                    idProductoEditando = null;
                    catalogoCache = await api('/api/productos');
                    renderizarModuloArticulos();
                } else if (vista === 'mecanicos') {
                    idMecanicoEditando = null;
                    mecanicosCache = await api('/api/mecanicos');
                    try { cobrosCache = await api('/api/cobros'); } catch (e) { cobrosCache = []; }
                    renderizarModuloMecanicos();
                } else if (vista === 'historial_ventas') {
                    await cargarVentas();
                    rangoVentas = null;
                    mostrarHistorialVentas();
                } else if (vista === 'cortes_caja') {
                    const [cortes, fondo] = await Promise.all([
                        api('/api/caja/cortes'), api('/api/caja/fondo')
                    ]);
                    cortesCache = cortes;
                    fondoCaja = Number(fondo.fondo);
                    rangoCortes = null;
                    mostrarCortes();
                } else if (vista === 'historial_cobros') {
                    cobrosCache = await api('/api/cobros');
                    rangoCobros = null;
                    mostrarHistorialCobros();
                } else if (vista === 'decisiones') {
                    catalogoCache = await api('/api/productos');
                    await renderizarDecisiones();
                }
            } catch (e) {
                mostrarErrorCarga(e, vista);
            }
        }

        function renderizarModuloCompras() {
            const opcionesProveedores = proveedoresCache.map(p =>
                `<option value="${esc(p.nombre)}">${esc(p.nombre)}</option>`).join('');
            const opcionesArticulos = catalogoCache.map(a =>
                `<option value="${a.id}">[${esc(a.sku)}] ${esc(a.nombre)} - Costo: $${dinero(a.costo_compra)} (Stock: ${a.stock})</option>`).join('');

            const filasHistorial = comprasCache.map(c => `
                <tr>
                    <td><strong style="color:#ffffff;">${esc(c.factura)}</strong></td>
                    <td>${esc(c.proveedor)}</td>
                    <td>${esc(c.fecha)}</td>
                    <td><strong style="color:#22c55e;">$${dinero(c.total)} MXN</strong></td>
                    <td>
                        <button class="btn-edit-item" onclick="verDetalleCompra(${c.id})">🔍 Detalle</button>
                        <button class="btn-remove-item" onclick="eliminarCompra(${c.id})">🗑️ Eliminar</button>
                    </td>
                </tr>
            `).join('');

            panelAdmin().innerHTML = `

        function agregarArticuloACompra() {
            const sel = document.getElementById('selectCompraArticulo');
            if (!sel || !sel.value) return;
            const cantidad = parseInt(document.getElementById('compraCantidadInput').value) || 1;
            const articulo = catalogoCache.find(a => mismoId(a.id, sel.value));
            if (!articulo) return;

            const existe = itemsCompraActual.find(item => mismoId(item.id, articulo.id));
            if (existe) {
                existe.cantidad += cantidad;
            } else {
                itemsCompraActual.push({
                    id: articulo.id,
                    sku: articulo.sku,
                    nombre: articulo.nombre,
                    costo: Number(articulo.costo_compra),
                    cantidad: cantidad
                });
            }
            actualizarTablaCompra();
        }

        function modificarCantidadCompra(id, delta) {
            const item = itemsCompraActual.find(i => mismoId(i.id, id));
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) removerArticuloCompra(id);
                else actualizarTablaCompra();
            }
        }

        function removerArticuloCompra(id) {
            itemsCompraActual = itemsCompraActual.filter(i => !mismoId(i.id, id));
            actualizarTablaCompra();
        }

        function actualizarTablaCompra() {
            const contenedor = document.getElementById('listaArticulosCompra');
            if (!contenedor) return;

            if (itemsCompraActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado artículos.</p>';
                document.getElementById('lblSubtotalCompra').innerText = '$0.00 MXN';
                document.getElementById('lblIvaCompra').innerText = '$0.00 MXN';
                document.getElementById('lblTotalCompra').innerText = '$0.00 MXN';
                return;
            }

            let subtotal = 0;
            contenedor.innerHTML = itemsCompraActual.map(item => {
                const importe = item.costo * item.cantidad;
                subtotal += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#e5e5e5; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${esc(item.sku)}</span>
                            <strong style="color:#ffffff;">${esc(item.nombre)}</strong>
                            <span style="margin-left:8px;">
                                <button class="qty-btn" onclick="modificarCantidadCompra(${item.id}, -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" onclick="modificarCantidadCompra(${item.id}, 1)">+</button>
                            </span>
                            <button class="btn-remove-item" onclick="removerArticuloCompra(${item.id})">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${dinero(importe)} MXN</span>
                    </div>
                `;
            }).join('');

            const iva = subtotal * 0.16;
            const total = subtotal + iva;
            document.getElementById('lblSubtotalCompra').innerText = '$' + dinero(subtotal) + ' MXN';
            document.getElementById('lblIvaCompra').innerText = '$' + dinero(iva) + ' MXN';
            document.getElementById('lblTotalCompra').innerText = '$' + dinero(total) + ' MXN';
        }

        async function guardarCompraMercancia() {
            const factura = document.getElementById('compraFacturaInput').value.trim();
            const proveedor = document.getElementById('compraProveedorSelect').value;

            if (!factura) { alert('Ingresa el número de factura o remisión.'); return; }
            if (!proveedor) { alert('Registra y selecciona un proveedor.'); return; }
            if (itemsCompraActual.length === 0) { alert('Agrega al menos un artículo.'); return; }

            let subtotal = 0;
            const detalle = itemsCompraActual.map(item => {
                const importe = redondear(item.costo * item.cantidad);
                subtotal += importe;
                return {
                    producto_id: String(item.id),
                    sku: item.sku,
                    nombre: item.nombre,
                    costo: item.costo,
                    cantidad: item.cantidad,
                    importe: importe
                };
            });
            subtotal = redondear(subtotal);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);

            const boton = document.getElementById('btnGuardarCompra');
            if (boton) boton.disabled = true;
            try {
                await enviar('POST', '/api/compras', {
                    factura, proveedor,
                    fecha: new Date().toLocaleDateString('es-MX'),
                    subtotal, iva, total, detalle
                });
                document.getElementById('alertaCompra').style.display = 'block';
                setTimeout(() => cambiarVistaAdmin('compras'), 1500);
            } catch (e) {
                if (boton) boton.disabled = false;
                alert('No se pudo guardar la compra: ' + e.message);
            }
        }

                    <div class="form-grid">
                        <div class="input-group">

                        </div>
                        <div class="input-group">

                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Fecha de Ingreso</label>
                            <input type="date" id="mecFechaInput" value="${hoyISO()}">

                        <div class="input-group">
                            <label>Estado</label>
                            <select id="mecActivoSelect">
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>

                    <div class="input-group">
                        <label>Notas / Observaciones (opcional)</label>

                    <div style="display:flex; gap:10px;">
                        <button type="submit" class="btn-action" id="btnGuardarMecanico" style="margin-top:10px;">
                            ${idMecanicoEditando ? 'Actualizar Mecánico' : 'Registrar Mecánico'}
                        </button>
                        ${idMecanicoEditando ? `<button type="button" class="btn-action" style="margin-top:10px; background:#404040; color:#fff;" onclick="cancelarEdicionMecanico()">Cancelar</button>` : ''}
                    </div>
                </form>

                <div id="alertaMec" class="alert-box">✓ Registro de mecánicos actualizado correctamente.</div>

                <div class="summary-box">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px;">
                        👷 Directorio de Mecánicos (${mecanicosCache.length} registrados · ${activos} activos)
                    </h3>
                    <div class="input-group" style="margin-bottom:8px;">
                        <label>Buscar por nombre o especialidad</label>
                        <input type="text" id="buscarMecanico" value="${esc(filtroMecanicos)}" placeholder="Ej. Miguel o eléctrico..." oninput="filtrarMecanicos(this.value)">
                    </div>
                    <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Especialidad</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th>Ingreso</th>
                                <th>Estado</th>
                                <th>Acciones</th>

        }

        function filtrarMecanicos(valor) {
            filtroMecanicos = valor || '';
            const cuerpoTabla = document.getElementById('tbodyMecanicos');
            if (cuerpoTabla) cuerpoTabla.innerHTML = filasMecanicos();
        }

        async function guardarOActualizarMecanico(event) {
            event.preventDefault();
            const cuerpo = {
                nombre: document.getElementById('mecNombreInput').value.trim(),
                especialidad: document.getElementById('mecEspecialidadInput').value.trim(),
                telefono: document.getElementById('mecTelefonoInput').value.trim(),
                email: document.getElementById('mecEmailInput').value.trim(),
                fecha_ingreso: document.getElementById('mecFechaInput').value,
                activo: document.getElementById('mecActivoSelect').value === 'true',
                notas: document.getElementById('mecNotasInput').value.trim()
            };

            const boton = document.getElementById('btnGuardarMecanico');
            if (boton) boton.disabled = true;
            try {
                if (idMecanicoEditando) {
                    await enviar('PUT', '/api/mecanicos/' + idMecanicoEditando, cuerpo);
                } else {
                    await enviar('POST', '/api/mecanicos', cuerpo);
                }
                idMecanicoEditando = null;
                document.getElementById('alertaMec').style.display = 'block';
                setTimeout(() => cambiarVistaAdmin('mecanicos'), 1000);
            } catch (e) {
                if (boton) boton.disabled = false;
                alert('No se pudo guardar el mecánico: ' + e.message);
            }
        }

        function prepararEdicionMecanico(id) {
            const m = mecanicosCache.find(x => mismoId(x.id, id));
            if (!m) return;
            idMecanicoEditando = id;
            renderizarModuloMecanicos();
            document.getElementById('mecNombreInput').value = m.nombre || '';
            document.getElementById('mecEspecialidadInput').value = m.especialidad || '';
            document.getElementById('mecTelefonoInput').value = m.telefono || '';
            document.getElementById('mecEmailInput').value = m.email || '';
            document.getElementById('mecFechaInput').value = m.fecha_ingreso || '';
            document.getElementById('mecActivoSelect').value = m.activo ? 'true' : 'false';
            document.getElementById('mecNotasInput').value = m.notas || '';
            panelAdmin().scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function cancelarEdicionMecanico() {
            idMecanicoEditando = null;
            renderizarModuloMecanicos();
        }

        async function cambiarEstadoMecanico(id) {
            const m = mecanicosCache.find(x => mismoId(x.id, id));
            if (!m) return;
            try {
                await enviar('PUT', '/api/mecanicos/' + id, {
                    nombre: m.nombre,
                    especialidad: m.especialidad,
                    telefono: m.telefono,
                    email: m.email,
                    fecha_ingreso: m.fecha_ingreso,
                    notas: m.notas,
                    activo: !m.activo
                });
                cambiarVistaAdmin('mecanicos');
            } catch (e) {
                alert('No se pudo cambiar el estado: ' + e.message);
            }
        }

        async function eliminarMecanico(id) {
            const m = mecanicosCache.find(x => mismoId(x.id, id));
            if (!m) return;
            if (!confirm(`¿Desea eliminar al mecánico ${m.nombre}? Los cobros anteriores conservarán su nombre.`)) return;
            try {
                await enviar('DELETE', '/api/mecanicos/' + id);
                cambiarVistaAdmin('mecanicos');
            } catch (e) {
                alert('No se pudo eliminar: ' + e.message);
            }
        }

        function verDetalleMecanico(id) {
            const m = mecanicosCache.find(x => mismoId(x.id, id));
            if (!m) return;
            const resumen = resumenMecanico(m.nombre);

            document.getElementById('modalMecanicoTitulo').innerText = m.nombre;
            document.getElementById('modalMecanicoInfo').innerText = m.especialidad || 'Sin especialidad registrada';

            document.getElementById('modalMecanicoContenido').innerHTML = `
                <div class="summary-row"><span>Teléfono / WhatsApp</span><span>${esc(m.telefono || '—')}</span></div>
                <div class="summary-row"><span>Correo electrónico</span><span>${esc(m.email || '—')}</span></div>
                <div class="summary-row"><span>Fecha de ingreso</span><span>${formatoFecha(m.fecha_ingreso)}</span></div>
                <div class="summary-row"><span>Estado</span><span class="${m.activo ? 'badge-activo' : 'badge-inactivo'}">${m.activo ? 'Activo' : 'Inactivo'}</span></div>
                <div class="summary-row"><span>Notas</span><span>${esc(m.notas || '—')}</span></div>
                <div class="summary-row"><span>Servicios cobrados</span><span>${resumen.servicios}</span></div>
                <div class="summary-row total">
                    <span>Total generado en cobros</span>
                    <span style="color:#22c55e;">$${dinero(resumen.total)} MXN</span>
                </div>
            `;
            document.getElementById('modalDetalleMecanico').style.display = 'flex';
        }

        function cerrarModalMecanico() {
            document.getElementById('modalDetalleMecanico').style.display = 'none';
        }

        function periodoSeleccionado(periodo) {
            const hoy = new Date();
            const inicio = new Date(hoy);
            const fin = new Date(hoy);
            if (periodo === 'semana') {
                const diasDesdeLunes = (hoy.getDay() + 6) % 7;
                inicio.setDate(hoy.getDate() - diasDesdeLunes);
                fin.setDate(inicio.getDate() + 6);
            }
            return { inicio: fechaLocalISO(inicio), fin: fechaLocalISO(fin) };
        }

        function imprimirReporte() {
            document.body.classList.add('reporte-impresion');
            window.print();
            window.setTimeout(() => document.body.classList.remove('reporte-impresion'), 500);
        }

        async function cargarVentas() {
            const filas = await api('/api/ventas');
            ventasCache = filas.map(r => ({
                id: r.id,
                folio: r.folio_numero,
                cliente: r.cliente,
                tipo: r.tipo,
                items: (r.detalle || []).map(d => ({
                    producto: d.producto,
                    cantidad: Number(d.cantidad),
                    precio: Number(d.precio)
                })),
                subtotal: Number(r.subtotal),
                iva: Number(r.iva),
                total: Number(r.total),
                fecha: r.fecha,
                pago: r.pago,
                corteId: r.corte_id
            }));
        }

        function mostrarHistorialVentas(fechaInicio, fechaFin) {
            const hoy = hoyISO();
            const inicio = fechaInicio || (rangoVentas ? rangoVentas.inicio : hoy);
            const fin = fechaFin || (rangoVentas ? rangoVentas.fin : hoy);
            rangoVentas = { inicio, fin };

            const ventas = ventasCache
                .filter(v => {
                    if (v.tipo !== 'VENTA') return false;
                    const f = fechaVentaISO(v.fecha);
                    return f !== '' && f >= inicio && f <= fin;
                })
                .sort((a, b) => {
                    const fa = fechaVentaISO(a.fecha);
                    const fb = fechaVentaISO(b.fecha);
                    if (fa !== fb) return fb.localeCompare(fa);
                    return Number(b.id) - Number(a.id);
                });

            const totalPeriodo = ventas.reduce((suma, v) => suma + v.total, 0);
            const subtotalPeriodo = ventas.reduce((suma, v) => suma + v.subtotal, 0);
            const ivaPeriodo = ventas.reduce((suma, v) => suma + v.iva, 0);

            const totalesPorDia = new Map();
            const totalesPorPago = new Map();
            ventas.forEach(v => {
                const dia = fechaVentaISO(v.fecha);
                const registroDia = totalesPorDia.get(dia) || { cantidad: 0, total: 0 };
                registroDia.cantidad++;
                registroDia.total += v.total;
                totalesPorDia.set(dia, registroDia);

                const metodo = v.pago || 'Sin especificar';
                const registroPago = totalesPorPago.get(metodo) || { cantidad: 0, total: 0 };
                registroPago.cantidad++;
                registroPago.total += v.total;
                totalesPorPago.set(metodo, registroPago);
            });

            const filasDiarias = [...totalesPorDia.entries()]
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([dia, registro]) => `
                    <tr>
                        <td>${formatoFecha(dia)}</td>
                        <td>${registro.cantidad}</td>
                        <td>${formatearMoneda(registro.total)}</td>
                    </tr>
                `).join('');

            const filasPago = [...totalesPorPago.entries()]
                .sort(([, a], [, b]) => b.total - a.total)
                .map(([metodo, registro]) => `
                    <tr>
                        <td>${esc(metodo)}</td>
                        <td>${registro.cantidad}</td>
                        <td>${formatearMoneda(registro.total)}</td>
                    </tr>
                `).join('');

            const filasVentas = ventas.map(v => {
                const detalle = v.items.map(it =>
                    `${esc(it.producto)} (${it.cantidad} × ${formatearMoneda(it.precio)}) — ${formatearMoneda(it.precio * it.cantidad)}`
                ).join('<br>');
                return `
                    <tr>
                        <td>${esc(v.fecha)}</td>
                        <td>#${esc(v.folio)}</td>
                        <td>${esc(v.cliente)}</td>
                        <td>${detalle}</td>
                        <td>${esc(v.pago)}</td>
                        <td>${formatearMoneda(v.subtotal)}<br>IVA: ${formatearMoneda(v.iva)}</td>
                        <td><strong>${formatearMoneda(v.total)}</strong></td>
                        <td>${v.corteId ? '#' + esc(v.corteId) : 'Pendiente'}</td>
                    </tr>
                `;
            }).join('');

            panelAdmin().innerHTML = `
                <div class="panel-header">
                    <h2>Historial de Ventas</h2>
                    <p class="no-print">Elige un periodo para consultar las ventas. Usa Imprimir / Guardar PDF para descargar el reporte como PDF.</p>
                    <p>Periodo del reporte: ${formatoFecha(inicio)} al ${formatoFecha(fin)}</p>
                </div>
                <div class="summary-box no-print" style="margin-top:0;">
                    <div class="report-filter-actions">
                        <div class="input-group" style="margin:0;">
                            <label for="ventasFechaInicio">Desde</label>
                            <input type="date" id="ventasFechaInicio" value="${esc(inicio)}">
                        </div>
                        <div class="input-group" style="margin:0;">
                            <label for="ventasFechaFin">Hasta</label>
                            <input type="date" id="ventasFechaFin" value="${esc(fin)}">
                        </div>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoVentas('hoy')">Hoy</button>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoVentas('semana')">Esta semana</button>
                        <button type="button" class="btn-secondary" onclick="aplicarFiltroVentas()">Aplicar fechas</button>
                        <button type="button" class="btn-action" style="margin-top:0; width:auto;" onclick="imprimirReporte()">Imprimir / Guardar PDF</button>
                    </div>
                </div>
                <div class="report-summary-grid">
                    <div class="report-total-card">Ventas en el periodo<strong>${ventas.length}</strong></div>
                    <div class="report-total-card">Total vendido<strong>${formatearMoneda(totalPeriodo)}</strong></div>
                    <div class="report-total-card">Subtotal sin IVA<strong>${formatearMoneda(subtotalPeriodo)}</strong></div>
                    <div class="report-total-card">IVA<strong>${formatearMoneda(ivaPeriodo)}</strong></div>
                </div>
                <div class="summary-box">
                    <h3 style="font-size:0.9rem;">Resumen diario</h3>
                    <div class="table-scroll">
                        <table class="data-table">
                            <thead><tr><th>Día</th><th>Ventas</th><th>Total vendido</th></tr></thead>
                            <tbody>${filasDiarias || '<tr><td colspan="3" style="text-align:center;">No hay ventas para este periodo.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
                <div class="summary-box">
                    <h3 style="font-size:0.9rem;">Resumen por método de pago</h3>
                    <div class="table-scroll">
                        <table class="data-table">
                            <thead><tr><th>Método de pago</th><th>Ventas</th><th>Total</th></tr></thead>
                            <tbody>${filasPago || '<tr><td colspan="3" style="text-align:center;">No hay ventas para este periodo.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
                <div class="summary-box">
                    <h3 style="font-size:0.9rem;">Detalle de ventas realizadas</h3>
                    <div class="table-scroll">
                        <table class="data-table">
                            <thead><tr><th>Fecha</th><th>Folio</th><th>Cliente</th><th>Productos</th><th>Método de pago</th><th>Subtotal / IVA</th><th>Total</th><th>Corte</th></tr></thead>
                            <tbody>${filasVentas || '<tr><td colspan="8" style="text-align:center;">No hay ventas para este periodo.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function seleccionarPeriodoVentas(periodo) {
            const p = periodoSeleccionado(periodo);
            mostrarHistorialVentas(p.inicio, p.fin);
        }

        function aplicarFiltroVentas() {
            const fechaInicio = document.getElementById('ventasFechaInicio').value;
            const fechaFin = document.getElementById('ventasFechaFin').value;
            if (!fechaInicio || !fechaFin || fechaInicio > fechaFin) {
                alert('Selecciona un rango válido: la fecha inicial debe ser igual o anterior a la fecha final.');
                return;
            }
            mostrarHistorialVentas(fechaInicio, fechaFin);
        }

        async function guardarFondo(modo) {
            const campo = document.getElementById('fondoInput');
            const valor = campo ? campo.value : '';
            if (valor === '' || !Number.isFinite(Number(valor))) {
                alert('Escribe un monto válido.');
                return;
            }
            if (modo === 'fondo' && Number(valor) < 0) {
                alert('El fondo no puede ser negativo.');
                return;
            }
            const cuerpo = modo === 'agregar' ? { agregar: valor } : { fondo: valor };
            try {
                const r = await enviar('PUT', '/api/caja/fondo', cuerpo);
                fondoCaja = Number(r.fondo);
                mostrarCortes();
            } catch (e) {
                alert('No se pudo guardar el fondo: ' + e.message);
            }
        }

        function mostrarCortes(fechaInicio, fechaFin) {
            const hoy = hoyISO();
            const inicio = fechaInicio || (rangoCortes ? rangoCortes.inicio : hoy);
            const fin = fechaFin || (rangoCortes ? rangoCortes.fin : hoy);
            rangoCortes = { inicio, fin };

            const cortes = cortesCache
                .filter(k => {
                    const f = fechaLocalISO(new Date(Number(k.fecha_corte)));
                    return f >= inicio && f <= fin;
                })
                .sort((a, b) => Number(b.fecha_corte) - Number(a.fecha_corte));

            const sumar = campo => cortes.reduce((suma, k) => suma + Number(k[campo] || 0), 0);
            const totalVentas = sumar('total_ventas');
            const totalEfectivo = sumar('ventas_efectivo');
            const totalTarjeta = sumar('ventas_tarjeta');
            const totalTransferencia = sumar('ventas_transferencia');
            const diferenciaNeta = redondear(sumar('diferencia'));
            const claseNeta = diferenciaNeta < 0 ? 'dif-falta' : 'dif-ok';
            const etiquetaNeta = diferenciaNeta === 0 ? 'Diferencia neta' : (diferenciaNeta > 0 ? 'Sobrante neto' : 'Faltante neto');

            const filas = cortes.map(k => {
                const dif = Number(k.diferencia);
                return `
                    <tr>
                        <td>#${esc(k.id)}</td>
                        <td>${esc(formatoFechaHora(k.fecha_corte))}</td>
                        <td>${esc(k.responsable)}</td>
                        <td>${esc(k.num_ventas)}</td>
                        <td>${formatearMoneda(k.total_ventas)}</td>
                        <td>${formatearMoneda(k.efectivo_esperado)}</td>
                        <td>${formatearMoneda(k.efectivo_contado)}</td>
                        <td class="${dif < 0 ? 'dif-falta' : 'dif-ok'}"><strong>${formatearMoneda(dif)}</strong></td>
                        <td class="no-print"><button type="button" class="btn-edit-item" onclick="verCorteAdmin(${k.id})">🔍 Ver detalle</button></td>
                    </tr>
                `;
            }).join('');

            panelAdmin().innerHTML = `
                <div class="panel-header">
                    <h2>Cortes de Caja</h2>
                    <p class="no-print">Elige un periodo para consultar los cortes realizados por el vendedor. Usa Imprimir / Guardar PDF para descargar el reporte como PDF.</p>
                    <p>Periodo del reporte: ${formatoFecha(inicio)} al ${formatoFecha(fin)}</p>
                </div>
                <div class="summary-box no-print" style="margin-top:0;">
                    <div class="report-filter-actions">
                        <div class="input-group" style="margin:0;">
                            <label for="cortesFechaInicio">Desde</label>
                            <input type="date" id="cortesFechaInicio" value="${esc(inicio)}">
                        </div>
                        <div class="input-group" style="margin:0;">
                            <label for="cortesFechaFin">Hasta</label>
                            <input type="date" id="cortesFechaFin" value="${esc(fin)}">
                        </div>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoCortes('hoy')">Hoy</button>
                        <button type="button" class="btn-secondary" onclick="seleccionarPeriodoCortes('semana')">Esta semana</button>
                        <button type="button" class="btn-secondary" onclick="aplicarFiltroCortes()">Aplicar fechas</button>
                        <button type="button" class="btn-action" style="margin-top:0; width:auto;" onclick="imprimirReporte()">Imprimir / Guardar PDF</button>
                    </div>
                </div>
                <div class="report-summary-grid">
                    <div class="report-total-card">
                        Fondo de caja vigente<strong>${formatearMoneda(fondoCaja)}</strong>
                        <div class="no-print">
                            <input type="number" id="fondoInput" class="fondo-input" min="0" step="0.01" placeholder="Monto en $ MXN" style="margin-top:10px;">
                            <div class="fondo-botones">
                                <button type="button" class="btn-secondary" onclick="guardarFondo('fondo')">Definir</button>
                                <button type="button" class="btn-secondary" onclick="guardarFondo('agregar')">Sumar</button>
                            </div>
                        </div>
                    </div>
                    <div class="report-total-card">Cortes en el periodo<strong>${cortes.length}</strong></div>
                    <div class="report-total-card">Total vendido<strong>${formatearMoneda(totalVentas)}</strong></div>
                    <div class="report-total-card">Efectivo<strong>${formatearMoneda(totalEfectivo)}</strong></div>
                    <div class="report-total-card">Tarjeta<strong>${formatearMoneda(totalTarjeta)}</strong></div>
                    <div class="report-total-card">Transferencia<strong>${formatearMoneda(totalTransferencia)}</strong></div>
                    <div class="report-total-card">${etiquetaNeta}<strong class="${claseNeta}">${formatearMoneda(Math.abs(diferenciaNeta))}</strong></div>
                </div>
                <div class="summary-box">
                    <h3 style="font-size:0.9rem;">Detalle de cortes realizados</h3>
                    <div class="table-scroll">
                        <table class="data-table">
                            <thead><tr><th>Corte</th><th>Fecha y hora</th><th>Responsable</th><th>Ventas</th><th>Total vendido</th><th>Efectivo esperado</th><th>Efectivo contado</th><th>Diferencia</th><th class="no-print">Acciones</th></tr></thead>
                            <tbody>${filas || '<tr><td colspan="9" style="text-align:center;">No hay cortes para este periodo.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function seleccionarPeriodoCortes(periodo) {
            const p = periodoSeleccionado(periodo);
            mostrarCortes(p.inicio, p.fin);
        }

        function aplicarFiltroCortes() {
            const fechaInicio = document.getElementById('cortesFechaInicio').value;
            const fechaFin = document.getElementById('cortesFechaFin').value;
            if (!fechaInicio || !fechaFin || fechaInicio > fechaFin) {
                alert('Selecciona un rango válido: la fecha inicial debe ser igual o anterior a la fecha final.');
                return;
            }
            mostrarCortes(fechaInicio, fechaFin);
        }

        async function verCorteAdmin(id) {
            mostrarCargando();
            try {
                const k = await api('/api/caja/cortes/' + id);
                const ventas = k.ventas || [];
                const dif = Number(k.diferencia);
                const etiquetaDif = dif === 0 ? 'Caja cuadrada' : (dif > 0 ? 'Sobrante' : 'Faltante');

                const filas = ventas.map(v => {

                        </tr>
                    `;
                }).join('');

                panelAdmin().innerHTML = `
                    <div class="panel-header">
                        <h2>Corte de Caja #${esc(k.id)}</h2>
                        <p>Fecha y hora del corte: ${esc(formatoFechaHora(k.fecha_corte))} | Responsable: ${esc(k.responsable)}</p>
                    </div>
                    <div class="summary-box no-print" style="margin-top:0;">
                        <div class="report-filter-actions">
                            <button type="button" class="btn-action" style="margin-top:0; width:auto;" onclick="imprimirReporte()">Imprimir / Guardar PDF</button>
                            <button type="button" class="btn-secondary" onclick="mostrarCortes()">← Volver a Cortes de Caja</button>
                        </div>
                    </div>
                    <div class="report-summary-grid">
                        <div class="report-total-card">Ventas incluidas<strong>${esc(k.num_ventas)}</strong></div>
                        <div class="report-total-card">Total vendido<strong>${formatearMoneda(k.total_ventas)}</strong></div>
                        <div class="report-total-card">Efectivo<strong>${formatearMoneda(k.ventas_efectivo)}</strong></div>
                        <div class="report-total-card">Tarjeta<strong>${formatearMoneda(k.ventas_tarjeta)}</strong></div>
                        <div class="report-total-card">Transferencia<strong>${formatearMoneda(k.ventas_transferencia)}</strong></div>
                    </div>
                    <div class="summary-box">
                        <h3 style="font-size:0.9rem;">Cuadre de efectivo</h3>
                        <div class="summary-row"><span>Fondo de caja:</span><span>${formatearMoneda(k.fondo_inicial)}</span></div>
                        <div class="summary-row"><span>Ventas en efectivo:</span><span>${formatearMoneda(k.ventas_efectivo)}</span></div>

                    <div class="summary-box">

                    </div>
                `;

                mostrarErrorCarga(e, 'cortes_caja');
