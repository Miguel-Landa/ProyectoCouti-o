<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eaf3fb;
            --bg-soft: #f4f9ff;
            --panel: #f8fbff;
            --panel-alt: #ebf4ff;
            --panel-strong: #dfeeff;
            --border: #bfd6ef;
            --border-soft: #9dbfe9;
            --text: #111827;
            --muted: #476a8d;
            --muted-strong: #254868;
            --accent: #5b8ec9;
            --accent-strong: #3f72b5;
            --button-text: #f7fbff;
            --success: #55a66d;
            --danger: #d96b6b;
            --shadow: rgba(110, 145, 185, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .btn-logout {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--panel-alt);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--panel-strong);
            color: var(--text);
            border-color: var(--border-soft);
        }

        .nav-btn.active {
            background: var(--text);
            color: var(--button-text);
            border-color: var(--text);
            font-weight: 600;
        }

        .main-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
        }

        .panel-header p {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: var(--panel-alt);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
            background: var(--panel-strong);
        }

        .summary-box {
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: var(--text);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: var(--muted-strong);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-add-item {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .qty-btn {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .btn-remove-item {
            color: var(--danger);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        .btn-edit-item {
            color: var(--accent);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-edit-item:hover { text-decoration: underline; }

        .badge-activo {
            background: #edf7ef;
            color: var(--success);
            border: 1px solid #b9d9c1;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-inactivo {
            background: #fff4f3;
            color: var(--danger);
            border: 1px solid #e9b8b5;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .alert-box {
            display: none;
            padding: 14px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .data-table th, .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            color: var(--muted);
            font-weight: 600;
            background: var(--panel-alt);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 10, 18, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            box-shadow: 0 20px 40px var(--shadow);
        }

        .btn-close {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border-soft);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: var(--panel-alt); color: var(--text); }

        [style*="color:#ffffff"], [style*="color: #ffffff"],
        [style*="color:#fff"], [style*="color: #fff"] {
            color: var(--text) !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Panel del Administrador</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">Módulos Unificados</div>
                <button class="nav-btn active" onclick="cambiarVistaAdmin('compras', this)">
                    📦 Compras a Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('proveedores', this)">
                    🏭 Gestión de Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('articulos', this)">
                    🔧 Gestión del Catálogo de Artículos
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('mecanicos', this)">
                    👷 Registro de Mecánicos
                </button>
            </div>

            <div class="main-panel" id="panel-contenido-admin">
            </div>
        </div>
    </div>

    <!-- Modal Emergente de Detalle de Compra -->
    <div class="modal-overlay" id="modalDetalleCompra">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalCompraTitulo">Detalle de Factura</h2>
                <p id="modalCompraInfo">Proveedor / Fecha</p>
            </div>
            <div class="summary-box" id="modalCompraContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-close" onclick="cerrarModalCompra()">Cerrar Ventana</button>
            </div>
        </div>
    </div>

    <!-- Modal Emergente de Detalle de Mecánico -->
    <div class="modal-overlay" id="modalDetalleMecanico">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalMecanicoTitulo">Detalle del Mecánico</h2>
                <p id="modalMecanicoInfo">Especialidad</p>
            </div>
            <div class="summary-box" id="modalMecanicoContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-close" onclick="cerrarModalMecanico()">Cerrar Ventana</button>
            </div>
        </div>
    </div>

    <script>
        // ================= Utilidades =================
        function esc(valor) {
            return String(valor == null ? '' : valor).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }
        function dinero(n) { return Number(n || 0).toFixed(2); }
        function mismoId(a, b) { return String(a) === String(b); }
        function redondear(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }

        function hoyISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatoFecha(f) {
            if (!f) return '—';
            const d = new Date(`${f}T12:00:00`);
            return isNaN(d.getTime()) ? esc(f) : d.toLocaleDateString('es-MX');
        }

        async function api(url, opciones) {
            const resp = await fetch(url, opciones);
            let datos = null;
            try { datos = await resp.json(); } catch (e) { /* respuesta sin cuerpo */ }
            if (!resp.ok) {
                throw new Error((datos && datos.message) || ('Error del servidor (' + resp.status + ')'));
            }
            return datos;
        }

        function enviar(metodo, url, cuerpo) {
            return api(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: cuerpo ? JSON.stringify(cuerpo) : undefined
            });
        }

        // ================= Estado =================
        let catalogoCache = [];
        let proveedoresCache = [];
        let comprasCache = [];
        let mecanicosCache = [];
        let cobrosCache = [];
        let itemsCompraActual = [];
        let idProveedorEditando = null;
        let idProductoEditando = null;
        let idMecanicoEditando = null;
        let filtroMecanicos = '';

        function panelAdmin() { return document.getElementById('panel-contenido-admin'); }

        function mostrarCargando() {
            panelAdmin().innerHTML = '<div class="summary-box">Cargando datos desde la base de datos...</div>';
        }

        function mostrarErrorCarga(error, vista) {
            panelAdmin().innerHTML = `
                <div class="summary-box">
                    <p>No fue posible conectar con el servidor: ${esc(error.message)}</p>
                    <p style="margin-top:8px;">Si el servidor estaba dormido, espera un minuto e inténtalo de nuevo.</p>
                    <button class="btn-action" onclick="cambiarVistaAdmin('${vista}')">Reintentar</button>
                </div>`;
        }

        async function cambiarVistaAdmin(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }
            mostrarCargando();
            try {
                if (vista === 'compras') {
                    itemsCompraActual = [];
                    [proveedoresCache, catalogoCache, comprasCache] = await Promise.all([
                        api('/api/proveedores'), api('/api/productos'), api('/api/compras')
                    ]);
                    renderizarModuloCompras();
                } else if (vista === 'proveedores') {
                    idProveedorEditando = null;
                    proveedoresCache = await api('/api/proveedores');
                    renderizarModuloProveedores();
                } else if (vista === 'articulos') {
                    idProductoEditando = null;
                    catalogoCache = await api('/api/productos');
                    renderizarModuloArticulos();
                } else if (vista === 'mecanicos') {
                    idMecanicoEditando = null;
                    mecanicosCache = await api('/api/mecanicos');
                    try { cobrosCache = await api('/api/cobros'); } catch (e) { cobrosCache = []; }
                    renderizarModuloMecanicos();
                }
            } catch (e) {
                mostrarErrorCarga(e, vista);
            }
        }

        /* ================= 1. COMPRAS ================= */
        function renderizarModuloCompras() {
            const opcionesProveedores = proveedoresCache.map(p =>
                `<option value="${esc(p.nombre)}">${esc(p.nombre)}</option>`).join('');
            const opcionesArticulos = catalogoCache.map(a =>
                `<option value="${a.id}">[${esc(a.sku)}] ${esc(a.nombre)} - Costo: $${dinero(a.costo_compra)} (Stock: ${a.stock})</option>`).join('');

            const filasHistorial = comprasCache.map(c => `
                <tr>
                    <td><strong style="color:#ffffff;">${esc(c.factura)}</strong></td>
                    <td>${esc(c.proveedor)}</td>
                    <td>${esc(c.fecha)}</td>
                    <td><strong style="color:#22c55e;">$${dinero(c.total)} MXN</strong></td>
                    <td>
                        <button class="btn-edit-item" onclick="verDetalleCompra(${c.id})">🔍 Detalle</button>
                        <button class="btn-remove-item" onclick="eliminarCompra(${c.id})">🗑️ Eliminar</button>
                    </td>
                </tr>
            `).join('');

            panelAdmin().innerHTML = `
                <div class="panel-header">
                    <h2>Registrar Compra de Mercancía</h2>
                    <p>Ingreso de facturas de compra y surtido dinámico de stock a almacén.</p>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Seleccionar Proveedor Registrado</label>
                        <select id="compraProveedorSelect">${opcionesProveedores || '<option value="">Primero registra un proveedor</option>'}</select>
                    </div>
                    <div class="input-group">
                        <label>Número de Factura / Remisión</label>
                        <input type="text" id="compraFacturaInput" placeholder="Ej. FAC-2026-88" required>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
                    <div class="input-group" style="margin-bottom:0; flex:2;">
                        <label>Artículo Surtido</label>
                        <select id="selectCompraArticulo">${opcionesArticulos || '<option value="">Primero registra artículos en el catálogo</option>'}</select>
                    </div>
                    <div class="input-group" style="margin-bottom:0; flex:1;">
                        <label>Cantidad Comprada</label>
                        <input type="number" id="compraCantidadInput" value="10" min="1">
                    </div>
                    <button type="button" class="btn-add-item" style="padding:12px 18px;" onclick="agregarArticuloACompra()">+ Agregar a la Compra</button>
                </div>

                <div class="summary-box">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                        📦 Desglose de Artículos en la Factura de Compra
                    </h3>
                    <div id="listaArticulosCompra"></div>
                    <div style="margin-top:15px; border-top:1px solid #262626; padding-top:10px;">
                        <div class="summary-row"><span>Subtotal Compra:</span><span id="lblSubtotalCompra">$0.00 MXN</span></div>
                        <div class="summary-row"><span>IVA Soportado (16%):</span><span id="lblIvaCompra">$0.00 MXN</span></div>
                        <div class="summary-row total"><span>Total Factura:</span><span id="lblTotalCompra" style="color: #22c55e;">$0.00 MXN</span></div>
                    </div>
                </div>

                <button class="btn-action" id="btnGuardarCompra" onclick="guardarCompraMercancia()">Guardar Compra e Incrementar Stock</button>
                <div id="alertaCompra" class="alert-box">✓ Compra registrada correctamente. El stock ha sido incrementado.</div>

                <div class="summary-box" style="margin-top:30px;">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px;">📑 Historial de Compras Realizadas a Proveedores</h3>
                    <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Factura / Remisión</th>
                                <th>Proveedor</th>
                                <th>Fecha</th>
                                <th>Monto Total</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filasHistorial.length > 0 ? filasHistorial : '<tr><td colspan="5" style="text-align:center;">No hay compras registradas en el historial.</td></tr>'}
                        </tbody>
                    </table>
                    </div>
                </div>
            `;
            actualizarTablaCompra();
        }

        function agregarArticuloACompra() {
            const sel = document.getElementById('selectCompraArticulo');
            if (!sel || !sel.value) return;
            const cantidad = parseInt(document.getElementById('compraCantidadInput').value) || 1;
            const articulo = catalogoCache.find(a => mismoId(a.id, sel.value));
            if (!articulo) return;

            const existe = itemsCompraActual.find(item => mismoId(item.id, articulo.id));
            if (existe) {
                existe.cantidad += cantidad;
            } else {
                itemsCompraActual.push({
                    id: articulo.id,
                    sku: articulo.sku,
                    nombre: articulo.nombre,
                    costo: Number(articulo.costo_compra),
                    cantidad: cantidad
                });
            }
            actualizarTablaCompra();
        }

        function modificarCantidadCompra(id, delta) {
            const item = itemsCompraActual.find(i => mismoId(i.id, id));
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) removerArticuloCompra(id);
                else actualizarTablaCompra();
            }
        }

        function removerArticuloCompra(id) {
            itemsCompraActual = itemsCompraActual.filter(i => !mismoId(i.id, id));
            actualizarTablaCompra();
        }

        function actualizarTablaCompra() {
            const contenedor = document.getElementById('listaArticulosCompra');
            if (!contenedor) return;

            if (itemsCompraActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado artículos.</p>';
                document.getElementById('lblSubtotalCompra').innerText = '$0.00 MXN';
                document.getElementById('lblIvaCompra').innerText = '$0.00 MXN';
                document.getElementById('lblTotalCompra').innerText = '$0.00 MXN';
                return;
            }

            let subtotal = 0;
            contenedor.innerHTML = itemsCompraActual.map(item => {
                const importe = item.costo * item.cantidad;
                subtotal += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#e5e5e5; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${esc(item.sku)}</span>
                            <strong style="color:#ffffff;">${esc(item.nombre)}</strong>
                            <span style="margin-left:8px;">
                                <button class="qty-btn" onclick="modificarCantidadCompra(${item.id}, -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" onclick="modificarCantidadCompra(${item.id}, 1)">+</button>
                            </span>
                            <button class="btn-remove-item" onclick="removerArticuloCompra(${item.id})">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${dinero(importe)} MXN</span>
                    </div>
                `;
            }).join('');

            const iva = subtotal * 0.16;
            const total = subtotal + iva;
            document.getElementById('lblSubtotalCompra').innerText = '$' + dinero(subtotal) + ' MXN';
            document.getElementById('lblIvaCompra').innerText = '$' + dinero(iva) + ' MXN';
            document.getElementById('lblTotalCompra').innerText = '$' + dinero(total) + ' MXN';
        }

        async function guardarCompraMercancia() {
            const factura = document.getElementById('compraFacturaInput').value.trim();
            const proveedor = document.getElementById('compraProveedorSelect').value;

            if (!factura) { alert('Ingresa el número de factura o remisión.'); return; }
            if (!proveedor) { alert('Registra y selecciona un proveedor.'); return; }
            if (itemsCompraActual.length === 0) { alert('Agrega al menos un artículo.'); return; }

            let subtotal = 0;
            const detalle = itemsCompraActual.map(item => {
                const importe = redondear(item.costo * item.cantidad);
                subtotal += importe;
                return {
                    producto_id: String(item.id),
                    sku: item.sku,
                    nombre: item.nombre,
                    costo: item.costo,
                    cantidad: item.cantidad,
                    importe: importe
                };
            });
            subtotal = redondear(subtotal);
            const iva = redondear(subtotal * 0.16);
            const total = redondear(subtotal + iva);

            const boton = document.getElementById('btnGuardarCompra');
            if (boton) boton.disabled = true;
            try {
                await enviar('POST', '/api/compras', {
                    factura, proveedor,
                    fecha: new Date().toLocaleDateString('es-MX'),
                    subtotal, iva, total, detalle
                });
                document.getElementById('alertaCompra').style.display = 'block';
                setTimeout(() => cambiarVistaAdmin('compras'), 1500);
            } catch (e) {
                if (boton) boton.disabled = false;
                alert('No se pudo guardar la compra: ' + e.message);
            }
        }

            const m = mecanicosCache.find(x => mismoId(x.id, id));
            if (!m) return;
            if (!confirm(`¿Desea eliminar al mecánico ${m.nombre}? Los cobros anteriores conservarán su nombre.`)) return;
            try {
                await enviar('DELETE', '/api/mecanicos/' + id);
                cambiarVistaAdmin('mecanicos');
            } catch (e) {
                alert('No se pudo eliminar: ' + e.message);
            }
        }

        function verDetalleMecanico(id) {
            const m = mecanicosCache.find(x => mismoId(x.id, id));
            if (!m) return;
            const resumen = resumenMecanico(m.nombre);

            document.getElementById('modalMecanicoTitulo').innerText = m.nombre;
            document.getElementById('modalMecanicoInfo').innerText = m.especialidad || 'Sin especialidad registrada';

            document.getElementById('modalMecanicoContenido').innerHTML = `
                <div class="summary-row"><span>Teléfono / WhatsApp</span><span>${esc(m.telefono || '—')}</span></div>
                <div class="summary-row"><span>Correo electrónico</span><span>${esc(m.email || '—')}</span></div>
                <div class="summary-row"><span>Fecha de ingreso</span><span>${formatoFecha(m.fecha_ingreso)}</span></div>
                <div class="summary-row"><span>Estado</span><span class="${m.activo ? 'badge-activo' : 'badge-inactivo'}">${m.activo ? 'Activo' : 'Inactivo'}</span></div>
                <div class="summary-row"><span>Notas</span><span>${esc(m.notas || '—')}</span></div>
                <div class="summary-row"><span>Servicios cobrados</span><span>${resumen.servicios}</span></div>
                <div class="summary-row total">
                    <span>Total generado en cobros</span>
                    <span style="color:#22c55e;">$${dinero(resumen.total)} MXN</span>
                </div>
            `;
            document.getElementById('modalDetalleMecanico').style.display = 'flex';
        }

        function cerrarModalMecanico() {
            document.getElementById('modalDetalleMecanico').style.display = 'none';
        }

        window.onload = function () {
            cambiarVistaAdmin('compras', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
