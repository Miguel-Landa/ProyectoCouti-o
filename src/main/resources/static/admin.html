<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Sistema MRX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eaf3fb;
            --bg-soft: #f4f9ff;
            --panel: #f8fbff;
            --panel-alt: #ebf4ff;
            --panel-strong: #dfeeff;
            --border: #bfd6ef;
            --border-soft: #9dbfe9;
            --text: #111827;
            --muted: #476a8d;
            --muted-strong: #254868;
            --accent: #5b8ec9;
            --accent-strong: #3f72b5;
            --button-text: #f7fbff;
            --success: #55a66d;
            --danger: #d96b6b;
            --shadow: rgba(110, 145, 185, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .btn-logout {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--panel-alt);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--panel-strong);
            color: var(--text);
            border-color: var(--border-soft);
        }

        .nav-btn.active {
            background: var(--text);
            color: var(--button-text);
            border-color: var(--text);
            font-weight: 600;
        }

        .main-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 30px;
            min-height: 520px;
        }

        .panel-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .panel-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
        }

        .panel-header p {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: var(--panel-alt);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
            background: var(--panel-strong);
        }

        .summary-box {
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 0.9rem;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            padding-top: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: var(--text);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .btn-action:hover {
            background: var(--muted-strong);
        }

        .btn-add-item {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-item:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .qty-btn {
            background: var(--panel-strong);
            color: var(--text);
            border: 1px solid var(--border-soft);
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
        }

        .qty-btn:hover {
            background: var(--text);
            color: var(--button-text);
        }

        .btn-remove-item {
            color: var(--danger);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-remove-item:hover { text-decoration: underline; }

        .btn-edit-item {
            color: var(--accent);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .btn-edit-item:hover { text-decoration: underline; }

        .alert-box {
            display: none;
            padding: 14px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 15px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .data-table th, .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            color: var(--muted);
            font-weight: 600;
            background: var(--panel-alt);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 10, 18, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            box-shadow: 0 20px 40px var(--shadow);
        }

        .btn-close {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border-soft);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-close:hover { background: var(--panel-alt); color: var(--text); }

        [style*="color:#ffffff"], [style*="color: #ffffff"],
        [style*="color:#fff"], [style*="color: #fff"] {
            color: var(--text) !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="topbar">
            <h1>Panel del Administrador</h1>
            <a href="index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="workspace">
            <div class="sidebar-buttons">
                <div class="sidebar-title">Módulos Unificados</div>
                <button class="nav-btn active" onclick="cambiarVistaAdmin('compras', this)">
                    📦 Compras a Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('proveedores', this)">
                    🏭 Gestión de Proveedores
                </button>
                <button class="nav-btn" onclick="cambiarVistaAdmin('articulos', this)">
                    🔧 Gestión del Catálogo de Artículos
                </button>
            </div>

            <div class="main-panel" id="panel-contenido-admin">
            </div>
        </div>
    </div>

    <!-- Modal Emergente de Detalle de Compra -->
    <div class="modal-overlay" id="modalDetalleCompra">
        <div class="modal-card">
            <div class="panel-header" style="margin-bottom: 15px;">
                <h2 id="modalCompraTitulo">Detalle de Factura</h2>
                <p id="modalCompraInfo">Proveedor / Fecha</p>
            </div>
            <div class="summary-box" id="modalCompraContenido" style="margin-top:0;">
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-close" onclick="cerrarModalCompra()">Cerrar Ventana</button>
            </div>
        </div>
    </div>

    <script>
        // ================= Utilidades de Comunicación con Base de Datos / Backend =================
        function escaparHtml(valor) {
            return String(valor == null ? '' : valor).replace(/[&<>"']/g, caracter => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[caracter]);
        }

        async function api(url, opciones) {
            const resp = await fetch(url, opciones);
            let datos = null;
            try { datos = await resp.json(); } catch (e) { /* respuesta sin cuerpo */ }
            if (!resp.ok) {
                throw new Error((datos && datos.message) || ('Error del servidor (' + resp.status + ')'));
            }
            return datos;
        }

        function enviar(metodo, url, cuerpo) {
            return api(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: cuerpo ? JSON.stringify(cuerpo) : undefined
            });
        }

        // ================= Caché Local de Datos del Servidor =================
        let catalogoCache = [];
        let proveedoresCache = [];
        let historialComprasCache = [];

        async function cargarDatosServidor() {
            const [productos, provs, compras] = await Promise.all([
                api('/api/productos'),
                api('/api/proveedores'),
                api('/api/compras')
            ]);

            catalogoCache = productos.map(p => ({
                id: String(p.id),
                sku: p.sku,
                nombre: p.nombre,
                precio: Number(p.precio),
                costoCompra: Number(p.costo_compra || p.costoCompra || 0),
                stock: Number(p.stock)
            }));

            proveedoresCache = provs.map(p => ({
                id: String(p.id),
                nombre: p.nombre,
                rfc: p.rfc,
                telefono: p.telefono,
                email: p.email
            }));

            historialComprasCache = compras.map(c => ({
                id: String(c.id),
                factura: c.factura,
                proveedor: c.proveedor,
                fecha: c.fecha,
                items: typeof c.items === 'string' ? JSON.parse(c.items) : (c.items || []),
                subtotal: Number(c.subtotal),
                iva: Number(c.iva),
                total: Number(c.total)
            }));
        }

        function obtenerCatalogo() { return catalogoCache; }
        function obtenerProveedores() { return proveedoresCache; }
        function obtenerHistorialCompras() { return historialComprasCache; }

        let itemsCompraActual = [];
        let idProveedorEditando = null;
        let idProductoEditando = null;

        async function cambiarVistaAdmin(vista, boton) {
            if (boton) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                boton.classList.add('active');
            }

            const panel = document.getElementById('panel-contenido-admin');
            panel.innerHTML = '<div class="summary-box">Cargando datos desde la base de datos...</div>';

            try {
                await cargarDatosServidor();

                if (vista === 'compras') {
                    itemsCompraActual = [];
                    renderizarModuloCompras();
                } else if (vista === 'proveedores') {
                    idProveedorEditando = null;
                    renderizarModuloProveedores();
                } else if (vista === 'articulos') {
                    idProductoEditando = null;
                    renderizarModuloArticulos();
                }
            } catch (e) {
                panel.innerHTML = `
                    <div class="summary-box">
                        <p>No fue posible conectar con la base de datos: ${escaparHtml(e.message)}</p>
                        <button class="btn-action" onclick="cambiarVistaAdmin('${vista}')">Reintentar Conexión</button>
                    </div>`;
            }
        }

        /* ================= 1. MÓDULO DE COMPRAS CON HISTORIAL Y DETALLES ================= */
        function renderizarModuloCompras() {
            const panel = document.getElementById('panel-contenido-admin');
            const proveedores = obtenerProveedores();
            const catalogo = obtenerCatalogo();
            const historial = obtenerHistorialCompras();

            let opcionesProveedores = proveedores.map(p => `<option value="${escaparHtml(p.nombre)}">${escaparHtml(p.nombre)}</option>`).join('');
            let opcionesArticulos = catalogo.map(a => `<option value="${a.id}">[${escaparHtml(a.sku)}] ${escaparHtml(a.nombre)} Costo: $${a.costoCompra.toFixed(2)} (Stock: ${a.stock})</option>`).join('');

            let filasHistorial = historial.map(c => `
                <tr>
                    <td><strong style="color:#ffffff;">${escaparHtml(c.factura)}</strong></td>
                    <td>${escaparHtml(c.proveedor)}</td>
                    <td>${escaparHtml(c.fecha)}</td>
                    <td><strong style="color:#22c55e;">$${c.total.toFixed(2)} MXN</strong></td>
                    <td>
                        <button class="btn-edit-item" onclick="verDetalleCompra('${c.id}')">🔍 Detalle</button>
                        <button class="btn-remove-item" onclick="eliminarCompra('${c.id}')">🗑️ Eliminar</button>
                    </td>
                </tr>
            `).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Registrar Compra de Mercancía</h2>
                    <p>Ingreso de facturas de compra y surtido dinámico de stock a almacén.</p>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Seleccionar Proveedor Registrado</label>
                        <select id="compraProveedorSelect">${opcionesProveedores}</select>
                    </div>
                    <div class="input-group">
                        <label>Número de Factura / Remisión</label>
                        <input type="text" id="compraFacturaInput" placeholder="Ej. FAC-2026-88" required>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px;">
                    <div class="input-group" style="margin-bottom:0; flex:2;">
                        <label>Artículo Surtido</label>
                        <select id="selectCompraArticulo">${opcionesArticulos}</select>
                    </div>
                    <div class="input-group" style="margin-bottom:0; flex:1;">
                        <label>Cantidad Comprada</label>
                        <input type="number" id="compraCantidadInput" value="10" min="1">
                    </div>
                    <button type="button" class="btn-add-item" style="padding:12px 18px;" onclick="agregarArticuloACompra()">+ Agregar a la Compra</button>
                </div>

                <div class="summary-box">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px; border-bottom:1px solid #262626; padding-bottom:8px;">
                        📦 Desglose de Artículos en la Factura de Compra
                    </h3>
                    <div id="listaArticulosCompra"></div>
                    <div style="margin-top:15px; border-top:1px solid #262626; padding-top:10px;">
                        <div class="summary-row"><span>Subtotal Compra:</span><span id="lblSubtotalCompra">$0.00 MXN</span></div>
                        <div class="summary-row"><span>IVA Soportado (16%):</span><span id="lblIvaCompra">$0.00 MXN</span></div>
                        <div class="summary-row total"><span>Total Factura:</span><span id="lblTotalCompra" style="color: #22c55e;">$0.00 MXN</span></div>
                    </div>
                </div>

                <button class="btn-action" id="btnGuardarCompra" onclick="guardarCompraMercancia()">Guardar Compra e Incrementar Stock</button>
                <div id="alertaCompra" class="alert-box">✓ Compra registrada correctamente en la base de datos. El stock ha sido incrementado.</div>

                <div class="summary-box" style="margin-top:30px;">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px;">📑 Historial de Compras Realizadas a Proveedores</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Factura / Remisión</th>
                                <th>Proveedor</th>
                                <th>Fecha</th>
                                <th>Monto Total</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filasHistorial.length > 0 ? filasHistorial : '<tr><td colspan="5" style="text-align:center;">No hay compras registradas en el historial.</td></tr>'}
                        </tbody>
                    </table>
                </div>
            `;
            actualizarTablaCompra();
        }

        function agregarArticuloACompra() {
            const artId = document.getElementById('selectCompraArticulo').value;
            const cantidad = parseInt(document.getElementById('compraCantidadInput').value) || 1;
            const catalogo = obtenerCatalogo();
            const articulo = catalogo.find(a => a.id === artId);

            if (articulo) {
                const existe = itemsCompraActual.find(item => item.id === artId);
                if (existe) {
                    existe.cantidad += cantidad;
                } else {
                    itemsCompraActual.push({
                        id: articulo.id,
                        sku: articulo.sku,
                        nombre: articulo.nombre,
                        costo: articulo.costoCompra,
                        cantidad: cantidad
                    });
                }
                actualizarTablaCompra();
            }
        }

        function modificarCantidadCompra(id, delta) {
            const item = itemsCompraActual.find(i => i.id === id);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) removerArticuloCompra(id);
                else actualizarTablaCompra();
            }
        }

        function removerArticuloCompra(id) {
            itemsCompraActual = itemsCompraActual.filter(i => i.id !== id);
            actualizarTablaCompra();
        }

        function actualizarTablaCompra() {
            const contenedor = document.getElementById('listaArticulosCompra');
            if (!contenedor) return;

            if (itemsCompraActual.length === 0) {
                contenedor.innerHTML = '<p style="color:#a3a3a3; text-align:center; padding:10px 0;">No se han agregado artículos.</p>';
                document.getElementById('lblSubtotalCompra').innerText = '$0.00 MXN';
                document.getElementById('lblIvaCompra').innerText = '$0.00 MXN';
                document.getElementById('lblTotalCompra').innerText = '$0.00 MXN';
                return;
            }

            let subtotal = 0;
            let html = itemsCompraActual.map(item => {
                const importe = item.costo * item.cantidad;
                subtotal += importe;
                return `
                    <div class="summary-row">
                        <div>
                            <span style="background:#262626; color:#e5e5e5; padding:2px 6px; border-radius:3px; font-size:0.75rem; font-weight:700; margin-right:6px;">${escaparHtml(item.sku)}</span>
                            <strong style="color:#ffffff;">${escaparHtml(item.nombre)}</strong> 
                            <span style="margin-left:8px;">
                                <button class="qty-btn" onclick="modificarCantidadCompra('${item.id}', -1)">-</button>
                                <span style="font-weight:700; color:#ffffff;">${item.cantidad}</span>
                                <button class="qty-btn" onclick="modificarCantidadCompra('${item.id}', 1)">+</button>
                            </span>
                            <button class="btn-remove-item" onclick="removerArticuloCompra('${item.id}')">Quitar</button>
                        </div>
                        <span style="color:#ffffff;">$${importe.toFixed(2)} MXN</span>
                    </div>
                `;
            }).join('');

            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            contenedor.innerHTML = html;
            document.getElementById('lblSubtotalCompra').innerText = '$' + subtotal.toFixed(2) + ' MXN';
            document.getElementById('lblIvaCompra').innerText = '$' + iva.toFixed(2) + ' MXN';
            document.getElementById('lblTotalCompra').innerText = '$' + total.toFixed(2) + ' MXN';
        }

        async function guardarCompraMercancia() {
            const factura = document.getElementById('compraFacturaInput').value;
            const proveedor = document.getElementById('compraProveedorSelect').value;

            if (!factura) { alert('Ingresa el número de factura o remisión.'); return; }
            if (itemsCompraActual.length === 0) { alert('Agrega al menos un artículo.'); return; }

            let subtotal = 0;
            itemsCompraActual.forEach(item => { subtotal += (item.costo * item.cantidad); });
            const iva = subtotal * 0.16;
            const total = subtotal + iva;

            const cuerpoCompra = {
                factura: factura,
                proveedor: proveedor,
                fecha: new Date().toLocaleDateString('es-MX'),
                items: itemsCompraActual,
                subtotal: subtotal,
                iva: iva,
                total: total
            };

            const boton = document.getElementById('btnGuardarCompra');
            if (boton) boton.disabled = true;

            try {
                await enviar('POST', '/api/compras', cuerpoCompra);

                const alerta = document.getElementById('alertaCompra');
                alerta.style.display = 'block';
                setTimeout(async () => {
                    alerta.style.display = 'none';
                    itemsCompraActual = [];
                    await cambiarVistaAdmin('compras');
                }, 1800);
            } catch (e) {
                if (boton) boton.disabled = false;
                alert('Error al guardar la compra en la base de datos: ' + e.message);
            }
        }

        function verDetalleCompra(id) {
            const historial = obtenerHistorialCompras();
            const compra = historial.find(c => c.id === id);
            if (!compra) return;

            document.getElementById('modalCompraTitulo').innerText = `Factura / Remisión: ${compra.factura}`;
            document.getElementById('modalCompraInfo').innerText = `Proveedor: ${compra.proveedor} | Fecha: ${compra.fecha}`;

            let itemsHTML = compra.items.map(it => `
                <div class="summary-row">
                    <span>${escaparHtml(it.nombre)} (${escaparHtml(it.sku)}) - x${it.cantidad}</span>
                    <span>$${((Number(it.costo) || 0) * (Number(it.cantidad) || 0)).toFixed(2)} MXN</span>
                </div>
            `).join('');

            document.getElementById('modalCompraContenido').innerHTML = `
                <h4 style="font-size:0.85rem; color:#a3a3a3; margin-bottom:8px;">Artículos Adquiridos:</h4>
                ${itemsHTML}
                <div class="summary-row" style="margin-top:10px; border-top:1px solid #262626; padding-top:8px;">
                    <span>Subtotal:</span><span>$${compra.subtotal.toFixed(2)} MXN</span>
                </div>
                <div class="summary-row"><span>IVA (16%):</span><span>$${compra.iva.toFixed(2)} MXN</span></div>
                <div class="summary-row total">
                    <span>Total Factura:</span>
                    <span style="color:#22c55e;">$${compra.total.toFixed(2)} MXN</span>
                </div>
            `;

            document.getElementById('modalDetalleCompra').style.display = 'flex';
        }

        function cerrarModalCompra() {
            document.getElementById('modalDetalleCompra').style.display = 'none';
        }

        async function eliminarCompra(id) {
            const historial = obtenerHistorialCompras();
            const compra = historial.find(c => c.id === id);

            if (compra && confirm(`¿Desea eliminar la compra ${compra.factura}? El stock de estos artículos será descontado.`)) {
                try {
                    await enviar('DELETE', '/api/compras/' + id);
                    await cambiarVistaAdmin('compras');
                } catch (e) {
                    alert('No se pudo eliminar la compra de la base de datos: ' + e.message);
                }
            }
        }

        /* ================= 2. MÓDULO DE PROVEEDORES ================= */
        function renderizarModuloProveedores() {
            const panel = document.getElementById('panel-contenido-admin');
            const proveedores = obtenerProveedores();

            let filasHTML = proveedores.map(p => `
                <tr>
                    <td><strong style="color:#ffffff;">${escaparHtml(p.nombre)}</strong></td>
                    <td>${escaparHtml(p.rfc)}</td>
                    <td>${escaparHtml(p.telefono)}</td>
                    <td>${escaparHtml(p.email)}</td>
                    <td>
                        <button class="btn-edit-item" onclick="prepararEdicionProveedor('${p.id}')">✏️ Editar</button>
                        <button class="btn-remove-item" onclick="eliminarProveedor('${p.id}')">🗑️ Eliminar</button>
                    </td>
                </tr>
            `).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Gestión de Proveedores</h2>
                    <p>Gestiona y actualiza las empresas proveedoras en una sola pantalla.</p>
                </div>

                <form onsubmit="guardarOActualizarProveedor(event)">
                    <h3 style="font-size:0.95rem; color:#ffffff; margin-bottom:12px;">
                        ${idProveedorEditando ? '✏️ Modificar Datos del Proveedor' : '➕ Registrar Nuevo Proveedor'}
                    </h3>
                    
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nombre / Razón Social</label>
                            <input type="text" id="provNombreInput" placeholder="Ej. MotoPartes del Golfo" required>
                        </div>
                        <div class="input-group">
                            <label>RFC</label>
                            <input type="text" id="provRfcInput" placeholder="Ej. MPG900101XYZ" required>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Teléfono / WhatsApp</label>
                            <input type="tel" id="provTelInput" placeholder="Ej. 2288123456" required>
                        </div>
                        <div class="input-group">
                            <label>Correo Electrónico</label>
                            <input type="email" id="provEmailInput" placeholder="contacto@proveedor.com" required>
                        </div>
                    </div>

                    <div style="display:flex; gap:10px;">
                        <button type="submit" class="btn-action" style="margin-top:10px;">
                            ${idProveedorEditando ? 'Actualizar Proveedor' : 'Registrar Proveedor'}
                        </button>
                        ${idProveedorEditando ? `<button type="button" class="btn-action" style="margin-top:10px; background:#404040; color:#fff;" onclick="cancelarEdicionProv()">Cancelar</button>` : ''}
                    </div>
                </form>

                <div id="alertaProv" class="alert-box">✓ Directorio de proveedores actualizado en la base de datos.</div>

                <div class="summary-box">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px;">🏭 Directorio de Proveedores Registrados</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Empresa</th>
                                <th>RFC</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filasHTML.length > 0 ? filasHTML : '<tr><td colspan="5" style="text-align:center;">No hay proveedores registrados.</td></tr>'}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function guardarOActualizarProveedor(event) {
            event.preventDefault();
            const nombre = document.getElementById('provNombreInput').value;
            const rfc = document.getElementById('provRfcInput').value;
            const tel = document.getElementById('provTelInput').value;
            const email = document.getElementById('provEmailInput').value;

            const cuerpo = { nombre, rfc, telefono: tel, email };

            try {
                if (idProveedorEditando) {
                    await enviar('PUT', '/api/proveedores/' + idProveedorEditando, cuerpo);
                    idProveedorEditando = null;
                } else {
                    await enviar('POST', '/api/proveedores', cuerpo);
                }

                const alerta = document.getElementById('alertaProv');
                alerta.style.display = 'block';
                setTimeout(async () => {
                    alerta.style.display = 'none';
                    await cambiarVistaAdmin('proveedores');
                }, 1200);
            } catch (e) {
                alert('No se pudo guardar el proveedor: ' + e.message);
            }
        }

        function prepararEdicionProveedor(id) {
            const proveedores = obtenerProveedores();
            const prov = proveedores.find(p => p.id === id);
            if (prov) {
                idProveedorEditando = id;
                renderizarModuloProveedores();
                document.getElementById('provNombreInput').value = prov.nombre;
                document.getElementById('provRfcInput').value = prov.rfc;
                document.getElementById('provTelInput').value = prov.telefono;
                document.getElementById('provEmailInput').value = prov.email;
            }
        }

        function cancelarEdicionProv() {
            idProveedorEditando = null;
            renderizarModuloProveedores();
        }

        async function eliminarProveedor(id) {
            if (confirm('¿Desea eliminar este proveedor del directorio?')) {
                try {
                    await enviar('DELETE', '/api/proveedores/' + id);
                    await cambiarVistaAdmin('proveedores');
                } catch (e) {
                    alert('No se pudo eliminar el proveedor: ' + e.message);
                }
            }
        }

        /* ================= 3. MÓDULO DE ARTÍCULOS ================= */
        function renderizarModuloArticulos() {
            const panel = document.getElementById('panel-contenido-admin');
            const catalogo = obtenerCatalogo();

            let filasHTML = catalogo.map(a => `
                <tr>
                    <td><span style="background:#262626; color:#e5e5e5; padding:2px 6px; border-radius:3px; font-weight:700;">${escaparHtml(a.sku)}</span></td>
                    <td><strong style="color:#ffffff;">${escaparHtml(a.nombre)}</strong></td>
                    <td>$${a.costoCompra.toFixed(2)} MXN</td>
                    <td>$${a.precio.toFixed(2)} MXN</td>
                    <td><strong style="color:${a.stock < 5 ? '#ef4444' : '#4ade80'};">${a.stock} pzas</strong></td>
                    <td>
                        <button class="btn-edit-item" onclick="prepararEdicionArticulo('${a.id}')">✏️ Editar</button>
                        <button class="btn-remove-item" onclick="eliminarArticulo('${a.id}')">🗑️ Eliminar</button>
                    </td>
                </tr>
            `).join('');

            panel.innerHTML = `
                <div class="panel-header">
                    <h2>Gestión del Catálogo de Artículos</h2>
                    <p>Alta de nuevos productos, ajuste de precios, costos y stock global en un solo lugar.</p>
                </div>

                <form onsubmit="guardarOActualizarArticulo(event)">
                    <h3 style="font-size:0.95rem; color:#ffffff; margin-bottom:12px;">
                        ${idProductoEditando ? '✏️ Modificar Artículo Existente' : '➕ Registrar Nuevo Producto'}
                    </h3>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Código SKU</label>
                            <input type="text" id="artSkuInput" placeholder="Ej. REF-300" required>
                        </div>
                        <div class="input-group">
                            <label>Descripción / Nombre del Producto</label>
                            <input type="text" id="artNombreInput" placeholder="Ej. Filtro de Aceite Hero" required>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="input-group">
                            <label>Costo de Compra ($ MXN)</label>
                            <input type="number" id="artCostoInput" step="0.01" placeholder="Ej. 120.00" required>
                        </div>
                        <div class="input-group">
                            <label>Precio de Venta ($ MXN)</label>
                            <input type="number" id="artPrecioInput" step="0.01" placeholder="Ej. 180.00" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Stock Disponible en Almacén</label>
                        <input type="number" id="artStockInput" placeholder="Ej. 15" min="0" required>
                    </div>

                    <div style="display:flex; gap:10px;">
                        <button type="submit" class="btn-action" style="margin-top:10px;">
                            ${idProductoEditando ? 'Actualizar Producto' : 'Guardar en Catálogo'}
                        </button>
                        ${idProductoEditando ? `<button type="button" class="btn-action" style="margin-top:10px; background:#404040; color:#fff;" onclick="cancelarEdicionArt()">Cancelar</button>` : ''}
                    </div>
                </form>

                <div id="alertaArt" class="alert-box">✓ Catálogo de productos actualizado en la base de datos.</div>

                <div class="summary-box">
                    <h3 style="font-size:0.9rem; color:#ffffff; margin-bottom:12px;">🔧 Inventario General de Productos</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>Producto</th>
                                <th>Costo Compra</th>
                                <th>Precio Venta</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filasHTML.length > 0 ? filasHTML : '<tr><td colspan="6" style="text-align:center;">No hay artículos registrados.</td></tr>'}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function guardarOActualizarArticulo(event) {
            event.preventDefault();
            const sku = document.getElementById('artSkuInput').value.toUpperCase();
            const nombre = document.getElementById('artNombreInput').value;
            const costo = parseFloat(document.getElementById('artCostoInput').value) || 0;
            const precio = parseFloat(document.getElementById('artPrecioInput').value) || 0;
            const stock = parseInt(document.getElementById('artStockInput').value) || 0;

            const cuerpo = { sku, nombre, costo_compra: costo, precio, stock };

            try {
                if (idProductoEditando) {
                    await enviar('PUT', '/api/productos/' + idProductoEditando, cuerpo);
                    idProductoEditando = null;
                } else {
                    await enviar('POST', '/api/productos', cuerpo);
                }

                const alerta = document.getElementById('alertaArt');
                alerta.style.display = 'block';
                setTimeout(async () => {
                    alerta.style.display = 'none';
                    await cambiarVistaAdmin('articulos');
                }, 1200);
            } catch (e) {
                alert('No se pudo guardar el producto en la base de datos: ' + e.message);
            }
        }

        function prepararEdicionArticulo(id) {
            const catalogo = obtenerCatalogo();
            const art = catalogo.find(a => a.id === id);
            if (art) {
                idProductoEditando = id;
                renderizarModuloArticulos();
                document.getElementById('artSkuInput').value = art.sku;
                document.getElementById('artNombreInput').value = art.nombre;
                document.getElementById('artCostoInput').value = art.costoCompra;
                document.getElementById('artPrecioInput').value = art.precio;
                document.getElementById('artStockInput').value = art.stock;
            }
        }

        function cancelarEdicionArt() {
            idProductoEditando = null;
            renderizarModuloArticulos();
        }

        async function eliminarArticulo(id) {
            if (confirm('¿Desea eliminar permanentemente este producto del catálogo?')) {
                try {
                    await enviar('DELETE', '/api/productos/' + id);
                    await cambiarVistaAdmin('articulos');
                } catch (e) {
                    alert('No se pudo eliminar el producto: ' + e.message);
                }
            }
        }

        window.onload = function() {
            cambiarVistaAdmin('compras', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
