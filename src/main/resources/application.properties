spring.application.name=miapp

# Conexión a PostgreSQL (Render inyectará estas variables en producción)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mrx_db_jygs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mrx_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate JPA para crear/actualizar tablas automáticamente
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true