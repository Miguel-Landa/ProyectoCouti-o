spring.application.name=miapp
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mrx_db_jygs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mrx_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.platform=postgres

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=never

server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax 